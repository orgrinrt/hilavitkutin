# --- Built-in quality lints ------------------------------------------------

[lints.no-empty-crate]
commit = "warn"
build = "warn"
push = "warn"

[lints.no-todo]
commit = "warn"
build = "warn"
push = "error"

[lints.no-fixme]
commit = "warn"
build = "warn"
push = "error"

[lints.file-size]
commit = "error"
build = "error"
push = "error"
max_lines = "500"

# --- The structural invariants ---------------------------------------------
# Hard errors: violations must be fixed, never suppressed except per-line with
# `// lint:allow(<name>) -- <reason>`.
#
# The five below come from the shared pack rather than from `mock/lints/`. The
# local copies said the same things and were still on the trait shape the engine
# carried before it split a lint by what it reads, so they stopped compiling and
# took the whole gate down with them. What is configured here is the same set at
# the same severity; only `no-dyn-dispatch` is spelled differently, the pack's
# name for what was `no-dynamic-dispatch` here.

[lints.no-std]
commit = "error"
build = "error"
push = "error"

[lints.no-alloc]
commit = "error"
build = "error"
push = "error"

[lints.no-dyn-dispatch]
commit = "error"
build = "error"
push = "error"

[lints.no-runtime-spawn]
commit = "error"
build = "error"
push = "error"

[lints.no-runtime-registration]
commit = "error"
build = "error"
push = "error"

# The engine hands closures to an executor only through `spawn_one_pointer`,
# which forces the api's `OnePointerClosure` gate first. The gate is a
# post-monomorphisation assert, so a spawn that skips it builds and tests
# green; this blocks at every gate instead. Repo lint, `mock/lints/`.
[lints.engine-spawn-through-gate]
commit = "error"
build = "error"
push = "error"

# A frozen crate is written as a consumer would write it: no feature gate and
# no raised recursion limit, each of which would hide what the api makes an
# author do. A frozen crate also changes only through its ledger: every file
# of the crate outside `tests/`, its manifest and build script included, has
# a line with its current hash, and no frozen file compiles in a file from
# elsewhere by a `path` attribute or an `include!` macro.
# Repo lints, `mock/lints/`, bound to the frozen authors crate alone.
[lints.frozen-no-outside-source]
commit = "error"
build = "error"
push = "error"
crates = ["hilavitkutin-frozen-authors"]

[lints.frozen-no-feature-gate]
commit = "error"
build = "error"
push = "error"
crates = ["hilavitkutin-frozen-authors"]

[lints.frozen-no-recursion-limit]
commit = "error"
build = "error"
push = "error"
crates = ["hilavitkutin-frozen-authors"]

[lints.frozen-ledger]
commit = "error"
build = "error"
push = "error"
crates = ["hilavitkutin-frozen-authors"]

# Advisory: vocabulary terms are common English words; warn everywhere,
# never block. Author suppresses with `// lint:allow(vocabulary-discipline)`.
[lints.vocabulary-discipline]
commit = "warn"
build = "warn"
push = "warn"

# --- Config-driven forbidden-imports (layer/boundary discipline) -----------
# Enforces module-path boundaries the token-level lints cannot express.

[lints.forbidden-imports]
commit = "error"
build = "error"
push = "error"
rules = [
    # No std / alloc anywhere in the engine (belt for the no_std / no_alloc
    # Rust lints' suspenders).
    { scope = "hilavitkutin*", forbidden = "std::*, alloc::*", reason = "hilavitkutin is no_std + no_alloc in every crate" },

    # API is contracts only — must never depend on engine internals.
    { scope = "hilavitkutin-api", forbidden = "hilavitkutin::*", reason = "hilavitkutin-api is the contract; the engine is one implementation. Contracts cannot depend on implementations." },

    # Build-time crate has zero runtime linkage.
    { scope = "hilavitkutin-build", forbidden = "hilavitkutin::*, hilavitkutin_api::*", reason = "hilavitkutin-build is build-dep-only and must not link into the runtime binary" },

    # Ecosystem crates never depend on the engine. ctx and str stand alone;
    # persistence builds on str and the api (below).
    { scope = "hilavitkutin-ctx", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_persistence::*, hilavitkutin_str::*", reason = "hilavitkutin-ctx is a standalone ecosystem crate; keep it independently usable" },
    # Persistence builds on hilavitkutin-str for its archive strings and on the
    # api for the shared `MemoryProvider`, as its DESIGN says; the engine and
    # ctx stay forbidden.
    { scope = "hilavitkutin-persistence", forbidden = "hilavitkutin::*, hilavitkutin_ctx::*", reason = "hilavitkutin-persistence builds on hilavitkutin-str and hilavitkutin-api but never on the engine or ctx" },
    { scope = "hilavitkutin-str", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*", reason = "hilavitkutin-str is a standalone ecosystem crate; keep it independently usable" },
    { scope = "hilavitkutin-sym", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*", reason = "hilavitkutin-sym is the standalone interned-identity core; it sits below the ecosystem crates and depends only on arvo and notko" },
    { scope = "hilavitkutin-kit", forbidden = "hilavitkutin::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, arvo::*, arvo_bits::*, arvo_bitmask::*, arvo_graph::*, arvo_sparse::*, arvo_spectral::*, arvo_comb::*, arvo_hash::*, notko::*", reason = "hilavitkutin-kit defines the Kit preset trait. Round 4 declarative shape (`type Units: WorkUnitBundle; type Owned: StoreBundle`) requires hilavitkutin-api substrate primitives in its bounds, so the api dep is allowed. Engine still depends on kit, not the reverse" },
    { scope = "hilavitkutin-providers", forbidden = "hilavitkutin::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_build::*, hilavitkutin_linking::*, hilavitkutin_extensions::*", reason = "hilavitkutin-providers ships default Kit impls; depends on api + str + kit + substrate. Must not depend on engine, build-time, ctx/persistence siblings, or plugin-host layer in its runtime source; its build script takes hilavitkutin-build as a build-dependency" },

    # Plugin-host layer: three crates, strict layering.
    { scope = "hilavitkutin-linking", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_extensions::*", reason = "hilavitkutin-linking is the dlopen primitive; it must stay domain-agnostic and depend only on substrate (notko, arvo, arvo-bits) and platform FFI" },
    { scope = "hilavitkutin-extensions", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_build::*", reason = "hilavitkutin-extensions is the contract-bound host layer; depends only on hilavitkutin-linking plus substrate. Must not depend on engine, api, ecosystem, or build-time in its runtime source; its build script takes hilavitkutin-build as a build-dependency" },
    { scope = "hilavitkutin-extensions-macros", forbidden = "hilavitkutin::*, hilavitkutin_api::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_build::*, hilavitkutin_linking::*", reason = "proc-macro crate; emitted output references ::hilavitkutin_extensions::* paths only. No other hilavitkutin-crate references at proc-macro runtime or in emission; the build script takes hilavitkutin-build as a build-dependency" },
    { scope = "hilavitkutin-api-macros", forbidden = "hilavitkutin::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_build::*, hilavitkutin_linking::*, hilavitkutin_extensions::*", reason = "proc-macro crate; emitted output references ::hilavitkutin_api::* paths only. No other hilavitkutin-crate references at proc-macro runtime or in emission; the build script takes hilavitkutin-build as a build-dependency" },

    # What the engine is held to. The instruments are written against the api
    # and never against the engine they hold; the frozen units are a consumer
    # and name the api and the engine's context type, nothing else of the stack.
    { scope = "hilavitkutin-conformance", forbidden = "hilavitkutin::*, hilavitkutin_frozen_authors::*, hilavitkutin_kit::*, hilavitkutin_providers::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_build::*, hilavitkutin_linking::*, hilavitkutin_extensions::*", reason = "hilavitkutin-conformance states what a frame means against hilavitkutin-api alone. A reference written against the engine it holds would share the engine's defects; its tests take the engine as a dev-dependency for the context type a unit names" },
    { scope = "hilavitkutin-frozen-authors", forbidden = "hilavitkutin_conformance::*, hilavitkutin_kit::*, hilavitkutin_providers::*, hilavitkutin_ctx::*, hilavitkutin_persistence::*, hilavitkutin_str::*, hilavitkutin_build::*, hilavitkutin_linking::*, hilavitkutin_extensions::*", reason = "hilavitkutin-frozen-authors is written as a consumer writes units: against hilavitkutin-api, with the engine's context type. Its hand model names neither, and its tests take the instruments as dev-dependencies" },

    # Engine consumes arvo bit contracts via the L2 `arvo-bitmask` surface,
    # never directly from L1 `arvo-bits`. Direct L1 coupling would bypass the
    # intended architecture layering (per arvo's own `.claude/rules`).
    { scope = "hilavitkutin", forbidden = "arvo_bits::*", reason = "engine reaches bit contracts via L2 arvo-bitmask; direct L1 coupling bypasses the layering" },
]

