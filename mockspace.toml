# The engine pin. `mockspace_version` is the released form, and mockspace has
# cut no release yet, so this tracks the working trunk instead. The launcher
# re-resolves the branch head periodically.
mockspace_branch = "dev"

project_name = "hilavitkutin"
crate_prefix = "hilavitkutin"
abi_version = 1
mock_dir = "mock"

# The canon is typed rows under `mock/registry/`: the subjects and the tenets
# under them. The questions under `mock/registry/question/` are no canon, so the
# globs leave them out; the registry loader reads every file all the same.
canon_paths = ["mock/registry/*.toml", "mock/registry/tenet/*.toml"]

proc_macro_crates = ["hilavitkutin-extensions-macros", "hilavitkutin-api-macros"]
module_crates = []

# Which macro to track per-crate in domain items
primary_domain_macro = "wu"
primary_domain_label = "WorkUnits"

# Layer labels by depth index
layers = [
    "API",          # hilavitkutin-api (contracts)
    "Engine",       # hilavitkutin (plan/dispatch/exec)
    "Build",        # hilavitkutin-build (LLVM/MIR)
    "Ext:ctx",      # hilavitkutin-ctx
    "Ext:persist",  # hilavitkutin-persistence
    "Ext:sym",      # hilavitkutin-sym
    "Ext:str",      # hilavitkutin-str
    "Ext:kit",      # hilavitkutin-kit
    "Ext:providers", # hilavitkutin-providers
]

# Domain kind labels for STRUCTURE.md domain items table
[domain_kinds]
wu = "WorkUnit"

# Known macros for DESIGN.md table (description | usage)
[known_macros]

# Crate header colors for dependency graph (bg_color | fg_color)
[crate_colors]
hilavitkutin-api = "#E8EEF7 | #3A6EA5"
hilavitkutin = "#EDE6F3 | #5C2D82"
hilavitkutin-build = "#FDF0E0 | #C05C00"
hilavitkutin-ctx = "#E6F2E6 | #2D6A2D"
hilavitkutin-persistence = "#E6F2E6 | #2D6A2D"
hilavitkutin-sym = "#E6F2E6 | #2D6A2D"
hilavitkutin-str = "#E6F2E6 | #2D6A2D"
hilavitkutin-kit = "#E6F2E6 | #2D6A2D"
hilavitkutin-providers = "#E6F2E6 | #2D6A2D"
hilavitkutin-conformance = "#F7EEE8 | #8A4B2D"
hilavitkutin-frozen-authors = "#F7EEE8 | #8A4B2D"

