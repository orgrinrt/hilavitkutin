[[registry.namespace.field]]
name = "verdict"
type = "string"
required = true
description = "pass, changes or note."

[[registry.namespace.field]]
name = "reviewer"
type = "string"
required = true
description = "Who reviewed, as a channel name."

[[registry.namespace.field]]
name = "at"
type = "string"
required = true
description = "When, UTC."

[[registry.namespace.field]]
name = "why"
type = "string"
required = false
description = "The findings in a sentence."


[[registry.namespace]]
key = "repo"
title = "Repositories"
description = "A repository the work writes in. A repository is a row so every ticket and landing spells it alike."

[[registry.namespace.field]]
name = "title"
type = "string"
required = true
description = "The repository's name as a view shows it."

[[registry.namespace.field]]
name = "name"
type = "string"
required = true
description = "owner/name on the forge."


[[registry.namespace]]
key = "plan_kind_role"
title = "Planning's reading of a ticket kind"
description = "What a ticket kind means to progress, read by planning so the tickets layer knows no planning."

[[registry.namespace.field]]
name = "ticket_kind"
type = "ticket_kind"
required = true
description = "The kind."

[[registry.namespace.field]]
name = "work"
type = "boolean"
required = true
description = "Whether tickets of the kind count as work in progress figures."

[[registry.namespace.field]]
name = "complication"
type = "boolean"
required = true
description = "Whether an open ticket of the kind is a declared complication."


[[registry.namespace]]
key = "plan_state_role"
title = "Planning's reading of a ticket state"
description = "What a ticket state means to planning."

[[registry.namespace.field]]
name = "ticket_state"
type = "ticket_state"
required = true
description = "The state."

[[registry.namespace.field]]
name = "starts"
type = "boolean"
required = true
description = "Whether the first move into the state is when work began."


[[registry.namespace]]
key = "known_red"
title = "Known reds"
description = "A test that is red on `dev`, so a helper that meets it on a branch knows whose it is without building `dev`. One row per test."

[[registry.namespace.field]]
name = "crate"
type = "string"
required = true
description = "The crate the test is in, as `cargo mock test -p <crate>` takes it."

[[registry.namespace.field]]
name = "test"
type = "string"
required = true
description = "The test filter exactly as `cargo mock test -p <crate> -- <filter>` takes it."

[[registry.namespace.field]]
name = "sha"
type = "string"
required = true
description = "The `dev` sha the test was seen red at, which says how stale the row is."

[[registry.namespace.field]]
name = "by"
type = "string"
required = true
description = "Who found it, a channel name."

[[registry.namespace.field]]
name = "at"
type = "string"
required = true
description = "When it was found, as `YYYY-MM-DDTHH:MM:SSZ`."

[[registry.namespace.field]]
name = "why"
type = "string"
required = true
description = "Whose the red is: a ticket id, or a line saying what is wrong."


# --- the workflow pack's tools -----------------------------------------------
#
# The tools that search what was already said read the maintainer's captured
# words as well as the research and the rounds. The captures are kept by the
# workspace this repository is cloned into, one directory up; in a clone that
# stands alone the tools say the directory was not read and answer from the
# repository's own record.

[tools.already-said]
maintainer_words = "../.data/op-responses"
maintainer_names = ["op", "lead designer"]

[tools.unearth]
maintainer_words = "../.data/op-responses"
maintainer_names = ["op", "lead designer"]

[tools.corpus]
maintainer_words = "../.data/op-responses"
maintainer_names = ["op", "lead designer"]

[tools.tackle]
maintainer_words = "../.data/op-responses"
maintainer_names = ["op", "lead designer"]

[tools.tickets]
maintainer_words = "../.data/op-responses"
maintainer_names = ["op", "lead designer"]
