# Takes the cargo keys of the workspace's pragmas, which the engine crate's script writes:
# it is the one written `hilavitkutin_build::script!(Workspace, workspace)`.
include = [{ path = "hilavitkutin-build.toml", optional = true }]

# Every crate whose build script is `hilavitkutin_build::script!` gets the rustc flags its
# pragmas chose through this wrapper. The wrapper's text is `hilavitkutin_build::write_wrapper`'s,
# and the script writes the file again where it holds another.
[build]
rustc-workspace-wrapper = ".cargo/hilavitkutin-rustc-wrapper"
