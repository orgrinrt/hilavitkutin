id = "runtime_strings_persist_as_content_hash_and_bytes_pairs_and_the_content_hash_is_file_identity_while_the_sequential_id_is_session_identity"
subject = "persistence"
what = "Runtime strings are persisted as pairs of content hash and string bytes. On load the constant table comes from the binary, each persisted pair is interned to a sequential identifier, and string column values are resolved by content hash lookup. The content hash is the stable file-level identity and the sequential identifier is the ephemeral session-level identity."
mechanism = "`(content_hash, string_bytes)` pairs in `runtime.rkyv`; const table from the binary (linker section); `StringTable` type."
source = "mock/crates/hilavitkutin-persistence/DESIGN.md.tmpl:169-178"
provenance = ["mock::crates::hilavitkutin-persistence::DESIGN::#string-table-persistence"]
quote = '''
## String table persistence

Runtime strings persisted as `(content_hash, string_bytes)`
pairs in `runtime.rkyv`. On load:
1. Const table available from binary (linker section)
2. Load `runtime.rkyv` → intern each pair → sequential IDs
3. Column data `Str` values resolved via content hash lookup

Content hash = stable file-level identity.
Sequential ID = ephemeral session-level identity.
'''
