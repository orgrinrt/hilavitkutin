[[tenet]]
id = "the_manifest_is_a_table_directory_of_table_metadata_archived_like_everything_else_and_the_consumer_extends_it_with_its_own_metadata"
subject = "persistence"
what = "The manifest is the directory of tables, holding for each table its name hash, schema version, record count and column metadata. It is archived like everything else, and the consumer extends it with domain-specific metadata such as schema versions and migration state."
mechanism = "`Manifest { tables: map of table_id -> TableMeta, count: ColumnCount }`; `TableMeta { name_hash: ContentHash, version: SchemaVersion, record_count: USize, column_count: ColumnCount, columns }`. Persistence-local newtypes over USize or raw integer: SchemaVersion (u32 ordinal), record_count, ColumnCount, Cardinality, BufferOffset, BufferLen, BitWidth (u32), EvictionWeight (u64)."
source = "mock/crates/hilavitkutin-persistence/DESIGN.md.tmpl:180-206"
provenance = ["mock::crates::hilavitkutin-persistence::DESIGN::#manifest"]
quote = '''
## Manifest

```rust
struct Manifest {
 tables: /* map of table_id → TableMeta */,
 count: ColumnCount,
}

struct TableMeta {
 name_hash: ContentHash,
 version: SchemaVersion,
 record_count: USize,
 column_count: ColumnCount,
 columns: /* column metadata */,
}
```

Domain aliases:

- ContentHash comes from arvo_hash (alias for arvo_bits Bits<64, Hot>).
- SchemaVersion, record_count, ColumnCount, Cardinality,
 BufferOffset, BufferLen, BitWidth, EvictionWeight are
 persistence-local newtypes over USize or raw integer (when the bit
 width is load-bearing, as with SchemaVersion's u32 ordinal).

All rkyv-archived. Consumer extends with domain-specific metadata
(schema versions, migration state, etc).
'''
