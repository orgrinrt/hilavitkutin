[[tenet]]
id = "evict_serialises_raw_column_arrays_through_the_memory_provider_and_inject_maps_the_archive_and_hands_the_pointer_over_with_zero_copy_reads"
subject = "persistence"
what = "Evicting serialises raw typed column arrays, translating string handles to content hashes and leaving everything else as it is, and writes the file through the memory provider. Injecting maps the archive file through the memory provider, reads the archived data directly with no copy, translates content hashes back into runtime handles for string columns and hands a pointer over for everything else, into the column storage."
mechanism = "Evict: column data -> rkyv serialize (with `PersistenceContext` carrying the interner) -> Str handle to content_hash, all else identity -> write `.rkyv` via MemoryProvider. Inject: mmap `.rkyv` via MemoryProvider -> archived data directly accessible (zero-copy) -> Str columns content_hash to intern to runtime handle, all else pointer handoff -> inject into ColumnStorage."
source = "mock/crates/hilavitkutin-persistence/DESIGN.md.tmpl:128-146"
provenance = ["mock::crates::hilavitkutin-persistence::DESIGN::#data-flow"]
quote = '''
### Data flow

**Evict (hot → cold):**
```
column data (raw typed arrays)
 → rkyv serialize (with PersistenceContext carrying interner)
 → Str values: handle → content_hash
 → all else: identity
 → write to.rkyv file via MemoryProvider
```

**Inject (cold → hot):**
```
mmap.rkyv file (via MemoryProvider)
 → rkyv archived data directly accessible (zero-copy)
 → Str columns: content_hash → intern → runtime handle
 → all else: pointer handoff
 → inject into ColumnStorage
```
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-persistence, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `86aa80598714`'
keywords = ["evict", "inject", "hot to cold", "cold to hot", "zero-copy", "mmap", "PersistenceContext", "pointer handoff", "ColumnStorage"]
