[[tenet]]
id = "ikiuni_s_design_applies_every_change_at_the_frame_barrier_by_a_double_buffer_swap"
subject = "downstream"
what = "In ikiuni, a reference and not hilavitkutin's record, a change never takes effect in place. It applies at the next frame barrier: the frame a tick computes over is read-only for the whole computation, and every change the tick produces is published together into the next frame by a double-buffer swap. A tick reads the previous committed frame as an immutable input and writes the next frame as output, and no reader within a tick observes another reader's write."
source = "mock/research/202611130850_the-record-read-whole/IKIUNI.md:34-38"
provenance = ["mock::research::202611130850_the-record-read-whole::IKIUNI::#mock-research-0000-canonical-design-firstmost-reference-000-fundamentals-index-md-lines-177-to-186"]
quote = '''
> A Mutation never takes effect in place. It applies at the next frame barrier: the frame a tick computes
> over is read-only for the whole of that computation, and every Mutation the tick produces is published
> together into the next frame by a double-buffer swap. A tick therefore reads the previous committed frame
> as an immutable input and writes the next frame as output, and no reader within a tick observes another
> reader's write. This application-timing law is what makes the order among a tick's own Mutations a pure
'''
origin = "proposed"
written_by = "ikiuni's canonical design, 000_FUNDAMENTALS_INDEX, at orgrinrt/ikiuni dev 634be3b; ikiuni's, a reference, not hilavitkutin's record"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: a reference from ikiuni and no part of the record of hilavitkutin, so the written history of hilavitkutin was not asked about it (`mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5`), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
