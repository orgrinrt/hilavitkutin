quote = '''
**Per-project defaults (T7 §5.3):**

| Project | Records | Shape | Strategy |
|---|---|---|---|
| polka-dots | ~200 | deep | sequential — 1µs total |
| saalis | 10K-100K | mixed | sequential for deep, adaptive for wide |
| loimu | 100K-10M | wide | phased with convergence |
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
