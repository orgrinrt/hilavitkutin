[[tenet]]
id = "a_resource_contributes_its_footprint_to_the_per_store_size_fold_through_a_footprint_trait_its_value_type_implements_and_not_through_the_column_value_bound"
subject = "stores"
what = "A resource contributes its footprint to the per-store size fold through a footprint trait that its value type implements, which holds whatever the value type's copy-ability or size. The fold then resolves for a resource value type holding sequence or map fields, a provider struct, or any non-Copy or over-sixteen-byte value. A column keeps the column-value bound, because column records are column values."
because = "Bounding the resource on the column-value trait and using its plain size does not resolve for a value type that is not a column value, so the earlier bound made the fold fail for such a resource."
mechanism = "`Resource<T>` re-bounded on `ResourceFootprint` (const `L1_BYTES`), where A3a bounded `Resource<T>` on `T: ColumnValue` and used `size_of::<T>()`; `Column<T>` keeps the `ColumnValue` bound."
source = "mock/research/sketches/202606210100_a3-resource-footprint/FINDINGS.md:59-59, mock/research/sketches/202606210100_a3-resource-footprint/FINDINGS.md:96-102"
provenance = ["mock::research::sketches::202606210100_a3-resource-footprint::FINDINGS::#claim-2-per-resource-type-footprint-trait-hand-written"]
quote = '''
A `ResourceFootprint { const L1_BYTES: USize }` trait the value type implements. The
---
- **The A3a ColumnValue-bound coherence issue is real and this fixes it.** A3a bounded
  `Resource<T>` on `T: ColumnValue` and used `size_of::<T>()`. A resource value type
  holding `Seq`/`Map` fields, a provider struct, or any non-Copy / >16B value is NOT
  `ColumnValue`, so A3a's `impl ... for Resource<T: ColumnValue>` would not resolve for
  such a `Resource` in the fold. Re-bounding `Resource<T>` on `ResourceFootprint` (which
  the value type implements regardless of Copy/size) removes the wall. `Column<T>` keeps
  the `ColumnValue` bound (column records ARE ColumnValue).
'''
origin = "proposed"
written_by = "sketch A3-2 findings of 2026-06-21 (type-level L1-morsel write-collection footprint of Resource<T>), outcome WORKS; agent-written"
