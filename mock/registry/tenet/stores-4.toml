id = "as_of_round_202607193110_a_replaceable_swap_is_a_member_by_member_copy_into_column_slots_and_not_a_blob_write"
what = "As of the revert round of 2026-07-19, the design stated that a swap of a replaceable value is a member-by-member copy of each leaf into its column slot, the same path as the initial drain, and not an in-place blob write of the whole value, with scalars written one per leaf and sequences and maps written element by element consecutively. Until that install could be built the swap returned to marking the store dirty without writing, which is honest about doing nothing rather than doing the wrong thing, the signature taking the value stayed, and the test became a catalogued red. The statement was made in the design because the code could not then express it."
mechanism = "`replace_value` marks the store dirty without writing; the old signature took `T` unifying to `Resource<Ra>`, a `PhantomData` marker carrying no value; cited to `202606210600`."
source = "mock/design_rounds/202607193110/202607193100_topic.revert-the-blob-install.md:13-15, mock/design_rounds/202607193110/202607193100_topic.revert-the-blob-install.md:30-43, mock/design_rounds/202607193110/202607193110_changelist.doc.lock.md:13-19"
provenance = ["mock::design_rounds::202607193110::202607193100_topic.revert-the-blob-install::#topic-revert-the-blob-install-from-replace-value"]
quote = '''
It should not have. `202606210600` says a `Replaceable` swap is a "member-by-member copy of each leaf
into its column slot ... **not an in-place blob memcpy**". The install is exactly the in-place blob
write that sentence rules out.
---
The **install** goes. `replace_value` returns to marking the store dirty without writing, which is
honest about doing nothing rather than doing the wrong thing.

The **signature fix stays**. The old signature took `T` unifying to `Resource<Ra>`, a `PhantomData`
marker carrying no value; it could not express an install under any mechanism. The parameter being
the value type is correct for the member-by-member install too, since the leaves are decomposed from
the value.

The **doc invariant added last round stays** and gains the member-by-member requirement, so the
design states what the install must do before anyone writes it again.

The **test** becomes a catalogued red. It asserts the right thing, that the value reaches the data
plane, and it will pass when the decomposed install lands. Deleting it would lose the case; leaving
it green would leave a test certifying an install that is not the designed one.
---
a swap is a member-by-member copy of each leaf into its column slot, the same path as the initial
drain, **not** an in-place blob write of the whole value. Scalars are a write per leaf; `Seq` and
`Map` write their elements consecutively.

This is stated in the design because the code cannot currently express it, and because a reader who
finds `replace_value` marking dirty and writing nothing should find the reason next to it rather
than having to reconstruct why the obvious one-line install is wrong.
'''
