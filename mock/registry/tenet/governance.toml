[[tenet]]
id = "phases_emerged_from_the_bench_and_replace_the_flat_dag_and_the_older_level_of_detail_names"
what = "Phases emerged from the benchmark and replace the earlier flat DAG. The old level-of-detail steps chain, chain group and partition are refined to fiber, trunk and phase, while the entry, morsel and pipeline levels are unchanged, and four earlier decisions of the second topic are superseded by a later decision of the third."
mechanism = "Supersedes: T1 decision #17 (flat DAG, not phased); T3 LOD levels 2-4 (chain, chain group, partition) refined to fiber, trunk, phase; levels 0-1 (entry, morsel) and 5 (pipeline) unchanged; T2 decisions #9, #12, #13, #14 superseded by T3 decision #51."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:803-808"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#11-cache-hierarchy-tiling-and-phase-decomposition"]
quote = '''
**What T6 supersedes:**
- T1 decision #17 "flat DAG, not phased" — phases emerged from bench
- T3 LOD levels 2-4 (chain → chain group → partition) — refined to
  fiber → trunk → phase. Levels 0-1 (entry, morsel) and 5 (pipeline)
  unchanged.
- T2 decisions #9, #12, #13, #14 — superseded by T3 decision #51
'''
origin = "stated"
standing = "provisional"
subject = "governance"
keywords = ["supersedes", "flat DAG", "phases", "LOD levels", "fiber", "trunk", "partition", "T3 decision #51"]

[[tenet]]
id = "the_earlier_archetype_chain_and_partition_decisions_are_superseded_by_fibers_trunks_and_phases"
what = "The earlier archetype scheduling hint, the chain partitioning decisions and the tiling model level-of-detail steps are superseded by the fiber, trunk and phase model. The rule that partitions are connected components is subsumed by phase detection via waist analysis, the order field on a unit is replaced by scheduling hint priority, and the greedy fusion algorithm is retained with its vocabulary updated."
mechanism = "Superseded: T1 §11.4.6 archetype as scheduling hint (dead, subsumed by fibers); T2 decisions #9-13 (by T3 decision #51, refined by T6/T7 register-file-aware limits); T3 decisions #41-51 (LOD levels refined: chain to fiber, chain group to trunk, partition to phase); T3 decision #48 (partitions = connected components, subsumed by phase detection via waist analysis); T6 `order` field on WU (replaced by scheduling hint priority); T7 §1.3 Kahn's + greedy fusion (retained, vocabulary updated)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1190-1200"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#14-fiber-formation"]
quote = '''
**What this supersedes:**
- T1 §11.4.6 "archetype as scheduling hint" → dead, subsumed by fibers
- T2 decisions #9-13 (chain partitioning, max_cols) → superseded by T3
  decision #51, further refined by T6/T7 register-file-aware limits
- T3 decisions #41-51 (tiling model, LOD levels 2-4) → LOD levels
  refined: "chain" → fiber, "chain group" → trunk, "partition" → phase
- T3 decision #48 "partitions = connected components" → subsumed by
  phase detection via waist analysis
- T6 `order` field on WU → replaced by scheduling hint priority
- T7 §1.3 "Kahn's + greedy fusion" → algorithm retained, vocabulary
  updated (chain → fiber)
'''
origin = "stated"
standing = "provisional"
subject = "governance"
keywords = ["supersedes", "archetype", "chain", "partition", "order field", "T3 decision #48", "T7 1.3", "vocabulary"]
cites = ["scheduling_hints_replace_an_order_field_on_the_unit"]

