[[tenet]]
id = "type_native_stride_supersedes_the_tagged_128_bit_stride_and_the_bench_finding_governs"
what = "The type-native stride supersedes the earlier 128-bit tagged stride, the universal 128-bit stride and the rule that the stride is the SIMD lane. The benchmark finding that type-native stride outperforms the 128-bit one is now the authoritative text."
mechanism = "Superseded: T1 decisions #80-81, T2 decision #1, T3 decision #90."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:383-383, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:390-392"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#04-column-memory-layout"]
quote = '''
**Resolution R3: type-native stride, no flags byte.**
---
**Supersedes:** T1 decisions #80-81 (128-bit tagged stride), T2 decision #1
(universal 128-bit), T3 decision #90 (stride IS the SIMD lane). The
T6 bench finding (type-native outperforms 128-bit) is now authoritative.
'''
origin = "stated"
standing = "provisional"
subject = "governance"
keywords = ["supersedes", "type-native stride", "128-bit", "T6 bench", "R3", "authoritative"]

[[tenet]]
id = "the_column_value_trait_replaces_the_payload_and_slot_size_system"
what = "The column value trait with its blanket implementation replaces the payload trait and the sealed slot size system. The rule that stride is the SIMD lane is superseded by R3, and the fifteen-byte constraint is updated to sixteen bytes."
mechanism = "Replaced: T3 decisions #83-87 (Payload trait, sealed SlotSize, Slot1-15), T3 decision #90, T1 decisions #82-83, the T4 §Q6 `Check<size_of <= 15>` pattern (now <= 16)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:466-471"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#05-column-value-types"]
quote = '''
**What this supersedes:**
- T3 decisions #83-87 (Payload trait, sealed SlotSize, Slot1-15) → replaced
  by ColumnValue with blanket impl
- T3 decision #90 (stride IS the SIMD lane) → superseded by R3
- T1 decisions #82-83 (15-byte constraint) → updated to 16-byte
- T4 §Q6 `Check<size_of ≤ 15>` pattern → updated to ≤ 16
'''
origin = "stated"
standing = "provisional"
subject = "governance"
keywords = ["Payload", "SlotSize", "ColumnValue", "supersedes", "15-byte", "16-byte", "R4"]
cites = ["each_column_has_its_own_stride_and_a_value_is_at_most_sixteen_bytes"]

