[[tenet]]
id = "the_record_s_precedence_is_the_founding_spec_then_dated_amendments_then_the_reading_aid_then_the_rest"
what = "The precedence order of the record is: first the consolidation spec, the founding canon; second the amendments that the maintainer ruled or a bench decided, in date order, each modifying canon where it explicitly speaks, where a later ruling wins over an earlier one on the same point and the consolidation spec's wording is the tiebreak where an amendment is silent or ambiguous; third the standalone spec, a commissioned reading aid with no independent design authority, whose conflict with the first two is a transcription defect to be fixed in it; and fourth everything else, roadmaps, audits, expert memos, sketches, the design templates and agent memory, which are intermediate artifacts and never canon."
source = "mock/research/pre_seed/202607193200_canon-amendment-a2-precedence-and-rulings.md:27-41"
provenance = ["mock::research::pre_seed::202607193200_canon-amendment-a2-precedence-and-rulings::#a2-1-document-precedence-traced-ruling"]
quote = '''
The precedence order is therefore:

1. The consolidation spec (`202603181200`), the founding canon.
2. Op-ruled and bench-decided amendments, in date order, each modifying canon where it
   explicitly speaks: the chain registered in A1, plus the unified-engine amendment
   (`202606061000`, op explicit ruling 2026-06-06, registered below), plus A1 itself, plus the
   storage addendum (`202606210600_resource-storage-model-canonical-addendum.md`, bench-decided
   with op's hybrid call 2026-07-02), plus this addendum, plus later dated rulings. A later
   ruling wins over an earlier one on the same point. Where an amendment is silent or
   ambiguous, the consolidation spec's wording is the tiebreak.
3. The standalone spec: a commissioned reading aid with no independent design authority. Where
   it conflicts with tiers 1 or 2, the conflict is a transcription defect in the standalone, to
   be fixed there. Its header is corrected to state this (same commit as this file).
4. Everything else (roadmaps, audits, expert memos, sketches, DESIGN.md.tmpl, agent memory):
   intermediate artifacts, never canon.
'''
origin = "proposed"
written_by = "addendum A2 (locked 2026-07-19), section A2-1, a provenance trace the maintainer delegated with the words it quotes"
standing = "provisional"
subject = "governance"
keywords = ["precedence", "ladder", "founding canon", "amendments", "date order", "standalone", "reading aid", "intermediate", "never canon"]

[[tenet]]
id = "the_standalone_spec_s_claim_to_win_conflicts_exceeds_its_commission"
what = "The standalone spec claims in its header that where it and any older document disagree, it is the design. Addendum A2 traces that this claim exceeds its commission: the commission grants the role of a faithful consolidation that spares the reader cross-reading, and does not grant authority to win conflicts, since any disagreement of a faithful consolidation with its sources is by definition a transcription defect in the consolidation. The standalone also entered the repository unsigned inside a feature squash and never through its own reviewed round."
source = "mock/research/pre_seed/202607193200_canon-amendment-a2-precedence-and-rulings.md:15-25"
provenance = ["mock::research::pre_seed::202607193200_canon-amendment-a2-precedence-and-rulings::#a2-1-document-precedence-traced-ruling"]
quote = '''
The standalone spec (`202606111800_canonical-spec-standalone.md`) claims in its header that
"where this document and any older one disagree, this document is the design." That claim
exceeds its commission. The commissioning text is A1 "Sequence from here" item 3, op-blessed
live 2026-06-11: the standalone is written "fully self-contained, readable with no prior
project knowledge ... superseding the need to cross-read the chain registered above." The
commission grants the role of a faithful consolidation that spares the reader cross-reading. It
does not grant conflict-winning authority, and a faithful consolidation cannot legitimately win
conflicts against its sources: any disagreement with them is by definition a transcription
defect in the consolidation. Provenance agrees: A1 is op-locked; the standalone entered the
repo unsigned inside the GATE-2 feature squash (`ff147c1a`, 2026-06-19), never through its own
reviewed round.
'''
origin = "proposed"
written_by = "addendum A2 (locked 2026-07-19), section A2-1, a provenance trace the maintainer delegated with the words it quotes"
standing = "provisional"
subject = "governance"
keywords = ["standalone spec", "commission", "conflict", "transcription defect", "consolidation", "provenance", "squash"]

