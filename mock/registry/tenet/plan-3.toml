id = "the_accumulator_store_set_is_produced_at_the_store_drain_as_a_flat_bitmask_and_a_fiber_is_morsel_local_when_no_unit_in_it_writes_an_accumulator"
subject = "plan"
what = "A fiber is morsel-local exactly when no unit in it writes an accumulator. The set of accumulator stores is produced at the store drain, where the accumulator stores are visible as distinct type-level facts, as a small flat bitmask shaped over the drain's stores, with no allocation and no new trait machinery beyond the existing const-fold pattern."
mechanism = "`resource/bindings.rs`, where `Sv<Accum<T>, _>` nodes are visible as distinct type-level facts, the same layer `AccumFreeBindings` folds; a `Mask`-shaped bitmask over `D::Stores`; fibers are formed plan-side from store access masks that do not distinguish accumulator stores, while the accumulator distinction is type-level (`AccumBinding`)."
source = "mock/design_rounds/202606051500/202606051500_changelist.doc.lock.md:11-11, mock/design_rounds/202606051500/202606051500_changelist.doc.lock.md:13-13"
