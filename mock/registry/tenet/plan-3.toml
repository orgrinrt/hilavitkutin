Supersedes `202605302330_changelist.doc.deprecated.md`. That CL framed this round as the full store-backed cut: `ExecutionPlan` becomes a `Copy` handle (meta-`StoreId`s plus counts), the data lives in the scheduler-owned `ColumnStorage`, and the `Scheduler` gains `CS: ColumnStorage = ArenaColumnStorage<M, Dim<256>>` with an `unsafe impl Send`/`Sync`. That shape is correct as the arc's end state, but it bundles the load-bearing flatten with cross-crate plumbing (an engine -> `hilavitkutin-providers` dependency for the default store, a 64-byte-aligned test `MemoryProvider`, the scheduler `Send`/`Sync` lifecycle) into one atomic-compile change. This CL stages the arc: it keeps the same end-state design but ships the flatten alone in this round (the piece that dissolves the 11 MB overflow and unblocks #647), and demotes the store-backing to the engine BACKLOG as the explicit next round. The end state is unchanged; only the round boundary moves. The deprecated CL's `## Store-backed execution plan` DESIGN subsection becomes `## Flat execution plan`; the store-backing prose moves to forward-looking notes pointing at `BACKLOG.md`.
'''
