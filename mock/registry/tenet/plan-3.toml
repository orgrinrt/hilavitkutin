[[tenet]]
id = "the_plan_is_a_twelve_step_chain_inherited_from_prior_art_plus_a_thirteenth_step_that_classifies_the_shape_of_each_fiber"
subject = "plan"
what = "The plan is computed by a chain of twelve steps inherited from the polka-dots prior art, composed as free functions, and a thirteenth step that classifies the shape of each fiber into a typed projection consumed by dispatch code generation."
mechanism = "`build_dag -> topo_sort -> upward_rank -> waist -> RCM -> block-diag -> spectral -> fiber group -> morsel size -> phase config -> column classify -> dirty masks`; step 13 `shape_classification` produces the typed `FiberShape` projection (round 202605101036). Foundations used: `arvo-bitmask` set ops, `arvo-graph` DAG / RCM, `arvo-sparse` CSR DependencyGraph, `arvo-spectral` Fiedler partition, `arvo-comb` cost DP."
source = "mock/DESIGN.md.tmpl:46-50"
provenance = ["mock::DESIGN::#plan-algorithm-chain-12-steps-step-13-fibershape-classification"]
quote = '''
### Plan algorithm chain (12 steps + step 13 FiberShape classification)

Free-function composition over the 12-step canonical chain inherited from the polka-dots prior art: `build_dag → topo_sort → upward_rank → waist → RCM → block-diag → spectral → fiber group → morsel size → phase config → column classify → dirty masks`. Round 202605101036 adds step 13 `shape_classification` producing the typed `FiberShape` projection consumed by dispatch codegen. The chain's output is a flat `ExecutionPlan`: the phase / trunk / fiber tree flattens CSR-style into plan-wide-sized flat arrays (a `phases` array, a flat `trunks` pool, a flat `fibers` pool), each phase and trunk carrying an offset-and-count range into the next pool. The `PlanDims` dimensions size the flat pools, collapsing the dense per-aggregate nesting that measured 11 MB at the default budget. Unifying these flat columns onto the scheduler's columnar store is the next step in the unified-storage arc.

Each step names its foundations crate dependency: `arvo-bitmask` for set ops, `arvo-graph` for DAG / RCM, `arvo-sparse` for CSR DependencyGraph (bench-locked canonical at all N), `arvo-spectral` for the Fiedler partition step, `arvo-comb` for the cost DP.
'''
origin = "proposed"
written_by = "the design template of the workspace, agent-written, undated"
standing = "provisional"
stamped_by = "experts"
stamp = 'provisional, 2026-11-13: a passage shows part of it to be his and not the whole of it (mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:90-92; mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1229-1262), so it is not ratified by default from the written history and stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md), and asked of the maintainer in ticket `86aa80598714`'
