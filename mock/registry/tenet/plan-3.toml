[[tenet]]
id = "the_dependency_graph_is_a_csr_at_every_size_with_no_threshold_because_the_bench_shows_dense_slower_even_at_eight_nodes"
subject = "plan"
what = "The dependency graph is backed by compressed sparse rows at every node count, with no threshold below which a dense matrix is used. The bench shows the dense form slower from eight nodes up. A hybrid of dense up to sixteen and compressed sparse rows above measured within noise of pure compressed sparse rows from thirty-two nodes up and slightly faster at 128 and 256 nodes, and the hybrid is dropped for simplicity."
mechanism = "Bench `mock/benches/dep_graph_csr_9` (2026-05-11), CSR ns/op against dense ns/op: N=8 146 vs 724, N=16 206 vs 1239, N=32 302 vs 2911, N=64 645 vs ~12500, N=128 1225 vs ~41300, N=256 2546 vs ~151000; the predicted crossover at N=16 is wrong; the earlier pending value `CSR_THRESHOLD_N` is not locked."
source = "mock/design_rounds/202605101036/202605101036_topic.plan-caching.md:21-30, mock/design_rounds/202605101036/202605101036_topic.plan-caching.md:32-34, mock/design_rounds/202605101036/202605101036_topic.plan-caching.md:66-66"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.plan-caching::#axis-b-dependencygraph-backing-csr-vs-dense-bench-locked-csr"]
quote = '''
**Locked: CSR canonical at all N, no threshold.** Bench result from `mock/benches/dep_graph_csr_9` (2026-05-11):

| N nodes | CSR ns/op | Dense ns/op | Dense slowdown vs CSR |
|---|---|---|---|
| 8 | 146 | 724 | +397% (5x slower) |
| 16 | 206 | 1239 | +502% (6x slower) |
| 32 | 302 | 2911 | +862% (10x slower) |
| 64 | 645 | ~12500 | +1840% (20x slower) |
| 128 | 1225 | ~41300 | +3270% (34x slower) |
| 256 | 2546 | ~151000 | +5830% (60x slower) |
---
**Predicted crossover N=16 is wrong.** CSR wins even at N=8 because dense O(N²) cell-scan beats CSR's edge-direct iteration's loop overhead only when N is so small the matrix fits trivially in registers, which is essentially never. At realistic DAG densities (3-6 edges/node), CSR's E iterations always beat dense's N² scans.

Hybrid variant (dense for N≤16, CSR else) measured within noise of pure CSR at N≥32, slightly faster at N=128 (-12%) and N=256 (-22%) due to cache effects on the unused col_indices allocation, but pure CSR is the canonical shape for simplicity. The hybrid variant is dropped.
---
Pending bench. The bench tests CSR vs dense `DependencyGraph::add_edge` + `iter_successors(u)` at N = 8, 16, 32, 64, 128, 256 with edge density ~2-6 per node. Crossover N is what the bench finds; lock the value into engine code as `CSR_THRESHOLD_N`. Until bench lands, CSR is the working default for all N.
'''
