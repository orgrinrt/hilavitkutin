mechanism = "`build_dag -> topo_sort -> upward_rank -> waist -> RCM -> block-diag -> spectral -> fiber group -> morsel size -> phase config -> column classify -> dirty masks`; step 13 `shape_classification` produces the typed `FiberShape` projection (round 202605101036). Foundations used: `arvo-bitmask` set ops, `arvo-graph` DAG / RCM, `arvo-sparse` CSR DependencyGraph, `arvo-spectral` Fiedler partition, `arvo-comb` cost DP."
