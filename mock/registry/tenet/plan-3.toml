[[tenet]]
id = "the_per_fiber_unit_and_column_caps_are_derived_from_the_outer_caps_by_division_which_cuts_the_independent_const_generics_from_nine_to_seven"
subject = "plan"
what = "The per-fiber unit cap and per-fiber column cap are derived from the outer caps by division rounded up, which brings the independent const generic count of the plan from nine to seven. A hybrid of const-generic outer caps and runtime-checked inner sizes is a deferred alternative, and the first version uses const generics only."
because = "The outer const generics produce one full monomorphisation per distinct scheduler configuration, which multiplies codegen work for consumers with several scheduler shapes, and the const-generic-only model produces strictly faster code because the inner loop has no runtime bounds check."
mechanism = "`MAX_UNITS_PER_FIBER = MAX_UNITS / MAX_FIBERS` and `MAX_COLUMNS_PER_FIBER = MAX_COLUMNS / MAX_FIBERS` (rounded up via `Cap`), earlier drafted as `CeilingDiv<MAX_UNITS, MAX_FIBERS>::RESULT`; the nested `Fiber<...>` takes the derived values as const generics computed through `generic_const_exprs`; Topic 3 invariant M9."
source = "mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:115-115, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1017-1017, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1019-1024, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1026-1028"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.plan-algorithm-chain::#final-executionplan-shape"]
quote = '''
    const MAX_UNITS_PER_FIBER:     usize,  // = CeilingDiv<MAX_UNITS, MAX_FIBERS>::RESULT
---
The 9 outer const generics on `ExecutionPlan` produce one full monomorphisation per distinct `Scheduler` configuration. For consumers with multiple Scheduler shapes (viola checker + vehje compilation server), this multiplies codegen work.
---
Mitigation: derive `MAX_UNITS_PER_FIBER` and `MAX_COLUMNS_PER_FIBER` from outer constants:

```text
MAX_UNITS_PER_FIBER   = MAX_UNITS / MAX_FIBERS  (rounded up via Cap)
MAX_COLUMNS_PER_FIBER = MAX_COLUMNS / MAX_FIBERS  (rounded up via Cap)
```
---
Reduces the independent dimension count from 9 to 7 on the outer ExecutionPlan. Nested `Fiber<...>` still takes the derived values as const generics; rustc trait-solver computes them via `generic_const_exprs`.

For runtime-decided sizing (where the consumer would otherwise need a different Scheduler per workload), a future-considered alternative is a hybrid: const-generic outer caps + runtime-checked inner sizes (USize counts validated against const-generic upper bounds). This is a deferred optimisation; v1 uses the const-generic-only model because it produces strictly faster code (no runtime bounds check in the inner loop).
'''
