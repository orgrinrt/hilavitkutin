[[tenet]]
id = "the_capacity_lift_is_made_for_the_one_capacity_the_arvo_wrappers_consume_with_one_witness_clause_per_function"
subject = "plan"
what = "The capacity lift to a Cap is made only for the one capacity parameter that feeds the arvo wrappers, and each function carries exactly one witness clause for it, which propagates up the caller chain as that one clause and not as a product. Witness propagation through the engine's caller graph does not blow up the trait solver. Every other capacity stays a plain usize."
because = "The attempts that hung are held, as a working theory, to have swept witness clauses over every capacity const generic on every function, a cartesian product across many const generics, and not the single-witness-per-function shape."
mechanism = "One clause `[(); cap_size(cap_of(MAX_UNITS))]:` per function; the three stubs (rcm, block, spectral) consume only MAX_UNITS and not MAX_PHASES or MAX_FIBERS; eleven const generics on `compute_execution_plan` would carry eleven witness clauses under the sweep."
source = "mock/research/sketches/202605131500-witness-propagation/OUTCOME.md:31-42, mock/research/sketches/202605131500-witness-propagation/OUTCOME.md:56-67, mock/research/sketches/202605131500-witness-propagation/OUTCOME.md:73-75"
provenance = ["mock::research::sketches::202605131500-witness-propagation::OUTCOME::#what-this-changes-about-the-prior-plan"]
quote = '''
S2's evidence: witness propagation does not blow up. The src CL's
fear (path-1 propagation triggers exponential trait-solver work) is
not supported by S2. The src CL's Pass 2.5 (reverted) attempts hung
because they swept witness clauses over EVERY MAX_X (cartesian
product across many const generics on every fn), not because of the
single-witness-per-fn shape S1+S2 establish.

The real wire-up plan uses exactly one witness clause per fn:
`[(); cap_size(cap_of(MAX_UNITS))]:`. All three stubs (rcm, block,
spectral) only consume MAX_UNITS, not MAX_PHASES or MAX_FIBERS. The
witness is identical across the three stubs; propagation up the
caller chain duplicates this one clause, not a cartesian product.
---
## Why the attempt-3 hang happened (working theory)

Attempt 3 (per src CL Pass 2.5 line 348-353) swept every engine
`<const MAX_*: usize>` to `<const MAX_*: Cap>` AND added a `[();
cap_size(MAX_X)]:` clause for every MAX_X on every fn. Eleven const
generics on `compute_execution_plan` would carry eleven witness
clauses, every fn calling it would also need eleven, every fn calling
those would need them too.

That is a cartesian shape: O(N const generics) witnesses per fn x
O(N callers) propagation depth. The trait solver's per-impl
constraint set scales multiplicatively.
---
The misread is in attempting to lift EVERY engine MAX_X to Cap. The
correct lift is only the one MAX_X that the arvo wrappers consume.
Everything else stays usize.
'''
origin = "proposed"
written_by = "sketch outcome S2 witness-propagation of 2026-05-13 (status HYPOTHESIS CONFIRMED), agent-written; it answers the unresolved witness-propagation question of sketch 202605121400-call-site-cap-turbofish"
standing = "held"
keywords = ["witness propagation", "cap_size", "cap_of", "MAX_UNITS", "Cap lift", "trait solver", "witness clause", "attempt 3 hang"]
rejects = ["swept every engine `<const MAX_*: usize>` to `<const MAX_*: Cap>` AND added a `[(); cap_size(MAX_X)]:` clause for every MAX_X on every fn"]

