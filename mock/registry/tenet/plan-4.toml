[[tenet]]
id = "the_accumulator_store_set_is_a_type_level_fold_over_the_global_stores_list_in_the_same_index_space_as_the_plan_s_access_masks"
subject = "plan"
what = "The accumulator-store set that a fiber's morsel-local test reads is produced by a type-level fold over the global stores list, setting the bit at each accumulator member's position, so that it lives in the same index space as the plan's access masks. The intersection of a unit's write mask with the accumulator mask is then self-consistent in one space."
because = "The plan's access masks index stores by position in the global stores list, whereas the drain's store identity advances once per non-zero-sized resource and once per column, skipping zero-sized resources, which is a different space, and the per-unit write masks live in the stores-list-position space."
mechanism = "A type-level fold over the global `Stores` AccessSet, built by the same `MaskProject` machinery; `PlanInputs.reads/writes/access` indexed by position through `WitnessIndex` / `Locate` / `MaskProject` (`plan/project.rs`); the drain's `StoreId` space (`bindings.rs:269`); `writes[u] & accum_mask`."
source = "mock/design_rounds/202606051500/202606051500_changelist.src.lock.md:11-11, mock/design_rounds/202606051500/202606051500_changelist.src.lock.md:13-13"
provenance = ["mock::design_rounds::202606051500::202606051500_changelist.src.lock::#deviation-from-the-locked-doc-cl-recorded-per-cl-claim-sketch-discipline-arvo-bridge-home-rule-precedent"]
quote = '''
The locked doc CL (and the architect read it captured) place the accumulator-store-set production at the store DRAIN, as a `Mask` over `D::Stores`. SRC inspection of `plan/project.rs` shows that is the wrong store-index space: the plan's access masks (`PlanInputs.reads/writes/access`) index stores by POSITION IN THE GLOBAL `Stores` AccessSet cons-list (`WitnessIndex` / `Locate` / `MaskProject`), whereas the drain's `StoreId` advances "once per non-zero-sized resource and once per column" (`bindings.rs:269`), skipping ZST resources, a different space. A fiber's morsel-local test is "does any unit in the fiber write an accumulator," and the per-unit write masks (`PlanInputs.writes`) live in the Stores-list-position space. So the accumulator mask must live in that same space.
---
Corrected production site: a type-level fold over the global `Stores` AccessSet, built by the same `MaskProject` machinery, setting the bit at each `Accum<T>` member's position. The intersection `writes[u] & accum_mask` is then self-consistent in one space, independent of the drain's `StoreId` space. The locked doc CL stays as audit trail; this src CL is the corrected execution.
'''
