[[tenet]]
id = "the_consolidation_spec_never_special_cases_single_core_as_a_code_path"
what = "Cross-checked against the consolidation spec, the spec never special-cases single-core as a code path. Sequential at one core with no overhead is one of the per-phase strategy modes, single-core being trivially ordered is a statement about ordering, pool size is the physical core count and thread count is the lesser of the physical core count and the parallelisable bound, morsel-to-core affinity is an adaptive plan-stage parameter, and the compiled per-core program is the dispatch, with one program, one arriver at each phase sync point and one worker at one core, so nothing forks."
mechanism = "Spec lines: `:1956` sequential 1.00x as a strategy among MAX_FUSE / BALANCED / MAX_SPLIT / sequential (`:1916-1956`); `:605` single-core = trivially ordered; `:1799` pool size = `physical_core_count`; `:1826` thread count = `min(physical_cores, parallelisable ...)`; R6 morsel-to-core affinity (`:2442-2446`); domain 17 compiled per-core program (`:1596-1613`)."
source = "mock/research/202606061000_canon-amendment-unified-engine.md:11-20"
provenance = ["mock::research::202606061000_canon-amendment-unified-engine::#what-i-found-the-verification-op-asked-for"]
quote = '''
## What I found (the verification op asked for)

op believed the canonical design already encodes this ("I did the canonical too"). Cross-checked against the consolidation spec, confirmed: the spec never special-cases single-core as a code path.

- "sequential, 1.00x, single core, no overhead" (`:1956`) is one of the per-phase STRATEGY modes (MAX_FUSE / BALANCED / MAX_SPLIT / sequential, `:1916-1956`) the plan selects. A strategy, not an engine.
- "single-core = trivially ordered" (`:605`) is a statement about ordering being trivial at one core, not a separate path.
- Pool size = `physical_core_count` (`:1799`); thread count = `min(physical_cores, parallelisable ...)` (`:1826`); morsel-to-core affinity is an adaptive plan-stage parameter (R6, `:2442-2446`). Core count is a parameter the unified machinery adapts to.
- The compiled per-core program (domain 17, `:1596-1613`) is THE dispatch. With one core there is one program; its phase sync points have one arriver; the pool has one worker. Nothing forks.

So the unified model is already canonical; this amendment makes op's authoritative ruling explicit and removes the ambiguity that let intermediate artifacts drift toward a special-cased single-core path.
'''
origin = "proposed"
written_by = "canon amendment of 2026-06-06 on the unified engine, the working out under the maintainer's ruling, written in the first person by an author the text does not name"
standing = "provisional"
subject = "execution"
keywords = ["single-core", "strategy modes", "sequential", "physical_core_count", "per-core program", "domain 17", "R6", "verification"]
cites = ["the_engine_is_one_and_the_core_count_is_configuration"]

