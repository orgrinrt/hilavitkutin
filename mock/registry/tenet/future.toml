[[tenet]]
id = "per_fiber_windowed_dispatch_is_to_be_measured_against_the_shared_window_and_a_loss_goes_to_the_maintainer"
subject = "future"
what = "Serving a window per fiber on the flat carrier costs repeated walks, and a sketch found the cost inherent to the mandated mechanism. The roadmap asks for per-fiber windowed dispatch to be measured against the shared-window shape at fiber counts of 1, 2, 4 and 8 on both fiber kinds; if the locality win does not cover the walk cost at realistic fiber counts, that is a finding about the mechanism to bring to the maintainer and not to absorb."
mechanism = "With F fibers of m morsels each over U trunk units, dispatch does F x m x U runtime `dirty.bit` tests where the shared-window shape did m x U, because `Member::IS` is const per trunk and not per fiber; sketch `202607191200_a4-fibercons-nest-wireability`; roadmap item G2C-M."
source = "mock/research/202611130850_the-record-read-whole/RECOVERED.md:153-162"
provenance = ["mock::research::202611130850_the-record-read-whole::RECOVERED::#mock-research-202607181300-engine-roadmap-r6-md-lines-211-to-220"]
quote = '''
**G2C-M also carries the per-fiber walk-overhead arm (added 2026-07-19).** Serving per-fiber L1
windows on the flat carrier costs re-walks, and the sketch
`202607191200_a4-fibercons-nest-wireability` established that the cost is inherent to the mandated
mechanism rather than a shape choice: with F fibers of m morsels each over U trunk units, dispatch
does F x m x U runtime `dirty.bit` tests where the old shared-window shape did m x U, for identical
executed work, because `Member::IS` is const per trunk rather than per fiber. Measure per-fiber
windowed dispatch against the shared-window shape at fiber counts 1, 2, 4 and 8, on both fiber
kinds. This applies to `run` as much as to `run_core_phase`, since A2b shipped the same shape. If
the locality win does not cover the walk cost at realistic fiber counts, that is a finding about the
mechanism to surface to op rather than absorb. If bandwidth saturates by 4 cores on the heavy fiber, that is the ceiling
'''
