[[tenet]]
id = "plan_recompute_is_sequential_and_single_threaded_in_the_first_version_and_parallelising_it_waits_for_pipelines_of_256_units_or_more"
subject = "future"
what = "In the first version the plan recompute runs sequentially on one thread. Making it parallel is deferred until consumers ship pipelines of 256 units or more."
mechanism = "Sequential single-threaded recompute in v1; parallelisation deferred until consumers ship 256+ WU pipelines."
source = "mock/DESIGN.md.tmpl:100-100"
provenance = ["mock::DESIGN::#plan-caching"]
quote = '''
Per-`PlanAffecting`-resource dirty bit array. Plan cache lives with Scheduler for the pipeline's lifetime: the cached plan is the flat `ExecutionPlan`, reused across frames and recomputed only when a `PlanAffecting` resource dirties. Sequential single-threaded recompute in v1 (parallelisation deferred until consumers ship 256+ WU pipelines). Moving the flat plan columns onto the scheduler's columnar store is the next step in the unified-storage arc.
'''
origin = "proposed"
written_by = "the design template of the workspace, agent-written, undated"
standing = "held"
keywords = ["plan recompute", "sequential", "single-threaded", "v1", "parallelisation deferred", "256 units"]

[[tenet]]
id = "work_stealing_and_calibration_of_the_spin_budget_at_pool_build_are_backlog_and_the_spin_budget_is_fixed_at_128_in_the_first_version"
subject = "future"
what = "Work stealing and a calibration micro-bench for the spin budget when the thread pool is built are deferred to the backlog. The spin budget is fixed in the first version."
mechanism = "Spin-budget calibration micro-bench at `ThreadPool::build()` BACKLOG; fixed 128 in v1."
source = "mock/DESIGN.md.tmpl:78-78"
provenance = ["mock::DESIGN::#thread-pool-executor"]
quote = '''
Work-stealing BACKLOG. Spin-budget calibration micro-bench at `ThreadPool::build()` BACKLOG; fixed 128 in v1. `Scheduler::Drop` sets `shutdown` flag, futex-wakes all parked, and waits on the exit counter until every worker has left its mainloop; the engine holds no thread handle to join, because the threads are the consumer executor's.
'''
