id = "an_extension_author_supplies_metadata_and_optional_init_and_shutdown_and_provider_export_through_four_traits"
subject = "extensions"
what = "An extension author feeds the name, the version and the required host providers into the export macro through a metadata trait, may implement an optional init trait and a matching optional shutdown trait for behaviour beyond the no-op default, and advertises a provider through a provider-export trait that gives its identifier and its vtable pointer."
mechanism = "`ExtensionMeta` (`NAME: &'static [u8]`, `VERSION: ExtensionVersion`, `REQUIRED_HOST_PROVIDERS: &'static [ProviderId]`); `InitHandler` (`extern \"C\" fn init(host_ctx: *mut c_void) -> ExtensionAbiStatus`); `ShutdownHandler`; `ProviderExport` (`const ID: ProviderId`, `const VTABLE_PTR: *const c_void`), typically implemented through a consumer-domain macro."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:44-47"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#public-items"]
quote = '''
- `ExtensionMeta` is the trait that extension authors implement to feed name, version, and required host provider metadata into the `#[export_extension]` macro. Associated constants: `NAME: &'static [u8]`, `VERSION: ExtensionVersion`, `REQUIRED_HOST_PROVIDERS: &'static [ProviderId]`.
- `InitHandler` is the optional trait for authors who want init behaviour beyond the no-op default. Its single method is `extern "C" fn init(host_ctx: *mut c_void) -> ExtensionAbiStatus`.
- `ShutdownHandler` is the matching optional trait for shutdown behaviour.
- `ProviderExport` is the trait extension authors implement (typically via a consumer-domain macro) to advertise a provider: `const ID: ProviderId` plus `const VTABLE_PTR: *const c_void`.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
