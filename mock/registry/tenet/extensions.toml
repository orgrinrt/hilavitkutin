[[tenet]]
id = "a_provider_identifier_is_a_compile_time_fnv_64_hash_of_an_ascii_name_and_a_collision_is_settled_by_renaming"
subject = "extensions"
what = "A provider identifier is a 64-bit value derived at compile time from an ASCII byte-string name, evaluated on both the host and the extension side, which makes it bit-equal across independently compiled binaries. Collisions are vanishingly rare but not impossible, and when one occurs the consumers rename, which is a compile-time operation, so no runtime collision detection is needed."
mechanism = "`ProviderId` is a `#[repr(transparent)]` newtype over `u64`; `ProviderId::from_name(name)` is a `const fn` using FNV-64; consumer contract crates declare ids as consts, for example `pub const PROVIDER_LINTER: ProviderId = ProviderId::from_name(b\"viola.linter.v1\");`. The `pub u64` field is the deliberate FFI-wire constructor pattern."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:28-28, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:100-104"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#public-items"]
quote = '''
- `ProviderId` is a `#[repr(transparent)]` newtype over `u64` derived at compile time from an ASCII byte-string name via a FNV-64 const function. Consumer contract crates declare provider ids as `const` items. The `pub u64` field is the deliberate FFI-wire constructor pattern.
---
## Provider identification

`ProviderId::from_name(name)` is `const fn` using FNV-64. Consumer contract crates declare provider names as const byte strings (e.g. `pub const PROVIDER_LINTER: ProviderId = ProviderId::from_name(b"viola.linter.v1");`). The id is compile-time evaluated on both the host and extension sides of the boundary, guaranteeing stable bit-equality across independently compiled binaries.

Collisions at 64 bits are vanishingly rare but not impossible. If they occur, consumers rename. The const nature of derivation means rename is a compile-time operation on both sides; no runtime collision detection is needed.
'''
