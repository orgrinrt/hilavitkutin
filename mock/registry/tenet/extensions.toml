[[tenet]]
id = "the_descriptor_is_a_c_layout_manifest_whose_leading_tag_gates_all_reads_and_whose_size_field_supports_forward_evolution"
subject = "extensions"
what = "The descriptor is the C-layout manifest an extension exposes to the host. Its first field is a tag that gates all later reads, its second field is the descriptor's size at the extension's build time so that a host of one ABI version can validate and skip trailing bytes of a higher one, and the ABI version must match the host's. It then carries the extension's name, version, required host providers, provider table and optional init and shutdown function pointers."
mechanism = "`ExtensionDescriptor` fields in layout order: `tag: u32` (`EXTENSION_DESCRIPTOR_TAG`), `descriptor_size: u32` (`core::mem::size_of` at the extension's build time), `abi_version: AbiVersion` (`#[repr(transparent)]` over `u32`, must match `HOST_ABI_VERSION`), name pointer and length (`*const u8`, `u32`), version triple, required host providers pointer and length (`*const ProviderId`, `u32`), providers table pointer and length (`*const ProviderEntry`, `u32`), optional init fn pointer, optional shutdown fn pointer."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:25-25"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#public-items"]
quote = '''
- `ExtensionDescriptor` is the `#[repr(C)]` manifest the extension exposes to the host. Fields in layout order: `tag: u32` (the literal `EXTENSION_DESCRIPTOR_TAG`, gates all subsequent reads), `descriptor_size: u32` (the `core::mem::size_of` of the descriptor at the extension's build time, supports forward evolution by letting a host of one ABI version validate-and-skip-trailing-bytes when reading a descriptor of a higher one), `abi_version: AbiVersion` (`#[repr(transparent)]` over `u32`, must match `HOST_ABI_VERSION`), extension name pointer and length (`*const u8`, `u32`), version triple, required host providers pointer and length (`*const ProviderId`, `u32`), providers table pointer and length (`*const ProviderEntry`, `u32`), optional init function pointer, optional shutdown function pointer. The three length fields are bare `u32` for wire-stable platform-independent layout (a previous shape used `USize` and varied byte width across pointer sizes). Each `u32` length is bounded against `MAX_DESCRIPTOR_LIST_LEN` at descriptor-read time; values above the ceiling surface `ExtensionError::DescriptorBoundsExceeded`. See "FFI-wire primitive policy" below for the rule that governs which fields are arvo newtypes and which are bare primitives.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (`mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5`), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
