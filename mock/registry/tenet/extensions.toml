id = "ffi_wire_descriptor_fields_use_an_arvo_newtype_where_one_is_wire_identical_and_otherwise_a_bare_primitive_by_deliberate_choice"
subject = "extensions"
what = "Descriptor fields that cross the boundary need a wire-stable footprint, so a two-tier rule applies. An arvo transparent newtype is used when its backing is wire-identical to the C type, and a bare primitive is kept where no wire-stable arvo newtype exists, because the width of a fixed-point backing comes from its strategy and is not pinned to the C integer width. Each such bare primitive carries a lint-allow comment recording the contract, raw pointer fields stay as they are, and a future fixed-width wire primitive would collapse the second tier into the first."
mechanism = "Tier 1: `USize(pub usize)` over `usize` for every `len` field paired with a pointer, `Bool(pub bool)`. Tier 2 bare: `abi_version: u32`, `ExtensionVersion { major: u16, ... }`, `ProviderId`'s inner `u64`, each with a trailing `// lint:allow(...) tracked: #206`. `UFixed<I, F, S>` is rejected for the backing width varying with `S: Strategy`. Raw pointers (`*const u8`, `*const ProviderEntry`, `*const ProviderId`) are outside the numeric-lint scope. Future `UWire<N>` (fixed backing for exactly N wire bits, no Strategy axis), recorded in BACKLOG."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:49-58"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#ffi-wire-primitive-policy"]
quote = '''
## FFI-wire primitive policy

`#[repr(C)]` descriptor fields cross the Rust / extension boundary and demand a wire-stable footprint. The crate follows a two-tier rule:

1. Use an arvo `#[repr(transparent)]` newtype when its backing is wire-identical to the C type. `USize(pub usize)` is transparent over `usize` and slots into every `len` field paired with a pointer. `Bool(pub bool)` is transparent over `bool`. When an arvo newtype fits, it wins; the field gets the semantic name and the lint is clean.
2. Retain a bare primitive when no wire-stable arvo newtype exists. `UFixed<I, F, S>` is `#[repr(transparent)]` over its backing, but the backing width comes from `S: Strategy` and is not pinned to exactly the C integer width. An FFI descriptor cannot accept that variability. `abi_version: u32`, `ExtensionVersion { major: u16,... }`, and `ProviderId`'s inner `u64` are bare primitives by deliberate choice; each site carries a trailing `// lint:allow(...) tracked: #206` comment that records the contract.

Raw pointer fields (`*const u8`, `*const ProviderEntry`, `*const ProviderId`) fall outside the numeric-lint scope and stay as-is.

A future arvo primitive `UWire<N>` (fixed backing for exactly `N` wire bits, no `Strategy` axis) would collapse the second tier back into the first. BACKLOG records the dependency.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "held"
