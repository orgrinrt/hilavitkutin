[[tenet]]
id = "descriptor_length_fields_are_bare_u32_for_a_wire_stable_layout_and_each_is_bounded_by_a_ceiling_of_one_mebi_entries"
subject = "extensions"
what = "The three length fields of the descriptor are 32-bit integers so that the layout is wire-stable and independent of the platform, where an earlier shape used the pointer-sized integer and varied in byte width across pointer sizes. Each length is bounded when the descriptor is read by a ceiling of about a million entries, which is well above any plausible extension's surface and bounds the worst-case slice at roughly 16 MiB."
mechanism = "`MAX_DESCRIPTOR_LIST_LEN: u32 = 1 << 20` (1_048_576), applied to name bytes, providers entries and required host providers; violation is `ExtensionError::DescriptorBoundsExceeded { field, len }`; `ProviderEntry` is 16 bytes on 64-bit, giving about 16 MiB."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:25-25, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:34-34"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#public-items"]
quote = '''
- `ExtensionDescriptor` is the `#[repr(C)]` manifest the extension exposes to the host. Fields in layout order: `tag: u32` (the literal `EXTENSION_DESCRIPTOR_TAG`, gates all subsequent reads), `descriptor_size: u32` (the `core::mem::size_of` of the descriptor at the extension's build time, supports forward evolution by letting a host of one ABI version validate-and-skip-trailing-bytes when reading a descriptor of a higher one), `abi_version: AbiVersion` (`#[repr(transparent)]` over `u32`, must match `HOST_ABI_VERSION`), extension name pointer and length (`*const u8`, `u32`), version triple, required host providers pointer and length (`*const ProviderId`, `u32`), providers table pointer and length (`*const ProviderEntry`, `u32`), optional init function pointer, optional shutdown function pointer. The three length fields are bare `u32` for wire-stable platform-independent layout (a previous shape used `USize` and varied byte width across pointer sizes). Each `u32` length is bounded against `MAX_DESCRIPTOR_LIST_LEN` at descriptor-read time; values above the ceiling surface `ExtensionError::DescriptorBoundsExceeded`. See "FFI-wire primitive policy" below for the rule that governs which fields are arvo newtypes and which are bare primitives.
---
- `MAX_DESCRIPTOR_LIST_LEN: u32` is `1 << 20` (`1_048_576`). Caps every per-descriptor list length: name bytes, providers entries, required host providers. Validated at descriptor-read time against each `u32` length field; a value above the ceiling surfaces `ExtensionError::DescriptorBoundsExceeded { field, len }`. The one-million-entry ceiling is well above any plausible extension's surface area; combined with the largest entry size (`ProviderEntry` at 16 bytes on 64-bit) the worst-case slice byte size bounds at roughly 16 MiB.
'''
because = "A previous shape used USize and varied byte width across pointer sizes; the u32 length fields give a wire-stable platform-independent layout."
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "held"
keywords = ["MAX_DESCRIPTOR_LIST_LEN", "1 << 20", "u32 length", "wire-stable", "DescriptorBoundsExceeded", "bounds check", "16 MiB", "USize"]

[[tenet]]
id = "the_extension_version_is_a_c_layout_semver_triple_with_a_padding_slot_and_bare_u16_fields"
subject = "extensions"
what = "The extension version in the descriptor is a C-layout semantic version of four 16-bit fields: major, minor, patch and a padding slot for future use. The fields are bare 16-bit integers by the wire-primitive policy, because the arvo family has no wire-stable 16-bit newtype yet."
