[[tenet]]
id = "the_extensions_crate_is_domain_agnostic_and_consumer_contract_crates_carry_the_domain_types_and_may_wrap_the_export_attribute"
subject = "extensions"
what = "The extensions crate knows what a descriptor, a provider identifier and a lifecycle hook are, and nothing about diagnostics, syntax-tree shapes, linter interfaces or any specific consumer domain. Downstream consumer contract crates carry the domain-specific types and may wrap the primary export attribute under their own domain-named macro."
mechanism = "Example named: `viola-plugin-abi`; a domain-named attribute such as `#[viola::plugin]` that expands to `#[export_extension(required_host_providers = [viola::PROVIDER_NAM])]` plus domain-specific trait bounds on the target type."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:16-21, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:154-169"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#hilavitkutin-extensions"]
quote = '''
This crate is domain-agnostic. It knows what a descriptor is, what a
provider id is, and what a lifecycle hook is. It does not know about
diagnostics, AST shapes, linter interfaces, or any specific consumer
domain. Downstream consumer contract crates (for example
`viola-plugin-abi`) carry the domain-specific types and may wrap the
primary export attribute under their own domain-named macro.
---
## Relationship to hilavitkutin-extensions-macros

The sibling proc-macro crate is a companion: in principle a consumer could author extensions without it by hand-writing the descriptor constant plus the `__hilavitkutin_extension_descriptor` exported fn plus the trampolines. In practice the macro is the default path for anyone writing an extension, because it collapses the hand-written boilerplate to a single `#[export_extension]` attribute plus the trait impls the consumer would write anyway.

Consumer contract crates can wrap `#[export_extension]` inside their own domain-named attribute. For example a viola-plugin-abi crate might ship `#[viola::plugin]` that expands internally to `#[export_extension(required_host_providers = [viola::PROVIDER_NAM])]` plus viola-specific trait bounds on the target type. The user then writes:

```rust
#[viola::plugin]
struct MyLinter;

impl viola::Linter for MyLinter {
 fn lint(&self, ast: &viola::Ast) -> viola::Diagnostics { /*... */ }
}
```

and gets the full repr-C descriptor, trampolines, and exported symbol with no direct contact with the lower-layer machinery.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
