[[tenet]]
id = "a_pipeline_is_extended_by_new_records_in_existing_columns_or_by_a_facade_unit_over_a_plugin"
subject = "extensions"
what = "The roadmap revision r2 names two surfaces of extensibility, neither of which needs dispatch that changes at run time. New data is the dominant one: records added to existing columns flow through the same static units, with the record count as an adaptive parameter. New code is the rarer one: the transform of an extension loaded at run time does not enter the engine's monomorphised dispatch and is reached through a statically registered facade unit that calls it across the capability interface, off the per-record path."
mechanism = "The facade unit calls the extension through the ProviderId capability ABI of hilavitkutin-extensions, per invocation or per morsel batch; the plugin keeps its own monomorphised dispatch inside its cdylib."
source = "mock/research/202606081500_engine-roadmap-r2.md:64-65"
provenance = ["mock::research::202606081500_engine-roadmap-r2::#5-new-first-class-section-extensibility-two-surfaces"]
quote = '''
- **Surface 1, new DATA (dominant, native):** records added to existing columns flow through the same static WUs. `record_count` is an R6 adaptive parameter. Unbounded data extensibility with zero new dispatch. No roadmap work needed; it falls out of the static-composition + adaptive-params design.
- **Surface 2, new CODE (rarer, downstream):** a runtime-loaded cdylib extension's transform does NOT enter the engine's monomorphised dispatch (R6: no runtime WU registration). It integrates via a statically-registered FACADE WU that calls the extension through the `ProviderId` capability ABI (hilavitkutin-extensions). The plugin keeps its own devirt (monomorphised in the cdylib); the host keeps its own; the only indirect hop is the ABI call at the FFI seam, per-invocation or per-morsel-batch, OFF the per-record hot path. Behind the facade the plugin runs its own static sub-engine (sub-graph) or is a per-morsel pure-function capability; downstream + bench-decidable.
'''
