[[tenet]]
id = "each_load_is_classified_required_or_optional_and_the_default_policy_aborts_on_required_failure_and_continues_on_optional_failure"
subject = "extensions"
what = "Each load is classified as required or optional. The default failure policy is stateless: a failed required load aborts and a failed optional load continues. A required failure always propagates as an error. An optional failure either yields success with nothing loaded when the policy says continue, which models a best-effort consumer for whom loading something or not are both normal outcomes, or propagates as an error when the policy says abort."
mechanism = "`ExtensionRequirement` { `Required`, `Optional` }; `PolicyVerdict` { `Continue`, `Abort` }; `default_policy`; `Outcome::Ok(Maybe::Nothing)` for an optional failure with Continue; `Outcome::Err` otherwise."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:38-39, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:42-42, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:64-64, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:106-108"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#public-items"]
quote = '''
- `ExtensionRequirement` classifies each load as `Required` or `Optional`.
- `PolicyVerdict` is the result of consulting the failure policy: `Continue` or `Abort`.
---
- `default_policy` implements the built-in behaviour: required-plus-failure aborts; optional-plus-failure continues. Used when the consumer provides no policy.
---
On any failure path, the host classifies by `requirement` and consults the policy. Required failures propagate up through `Outcome::Err`. Optional failures either produce `Outcome::Ok(Maybe::Nothing)` (policy said continue) or propagate via `Outcome::Err` (policy said abort). The `Outcome::Ok(Maybe::Nothing)` shape is the correct modelling for a best-effort consumer: loaded something or didn't, both are normal outcomes.
---
## Failure policy

Each `ExtensionHost::load` takes a `requirement` argument. The default policy is stateless and simple: required failure aborts, optional failure continues. Consumers with richer needs construct their host via `ExtensionHost::new(caps).with_policy(their_fn)`. `FailurePolicyFn` is a plain function pointer with signature `fn(&ExtensionError, ExtensionRequirement) -> PolicyVerdict`. No `dyn`, no heap, no closures: consumers carrying state pack it into the extension instance they are loading for and expose a plain `fn` that pulls from a well-known static.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
