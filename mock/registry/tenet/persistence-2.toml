## Op's rulings on the three handed-back conflicts, 2026-09-18
---
Persistence. His answer: "Builds on str and api". The intent is that the per-crate design governs and the lint line was wrong; the `forbidden-imports` rule for `hilavitkutin-persistence` now forbids only `hilavitkutin` and `hilavitkutin-ctx`, and its reason says what the crate builds on.
---
Op: "Builds on str and api". The rule said persistence and str do not depend on each other; it now says persistence builds on `hilavitkutin-str` and `hilavitkutin-api`, never on the engine or `hilavitkutin-ctx`, matching the persistence design and the corrected `forbidden-imports` line in `mock/mockspace.toml`.
---
- On persistence's dependencies, choosing among standalone, "Builds on str and api", and str without api: "Builds on str and api".
'''
