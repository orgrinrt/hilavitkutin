id = "op_ruled_that_the_persistence_crate_builds_on_the_str_and_api_crates_and_its_design_holds_over_the_lint"
subject = "persistence"
what = "Op ruled on 2026-09-18, choosing among persistence being standalone, persistence building on the str crate and the api crate, and persistence using str without the api, that persistence builds on str and api: the per-crate design holds, and the scope of the lint for persistence is corrected to allow the str crate and the api crate while it still forbids the engine."
mechanism = "`hilavitkutin-persistence` lists `hilavitkutin-str` and takes memory from the shared `MemoryProvider` of `hilavitkutin-api`; rule-4 of the lint config. Op's answer: \"Builds on str and api\"."
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS-0918.md:36-46"
provenance = ["mock::research::202611130850_the-record-read-whole::OP-ANSWERS-0918::#what-was-going-on"]
quote = '''
> `hilavitkutin-persistence`: its DESIGN lists `hilavitkutin-str` and a shared `MemoryProvider` from the api as dependencies, but the lint config (rule-4) says persistence is a standalone crate and forbids importing `hilavitkutin_str` and `hilavitkutin_api`. Which one holds?

Options offered:

1. **Standalone, lint holds.** Persistence depends on arvo and notko only; the str and MemoryProvider uses move behind its own traits and the DESIGN is corrected.
2. **Builds on str and api.** The DESIGN holds; rule-4's scope for persistence is corrected to allow `hilavitkutin_str` and `hilavitkutin_api`, still forbidding the engine.
3. **Str yes, api no.** Persistence may use hilavitkutin-str (a sibling ecosystem crate) but not the api; MemoryProvider comes through its own trait.

## Answered

> Builds on str and api
'''
