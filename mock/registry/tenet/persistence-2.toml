id = "an_end_of_pass_unit_drains_accumulator_columns_through_the_provider_commit_ordered_after_the_phase_barrier_and_before_the_next_phase_s_dispatch"
what = "A unit that runs at the end of a pass, supplied by the consumer or the layer it builds on, reads the accumulator columns and writes them through the provider's commit. The commit is the phase-end synchronisation point, so persistence writes are ordered after the phase barrier and before the next phase's morsel dispatch begins, and the barrier's release-acquire pair guarantees visibility across threads."
mechanism = "`PassEnd` WorkUnit writes through `PersistenceProvider::commit(...)`; Release-Acquire pair of the barrier (Topic 3 S7 atomic-ordering protocol)."
source = "mock/crates/hilavitkutin-persistence/DESIGN.md.tmpl:219-225"
provenance = ["mock::crates::hilavitkutin-persistence::DESIGN::#engine-integration-boundary-round-202605101036"]
quote = '''
PassEnd WU drain protocol: a substrate or consumer-authored PassEnd
WorkUnit reads accumulator columns and writes through
`PersistenceProvider::commit(...)`. The commit boundary is the
phase-end synchronisation point; persistence writes are ordered after
the phase barrier and before the next phase's morsel dispatch begins.
Cross-thread visibility is guaranteed by the barrier's Release-Acquire
pair (Topic 3 S7 atomic-ordering protocol).
'''
