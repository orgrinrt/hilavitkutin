[[tenet]]
id = "the_morsel_size_is_the_l1_budget_divided_by_the_written_bytes_per_record_within_fixed_bounds"
subject = "execution"
what = "The morsel size is the usable L1 divided by the written bytes per record of the fiber, clamped between a minimum and a maximum and aligned to a multiple of four. It is computed per fiber, and read-only columns and read-only resource collections ride the L2 prefetcher and do not consume the L1 budget."
mechanism = "`morsel_size = (L1_usable / Σ write_sizes).clamp(MIN_MORSEL, MAX_MORSEL) & !3`; L1_usable = detected_L1 × 0.75; write_sizes = Σ size_of::<T_i>() for write columns + write resource collection sizes (R5); MIN_MORSEL configurable; MAX_MORSEL = 8192; multiple of 4 (cache line alignment at any stride)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:832-843"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#12-morsel-model"]
quote = '''
**Morsel sizing formula (with R3 type-native stride, R5 resource model):**
```
morsel_size = (L1_usable / Σ write_sizes).clamp(MIN_MORSEL, MAX_MORSEL) & !3
```
- L1_usable = detected_L1 × 0.75
- write_sizes = Σ size_of::<T_i>() for write columns + write resource
  collection sizes (R5). Read-only columns and read-only resource
  collections ride L2 prefetcher, don't consume L1 budget.
- MIN_MORSEL configurable (not a design decision — R3 note)
- MAX_MORSEL = 8192
- Align to multiple of 4 (cache line alignment at any stride)
- Per-fiber morsel size (each fiber has its own)
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
