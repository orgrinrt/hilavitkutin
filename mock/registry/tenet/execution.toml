[[tenet]]
id = "a_micro_morsel_is_an_inner_tiling_that_is_single_level_by_default_and_activates_at_ecs_scale"
subject = "execution"
what = "A micro-morsel is an inner tiling of a morsel over a sub-range of records, used when the peak live data exceeds L1. It is single-level by default and activates at ECS scale, with hundreds of columns per fiber; a single level is sufficient for polka and saalis."
mechanism = "peak_live = max(op.read ∪ op.write ∪ prev.write) at any Z-slice; the morsel is the L1 scheduling unit (outer loop); micro-morsel when peak_live > L1 (T3 decision #60); two-level morsel is T3 decision #98."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:81-81, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:847-852"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#vocabulary"]
quote = '''
| **micro-morsel** | Inner tiling when peak_live > L1. Sub-morsel record range. Single-level by default; activates at ECS scale. |
---
**Two-level morsel (T3 decision #98, single-level by default):**
- Morsel = L1 scheduling unit (outer loop)
- Micro-morsel = inner tiling when peak_live > L1 (T3 decision #60)
- peak_live = max(op.read ∪ op.write ∪ prev.write) at any Z-slice
- Single-level sufficient for polka/saalis. Micro-morsel activates
  at ECS scale (hundreds of columns per fiber).
'''
origin = "stated"
