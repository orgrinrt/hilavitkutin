[[tenet]]
id = "a_column_is_classified_by_temperature_and_each_class_has_its_cache_level_and_budget"
subject = "execution"
what = "A column is classified by temperature into write-only, read-write, read-only dense, read-only sparse and read-only shared. Each class has its cache level and budget: the written ones are in L1 during a morsel, dense read-only ones are prefetched into L2, sparse read-only ones tolerate L3, and shared read-only ones live in shared L2 or L3."
mechanism = "Write-only: L1 during morsel, L1 write budget. Read-write: L1 during morsel, L1 write budget. Read-only dense: L2 prefetched, L2 read. Read-only sparse: L3 tolerable, minimal. Read-only shared: shared L2/L3, L2 amortised. T3 decision #50."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:762-763, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1114-1122"
