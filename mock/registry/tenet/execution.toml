[[tenet]]
id = "shared_read_columns_between_trunks_are_snapshotted_per_trunk_on_arm_or_read_in_aligned_sync_on_x86_numa"
subject = "execution"
what = "Read columns shared between trunks are handled in one of two ways. Snapshotting copies them per trunk at the phase transition, which is simpler and has no cross-core contention. Aligned morsel synchronisation copies nothing and works on unified-memory ARM but is complex on x86 NUMA. The recommendation is the snapshot on ARM and aligned synchronisation on x86 NUMA."
mechanism = "Approach 1 (snapshot-to-local): copy shared columns per trunk at phase transition, 1.6% overhead. Approach 2 (aligned morsel sync): zero copy, both trunks read the same data. Recommendation: approach 1 for ARM, approach 2 for x86 NUMA."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:781-786"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#11-cache-hierarchy-tiling-and-phase-decomposition"]
quote = '''
**Shared read columns between trunks (T6 L3635-3670):**
- Approach 1 (snapshot-to-local): copy shared columns per trunk at
  phase transition. 1.6% overhead. Simpler, no cross-core contention.
- Approach 2 (aligned morsel sync): zero copy, both trunks read same
  data. Works on unified-memory ARM (M1). Complex on NUMA x86.
- Recommendation: approach 1 for ARM, approach 2 for x86 NUMA.
'''
