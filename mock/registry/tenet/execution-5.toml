[[tenet]]
id = "a_unit_no_fiber_descriptor_names_does_not_run_so_the_descriptors_must_cover_every_live_unit"
what = "Both dispatch paths run under the union of the per-fiber member masks, so a unit that no fiber descriptor names does not run at all, and the descriptors must cover every live unit. As of the recovery branch that coverage is checked by debug assertions only, and the flatten truncates silently once the descriptor pool is full, so a plan too large to describe becomes units that never execute in a release build; making the truncation visible is tracked as follow-up."
mechanism = "Coverage is established by the flatten in `derive_phase_dispatch_order`, which assigns each live unit to exactly one fiber."
source = "mock/research/202611130850_the-record-read-whole/RECOVERED.md:47-57"
provenance = ["mock::research::202611130850_the-record-read-whole::RECOVERED::#mock-crates-hilavitkutin-design-md-tmpl-lines-310-to-320"]
quote = '''
Because both paths now dispatch under the union of the per-fiber member masks
rather than an all-ones mask, the descriptor set must cover every live unit: a
unit that no descriptor names does not run at all. Coverage is established by
the flatten in `derive_phase_dispatch_order`, which assigns each live unit to
exactly one fiber, so the union over descriptors is total. That invariant is
currently checked by debug assertions only, and the flatten truncates silently
once the descriptor pool is full, so a plan too large to describe degrades in a
release build into units that quietly never execute rather than into a build
failure. Making that truncation visible is tracked as follow-up; until it lands,
any change to the flatten bounds or to descriptor sizing is changing a
correctness invariant that both dispatch paths depend on.
'''
origin = "proposed"
written_by = "engine design template as on the branch recover/unlanded-rounds-and-benches, commit of 2026-08-30, not on dev; the text does not say whose it is"
standing = "provisional"
subject = "execution"
keywords = ["fiber descriptor", "coverage invariant", "member mask", "silent truncation", "debug assertion", "derive_phase_dispatch_order"]

