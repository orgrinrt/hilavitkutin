id = "record_slice_ownership_belongs_to_the_accumulator_path_alone_and_every_worker_participates_in_each_waist_on_the_other_path"
subject = "execution"
what = "Ownership of a record slice belongs to the accumulator path alone. The path without accumulators runs the phase walk for every core on every phase, and every worker participates in each waist even if it owned no trunk this phase. The two ownership models are mutually exclusive paths and cannot disagree, so deleting the N-way record split strands no trunks."
mechanism = "`run_this` (:966) lives inside `worker_accum_unit_outer` (begins :933), which accumulator-bearing carriers reach and then `continue` at :873 without reaching `run_core_phase`; the other path calls `run_core_phase` unconditionally for every core on every phase and states the invariant at :913: \"every worker participates in each waist, even one that owned no trunk this phase\"."
