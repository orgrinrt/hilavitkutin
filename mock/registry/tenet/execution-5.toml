[[tenet]]
id = "an_append_past_an_accumulator_s_reserved_capacity_is_a_contract_violation_that_asserts_and_never_drops_silently"
subject = "execution"
what = "As of 2026-06-20, appending past the reserved capacity of a fixed-capacity accumulator is a capacity-contract violation, like an out-of-bounds index, and not a recoverable run-time condition. The append asserts that the live length is below the capacity and panics before the write, so the write never leaves the reserved buffer and the record is never dropped silently. A consumer sizes the accumulator for its maximum appends per frame, and that is the contract."
because = "The run entries return the consumer-defined output, so there is no uniform outcome channel to carry a recoverable error, and a silent drop loses data with no signal when a consumer under-sizes an accumulator."
mechanism = "`resolve_append` (dispatch/engine_ctx.rs) asserts `live < cap` before the write; it had returned without writing once the live length reached `cap`."
source = "mock/design_rounds/202606200300/202606200300_topic.accum-overcap-hard-error.md:9-15, mock/design_rounds/202606200300/202606200300_topic.accum-overcap-hard-error.md:19-26"
provenance = ["mock::design_rounds::202606200300::202606200300_topic.accum-overcap-hard-error::#problem"]
quote = '''
`resolve_append` (dispatch/engine_ctx.rs) saturates at the reserved capacity: once
the live length reaches `cap`, the append `return`s without writing. That keeps
the write inside the reserved buffer (the soundness floor) but silently DROPS the
record. A consumer that under-sizes an accumulator for its per-frame appends loses
data with no signal. The R3b parallel test surfaced this: with fewer records than
cores, per-core consumer marks plus the epilogue exceeded the record-count-sized
capacity and the surplus appends vanished.
---
Over-appending a fixed-capacity accumulator is a capacity-contract violation (a
bug, like an out-of-bounds index), not a recoverable runtime condition. The run
entries return the consumer-defined `Cfg::Out`, so there is no uniform `Outcome`
channel to carry a recoverable error. The fix is fail-loud: `resolve_append`
asserts `live < cap` and panics before the write when the contract is violated.
The assert fires before any write, so the soundness floor (no out-of-bounds write)
is preserved; the difference is a loud abort instead of a silent drop. A consumer
sizes the accumulator for its maximum per-frame appends; that is the contract.
'''
origin = "proposed"
written_by = "topic accum-overcap-hard-error of 2026-06-20, round 202606200300, agent-written"
standing = "pending"
keywords = ["accumulator", "over-capacity", "resolve_append", "panic", "assert", "silent drop", "capacity contract", "fail-loud"]
rejects = ["a silent drop"]
related = ["tenet::an_accumulator_append_saturates_at_the_reserved_capacity_which_equals_the_record_count_at_build"]

[[tenet]]
id = "per_fiber_windows_on_the_parallel_path_come_from_a_fiber_outer_loop_and_not_from_a_unit_to_fiber_size_lookup"
subject = "execution"
what = "Giving each fiber its own morsel window on the parallel dispatch path is the same loop inversion as on the single-core path, and not a lookup of a window per unit. One dispatch call already spans every fiber of every trunk the core owns under a single morsel range, and those fibers have different windows, so a per-unit size cannot express it: the size has to select the loop and the loop is outside the call. The walk becomes fiber-outer, driven by the fiber descriptors, which already carry the fiber's unit order and its window, so no unit-to-fiber map is needed. Before this, the same pipeline got cache-sized windows on one core and a uniform constant window on many."
mechanism = "`RunTrunkDispatch::dispatch_core` (dispatch/trunk_dispatch.rs:143-170) walks the whole carrier in one call under a single `MorselRange`; `run_core_phase` restructured fiber-outer from the `FiberDispatch` descriptors (`topo_order` slice and window); no third `[USize; GATE2_MAX_UNITS]` array and no `gate2_fiber`; the decision recorded in r6 about landing it pre-lift or mid-lift against #690 no longer applies."
source = "mock/design_rounds/202607190930/202607190910_topic.a4-parallel-per-fiber-windows.md:19-23, mock/design_rounds/202607190930/202607190910_topic.a4-parallel-per-fiber-windows.md:29-38, mock/design_rounds/202607190930/202607190910_topic.a4-parallel-per-fiber-windows.md:40-45"
provenance = ["mock::design_rounds::202607190930::202607190910_topic.a4-parallel-per-fiber-windows::#what-is-wrong-today"]
quote = '''
The parallel path did not follow. `run_core_phase` still windows every fiber in the
phase by one scalar `Cfg::MORSEL_SIZE` handed down from `worker_main`
(`scheduler/mod.rs:865`, consumed at `:2149-2170`). So the same pipeline gets
cache-sized windows on one core and a uniform const window on many, and the domain-12
formula is half-consumed.
---
**A4 is not a lookup; it is the same loop inversion.** The roadmap inherited from the
per-fiber morsel blueprint the framing that A4 threads per-fiber sizes in "through a
unit-to-fiber-size lookup, which needs a `gate2_fiber` mapping". That does not fit the
dispatch shape. `RunTrunkDispatch::dispatch_core` (`dispatch/trunk_dispatch.rs:143-170`)
walks the entire carrier in one call, firing every in-phase trunk root the core owns,
all under a single `MorselRange`; the morsel loop is outside it. One call therefore
already spans every fiber in every owned trunk, and those fibers have different windows.
A per-unit size lookup cannot express that, because the size has to select the loop and
the loop is outside the call. The fix is to restructure the loop fiber-outer, exactly as
A2b did.
---
**`gate2_fiber` is not needed, so the question of how it interacts with #690 is moot.**
A fiber-outer loop is driven by the `FiberDispatch` descriptors, which already carry the
fiber's `topo_order` slice and its window, and `run_core_phase` takes `&self`, so they
are already in scope. No third `[USize; GATE2_MAX_UNITS]` array is added, and the
decision recorded in r6 about landing it pre-lift or mid-lift against #690 no longer
applies. The decision was sound for the shape it assumed; the shape changed.
'''
