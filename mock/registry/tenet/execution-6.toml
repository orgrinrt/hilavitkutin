mechanism = "`thread/parking.rs` (`WakeStrategy`, `pick_tier`, `spin_budget_for`, `spin`); `thread/frame.rs`; `RunCfg` budget constant defaulting to 128; `predicted_wait_ns` telemetry, always zero."
source = "mock/design_rounds/202607202310/202607202300_topic.wake-spin-preroll.md:10-18, mock/design_rounds/202607202310/202607202300_topic.wake-spin-preroll.md:22-30"
