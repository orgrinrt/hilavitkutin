what = "The canonical spin-then-park middle tier is wired unconditionally into the frame waits. The worker frame wait and the scheduler done wait spin a bounded budget, re-checking the word each iteration so the lost-wakeup discipline is untouched, and then park through the same load-check-wait pattern as before. The budget is a consumer-tunable run configuration constant defaulting to the canonical performance-core figure of 128, and zero restores park-immediately exactly. The shutdown wait stays park-only, since latency is irrelevant there. Wiring the telemetry-driven tier selection remains a follow-up the ledger names, because the telemetry is undriven and a zero prediction selects the unbounded spin-only tier."
