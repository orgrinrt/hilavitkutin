id = "thread_spawn_copies_a_pointer_sized_closure_under_a_compile_time_size_check_and_never_casts_a_function_pointer_or_allocates"
what = "Spawning a thread takes a generic once-callable closure and copies a pointer-sized closure by value into the thread-creation argument under a compile-time size and alignment assertion. The closure captures a data pointer, so no function pointer is cast and the question of whether function and data pointers have matching size does not arise. A closure that is too fat is a compile error and never an allocation. This is neither option the old backlog note proposed: boxing a function pointer would allocate, which the engine path forbids, and the static work-queue slot was never built."
