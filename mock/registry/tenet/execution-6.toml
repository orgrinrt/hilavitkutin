[[tenet]]
id = "a_store_barrier_that_is_inner_shareable_precedes_the_progress_counter_release_store_after_non_temporal_writes"
subject = "execution"
what = "After the last non-temporal writes of a fiber's output, the generated code emits an explicit store barrier before the release store of the progress counter. On aarch64 that barrier is the inner-shareable store barrier, since the local one is insufficient for observation by another core, and on x86-64 it is an explicit store fence, since a release fence there is only a compiler barrier. The ASM verification checklist gains a sixth check, scoped per platform."
because = "Non-temporal stores on aarch64 do not participate in the release semantics of a later release store, so a reader on another core that sees the progress counter may not see the earlier writes."
mechanism = "aarch64: `dmb ishst` immediately before `progress_counter.store(end_record, Ordering::Release)` (`stlr`); x86_64: `core::arch::x86_64::_mm_sfence()` before the store (`mov`); `dmb st` is local-PE-only; the sixth ASM check: `dmb ishst` / `sfence` immediately preceding the progress counter store; Topic 3 invariant S3, corrected per audit-2 C1."
source = "mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1094-1096, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1104-1108, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1114-1119, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1123-1127"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.plan-algorithm-chain::#s3-non-temporal-store-release-store-ordering-corrected-per-audit-2-c1"]
quote = '''
M7 commits to `stnp` for FiberOutput columns. ARMv8-A `stnp` does NOT participate in the release semantics of a subsequent `stlr` (ARM ARMv8-A B2.3.2: non-temporal stores are weakly ordered relative to release barriers). Without an **inner-shareable** store-side data memory barrier, a reader on another core that sees the progress counter `stlr` may NOT see the prior `stnp` writes.

**Corrected codegen contract (Topic 4) — exact mnemonics per platform:**
---
    // dmb st (local PE) is INSUFFICIENT for inner-shareable observation.
    // Emit dmb ishst (inner-shareable store domain barrier) so other
    // cores observe the stnp writes before the subsequent stlr.
    core::arch::asm!("dmb ishst", options(nostack, preserves_flags));
    progress_counter.store(end_record, Ordering::Release);  // stlr
---
    // `core::sync::atomic::fence(Ordering::Release)` lowers to a
    // compiler barrier ONLY on x86 (TSO is free for ordinary stores).
    // For non-temporal stores, the architectural requirement is sfence
    // per Intel SDM Vol 3 §11.3.1. Emit it explicitly.
    core::arch::x86_64::_mm_sfence();
    progress_counter.store(end_record, Ordering::Release);  // mov (TSO)
---
Earlier draft said "the fence lowers to `sfence`" on x86 — that's wrong; `fence(Release)` is a no-op on x86. Earlier draft also said `dmb st` on aarch64 — that's local-PE-only and insufficient for cross-core observation; `dmb ishst` is required.

The ASM verification checklist (Topic 3 axis F + Topic 4) gains a sixth check, scoped per-platform:
- **aarch64:** any fiber whose dispatch_approach uses `stnp` for output columns has a `dmb ishst` immediately preceding the progress counter store.
- **x86_64:** any fiber whose dispatch_approach uses `movnt*` has an `sfence` immediately preceding the progress counter store.
'''
origin = "proposed"
written_by = "design round 202605101036, topic 3 plan algorithm chain, invariant S3 corrected per audit-2 C1, dated 2026-05-10, agent-written; the text does not say whose decision it is"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (`mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5`), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
