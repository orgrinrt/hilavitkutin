[[tenet]]
id = "as_of_2026_11_13_the_fused_run_entry_refuses_a_unit_with_no_per_record_map_but_not_an_accumulator_writing_one_and_drops_its_append_silently"
subject = "execution"
what = "As of 2026-11-13, the fused run entry refuses at compile time a unit that has no per-record map, but it does not refuse a unit that has a per-record map and also writes an accumulator: the fused chain never runs that unit's own execute and the append is silently dropped. The fused entry also lacks the per-frame accumulator reset that the other two run entries perform, so running the body alone would hit the capacity assert at the first frame. This is a gap, committed as an ignored two-frame append test and ticketed, and the engine change that would make the fused entry refuse an accumulator-writing carrier is not part of the suite round."
mechanism = "`run_fused`; `RecordOp`; `ChainWu`; the compile-fail pair `unmapped_unit_fused`; the ignored two-frame append test on `run_fused`; ticket `0fb716c5a463`; finding H25; `reset_accumulators` called by `run.rs` and `run_parallel.rs` at frame start and not by `run_fused.rs`."
source = "mock/design_rounds/202611130044/202611130044_topic.suite-can-fail-review-fixes.md:13-13, mock/design_rounds/202611130044/202611130044_topic.suite-can-fail-review-fixes.md:20-22, mock/design_rounds/202611130044/202611130044_changelist.doc.lock.md:11-11, mock/design_rounds/202611130058/202611130058_topic.suite-can-fail-second-review.md:14-14"
provenance = ["mock::design_rounds::202611130044::202611130044_topic.suite-can-fail-review-fixes::#findings-and-what-answers-each"]
quote = '''
2. The `append_fused` pair shows that a unit without a per-record map is refused by `run_fused`, and the changelist claimed more: that appends cannot reach the fused entry. They can. A unit that implements `RecordOp` and also writes an accumulator compiles through `run_fused`, the fused `ChainWu` never runs its `execute`, and the append is silently dropped. Answer: the pair is renamed for what it shows (`unmapped_unit_fused`), the hole is a committed two-frame append test on `run_fused` that fails today and is ignored with its ticket (`0fb716c5a463`), and H25 is reported ticketed rather than closed.
---
## Not in this round

The engine change that would make `run_fused` refuse an accumulator-writing carrier (`0fb716c5a463`), the test providers that move with the scheduler (`6393002dea2d`), and the `add_resource` advice in the committed diagnostics (`71f89b0d7775`).
---
After the paragraph on within-fiber fusion, a paragraph says that `FuseCarrier` bounds a unit on `RecordOp` and `Copy` and not on its write set, so a `RecordOp` unit that also writes an accumulator is accepted by `run_fused` and its body never runs, that a unit with no per-record map is refused at compile time, and that the gap is ticket `0fb716c5a463`, with `run` the entry for an accumulator-writing unit meanwhile.
---
3. The design sentence and the ticket describe the `run_fused` gap without the missing `reset_accumulators` call: `run.rs` and `run_parallel.rs` reset the accumulators at frame start and `run_fused.rs` does not, so running the body alone would hit the capacity assert at frame one. Answer: the design sentence, the catalogue row and the ticket (bumped) name the reset.
'''
