id = "the_run_returns_the_foundation_outcome_type_chosen_by_the_run_configuration_and_the_pipeline_result_enum_is_retired"
subject = "execution"
what = "The scheduler's run returns the foundation outcome type, whose success and error types are determined by the consumer's run configuration and propagated through the builder typestate by the existing dispatch routing. The old three-variant pipeline result enum is retired, and the result type uses the stack's own outcome primitive."
mechanism = "`Scheduler::run()` returns `notko::Outcome<T, E>`, `T` and `E` from the consumer's `RunCfg`; dispatch-routing variant `RunCfgDispatch<C>` (Axis 2); retired `PipelineResult { Completed | Failed | Poisoned }`."
source = "mock/design_rounds/202605101036/202605101036_topic.scheduler-run-signature.md:119-119, mock/design_rounds/202605101036/202605101036_topic.scheduler-run-signature.md:121-129"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.scheduler-run-signature::#axis-2-return-shape"]
quote = '''
**DECIDED.** `Scheduler::run()` returns `notko::Outcome<T, E>` whose concrete `T` and `E` are determined by the consumer's `RunCfg` type, propagated through the builder typestate via the existing dispatch-routing mechanism. The substrate's old `PipelineResult { Completed | Failed | Poisoned }` enum is retired; the result type dogfoods notko's foundation primitive.
---
#### Mechanism: new dispatch variant

A fifth dispatch variant joins the existing four:

```rust
pub struct RunCfgDispatch<C>(PhantomData<C>);  // bare PhantomData, like StoreDispatch / UnitDispatch
```

Consumers pick which type is "the run cfg" by setting `BuilderInput::Dispatch = RunCfgDispatch<Self>`. This is the same `.with()`-routed disambiguator the builder already uses for Resource / Column / Virtual / WorkUnit / Kit / platform impls. No `.set_runcfg_type::<C>()` separate API; no turbofish on `run()`.
'''
