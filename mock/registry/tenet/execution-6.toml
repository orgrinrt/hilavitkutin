[[tenet]]
id = "single_core_run_executes_phase_by_phase_under_runtime_phase_masks_with_no_per_trunk_enumeration"
subject = "execution"
what = "Single-core output equivalence does not need per-phase-and-trunk monomorphisation, so the run is a runtime loop over the phases, each phase walking the shipped mask-gated walk under a runtime unit mask for that phase with a waist barrier between phases. Const enumeration of every phase and trunk is not done at single-core, since it would hit a count-bound monomorphisation explosion; the const-gated per-trunk programs remain the building block for the per-core case."
because = "Enumerating every phase and trunk at single-core would hit a count-bound mono-explosion and the const-recursion overflow that round 2a already resolved for the position axis."
mechanism = "`for p in 0..nphases { for morsel { wu_values.run_gated(bindings, morsel, dirty & phase_mask_p, ZERO) }; waist_barrier(degenerate) }`; per-phase unit mask `{ pos : phase_of(pos) == p }` as a runtime `AdjRow` built once per frame; `RunFiber::run_gated`; `run_one_trunk` / `RunGatedTrunk` are the G2-N per-core building block."
source = "mock/design_rounds/202606071300-abandoned/202606071300_topic.gate2-phase-sectioned-run.md:14-14, mock/design_rounds/202606071300-abandoned/202606071300_topic.gate2-phase-sectioned-run.md:19-20, mock/design_rounds/202606071300-abandoned/202606071300_topic.gate2-phase-sectioned-run.md:22-22"
provenance = ["mock::design_rounds::202606071300-abandoned::202606071300_topic.gate2-phase-sectioned-run::#design-resolved-by-spec-grounding"]
quote = '''
Single-core output-equivalence does not need per-`(phase, trunk)` monomorphisation. The const-gated per-trunk monos (round 2a, `run_one_trunk` / `RunGatedTrunk`) are the G2-N per-core building block; enumerating every `(phase, trunk)` at single-core would hit a count-bound mono-explosion (and the `{N+1}` const-recursion overflow round 2a already resolved for the position axis). Single-core needs only phase-ordered execution with waists, and degenerate single-core barriers are no-ops, so the output is unchanged.
---
2. Compute `nphases = phase_count::<WuVals, Stores, GW, CU, CS>()` and, per phase `p`, the unit mask `{ pos : phase_of(pos) == p }` as a runtime `AdjRow` bitmask (the round-1 grouping const fns are callable at runtime; the mask is built once per frame).
3. Replace the single morsel-outer walk with a phase loop: `for p in 0..nphases { for morsel { wu_values.run_gated(bindings, morsel, dirty & phase_mask_p, ZERO) }; waist_barrier(degenerate) }`. This reuses the shipped `RunFiber::run_gated` (the mask-gated walk) and the degenerate `waist_barrier` (`dispatch::phase_run`, G2-0b). The per-frame incremental-skip `dirty` mask (E7) is intersected with the per-phase mask.
---
No const enumeration, no `{N+1}` recursion, no GCE overflow: the phase loop is a runtime loop over `nphases`, the masks are runtime, `run_gated` is the existing walk.
'''
origin = "proposed"
written_by = "design round 202606071300, topic GATE-2 phase-sectioned single-core run re-point (round 2b), dated 2026-06-07, agent-written; the round directory is named abandoned, and the text does not say whose decision it is"
standing = "held"
keywords = ["phase-sectioned run", "runtime phase mask", "run_gated", "waist_barrier", "no const enumeration", "mono explosion", "round 2b", "single-core"]
related = ["tenet::phase_sectioned_dispatch_with_a_waist_between_phases_is_established_before_parallelising", "tenet::the_single_core_run_walks_the_flat_value_carrier_gated_by_const_phase_and_trunk_so_dead_code_elimination_leaves_one_member_only_program_per_phase_and_trunk"]

[[tenet]]
id = "n_core_dispatch_walks_the_flat_carrier_gated_by_a_runtime_mask_of_the_trunks_a_core_owns_and_the_const_gated_enumeration_is_superseded"
subject = "execution"
what = "For N-core dispatch each worker walks the flat unit carrier gated by a runtime mask of the trunks it owns, reusing the existing mask-gated walk, and one worker owning every trunk is the existing single-core walk. The const-gated enumeration of per-trunk monomorphisations is superseded by this choice, while the grouping data that gives each unit its phase and trunk stays on the path."
mechanism = "`run_gated<M: BitAccess>` reused; the mask for a core and a phase is the units whose trunk the core owns and whose phase is that phase; per-unit phase and trunk from `plan::grouping` via `phase_of(pos)` / `trunk_of(pos)`; superseded `run_one_trunk` / `RunGatedTrunk`; round R4a, decision \"bench-first runtime mask\" of 2026-06-07."
source = "mock/design_rounds/202606071109/202606071109_topic.gate2-r4a-core-phase-masks.md:13-17, mock/design_rounds/202606071109/202606071109_topic.gate2-r4a-core-phase-masks.md:4-4, mock/design_rounds/202606071109/202606071109_topic.gate2-r4a-core-phase-masks.md:21-29"
provenance = ["mock::design_rounds::202606071109::202606071109_topic.gate2-r4a-core-phase-masks::#what-this-round-adds"]
quote = '''
op's chosen mechanism: each worker walks the flat carrier gated by a runtime mask
of its owned trunks (reuse the shipped `run_gated<M: BitAccess>`). Single-core =
one worker owns all trunks = the existing flat walk (already the canonical 1-core
degenerate). The mask a worker needs for (its core, a given phase) is: the units
whose trunk is owned by that core AND whose phase is that phase.
---
**Source:** GATE-2 R4a; op decision "bench-first runtime mask" (2026-06-07); reframing `mock/research/202606071029_gate2-dispatch-mechanism-options.md`
---
Per-unit (phase, trunk) comes from the shipped const grouping (`plan::grouping`,
R2): `phase_of(pos)` / `trunk_of(pos)` give each carrier unit's waist-bounded
phase and within-phase column-conflict trunk, callable at run time with concrete
types. The const-gated mono ENUMERATION (`run_one_trunk` / `RunGatedTrunk`) is
superseded by op's runtime-mask choice, but the grouping DATA stays on-path: it
is the direct per-unit (phase, trunk) source the runtime mask needs, trunk-level,
no CSR traversal. The runtime plan's richer fiber / RCM / spectral structure is an
orthogonal within-trunk ordering refinement (later), not needed for the
trunk-level core mask.
'''
