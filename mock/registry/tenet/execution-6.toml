[[tenet]]
id = "thread_spawn_copies_a_pointer_sized_closure_under_a_compile_time_size_check_and_never_casts_a_function_pointer_or_allocates"
subject = "execution"
what = "Spawning a thread takes a generic once-callable closure and copies a pointer-sized closure by value into the thread-creation argument under a compile-time size and alignment assertion. The closure captures a data pointer, so no function pointer is cast and the question of whether function and data pointers have matching size does not arise. A closure that is too fat is a compile error and never an allocation. This is neither option the old backlog note proposed: boxing a function pointer would allocate, which the engine path forbids, and the static work-queue slot was never built."
mechanism = "`spawn<F: FnOnce() + Send + 'static>` with `tramp<F>` (os.rs:163) and `PtrSizedClosure::<F>::CHECK`."
source = "mock/design_rounds/202607192810/202607192800_topic.retire-the-fn-pointer-spawn.md:21-24, mock/design_rounds/202607192810/202607192800_topic.retire-the-fn-pointer-spawn.md:36-41, mock/design_rounds/202607192810/202607192810_changelist.doc.lock.md:16-24"
provenance = ["mock::design_rounds::202607192810::202607192800_topic.retire-the-fn-pointer-spawn::#what-each-piece-is-for"]
quote = '''
The generic `spawn<F: FnOnce() + Send + 'static>` is separate machinery with its own entry point,
`tramp<F>` (`os.rs:163`). It copies a pointer-sized closure by value into the argument slot, guarded
by `PtrSizedClosure::<F>::CHECK`, a compile-time size and alignment assertion. A closure too fat is a
compile error rather than a heap allocation, which is what keeps the engine path allocation-free.
---
That round has since happened, and it resolved the concern differently from either option the note
proposed. The live path never casts a function pointer: it copies a closure's bytes, and the closure
captures a data pointer. The `fn*`-versus-`void*` parity question does not arise for it, and the
size/align check makes the copy's precondition explicit rather than assumed.

So the note is resolved by supersession, not still open. Deleting the code it tracks without saying
---
It becomes a record of how the concern was resolved, rather than an open item pointing at deleted
code.

The resolution is neither option the note proposed. `Box<fn()>` would allocate, which the engine path
forbids, and the static work-queue slot was never built. What shipped is the generic
`spawn<F: FnOnce() + Send + 'static>`, which copies a pointer-sized closure by value into the
`pthread_create` argument under `PtrSizedClosure::<F>::CHECK`, a compile-time size and alignment
assertion. The closure captures a data pointer, so no function pointer is cast and the `fn*`-versus-
`void*` parity question does not arise. An over-fat closure is a compile error, never an allocation.
'''
origin = "proposed"
written_by = "topic retire-the-fn-pointer-spawn of 2026-07-19, round 202607192810, and its doc changelist, agent-written"
standing = "held"
