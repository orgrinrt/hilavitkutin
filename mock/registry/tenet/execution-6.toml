---
New entry naming the follow-up: sweep `(record_count, fiber_count)` against the bench harness, measure dispatch overhead per approach (IndirectPerFiber / TrunkMega / ScheduleMega), update the cutovers based on real data. Refines both the `record_count >= 10_000` size threshold AND the `fiber_count <= 1` tiebreaker between TrunkMega and IndirectPerFiber in the small-record-count path. Sequencing: ships after the bench harness gains a dispatch-overhead bench fixture.
'''
