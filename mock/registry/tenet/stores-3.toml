[[tenet]]
id = "each_core_appends_into_its_own_region_of_an_accumulator_and_the_main_thread_merges_the_regions_in_order"
what = "For an accumulator each core owns an exclusive region of the one reserved buffer and the main thread merges the regions after the workers rejoin, preserving append order. This regioning by core is what the design asks for on the accumulator, and it is a different mechanism from head and tail convergence, which splits input records between two threads."
mechanism = "Cap = build-time record count (at most one append per record); regions tile `[0, total)` one per core: `per = ceil(total/ncores)`, `lo = (c*per).min(total)`, `hi = (lo+per).min(total)`, cap `hi_c - lo_c`, each with its own live-length cell."
source = "mock/research/202611130850_the-record-read-whole/RECOVERED.md:61-70"
provenance = ["mock::research::202611130850_the-record-read-whole::RECOVERED::#mock-crates-hilavitkutin-design-md-tmpl-lines-552-to-561"]
quote = '''
regions of the single reserved buffer. The accumulator reserves cap =
build-time record count (the global at-most-one-append-per-record bound),
and core c appends into the sub-region at element offset `lo_c`, where the
regions tile `[0, total)` one per core (`per = ceil(total/ncores)`,
`lo = (c*per).min(total)`, `hi = (lo+per).min(total)`), with cap `hi_c - lo_c`
and its own live-length cell. This N-way regioning is what the design asks for
on the accumulator: each core owns an exclusive region and the main thread
merges them after the workers rejoin, preserving append order. It is a
different mechanism from head+tail convergence, which splits input records
between two threads; they share the ceiling formula and nothing else.
'''
origin = "proposed"
written_by = "engine design template as on the branch recover/unlanded-rounds-and-benches, commit of 2026-08-30, not on dev; the text does not say whose it is"
standing = "provisional"
subject = "stores"
keywords = ["accumulator", "per-core region", "merge", "append order", "N-way regioning", "reserved buffer"]
