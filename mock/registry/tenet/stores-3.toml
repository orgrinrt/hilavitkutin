[[tenet]]
id = "an_append_past_an_accumulator_s_capacity_is_counted_and_never_written_and_the_refusal_is_sticky_for_the_frame"
what = "Each accumulator binding carries, beside its live length, a count of how many appends the frame asked of it. Every append raises that count. An append writes and raises the live length only when nothing has been refused yet and the live length is below the capacity; otherwise nothing is written. Once one append is refused, every later append on the same binding is refused. No flag is stored apart from the two counts."
mechanism = "A second cell `wanted` beside `len` on the accumulator binding; write only when `wanted == len` and `len < cap`; refused exactly when `wanted > len`."
source = "mock/design_rounds/202611130402/202611130400_topic.overflow-is-a-value.md:16-16"
provenance = ["mock::design_rounds::202611130402::202611130400_topic.overflow-is-a-value::#the-shape"]
quote = '''
The sticky refusal is a second count on each accumulator binding beside the live length: how many appends the frame asked of it. Every append bumps it. An append writes and bumps the live length only when nothing has been refused yet (`wanted == len`) and the live length is below the capacity; otherwise it writes nothing and only `wanted` moves. So `wanted >= len` always, and the accumulator has refused this frame exactly when `wanted > len`. That is the sticky state: once one append is refused, every later append on the same binding is refused and the live length does not move, which is the law `notko`'s `Fill` keeps for a lend and the panel stated for the window (L75, N3). No flag is stored apart from the two counts, so there is nothing to keep consistent with them.
'''
origin = "proposed"
written_by = "topic overflow-is-a-value of 2026-11-13, round 202611130402, roadmap step HV1b, agent-written"
standing = "provisional"
subject = "stores"
keywords = ["accumulator", "append", "capacity", "refusal", "sticky", "wanted", "overflow", "AccumRefused"]
rules_out = ["An append past an accumulator's reserved capacity panics"]
