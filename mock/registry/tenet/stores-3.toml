[[tenet]]
id = "the_refusal_of_an_accumulator_is_read_at_the_close_and_is_the_same_value_at_every_worker_count"
subject = "stores"
what = "After the last band of the frame the run walks the bindings in registration order and returns the first accumulator that refused, as a value naming its position among the accumulators, how many appends were asked and the reserved capacity. The count asked does not depend on how the records were split, so the refusal of an emitter that asks more than the reserved capacity is the same value at one, two, four and the maximum number of workers."
mechanism = "`AccumRefused` with the registration position and `notko::Exhausted { wanted, had }`, handed out through the run configuration's output type; on several workers the merge sums the per-core counts."
source = "mock/design_rounds/202611130402/202611130400_topic.overflow-is-a-value.md:18-20"
provenance = ["mock::design_rounds::202611130402::202611130400_topic.overflow-is-a-value::#the-shape"]
quote = '''
The refusal is read at the close. After the last band of the frame, `run` walks the bindings in registration order and returns the first accumulator whose `wanted > len`, as a value naming its registration position among the accumulators and `notko::Exhausted { wanted, had }`, with `had` the reserved capacity. The value goes out through the run-config's output: `RunCfg::Out` is bound on `From<Outcome<(), AccumRefused>>`, the default config's `Out` is `Outcome<(), AccumRefused>` (the reflexive `From` covers it), and every run entry returns `Cfg::Out::from(verdict)`. `RunCfg` is sealed, so the default config is the only impl and no consumer impl breaks.

`wanted` is the count of appends the frame asked for, so it does not depend on how the records were split. On one core it is every append the bodies made; on `n` workers the merge sums the per-core counts. `had` is the reserved capacity of the shared binding in both. The refusal of an emitter that asks more than the reserved capacity is therefore the same value at 1, 2, 4 and the maximum worker count, which is the proof the roadmap asks for.
'''
origin = "proposed"
written_by = "topic overflow-is-a-value of 2026-11-13, round 202611130402, roadmap step HV1b, agent-written"
standing = "provisional"
stamped_by = "experts"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md), and asked of the maintainer in ticket `86aa80598714`'
