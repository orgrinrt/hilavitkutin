[[tenet]]
id = "in_the_frame_view_sketch_a_step_kernel_reads_the_committed_frame_through_a_view_and_writes_through_staged_handles"
subject = "stores"
what = "In the same sketch, a step kernel is handed a view of the committed frame for the length of the step, restricted to the list of lanes it reads. The view can be copied and read from every thread and has no write. What the kernel writes goes through one write-only handle per lane of its write list, which has no read and cannot be copied."
mechanism = "`View<'s, Reg, R>` with `view.get(Lane, row)` bounded on `R: Contains<Lane>`; `StagedLane<'s, X>` with `set(row, value)`, neither `Copy` nor `Clone`; a value kernel returns a tuple of values per row and the runner writes them through the handles."
source = "mock/research/sketches/202611122242_frame-view-typestate/FINDINGS.md:17-19"
provenance = ["mock::research::sketches::202611122242_frame-view-typestate::FINDINGS::#the-shape"]
quote = '''
`View<'s, Reg, R>` is the committed frame for the step `'s`, restricted to the read list `R`. It is a list of shared slices and a phantom, so it is `Copy`, and `Sync` exactly when every lane's item is, which `Lane::Item` requires. Its one read is `view.get(Lane, row)`, bounded on `R: Contains<Lane>`; it has no write method. `Row` is an opaque brand built only by the engine, with no order and no integer conversion (stamp 7, F's note).

`StagedLane<'s, X>` is one write-only handle: `set(row, value)` and nothing else, neither `Copy` nor `Clone`. A block kernel receives one per member of its write list as a nested tuple and destructures it. A value kernel returns a nested tuple of values per row and the runner writes them through the handles itself.
'''
