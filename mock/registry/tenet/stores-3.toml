[[tenet]]
id = "the_overflow_choice_is_a_sealed_pair_on_the_run_configuration_and_the_assert_fires_at_the_close_on_the_calling_thread"
subject = "stores"
what = "The round that carries op's ruling reads its intent as a pick at compile time on the run configuration, with the refusal as a value the default. It names the choice as a sealed set of two, refuse and assert, which it calls the engine's own fixed vocabulary and not content; each fixes the run's output type. The append path is the same under both: it refuses and counts. The assert fires at the close, on the thread that called the run, after every worker has parked again, so that a panic never hits a worker and stalls the join."
mechanism = "Sealed `AccumOverflow` with `Refuse` and `Assert`; `RunCfg::Overflow: AccumOverflow<Out = Self::Out>`; `DefaultRunCfg<O: AccumOverflow = Refuse>`; `build_with::<DefaultRunCfg<Assert>, _, _>` takes the assert."
source = "mock/design_rounds/202611130554/202611130600_topic.overflow-is-the-consumers-choice.md:11-21"
provenance = ["mock::design_rounds::202611130554::202611130600_topic.overflow-is-the-consumers-choice::#op-s-ruling"]
quote = '''
The intent: the consumer picks, at compile time and on the run configuration, whether an over-capacity append comes back as a value or stops the run with a panic, and the refusal as a value is the default.

## Current state

Round 202611130402 built the refusal only. `RunCfg` is sealed, `DefaultRunCfg` is its one impl, and `RunCfg::Out` is `notko::Outcome<(), AccumRefused>` there. Every run entry ends in `frame_verdict`, which builds `Cfg::Out` from the frame's verdict. A consumer picks a configuration by type through `build_with::<Cfg, _, _>`; `build` takes `DefaultRunCfg`.

## Changes proposed

1. A sealed `AccumOverflow` names the choice, with two inhabitants, `Refuse` and `Assert`. Each fixes the run's output type and turns the frame's verdict into it: `Refuse` hands the verdict back as `notko::Outcome<(), AccumRefused>`; `Assert` returns `()` and panics on a refusal, naming the `AccumRefused`. The set is the engine's own fixed vocabulary, two behaviours of one branch, not content.
2. `RunCfg` gains `type Overflow: AccumOverflow<Out = Self::Out>`, so `Out` differs by the choice and nothing else can set it apart from it. `DefaultRunCfg` becomes `DefaultRunCfg<O: AccumOverflow = Refuse>`, so `build` keeps the refusal and `build_with::<DefaultRunCfg<Assert>, _, _>` takes the assert.
3. The append path does not change under either choice: it refuses and counts. The assert fires at the close, on the thread that called the run, after every worker has re-parked. `dev` asserted inside the append, so under `run_parallel` the panic hit a worker and the join stalled (fault H2). Asserting at the close keeps op's intent, a run that stops on an over-capacity append, without bringing that stall back, and no write passes the capacity under either choice.
'''
origin = "proposed"
written_by = "topic overflow-is-the-consumers-choice of 2026-11-13, round 202611130554, the working out of op's ruling, agent-written"
standing = "provisional"
stamped_by = "experts"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md), and asked of the maintainer in ticket `86aa80598714`'
keywords = ["AccumOverflow", "Refuse", "Assert", "run configuration", "sealed", "close", "calling thread", "typestate"]
related = ["tenet::the_consumer_picks_on_the_run_configuration_whether_an_over_capacity_append_is_a_refusal_or_an_assert"]

[[tenet]]
id = "under_the_parallel_run_each_core_s_accumulator_region_starts_after_the_leading_records_and_keeps_its_own_refusal"
subject = "stores"
what = "Under the parallel run the region of each accumulator a core appends into starts after the records the leading bands already accepted, clipped to the capacity, and the merge compacts from there, so the leading bands' records survive and count, and a region with no room refuses and does not drop. On one thread the accepted records are a prefix of the appends; under the parallel run each region keeps its own prefix, so the bytes kept depend on the worker count while the refusal value does not."
source = "mock/design_rounds/202611130500/202611130500_topic.overflow-review-fixes.md:22-23"
provenance = ["mock::design_rounds::202611130500::202611130500_topic.overflow-review-fixes::#changes-proposed"]
quote = '''
2. The per-core region of each accumulator starts after the records the leading bands already accepted: core c appends at `len + lo_c`, clipped to the capacity, and the merge compacts from `len` rather than 0. The leading bands' records survive and count. The last regions lose that much room, which the region-skew gap (ticket 9979e2632a6a) already covers, and a region with no room refuses rather than drops. The merged `wanted` saturates.
3. The rule for the accepted records is stated per region: on one thread the accepted records are a prefix of the appends; under `run_parallel` each region keeps its own prefix, so the bytes kept depend on the worker count while the `AccumRefused` value does not.
'''
