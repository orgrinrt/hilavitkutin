[[tenet]]
id = "a_resource_handle_s_members_decompose_into_per_member_shape_bound_columns_in_the_unified_store"
subject = "stores"
what = "As first stated in the round of 2026-06-19, a resource is a handle whose field, sequence and map members each decompose into their own column in the unified type-erased columnar store, keyed by shape so that a field type appearing in many resources collapses to one column. The resource record holds only the pointers to those columns, in a separate handle store keyed by resource id with its own pointer provenance, and there is no private value arena. On that statement the one-record blob of the shipped drain was named the drift."
mechanism = "`DrainStores` (bindings.rs:22) reserved a one-record opaque column per `Resource<T>` behind a single `ResourcePtr<T>`."
source = "mock/design_rounds/202607161000/202606210600_topic.resource-handle-storage-model.md:10-18, mock/design_rounds/202607161000/202606210600_topic.resource-handle-storage-model.md:41-48"
provenance = ["mock::design_rounds::202607161000::202606210600_topic.resource-handle-storage-model::#the-realization"]
quote = '''
A `Resource<T>` is a **handle**. It does not store its value inline. `T` decomposes
per-member: each `Field`/`Seq`/`Map` member becomes its own column in the **unified,
type-erased columnar store**, keyed/shared by **shape** (stride), so a `Field<u32>`
appearing in many resources collapses to one shape-bound column rather than a
type-unique column per concrete `T` (type-unique is too wide and explodes the column
count). The resource record itself holds only the **pointers** (or pointer + index)
to its members' columns, in a **separate handle store keyed by resource id**, with
separate pointer provenance from the value columns. The resource has **no private
value arena**.
---
`DrainStores` (bindings.rs:22) reserves a **one-record opaque column per `Resource<T>`**:
the whole value moved in as a blob behind a single `ResourcePtr<T>`. That is NOT the
canonical model. Canonical: the members decompose into per-member shape-bound columns,
and the resource is a handle of their pointers/indices. The blob impl is the drift to
fix; it is also what manufactured the morsel-size "dissonance" (the heterogeneous
bare-RunCfg-vs-Resource-vs-Column type-fold). Once every value is a shape-bound column
with a known stride and the resource is a handle, per-store size is uniform (column
strides) and the type-fold problem disappears.
'''
origin = "proposed"
written_by = "topic resource-handle-storage-model of 2026-06-19, round 202606210600, agent-written, later reversed by the same round's bench topics"
standing = "provisional"
superseded_by = ["a_resource_value_is_a_one_record_blob_and_the_bench_reverses_the_decomposition_to_shape_bound_columns"]
keywords = ["resource handle", "shape-bound columns", "decompose", "handle store", "DrainStores", "one-record blob", "R5", "unified store"]
related = ["tenet::a_resource_is_a_handle_and_not_an_inline_value_store_which_is_the_corrected_reading_of_r5"]

[[tenet]]
id = "a_resource_value_is_a_one_record_blob_and_the_bench_reverses_the_decomposition_to_shape_bound_columns"
subject = "stores"
what = "The bench and the experts reverse the decomposition: a resource value is a one-record blob per resource, the handle pointing to a contiguous value, with a stack-local snapshot of the scalar members before the morsel loop and the large sequence and map members streamed live and not copied. The decision first stood provisional pending a second run, and the second run confirmed the first on every axis. The decomposed layout and the shape-bound shared layout are both refuted."
mechanism = "Bench variants: V2 decomposed per-member columns loses axis B and axis C; V3 shape-bound shared columns lose axis E plus a resize-invalidates-all-sharers hazard; large collection members streamed live beat snapshot-copy about 2.5 times at 64 MiB."
source = "mock/design_rounds/202607161000/202606210600_topic.bench-decision.md:8-13, mock/design_rounds/202607161000/202606210600_topic.bench-decision.md:17-22, mock/design_rounds/202607161000/202606210600_topic.bench-run2-resolution.md:12-16, mock/design_rounds/202607161000/202606210600_topic.bench-run2-resolution.md:41-52"
provenance = ["mock::design_rounds::202607161000::202606210600_topic.bench-decision::#status-provisional"]
quote = '''
## Status: PROVISIONAL

Op directed a couple of full harness runs before judging. **Only run-1 has completed.**
This topic records the decision the pressure-test + run-1 point to; it is NOT locked. Run-2
(confirmation) + a full CSV aggregation (min/median `algo_ns` per section x n x variant) are
deferred to next week, then the decision locks or revises.
---
The earlier addendum (`202606210600_resource-storage-model-canonical-addendum.md`) asserted
**decompose-to-shape-bound-columns**. The bench + experts **reverse** that. The winner is:

**A one-record blob per resource (the handle points to a contiguous value), with a
stack-local snapshot of the scalar `Field` members before the morsel loop, and large
`Seq`/`Map` collection members streamed live (NOT snapshot-copied).**
---
## Run-2 confirmed run-1 on every axis

A second full 16-arm pass on the same M1 host, independent of run-1 (the harness `run` path consults no
dylib cache), 74 minutes, all arms byte-exact-validated. Read on the best-20% (min) low-noise estimator,
every axis verdict reproduced:
---
## Decided by the bench (independent of the requirements call)

- Resource is a handle, not an inline-value store (R5:1689).
- The per-record value layout is a one-record blob (per-resource contiguous on the arena), NOT decomposed
  per-member columns (V2: loses axis B and C) and NOT shape-bound shared columns (V3: loses axis E plus the
  resize-invalidates-all-sharers hazard). This reverses the addendum's original decompose-to-shape-bound.
- Scalar Field members: stack-snapshot before the morsel loop (wall-clock-neutral on M1, free insurance,
  mechanism proven in disasm, real where the reload is not L1-cheap).
- Seq/Map collection members: stream live from the column, never snapshot-copy (~2.5x at 64 MiB). The
  snapshot copies only the small scalars and the collection ptr+len, not the elements.
- The noalias invariant is architectural: the handle store never aliases the value columns, and scalars are
  snapshotted before the loop.
'''
