id = "the_plan_dirty_array_stays_hardcoded_at_256_with_a_documented_deferral_because_rustc_rejects_field_access_on_generic_constants"
subject = "change"
what = "The lift of the plan-dirty array to the run configuration's cap is deferred. The array stays hardcoded at 256 with the intended shape documented in the source, because the compiler rejects field access on generic constants, while the run signature and the per-configuration typestate of the scheduler shell stay as locked and only the per-configuration width of the dirty bitmap awaits compiler support."
mechanism = "`generic_const_exprs` rejects field access on generic constants (\"overly complex generic constant\"), the block-syntax variant reproducing the same error; documented via an extended comment plus lint:allow rationale on the `plan_dirty` field; tracked under `#345`; verified by grep of 'per-Cfg lift awaits rustc generic_const_exprs gaining field-access support'."
source = "mock/design_rounds/202605232000/202605232000_changelist.src.lock.md:14-19, mock/design_rounds/202605232000/202605232000_changelist.src.lock.md:21-21, mock/design_rounds/202605232000/202605232000_changelist.src.lock.md:37-37"
provenance = ["mock::design_rounds::202605232000::202605232000_changelist.src.lock::#change-scheduler-plan-dirty-typestate-lift-deferred-per-rustc-generic-const-exprs-limitation"]
quote = '''
## CHANGE: `Scheduler::plan_dirty` typestate lift deferred per rustc generic_const_exprs limitation

File: `mock/crates/hilavitkutin/src/scheduler/mod.rs`
Topic A2 pivot. The reviewer's recommendation to lift `Scheduler::plan_dirty` from `[AtomicBool; 256]` to `[AtomicBool; Cfg::MAX_PLAN_AFFECTING_RESOURCES.0]` runs into a rustc limitation: `generic_const_exprs` rejects field access on generic constants ("overly complex generic constant"). The block-syntax variant reproduces the same error.

The intended shape is documented in source via an extended comment + lint:allow rationale on the `plan_dirty` field. The `Scheduler::run` signature and the per-Cfg typestate of the surrounding `Scheduler<Cfg: RunCfg>` shell remain as the prior round locked them; only the per-Cfg width of the dirty bitmap awaits rustc's feature work, tracked under `#345`.
---
Verification: `grep 'per-Cfg lift awaits rustc generic_const_exprs gaining field-access support' mock/crates/hilavitkutin/src/scheduler/mod.rs` returns one match.
---
This src CL supersedes `202605232000_changelist.src.deprecated.md`. The earlier draft locked prematurely (source changes had not landed yet) and assumed the `Scheduler::plan_dirty` lift to `Cfg::MAX_PLAN_AFFECTING_RESOURCES.0` would land under `feature(generic_const_exprs)`; current rustc rejects field access on generic constants, so the lift pivots to a documented deferral.
'''
