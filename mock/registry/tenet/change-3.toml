[[tenet]]
id = "the_plan_dirty_array_is_sized_by_the_run_configuration_s_plan_affecting_cap_so_an_override_cannot_overrun_it"
subject = "change"
what = "The plan-dirty array is sized by the run configuration's plan-affecting cap in place of a hardcoded size of 256, since the hardcode defeats the per-configuration typestate and a consumer that overrides the cap either silently overruns or mismatches with no type-system signal."
mechanism = "`[AtomicBool; Cfg::MAX_PLAN_AFFECTING_RESOURCES.0]` (the inner `usize` of the `arvo::USize` trait constant) under `feature(generic_const_exprs)`; source had landed `[AtomicBool; 256]` with a `lint:allow(no-bare-numeric)`; the reviewer's recommendation."
source = "mock/design_rounds/202605232000/202605232000_topic.runtime-megaround-post-review-fixes.md:22-22, mock/design_rounds/202605232000/202605232000_topic.runtime-megaround-post-review-fixes.md:24-24"
provenance = ["mock::design_rounds::202605232000::202605232000_topic.runtime-megaround-post-review-fixes::#a2-scheduler-plan-dirty-lifts-to-const-generic-via-cfg"]
quote = '''
Prior round's src CL Pass 6 specified `[AtomicBool; Cfg::MAX_PLAN_AFFECTING_RESOURCES]`; source landed `[AtomicBool; 256]` hardcoded with a `lint:allow(no-bare-numeric)`. The hardcode defeats the per-Cfg typestate: any consumer overriding `MAX_PLAN_AFFECTING_RESOURCES` either silently overruns or mismatches with no type-system signal.
---
This round's src CL lifts the array dimension to `Cfg::MAX_PLAN_AFFECTING_RESOURCES.0` (the inner `usize` extracted from the `arvo::USize` trait constant) under `feature(generic_const_exprs)`. The crate's `lib.rs` gains the feature flag. The reviewer's recommendation here is exact; the implementation matches it.
'''
