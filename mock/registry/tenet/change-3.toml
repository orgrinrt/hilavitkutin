[[tenet]]
id = "the_plan_dirty_bit_array_is_keyed_by_the_plan_affecting_id_under_a_default_cap_of_sixteen_and_exceeding_it_fails_at_compile_time"
subject = "change"
what = "The plan-dirty bit array holds one bit for each plan-affecting input type of a pipeline, keyed by an identifier for each, under a default cap of sixteen. Registering more than the cap fails at compile time with a diagnostic pointing at the cap, and the cap is a const generic on the scheduler that a consumer overrides."
because = "Realistic consumer counts, a run configuration plus a few stage configurations, are likely under eight, so sixteen leaves headroom."
mechanism = "`[AtomicBool; MAX_PLAN_AFFECTING_RESOURCES]` keyed by `PlanAffectingId`; default 16; `#[diagnostic::on_unimplemented]` pointing at `MAX_PLAN_AFFECTING_RESOURCES`; override through `Scheduler::<_, _, 32>::builder()`."
source = "mock/design_rounds/202605101036/202605101036_topic.resource-resolution.md:68-70"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.resource-resolution::#max-plan-affecting-resources-16"]
quote = '''
The dirty-bit array is `[AtomicBool; MAX_PLAN_AFFECTING_RESOURCES]` keyed by `PlanAffectingId`. Default cap is 16. This is the count of distinct `PlanAffecting`-bound BuilderInput types per pipeline. Realistic consumer counts (RunCfg + a few stage configs) likely under 8; 16 leaves headroom.

If a consumer registers more than 16 PlanAffecting types, compile-time fails with `#[diagnostic::on_unimplemented]` pointing at `MAX_PLAN_AFFECTING_RESOURCES`. Cap is a const generic on Scheduler; consumers override via `Scheduler::<_, _, 32>::builder()` syntax if needed.
'''
origin = "proposed"
written_by = "design round 202605101036, topic 8 resource resolution, user-attention call marked autonomous and revisitable, dated 2026-05-11, agent-written; the text does not say whose decision it is"
standing = "held"
keywords = ["MAX_PLAN_AFFECTING_RESOURCES", "PlanAffectingId", "dirty-bit array", "cap of 16", "on_unimplemented", "const generic override", "Scheduler"]
related = ["tenet::a_resource_is_plan_affecting_only_when_the_consumer_opts_it_in_and_the_number_of_them_is_capped"]

