[[tenet]]
id = "a_changelist_claim_is_verified_against_what_landed_and_every_verification_line_is_run_before_the_lock"
subject = "governance"
what = "A claim in a changelist is verified against what landed and not against the working tree, because a claim verified before a commit can be falsified by that commit's own formatter. Until a claim-verifier lint exists, the discipline is to run every verification line of a changelist as a command against the committed state before the changelist locks."
mechanism = "`git show HEAD` after the pre-commit autofix, which runs rustfmt; the claim-verifier lint of `cl-claim-sketch-discipline.md` is tracked upstream and does not exist yet."
source = "mock/design_rounds/202608090300/202608090300_topic.the-kind-width-is-still-fixed.md:55-63, mock/design_rounds/202608101600/202608101600_topic.a-locked-claim-that-was-never-executed.md:40-44"
provenance = ["mock::design_rounds::202608090300::202608090300_topic.the-kind-width-is-still-fixed::#a-record-defect-worth-stating-because-it-will-recur"]
quote = '''
`grep -c 'impl const SymShape for SixteenMinters'`, and the source reads `const
impl`. The verification **was** run and **was** true when run. The pre-commit
autofix then ran rustfmt, which rewrote the keyword order, and the locked
changelist shipped naming a command that returns zero against the source it
describes.

So a claim verified before a commit can be falsified by that commit's own
formatter. Verify against what landed, not against the working tree. The
workspace rule now says so.
---
Naming that here rather than proposing a mechanism: the lint that would close it
is `cl-claim-sketch-discipline.md`'s claim-verifier, which is tracked upstream
and does not exist yet. Until it does, the discipline is to run every
verification line as a command against `git show HEAD` before locking, which is
what this round does for its own.
'''
origin = "proposed"
written_by = "topics of rounds 202608090300 'the kind width is still fixed' and 202608101600 'a locked claim that was never executed', agent-written"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["verification", "git show HEAD", "autofix", "rustfmt", "locked changelist", "claim verifier", "verify against what landed"]

