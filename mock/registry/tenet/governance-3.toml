id = "the_evidence_then_bless_standard_is_part_of_canon_and_governs_every_recorded_deviation_of_a_shipped_mechanism"
what = "The evidence-then-bless standard is part of canon and not process trivia. Shipped mechanisms that deviate from a canonical mechanism are neither blessed by default nor rebuilt by default. For each recorded deviation the canonical shape is built or sketched, benched against the shipped shape where a bench trigger is named, and the evidence is presented for a ruling to bless it or rebuild it. It governs the six GATE-2 agent-call deviations and the spectral role deviation."
