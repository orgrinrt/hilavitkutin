[[tenet]]
id = "the_evidence_then_bless_standard_is_part_of_canon_and_governs_every_recorded_deviation_of_a_shipped_mechanism"
subject = "governance"
what = "The evidence-then-bless standard is part of canon and not process trivia. Shipped mechanisms that deviate from a canonical mechanism are neither blessed by default nor rebuilt by default. For each recorded deviation the canonical shape is built or sketched, benched against the shipped shape where a bench trigger is named, and the evidence is presented for a ruling to bless it or rebuild it. It governs the six GATE-2 agent-call deviations (`the_gate_2_agent_call_deviations_are_blessed_or_rebuilt_only_on_evidence_put_to_the_maintainer`) and the spectral role deviation (`the_spectral_role_deviation_follows_the_same_evidence_then_bless_standard`)."
mechanism = "A2-4; chapters [[execution]] and [[plan]]."
source = "mock/research/seed/governance.md:72-80"
provenance = ["mock::research::seed::governance::#standards-the-seed-carries-forward"]
quote = '''
Two standing decision standards are part of canon, not process trivia:

**Evidence then bless (A2-4).** Shipped mechanisms that deviate from a
canonical mechanism are neither blessed by default nor rebuilt by default.
For each recorded deviation, the canonical shape is built or sketched,
benched against the shipped shape where a bench trigger is named, and the
evidence is presented for a bless-or-rebuild ruling. This governs the six
GATE-2 agent-call deviations and the spectral role deviation (see
[[execution]] and [[plan]]).
'''
