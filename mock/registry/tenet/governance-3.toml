[[tenet]]
id = "a_backlog_note_answered_by_a_later_design_is_rewritten_as_a_record_of_its_resolution_and_not_deleted"
subject = "governance"
what = "A backlog note whose concern a later design answered, and did not drop, is kept and rewritten as a record of how the concern was resolved, instead of being left open against deleted code or deleted along with the code. A reader who finds both the code and the note gone could not tell whether the concern was addressed or abandoned."
source = "mock/design_rounds/202607192810/202607192800_topic.retire-the-fn-pointer-spawn.md:36-42, mock/design_rounds/202607192810/202607192810_changelist.doc.lock.md:16-17, mock/design_rounds/202607192810/202607192810_changelist.doc.lock.md:26-27"
provenance = ["mock::design_rounds::202607192810::202607192800_topic.retire-the-fn-pointer-spawn::#the-design-note-the-check-surfaced"]
quote = '''
That round has since happened, and it resolved the concern differently from either option the note
proposed. The live path never casts a function pointer: it copies a closure's bytes, and the closure
captures a data pointer. The `fn*`-versus-`void*` parity question does not arise for it, and the
size/align check makes the copy's precondition explicit rather than assumed.

So the note is resolved by supersession, not still open. Deleting the code it tracks without saying
so would leave a reader to conclude the concern was dropped rather than answered.
---
It becomes a record of how the concern was resolved, rather than an open item pointing at deleted
code.
---
Worth keeping rather than deleting outright: a reader who finds the code gone and the note gone has
no way to tell whether the concern was addressed or abandoned. The rewritten entry says which.
'''
