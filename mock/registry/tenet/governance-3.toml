**Pre-implementation; runtime megaround design locked.** Design round 202605101036 (closed-pending-sketches 2026-05-11) crystallised the runtime layer across 11 topics (Scheduler::run signature, BuilderInput reshape, plan algorithm chain, dispatch codegen, adapt subsystem, thread pool, morsel loop, resource resolution, plan caching, per-core dispatch, test+example bar). Implementation lands bottom-up via the round's src CL.

Five user-attention items flagged from the autonomous topic locks:
- `WakeStrategy { p_spin_iters: 128, e_spin_iters: 32 }` default ratio.
- `MICRO_MORSEL_INTERVAL = 64`, `MAX_DRIFT_RECORDS = 32`.
- `MAX_PLAN_AFFECTING_RESOURCES = 16` cap.
- Three example apps: `word_count`, `particle_step`, `audio_mix`.

Each is a low-impact-revisitable constant or naming choice. None block downstream implementation.

Bench evidence aggregated in `mock/benches/NIGHT_FINDINGS_2026-05-11.md`. Audit trail for every locked decision.
