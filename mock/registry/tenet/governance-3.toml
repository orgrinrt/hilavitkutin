[[tenet]]
id = "code_superseded_by_a_later_design_decision_is_deleted_with_its_test_and_doc_paragraph_and_a_remaining_reference_is_no_reason_to_keep_it"
subject = "governance"
what = "Whether superseded code is kept is decided by supersession: has a later design decision replaced it. If so the code goes, and its test and its doc paragraph go with it, because they document the thing that lost. That something still references it, a test exercising it, a design paragraph naming it or a backlog note promising to wire it, is no reason to keep it, because that signal is satisfied by exactly the artefacts that describe the superseded mechanism and so always votes to keep drift alive."
source = "mock/design_rounds/202607192910/202607192900_topic.delete-superseded-dispatch-and-barrier.md:10-18"
provenance = ["mock::design_rounds::202607192910::202607192900_topic.delete-superseded-dispatch-and-barrier::#the-test-that-was-being-used-and-why-it-was-wrong"]
quote = '''
## The test that was being used, and why it was wrong

Earlier passes in this arc kept both of these on the signal "something still references it": a test
exercises `phase_run`, a design paragraph names it, a BACKLOG note promises to wire the phase
barriers. That signal is worthless here. It is satisfied by exactly the artefacts that describe the
superseded mechanism, so it will always vote to keep drift alive.

The test that matters is **supersession**. Has a later design decision replaced this? If so the code
goes, and the test and the doc paragraph go with it, because they document the thing that lost.
'''
