id = "fiber_dispatch_is_never_inlined_and_the_units_inside_a_fiber_are_always_inlined"
subject = "execution"
what = "Fiber dispatch is marked never-inline so that LLVM optimises each fiber as a separate compilation unit, the unit functions within their fiber are always inlined so that LLVM sees the full body, fuses the operations and vectorises, and the per-core program, which sequences fibers and phase sync, is never inlined."
mechanism = "`#[inline(never)]` on fiber dispatch; `#[inline(always)]` on WU functions within their fiber; `#[inline(never)]` on the per-core program."
