[[tenet]]
id = "progress_counters_are_stack_atomics_with_a_release_store_by_the_producer_and_an_acquire_load_by_the_consumer"
subject = "execution"
what = "Each fiber has an atomic progress counter holding a monotonic record index. The producer publishes with a plain release store, which is a single store-release instruction on aarch64 and not a read-modify-write, and the consumer reads with an acquire load, a single load-acquire instruction; at phase boundaries a spin loop polls the counter. The counters live on the stack and are not reference-counted, which eliminates six heap allocations per pipeline execution."
mechanism = "`AtomicUsize` per fiber. Producer `store(end, Release)`: single `stlr` on aarch64, not fetch_add or fetch_or. Consumer `load(Acquire)`: single `ldar`. Spin loop: `isb` + `ldapr` + `cmp` + branch. Stack AtomicUsize, not Arc; raw pointer (`as usize`) passed to the thread."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1619-1627"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#17-dispatch-codegen"]
quote = '''
**Progress counters and sync (T2 §7, T6 L2020-2024, T7 §3.3):**
- AtomicUsize per fiber, monotonic record index
- Producer: `store(end, Release)` — single `stlr` on aarch64. Not
  RMW, cheapest atomic. (T2 L474-498: plain store, not fetch_add or
  fetch_or)
- Consumer: `load(Acquire)` — single `ldar`
- Spin loop at phase boundaries: `isb` + `ldapr` + `cmp` + branch
- Stack AtomicUsize, not Arc — eliminates 6 heap allocations per
  pipeline execution. Raw pointer (`as usize`) passed to thread.
'''
