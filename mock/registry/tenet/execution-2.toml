[[tenet]]
id = "the_dispatch_approach_is_chosen_by_record_count_between_fiber_level_trunk_level_and_whole_schedule_functions"
subject = "execution"
what = "Dispatch is measured against hand-fused code in five approaches, and the choice among them follows the record count: below 10K records the indirect per-fiber or the trunk-level approach, whose smaller function bodies give better icache and register allocation, and above 10K records the whole-schedule function, where call setup is amortised over the morsel iterations."
mechanism = "A: monomorphised tuple, per-fiber-type trait, LOCAL `&[WuFn]`, 1.0x. B: unrolled params, each fn as a separate parameter, 0.9x. C: indirect per fiber, one fn pointer per fiber per morsel, 1.17x. D: trunk mega, `#[inline(always)]` fibers into a trunk function, 1.02x. E: schedule mega, all trunks in one function, 0.97x. Struct-field fn pointers: 12.6x FAIL. Thresholds: <10K records C or D; >10K records E."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1547-1562"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#17-dispatch-codegen"]
quote = '''
**Dispatch approaches (T6 L1084-1384, bench-validated):**

| Approach | Pattern | vs hand-fused |
|---|---|---|
| A: mono tuple | per-fiber-type trait, LOCAL `&[WuFn]` | 1.0x |
| B: unrolled params | each fn as separate parameter | 0.9x |
| C: indirect per-fiber | one fn ptr per fiber per morsel | 1.17x |
| D: trunk mega | `#[inline(always)]` fibers into trunk fn | 1.02x |
| E: schedule mega | all trunks in one fn | 0.97x |
| struct-field | fn ptrs in struct field | 12.6x FAIL |

Row size determines approach (T6 L1507-1517):
- <10K records: C or D (smaller function bodies, better icache — LLVM
  makes better register allocation for separated functions)
- \>10K records: E (full-schedule mega-dispatch, call setup amortised
