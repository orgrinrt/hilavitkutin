[[tenet]]
id = "the_arena_needs_no_size_threshold_because_column_pointers_are_resolved_from_its_base_at_each_morsel_boundary"
subject = "execution"
what = "The concern that a co-located arena larger than the aarch64 immediate range would degrade code is a non-issue, and fiber formation needs no arena size threshold. The dispatcher resolves the column pointers from the arena base at each morsel boundary, and the inner loop is then pointer arithmetic."
mechanism = "Precomputed model: `col_ptr = base + col * rows` resolved once at the morsel boundary, inner loop `col_ptr.add(i)`. Bench (arena_addressing.rs, 2-30 columns, 1M records, morsel=1024, 30 reps, fat LTO, codegen-units=1, Apple Silicon M1), precomputed vs separate ns/element: 2 cols 0.42 vs 0.63 (0.67x); 4 cols 1.36 vs 1.17 (1.17x); 8 cols 2.95 vs 2.89 (1.02x); 14 cols 5.94 vs 6.57 (0.90x); 20 cols 10.53 vs 11.00 (0.96x); 30 cols 24.58 vs 23.50 (1.05x). Dynamic column count: arena 6-15% faster (0.85-0.97x)."
because = "No addressing mode cliff: at a 120 KB morsel arena (14 columns, four times the 32 KB immediate range) the precomputed model is 10% faster than separate pointers, and LLVM pre-computes column pointers from the arena base when offsets exceed the immediate range."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:977-983, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:988-1002, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1004-1016, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1023-1026, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1033-1038"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#14-fiber-formation"]
quote = '''
**Arena addressing — RESOLVED (bench-validated, no constraint needed).**

The concern was that co-located arenas exceeding the aarch64 12-bit
scaled immediate range (~32KB for 8-byte accesses) would force LLVM
to use extra offset registers, degrading codegen. Benchmarked three
access patterns at 2-30 columns, 1M records, morsel=1024, 30 reps,
fat LTO, codegen-units=1 (Apple Silicon M1):
---
- **precomputed**: resolve `col_ptr = base + col * rows` once at morsel
  boundary, inner loop does `col_ptr.add(i)`. This IS the real fiber
  model — the dispatcher resolves column pointers from the arena base
  at each morsel boundary, then the inner loop is pointer arithmetic.

**Results (pre-computed vs separate pointers, const-generic N):**

| read_cols | precomp ns/el | separate ns/el | ratio | morsel arena |
|---|---|---|---|---|
| 2 | 0.42 | 0.63 | **0.67x** | 24 KB |
| 4 | 1.36 | 1.17 | 1.17x | 40 KB |
| 8 | 2.95 | 2.89 | 1.02x | 72 KB |
| 14 | 5.94 | 6.57 | **0.90x** | 120 KB |
| 20 | 10.53 | 11.00 | **0.96x** | 168 KB |
| 30 | 24.58 | 23.50 | 1.05x | 248 KB |
---
**Key findings:**

1. **No addressing mode cliff.** Performance varies ±17% across all
   column counts with no sudden degradation. At 120 KB morsel arena
   (14 cols, 4x the 32KB immediate range), the precomputed model is
   10% FASTER than separate pointers. At 248 KB (30 cols, 8x the
   range), it's only 5% slower.

2. **LLVM handles it correctly.** When column offsets exceed the
   immediate range, LLVM pre-computes column pointers from the arena
   base and uses `ptr.add(i)` in the inner loop — exactly the
   precomputed pattern. The addressing mode transition is invisible
   at the performance level.
---
4. **Dynamic column count: arena always wins.** When LLVM cannot see
   the exact column count (runtime loop), the arena model is 6-15%
   faster at every column count tested (0.85-0.97x). This is because
   `base + col * rows + i` compiles to one multiply-add vs loading a
---
**Resolution:** the arena addressing concern is a non-issue. The
holistic feasibility check does NOT need an arena size threshold. The
existing constraints (register file budget, L1 write budget, L1+L2
total, fan-in, pipeline breakers) are sufficient. The co-located arena
with pre-computed column pointers at morsel boundaries is the correct
model. No additional fiber formation constraint needed.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:977-983", "founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:988-1002", "founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1004-1016", "founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1023-1026", "founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1033-1038"]
keywords = ["arena addressing", "12-bit immediate", "precomputed column pointers", "no cliff", "arena size threshold", "bench", "co-location"]
rejects = ["an arena size threshold as an additional fiber formation constraint"]
