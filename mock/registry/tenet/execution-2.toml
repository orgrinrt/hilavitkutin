subject = "execution"
what = "The bench-validated helpful intrinsics are the count-leading-and-trailing-zeros scans for virtual flags and bitmasks, bulk non-overlapping copy for slab columns, byte fill for flag reset and column initialisation, a minimal spin loop for phase synchronisation, and the indexed addressing that LLVM generates, which is better than hand-written pointer advances."
