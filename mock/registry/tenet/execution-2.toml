[[tenet]]
id = "local_slices_monomorphised_dispatch_and_unrolled_parameters_devirtualise_and_struct_field_function_pointer_arrays_do_not"
subject = "execution"
what = "Devirtualisation works for local slices of function pointers with known values, for monomorphised trait dispatch and for unrolled function parameters. It does not work for function pointer arrays in a struct field, for const-generic array reference parameters, for global mutable static slots (an indirect branch per call), or for a non-inlined run function taking a slice of unit functions; for the struct-field arrays and the non-inlined run function LLVM cannot prove the contents."
mechanism = "Bench-validated. Works: local `&[fn]` slices with known values, monomorphised trait dispatch, unrolled function parameters. Fails: struct-field fn pointer arrays (12.6x penalty, LLVM cannot prove contents through a struct reference), `&[fn; N]` const-generic parameters (5.8x), global `static mut` slots (indirect `blr` per call), `run_fiber(&[WuFn], ...)` with `#[inline(never)]` (one function for all callers)."
