[[tenet]]
id = "the_flattener_emits_one_monomorphised_function_per_fiber_in_the_rust_pipe_pattern"
subject = "execution"
what = "For each fiber the codegen flattener emits a monomorphised function, and this is where the execution strategy for the units in a fiber is decided; the common case is a pipeline of fused units with resources cached on the stack, fiber input columns read at morsel start, pure functions on locals with no intermediate column stores, fiber-internal columns passed register to register so dead store elimination skips the memory operations, and all output stores grouped at the end of the loop body so the store buffer is used well."
mechanism = "The rust-pipe pattern: (1) cache resources to a stack-local array, (2) read fiber-input columns at morsel start, (3) pure function pipeline with locals, no intermediate column stores, (4) fiber-internal columns register-to-register, DSE skips memory ops, (5) all output stores grouped at the end of the loop body, (6) resource accumulation via stack-cached pointers. 0.95-0.96x baseline, beating hand assembly."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1564-1581"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#17-dispatch-codegen"]
quote = '''
**The codegen flattener — rust-pipe pattern (T6 L1689-1976):**

For each fiber, the flattener emits a monomorphised function. This
is where the execution strategy for ops within a fiber is decided
(domain 14 notes that fibers are the column co-location unit, not
definitionally fused). The flattener chooses how to execute the
fiber's WUs based on the fiber's properties:

For the common case (ops that benefit from fusion — most fibers):
1. Cache resources to stack-local array (domain 19)
2. Read fiber-input columns at morsel start
3. Pure function pipeline with locals — no intermediate column stores
4. Fiber-internal columns → register-to-register, DSE skips memory ops
5. All output stores grouped at end of loop body (store-buffer friendly)
6. Resource accumulation via stack-cached pointers

This is the `rust-pipe` pattern. 0.95-0.96x baseline (beats hand ASM
— LLVM makes better instruction scheduling decisions).
'''
