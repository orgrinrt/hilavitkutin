[[tenet]]
id = "a_column_is_a_typed_storage_slot_and_domain_schemas_are_the_consumer_s"
subject = "stores"
what = "A column is a typed storage slot. hilavitkutin does not know or care about domain schemas: it schedules on the read and write column sets only, and a schema layered over columns is the consumer's, translated in the consumer's registration layer."
mechanism = "`Column<T>` in hilavitkutin-api; the `Column<In<IR>, As<T>>` schema-as-traits pattern is a consumer wrapper around it (polka-sdk, saalis-sdk)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2397-2404"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#resolutions"]
quote = '''
**R1. Column<T> only — IR is consumer-side.** (items 1, 2)
hilavitkutin-api defines `Column<T>` as a typed storage slot. The
`Column<In<IR>, As<T>>` schema-as-traits pattern is consumer-side
(polka-sdk, saalis-sdk). hilavitkutin doesn't know or care about
domain schemas — it schedules based on Read/Write column sets only.
The `In<CatalogueIR, Installed>` syntax in polka-dots is a consumer
wrapper around hilavitkutin's `Column<T>`. Translation happens in
the consumer's registration layer.
'''
