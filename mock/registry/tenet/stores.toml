[[tenet]]
id = "any_copy_static_type_of_at_most_sixteen_bytes_is_column_storable_through_a_blanket_implementation"
subject = "stores"
what = "Any copyable static type of at most sixteen bytes is storable in a column through a blanket implementation, with no friction for consumers."
mechanism = "`impl<T: Copy + 'static> ColumnValue for T { default const BIT_WIDTH: usize = core::mem::size_of::<Self>() * 8; }` via min_specialization; `Column<u32>` just works."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:436-439, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:448-449"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#05-column-value-types"]
quote = '''
// Blanket impl via min_specialization: everything Copy + 'static + ≤16 bytes
impl<T: Copy + 'static> ColumnValue for T {
    default const BIT_WIDTH: usize = core::mem::size_of::<Self>() * 8;
}
---
- **Blanket impl:** any `Copy + 'static` type ≤16 bytes is column-storable.
  Zero friction for consumers. `Column<u32>` just works.
'''
