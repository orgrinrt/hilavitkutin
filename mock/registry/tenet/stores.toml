# The tenets whose subject is `stores`.

[[tenet]]
id = "there_are_three_store_types_and_one_scheduling_mechanism"
what = "There are three store types and one scheduling mechanism: a resource is a singleton holding one value, a column is a collection of N values chunked into morsels, and a virtual holds no data and is an edge of the graph only."
mechanism = "`Resource<T>(PhantomData<T>)`, `Column<T>(PhantomData<T>)`, `Virtual<T>(PhantomData<T>)`."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:491-496"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#06-store-types"]
quote = '''
**Three store types, one scheduling mechanism (T5 L198-208):**
```rust
pub struct Resource<T>(PhantomData<T>);  // singleton, one value
pub struct Column<T>(PhantomData<T>);    // collection, N values, morsel-chunked
pub struct Virtual<T>(PhantomData<T>);   // zero-data, DAG edge only
```
'''
origin = "stated"
standing = "provisional"
subject = "stores"
keywords = ["store types", "three", "resource", "column", "virtual", "singleton", "collection", "zero-data"]

