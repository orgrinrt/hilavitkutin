subject = "stores"
what = "With type-native stride the domain type is the storage type, so there is no pack or unpack step and no slot size intermediary. The payload trait simplifies to the column value trait."
mechanism = "`pub trait ColumnValue: Copy + 'static { const BIT_WIDTH: usize; }`"
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:427-429, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:432-434, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:464-464"
