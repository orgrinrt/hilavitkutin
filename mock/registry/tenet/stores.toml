[[tenet]]
id = "a_resource_is_scalars_and_const_sized_collections_only"
what = "A resource consists of three field types only: a scalar field of a column value, a const-sized array and a const-sized map. There are no dynamic collections; the allocation size is known at compile time."
mechanism = "`Field<T>` where T: ColumnValue (at most 16 bytes), stack-local cached; `Seq<T, const N: usize>` and `Map<K, V, const N: usize>` in a separate arena. Element values of Seq and Map are not held to 16 bytes."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:535-547"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#07-column-storage"]
quote = '''
**Resolution R5: Resource model — scalars + const-sized collections.**

Resources consist of three field types only:
- `Field<T>` where T: ColumnValue (≤16 bytes) — scalar, stack-local
  cached, LLVM promotes to registers. Only accessed fields loaded.
- `Seq<T, const N: usize>` — const-sized array in separate arena.
  Stack-local copied if small, L2-hinted if read-only.
- `Map<K, V, const N: usize>` — const-sized map in separate arena.
  Same caching pattern as Seq.

No dynamic collections. Allocation size is const generic (compile-time).
Element values in Seq/Map are NOT constrained to 16 bytes — only
Field<T> has the ColumnValue limit.
'''
origin = "stated"
standing = "provisional"
subject = "stores"
keywords = ["resource model", "field", "seq", "map", "const-sized", "no dynamic collections", "R5"]
rules_out = ["dynamic collections"]

