[[tenet]]
id = "the_consumer_provides_the_backing_memory_of_a_column"
subject = "stores"
what = "The consumer provides the backing memory of column storage and the library never calls an allocator directly. Column storage is reached through raw pointers and never through slices."
mechanism = "The ColumnStorage trait: raw pointers (slices cause aliasing UB when units are fused), type-native stride, 64-byte alignment on column arrays, a separate arena for resource Seq and Map allocations."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:557-562, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:566-566"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#07-column-storage"]
quote = '''
**ColumnStorage trait (updated from T2):**
- Raw pointers, NOT slices (T6 §CRITICAL: slices cause aliasing UB)
- Type-native stride (R3) — no universal Stride type
- Consumer provides backing memory (arena, mmap, etc.)
- Library never calls allocator directly
- 64-byte alignment on column arrays (T3 §Q3 L2825-2860)
---
- Separate arena for resource Seq/Map allocations
'''
