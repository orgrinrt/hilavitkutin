# What the record says about `principles`, part 4.

[[tenet]]
id = "the_dispatch_determining_traits_are_sealed_with_a_private_supertrait_and_consumers_reach_them_only_through_derive_macros"
what = "The dispatch-determining traits are all sealed with a private supertrait, and a consumer reaches them only through derive macros, which force exactly one dispatch role per type. Without the seal a consumer could implement two roles on one type at once, leaving the builder input's dispatch ambiguous with an opaque coherence error."
mechanism = "`RunCfg`, `Resource`, `Column`, `Virtual`, `WorkUnit`, `Kit`, `MemoryProvider`, `ThreadPool`, `Clock` sealed via `mod sealed { pub trait Sealed {} }`; derive macros `#[derive(Resource)]` / `#[derive(RunCfg)]` emit `impl sealed::Sealed`; `BuilderInput::Dispatch` resolution; invariant S2."
source = "mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1073-1076, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1090-1090"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.plan-algorithm-chain::#s2-sealed-dispatch-determining-traits"]
quote = '''
`RunCfg`, `Resource`, `Column`, `Virtual`, `WorkUnit`, `Kit`, `MemoryProvider`, `ThreadPool`, `Clock` are ALL sealed via a private `Sealed` supertrait. Consumers cannot impl these traits for arbitrary types; the sealed pattern (canonical Rust idiom: a private `Sealed` super-trait defined in `mod sealed`) is required because:

1. Without sealing, a consumer could write `impl Resource for LoimuCfg` AND `impl RunCfg for LoimuCfg` simultaneously, producing an ambiguous `BuilderInput::Dispatch` resolution. The trait solver hits a coherence error with an opaque message.
2. `min_specialization` (rustc #31844) does NOT resolve overlap between two traits-applicable-to-the-same-type cases (only specialization of "more specific" over "less specific"). The pair-impl pattern relies on the type uniquely satisfying ONE dispatch-determining sub-trait at a time.
---
The substrate provides a derive macro `#[derive(Resource)]` / `#[derive(RunCfg)]` etc. that emits `impl sealed::Sealed for MyType {}` alongside the sub-trait impl. Consumers cannot impl Sealed by hand (it's `pub(crate)` in `notko`-shaped sealing) so they go through the macro, which forces them to pick exactly one dispatch role per type.
'''
origin = "proposed"
written_by = "design round 202605101036, topic 3 plan algorithm chain, soundness invariant S2, dated 2026-05-10, agent-written; the text does not say whose decision it is"
standing = "provisional"
subject = "principles"
keywords = ["sealed traits", "Sealed supertrait", "derive macro", "dispatch role", "coherence", "S2", "RunCfg", "BuilderInput::Dispatch"]

