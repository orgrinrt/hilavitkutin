what = "Coherence safety of the sealed dispatch traits comes from the proc-macro-only implementation path, where a consumer type can implement the seal only through derive macros and the macro rejects a double derive. Minimal specialization resolves overlap within one trait, and does not stop the projections of two distinct traits from being computed on the same type."
mechanism = "`#[derive(Resource)]` / `#[derive(RunCfg)]` rejecting double-derives; `min_specialization`; a `trybuild` fixture added to the Topic 11 test bar proving double-derive rejection; Topic 3 S2 text amended."
