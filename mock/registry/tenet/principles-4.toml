- [x] **(Audit-2 M5, 2026-05-10):** S2's attribution of pair-impl coherence safety to `min_specialization` is incorrect; the actual safety mechanism is the **proc-macro-only impl path** (consumer types can only impl `Sealed` via `#[derive(Resource)]` / `#[derive(RunCfg)]` / etc., and the proc-macro rejects double-derives). `min_specialization` is what resolves *within a single trait* when multiple blanket impls would otherwise overlap; it does NOT prevent two distinct traits' projections from being computed on the same type. Topic 3 S2 text amended (audit follow-up); a `trybuild` fixture is added to Topic 11 test bar that proves double-derive rejection.
