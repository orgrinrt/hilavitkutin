[[tenet]]
id = "a_morsel_is_reprocessed_only_when_its_generation_is_past_the_one_last_processed"
what = "Each morsel has a generation number, a monotonic counter that increments whenever any record in the morsel's range is modified; the column storage or a separate change-tracking layer bumps it when a write occurs. Each fiber, which the topic still calls a chain, records the generation it last processed for each of its input morsels. On the next frame an input morsel whose generation equals the last processed one is skipped, and the output from the previous frame is still valid; one whose generation is greater must be reprocessed. This is incremental execution: only what changed is processed again."
mechanism = "Frame cost drops from O(total records times ops) to O(changed records times ops)."
source = "mock/design_rounds/202604200055/202603121800_topic.dispatch-and-optimisation.md:907-927"
provenance = ["mock::design_rounds::202604200055::202603121800_topic.dispatch-and-optimisation::#change-detection-and-incremental-execution"]
quote = '''
**Mechanism: per-morsel generation counter.**

Each morsel has a generation number — a monotonic counter that
increments whenever any row in the morsel's range is modified. The
ColumnStorage (or a separate change-tracking layer) bumps the
generation when a write occurs.

Each chain records the generation it last processed for each of its
input morsels. On the next frame:
- If input morsel generation == last processed generation → skip.
  The output from the previous frame is still valid (in cache AND in
  the output columns).
- If input morsel generation > last processed generation → must
  reprocess. The data has changed.

This is **incremental execution** — only re-process what changed.
The cost of a frame drops from O(total_rows × ops) to O(changed_rows
× ops). For a dotfiles daemon watching for config changes, 99% of
morsels are unchanged between checks. For an ECS game, the fraction
depends on the system — physics changes every entity every frame,
but rendering data (mesh, material) is mostly static.
'''
origin = "proposed"
written_by = "topic T3 of the founding round (dispatch-and-optimisation), decision 57"
standing = "provisional"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
subject = "change"
keywords = ["generation counter", "monotonic", "last processed generation", "skip", "previous frame", "incremental execution", "change tracking"]
cites = ["change_detection_is_per_morsel_and_skips_what_is_unchanged"]

[[tenet]]
id = "the_temporal_extent_of_a_morsel_is_how_many_frames_its_cached_result_stays_valid"
what = "The morsel cube has three dimensions: the records the morsel covers, the columns it accesses, and a temporal one, which is how many frames the morsel's cached result remains valid. Change detection determines the temporal extent: an unchanged morsel is skipped and a changed one must be reprocessed. For a single exhaustive run every morsel is processed exactly once and the cube degenerates to a two-dimensional window. The temporal dimension turns the pipeline from a batch processor into an incremental one: the schedule and the morsel sizes stay the same, and only the morsels whose input generations have advanced are dispatched."
mechanism = "X (records), Y (columns), T (temporal). Unchanged morsels have T = infinity, changed morsels T = 0; for a single exhaustive run T = 1 for all morsels."
source = "mock/design_rounds/202604200055/202603121800_topic.dispatch-and-optimisation.md:942-966"
provenance = ["mock::design_rounds::202604200055::202603121800_topic.dispatch-and-optimisation::#change-detection-and-incremental-execution"]
quote = '''
**The temporal cube, concretely:**

The morsel cube has three dimensions:
- **X (rows):** spatial extent — which entities this morsel covers.
  Sized to fit write columns in L1.
- **Y (columns):** schema extent — which attributes this morsel
  accesses. Determined by chain partitioning.
- **T (temporal):** how many frames this morsel's cached result
  remains valid. Determined by change detection — unchanged morsels
  have T = ∞ (skip processing), changed morsels have T = 0 (must
  reprocess).

For a single exhaustive run, T = 1 for all morsels (every morsel
processed exactly once). The cube degenerates to a 2D window.

For a real-time loop, T varies per morsel:
- Stable morsels (unchanged data, affinitized core): T = many frames.
  Cache-warm, skip-eligible.
- Volatile morsels (frequently changing data): T = 1. Must reprocess
  every frame.

The temporal dimension transforms the pipeline from a batch processor
into an incremental processor. The same Schedule, the same chain
partitioning, the same morsel sizes — but the Executor only dispatches
morsels whose input generations have advanced.
'''
origin = "proposed"
written_by = "topic T3 of the founding round (dispatch-and-optimisation), the 3D cube model"
standing = "provisional"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
