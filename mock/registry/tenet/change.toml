[[tenet]]
id = "a_swap_of_a_resource_value_is_legal_only_between_frames_and_is_observed_from_the_next_run"
what = "The draft swap specification says that replacing a resource value installs the new value as the whole one-record blob and sets the store's dirty bit, without touching the plan-dirty state. The call is legal only between frames, so no swap can race a live-streamed read or a snapshot in flight. The swap is observable starting at the next run and at no earlier point, and of several swaps before a run only the last is ever observed."
mechanism = "`Scheduler::replace_value<V: Replaceable>(&mut self, new: V)`: a `ptr::write` of `V` through the same `Selector<V, Index>` witness the drain and the projection read use; no drop of the old value (`V: ColumnValue` is `Copy`); `mark_dirty` on `Resource<V>`, never `plan_dirty`; `&mut self` plus the parked-between-frames invariant."
source = "mock/research/pre_seed/202607193300_swap-semantics-panel/03-giesen-synthesis.md:23-23"
provenance = ["mock::research::pre_seed::202607193300_swap-semantics-panel::03-giesen-synthesis::#2-draft-specification"]
quote = '''
**S1 (replace_value mechanism).** `Scheduler::replace_value<V: Replaceable>(&mut self, new: V)` installs `new` as the whole one-record blob value: a `ptr::write` of `V` through the same `Selector<V, Index>` witness (the binding's backcast pointer) that the drain and the projection read use. No pointer derived by any other route. No drop of the old value (`V: ColumnValue` is `Copy`; the bytes are overwritten). The call additionally sets the store-dirty bit for `Resource<V>` via `mark_dirty`, and never touches `plan_dirty`. The call is legal only between frames: `&mut self` plus the parked-between-frames invariant (named as load-bearing, since worker raw pointers are outside the borrow checker's jurisdiction) means no swap can race a live-streamed read or an in-flight snapshot. The swap is observable starting at the next `run()` and at no earlier point; of multiple swaps before a `run()`, only the last is ever observed.
'''
origin = "proposed"
written_by = "the swap semantics panel, memo 3 (synthesis and draft specification, 2026-07-19), a dispatched expert persona drafting for the maintainer's ruling"
standing = "provisional"
subject = "change"
keywords = ["swap", "replace_value", "between frames", "next run", "last swap wins", "blob", "dirty bit", "parked between frames"]
related = ["tenet::the_swap_of_a_replaceable_resource_is_to_be_specified_by_a_commissioned_round"]

