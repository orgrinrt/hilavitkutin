[[tenet]]
id = "a_unit_whose_inputs_are_all_clean_skips_the_pass"
what = "At run time, before each pass, the generation counters on the root units' inputs are checked. What is unchanged since the last pass is clean, the mark propagates along every edge of the graph, and a unit whose whole predecessor set is clean skips execution entirely, so only what changed is re-run."
mechanism = "`dirty[j] |= dirty[i]` for every edge i→j, as a bitmask OR sequence, `predecessors[N] & dirty_mask`: one AND per unit."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1418-1431"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
**Step 9: Dirty propagation → incremental skip** (arvo-bitmask)

At runtime (not plan-time), before each pass: check generation
counters on root WU inputs. If unchanged since last pass, set
dirty bit to 0. Propagate through the DAG:
`dirty[j] |= dirty[i]` for every edge i→j. A WU whose entire
predecessor set is clean (all dirty bits 0) skips execution entirely.

The propagation is a bitmask OR sequence: `predecessors[N] & dirty_mask`.
One AND per WU. For 50 WUs: 50 AND operations on u64 values. The
entire dirty check is ~50 nanoseconds. This transforms the pipeline
from a batch processor (re-run everything) to an incremental
processor (re-run only what changed). Feeds domain 12 (change
detection per morsel).
'''
origin = "stated"
standing = "provisional"
subject = "change"
keywords = ["dirty", "propagation", "incremental skip", "generation counter", "root inputs", "since last pass", "clean"]
cites = ["change_detection_is_per_morsel_and_skips_what_is_unchanged"]

[[tenet]]
id = "version_stamps_tell_which_stores_a_unit_actually_modified"
what = "Each store has a version stamp. The versions are captured before a unit runs and compared after, which gives the stores the unit actually modified. A stamp increments only on completion."
mechanism = "Parallel arrays (SoA): separate contiguous `[u64; MAX_STORES]` for the before and the current stamps; the changed stores are a bitmask; 2 to 5 u64 per unit stamp view, packed in one cache line."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2139-2145"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#23-scheduler-builder-and-meta"]
quote = '''
**Version stamps (T5 §Q10, T6 §Q10):**

Parallel arrays (SoA): separate contiguous `[u64; MAX_STORES]` for
"before" and "current" stamps. Capture before-versions before WU runs,
compare after. Changed stores = bitmask of actually-modified columns.
Increment only on completion — no partial writes (domain 08). 2-5 u64
per unit stamp view, packed in one cache line.
'''
origin = "stated"
standing = "provisional"
subject = "change"
keywords = ["version stamp", "before", "current", "changed stores", "actually modified", "bitmask", "completion"]
