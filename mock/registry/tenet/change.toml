[[tenet]]
id = "change_detection_is_per_morsel_and_skips_what_is_unchanged"
what = "Change detection is per morsel: a write marks the morsel as changed and an unchanged morsel is skipped. It propagates through the graph, so an unchanged root skips all its transitive dependents, which turns the pipeline from a batch processor into an incremental one."
mechanism = "A per-morsel generation counter, bumped on write. Persistence to consumer storage goes through the evict and inject APIs."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:861-865"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#12-morsel-model"]
quote = '''
**Change detection (T3 decisions #57-58, R2 evict/inject):**
- Per-morsel generation counter — bump on write, skip if unchanged
- Propagates through DAG — unchanged root skips all transitive dependents
- Transforms pipeline from batch processor to incremental processor
- evict/inject APIs (R2) handle persistence to consumer storage
'''
