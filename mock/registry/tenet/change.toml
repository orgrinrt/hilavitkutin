[[tenet]]
id = "replacing_a_plan_affecting_resource_does_the_replace_value_write_and_sets_the_plan_dirty_bit_the_next_run_consumes"
what = "Replacing a plan-affecting resource performs the identical write and store-dirty mark as replacing a value, and additionally sets the plan-dirty bit for the type's plan-affecting identity in the scheduler's plan-dirty bit array. The very next run consumes that array: the band gate is the first frame or any plan-dirty bit, a plan-dirty frame enters the leading plan band at phase 0, and the consumed bits clear."
mechanism = "`Scheduler::replace_resource<T: PlanAffecting>(&mut self, new: T)`; the S1 write and store-dirty mark; `plan_dirty` bit for `T`'s `PlanAffectingId`; band gate `first_frame OR any plan_dirty bit`; leading plan band at phase 0."
source = "mock/research/202607200200_replaceable-swap-semantics-spec.md:22-22, mock/research/202607200200_replaceable-swap-semantics-spec.md:40-47"
provenance = ["mock::research::202607200200_replaceable-swap-semantics-spec::#s1-replace-value-mechanism"]
quote = '''
## S1: replace_value mechanism
---
## S2: replace_resource mechanism

`Scheduler::replace_resource<T: PlanAffecting>(&mut self, new: T)` performs
the identical S1 write and store-dirty mark, and additionally sets the
`plan_dirty` bit for `T`'s `PlanAffectingId` in the scheduler's plan-dirty
bit array. The very next `run()` consumes that array: the band gate is
`first_frame OR any plan_dirty bit`, a plan-dirty frame enters the leading
plan band at phase 0, and the consumed bits clear.
'''
