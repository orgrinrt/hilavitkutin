[[tenet]]
id = "a_unit_declares_whether_it_is_commutative"
what = "A work unit declares whether it is commutative, and a fiber is commutative only when all of its units are. A commutative fiber is eligible for front-back processing, multi-core morsel dispatch and deterministic segment assignment; a non-commutative one is processed in a single direction only."
mechanism = "`COMMUTATIVE: bool` on the WorkUnit."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:597-602"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#08-determinism-and-ordering"]
quote = '''
**Commutativity (T3 §tiling model L440-510):**
- WorkUnit declares `COMMUTATIVE: bool` (T3 decision #45)
- Commutative fiber = ALL constituent WUs commutative (T3 decision #46)
- Commutative → eligible for front-back processing, multi-core morsel
  dispatch, deterministic segment assignment
- Non-commutative → single-direction processing only
'''
origin = "stated"
standing = "provisional"
subject = "ordering"
keywords = ["commutative", "commutativity", "front-back", "segment", "single direction"]

[[tenet]]
id = "ordering_is_guaranteed_by_construction"
what = "Ordering is guaranteed by construction: a non-commutative fiber runs on a single core and is trivially ordered, a commutative one runs in deterministic segments that are always in record order, and no lineariser or other ordering mechanism is needed."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:604-607"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#08-determinism-and-ordering"]
quote = '''
**Ordering guaranteed by construction (T3 §Q6):**
- Non-commutative: single-core = trivially ordered (T3 decision #99)
- Commutative: deterministic segments = always in record order (T3 decision #100)
- No lineariser needed (unlike Polars). No ordering mechanism needed.
'''
origin = "stated"
standing = "provisional"
subject = "ordering"
keywords = ["determinism", "lineariser", "record order", "deterministic segments", "single-core"]
