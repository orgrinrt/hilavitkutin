[[tenet]]
id = "gate_one_takes_registration_as_canonical_with_a_build_time_check_that_it_is_the_plan_s_rcm_reordered_topological_order_and_the_reordering_automation_is_deferred"
subject = "ordering"
what = "The compile-time unit sequence is walked in registration order, devirtualised, and the engine requires and validates that registration order is the plan's RCM-reordered topological order, so RCM is the dispatch order and not the arena layout only. The automation of the within-equal-depth reordering, where the engine would reorder the sequence itself, is the codegen flattener's and is deferred until the generic-const-expression soundness migration."
because = "The compile-time sequence is built in registration order and fixed before any plan runs, while the plan's RCM row order is computed at runtime, so the only ways to make the walk order equal the RCM order are the codegen flattener, which needs the plan algorithms const-evaluable, or registration-is-canonical with validation."
mechanism = "`RunFiberCol` walk; `group_fibers` (step 8) consumes the RCM row order (currently computed and left unused) to define the canonical fiber and unit sequence; a unit registered before its dependency is a build-time `BuildError`; the flattener (spec domain 17) is gated behind the GCE soundness migration (#628); the Approach-E sketch measured the RCM effect among equal-depth units at a reproducible ~2%."
source = "mock/research/sketches/202606060730_runfibercol-accumulator-inline/FINDINGS.md:62-80, mock/research/sketches/202606060730_runfibercol-accumulator-inline/FINDINGS.md:82-96"
provenance = ["mock::research::sketches::202606060730_runfibercol-accumulator-inline::FINDINGS::#the-plan-order-to-compile-time-order-bridge-design-resolution"]
quote = '''
The cons-list (`Scheduler::wu_values`) is built at compile time in registration
order; its type and element order are fixed before any plan runs. The plan's RCM
row order is computed at runtime by `build_plan`. There are exactly two ways to
make the compile-time cons-list walk order equal the RCM-reordered topological
order:

1. The codegen flattener (spec domain 17): const-evaluate the plan and emit the
   cons-list in RCM order. This is the spec's eventual ideal. It requires the
   plan algorithms to be const-evaluable, which is `generic_const_exprs` /
   `generic_const_args` territory, gated behind the GCE soundness migration
   (#628). Not available for GATE 1.

2. Registration-is-canonical with build-time validation (GATE 1): the cons-list
   walks in registration order, devirtualized (`RunFiberCol`), and the engine
   requires/validates that registration order is the plan's RCM-reordered
   topological order. `group_fibers` (step 8) consumes the RCM row order
   (currently computed and left unused) to define the canonical fiber/unit
   sequence; a unit registered before its dependency is a build-time
   `BuildError` (the topo-validity check the doc CL claim 2 already names).
---
GATE 1 takes (2). This honors the canonical spec: RCM IS the dispatch order (the
plan computes it, `group_fibers` consumes it, the walk realizes it, the order is
validated against the plan), NOT arena-layout-only. The only deferred piece is
the AUTOMATION of the within-equal-depth reordering: who physically reorders the
cons-list when registration order and the plan's RCM order differ among
independent equal-depth units. At GATE 1 the consumer registers in the order
(forced for a linear chain, where exactly one topological order exists; a degree
of freedom only for fan-out, where the Approach-E sketch measured the RCM effect
at a reproducible ~2%), and the engine validates topo-validity. The engine
reordering the cons-list ITSELF is the codegen flattener, bounded precisely to
the GCE gate (#628). This is distinct from the corrected drift ("RCM is
arena-only; dispatch runs plain topological, RCM untouched"): here RCM is
consumed by dispatch and defines the required order; what is deferred is the
reordering automation, not whether RCM touches dispatch. See the workspace rule
`canonical-design-outranks-intermediate-rounds.md`.
'''
origin = "proposed"
written_by = "sketch findings runfibercol-accumulator-inline (Phase D, task 340), outcome WORKS on nightly-2026-05-28, undated; agent-written"
standing = "held"
keywords = ["registration order", "RCM order", "build-time validation", "RunFiberCol", "group_fibers", "codegen flattener", "GATE 1", "equal-depth reordering"]
related = ["tenet::the_builder_appends_each_registered_unit_so_the_carrier_type_order_equals_registration_order_and_build_requires_a_topological_registration", "tenet::rcm_always_runs_and_reorders_the_units_so_column_sharing_units_are_adjacent_for_fiber_grouping"]

[[tenet]]
id = "dispatch_runs_in_the_plan_s_rcm_reordered_topological_order_because_the_rcm_row_order_is_the_unit_execution_order"
subject = "ordering"
what = "Dispatch runs in the plan's RCM-reordered topological order: RCM's row reordering is the unit execution order, and fiber grouping processes the units in that order. The order stays topological, and among units at the same topological depth RCM picks the order that maximises column reuse between adjacent units. A unit whose dependencies admit no topological order is a build-time error."
because = "The canonical consolidation spec states that RCM's row reordering is the unit execution order, fed to fiber grouping. The intermediate rounds and a current-code comment drifted from the spec, and the canonical design is authoritative."
mechanism = "Spec Step 5 (\"RCM reordering -> fiber grouping order + arena layout\") and Step 8 (\"Process WUs in RCM-reordered topo order\"); `group_fibers` (step 8); the walk runs the fiber's unit sequence as a compile-time-known cons-list, which is what devirtualizes; `BuildError`."
source = "mock/design_rounds/202606051659/202606051659_changelist.doc.lock.md:29-29, mock/design_rounds/202606051659/202606051659_changelist.doc.lock.md:53-53"
provenance = ["mock::design_rounds::202606051659::202606051659_changelist.doc.lock::#changes-proposed-the-corrected-shape"]
quote = '''
2. **Dispatch in the plan's RCM-reordered topological order.** Per the canonical design (consolidation spec Step 5 "RCM reordering -> fiber grouping order + arena layout" and Step 8 "Process WUs in RCM-reordered topo order"), RCM's row reordering is the WU execution order. `group_fibers` (step 8) processes units in that order, so each fiber's unit sequence is in RCM-reordered topological order, and the walk runs that sequence. The order stays topological (every unit after its dependencies), but among units at the same topological depth that a naive topo sort would order arbitrarily, RCM picks the order maximising column reuse between adjacent units. The walk runs the fiber's unit sequence as a compile-time-known cons-list, which is what devirtualizes; a unit whose dependencies admit no topological order is a build-time `BuildError`. (This corrects an earlier framing in this round that had dispatch run in plain registration order with RCM unused. That framing came from intermediate design rounds and a current-code punt comment, both of which strayed from the canonical spec; see the Basis.)
---
- Architect read 2 evaluated the order handling and, reasoning from a current-code punt comment (`rcm_order` "is arena layout, not the dispatch order") and the intermediate RCM-wiring and phase-sequential rounds, concluded dispatch should run in plain registration/topological order with RCM unused single-core. That conclusion strayed: the canonical consolidation spec (Step 5 / Step 8) states RCM's row reordering IS the WU execution order, fed to fiber grouping. The intermediate rounds and the current-code comment drifted from the spec; the canonical design is authoritative. Claims 2 and 3 are stated on the canonical position. See the workspace rule `canonical-design-outranks-intermediate-rounds.md`.
'''
origin = "proposed"
written_by = "doc changelist 202606051659 of 2026-06-05 (phase DOC, single-core dispatch codegen), locked; agent-written round artifact that does not name the maintainer as its author"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: op ruled that a bench decides the dispatch order (mock/research/202606111400_canonical-design-addendum-a1.md:49-57), and the bench of 2026-07-20 reports the RCM order this row states (mock/research/202607200800_a1-1-ordering-theory-bench-expansion.md:82-90); no word of his read takes that result as the answer, so the row stands on a stamp under his words "The rest can be on provisional stamps to begin with" (`mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5`), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
keywords = ["RCM", "dispatch order", "topological order", "execution order", "group_fibers", "registration order", "canonical design", "BuildError"]
rejects = ["dispatch should run in plain registration/topological order with RCM unused single-core", "dispatch run in plain registration order with RCM unused"]
