[[tenet]]
id = "a_writer_precedes_every_reader_of_what_it_writes"
subject = "ordering"
what = "A unit that writes a store precedes every unit that reads that store."
mechanism = "For every pair (i, j), `(write_masks[i] & read_masks[j]) != 0` means unit i must precede unit j: one AND and one compare per pair, giving a bit-matrix DAG."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1273-1276"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
DAG edges: for every pair (i, j), `(write_masks[i] & read_masks[j])
!= 0` → WU i must precede WU j. This is a single AND + compare per
pair. O(N²) on u64 values. For 50 WUs: 2500 ANDs, ~1µs. The result
is a bit-matrix DAG: `dag[i] |= 1 << j` where i precedes j.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1273-1276"]
keywords = ["read after write", "precede", "access matrix", "write mask", "read mask", "edge"]

