id = "the_kit_crate_declares_a_recursion_limit_of_512_defensively_and_a_consumer_hitting_it_declares_its_own"
subject = "kits"
what = "The kit crate declares a recursion limit of 512 defensively. A consumer composing deep kit chains sends the trait solver through the cons-list at each add-kit call and again at build, the default of 128 suffices for shallow chains and 512 covers realistic compositions without consumer-side awareness. A consumer whose own crate hits the limit anyway declares its own limit at its crate root, and the kit trait's diagnostic message references that fallback so consumers land on the directive without reading the api docs first."
mechanism = "`#![recursion_limit = \"512\"]`; Concat recursion at `.add_kit`, ContainsAll recursion plus WorkUnitBundle accumulator recursion at `.build()`; the api crate documents a consumer-side `#![recursion_limit = \"1024\"]`; S1b depth-5 sketch (`mock/research/sketches/202605050700_deep_stacking_d5/`): 25 WUs at 5 tiers compile in 0.53s without exceeding 512."
source = "mock/crates/hilavitkutin-kit/DESIGN.md.tmpl:227-247"
provenance = ["mock::crates::hilavitkutin-kit::DESIGN::#crate-internal-recursion-limit"]
quote = '''
## Crate-internal recursion limit

This crate declares `#![recursion_limit = "512"]` defensively. A
consumer composing deep Kit chains sends the trait solver through
the cons-list at each `.add_kit` call (Concat recursion) and again
at `.build()` (ContainsAll recursion plus WorkUnitBundle accumulator
recursion). The default 128 suffices for shallow chains; 512
covers realistic compositions without consumer-side awareness. If
a consumer's own crate hits the limit anyway, the consumer
declares its own `#![recursion_limit = "..."]` at the consumer
crate root.

S1b's depth-5 sketch (`mock/research/sketches/202605050700_deep_stacking_d5/`)
confirms 25 WUs at 5 tiers compile in 0.53s without exceeding the
512 limit.

The api crate's `### Recursion limit` subsection documents the
consumer-side `#![recursion_limit = "1024"]` directive. The Kit
trait diagnostic message references that fallback when applicable;
consumers building deep Kit chains land on the directive via the
diagnostic without reading the api docs first.
'''
