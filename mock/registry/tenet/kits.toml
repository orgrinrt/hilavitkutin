[[tenet]]
id = "a_kit_may_own_no_state_or_no_units_and_a_kit_only_declares_that_a_store_exists_while_the_value_is_supplied_at_the_app_call_site"
subject = "kits"
what = "A kit may bundle units and own no state, and an empty owned list is fine because the empty cons-list satisfies the store bundle trivially. A kit may also ship only owned state with no units, as a pure provider preset. In that case the kit declares the type-level commitment that the store exists, and the actual value is supplied at the app's call site, since the api has no way for a kit to give default resources."
mechanism = "`TracingKit`: `type Units = read![TracerFiber, SampleCollector]; type Owned = read![];`. `InternerKit<const BYTES: usize, const ENTRIES: usize>`: `type Units = read![]; type Owned = read![Resource<StringInterner<MemoryArena<BYTES, ENTRIES>>>];`, value supplied by `builder.add_resource(default_interner::<...>())`; there is no `Kit::default_resources()` association (BACKLOG entry). The `read!` macro from `hilavitkutin-api` expands the flat list into `Cons<H, T>`."
source = "mock/crates/hilavitkutin-kit/DESIGN.md.tmpl:59-111"
provenance = ["mock::crates::hilavitkutin-kit::DESIGN::#authoring-a-kit"]
quote = '''
A consumer-side Kit that owns a `RunnerKit` shape with one WU plus
two output columns:

```rust
pub struct RunnerKit;

impl Kit for RunnerKit {
 type Units = read![RunnerWu];
 type Owned = read![Column<RunnerOutput>, Column<RunnerStats>];
}
```

The `read!` macro from `hilavitkutin-api` expands the flat list
into the `Cons<H, T>` cons-list shape `WorkUnitBundle` and
`StoreBundle` recursive impls consume.

A Kit that bundles WUs but no Owned state (for example a "tracing
fiber" preset that reads several columns and writes to a Resource
the app provides):

```rust
pub struct TracingKit;

impl Kit for TracingKit {
 type Units = read![TracerFiber, SampleCollector];
 type Owned = read![];
}
```

Empty `Owned` is fine; the empty cons-list satisfies `StoreBundle`
trivially. The Kit's WUs read from external Resources (Tracer,
Diagnostic, etc.) which the app registers separately or via other
Kits' `Owned` declarations.

A Kit that ships only Owned state with no WUs of its own (a pure
provider-preset, like `InternerKit` from `hilavitkutin-providers`):

```rust
pub struct InternerKit<const BYTES: usize, const ENTRIES: usize>;

impl<const BYTES: usize, const ENTRIES: usize> Kit
 for InternerKit<BYTES, ENTRIES>
{
 type Units = read![];
 type Owned = read![Resource<StringInterner<MemoryArena<BYTES, ENTRIES>>>];
}
```

The kit declares the type-level commitment that the StringInterner
Resource exists in `Stores`. The actual value is supplied at the
app's call site via `builder.add_resource(default_interner::<...>())`,
since the api has no `Kit::default_resources()` association
(see BACKLOG entry).
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-kit, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `86aa80598714`'
keywords = ["empty Owned", "pure provider preset", "InternerKit", "TracingKit", "RunnerKit", "read!", "default_resources", "add_resource", "call site"]
related = ["tenet::the_providers_crate_v0_ships_the_interner_value_type_surface_and_a_declarative_interner_kit"]

[[tenet]]
id = "every_type_in_a_public_kit_impl_s_owned_position_must_be_as_visible_as_the_impl_so_a_kit_is_either_wholly_public_or_wholly_crate_private"
subject = "kits"
what = "Every type in the owned position of a public kit implementation must be at least as visible as the implementation itself, because the language forbids private types in the associated-type positions of a public trait. Two kit shapes work: a whole-kit public shape, where kit-internal is only a documentation convention that the framework cannot enforce, and a whole-kit crate-private shape inside a per-kit crate, where the crate offers a public helper function that takes a builder and returns one without naming the kit, which is the genuine kit-private mode. A single kit implementation cannot mix the levels, the fourth-round kits ship in the first shape, and the second is an optional choice when kit-private state is genuinely needed at the crate boundary."
mechanism = "Rust E0446 (\"private type in public interface\") forbids `pub(crate)` or module-private types in pub-trait associated-type positions. Pattern 1: whole-kit `pub` (the Kit struct, every Owned type, every WorkUnit type); pattern 2: whole-kit `pub(crate)` within a per-kit crate with a `pub` helper fn. Evidence: round-4 S5 sketch, `mock/research/sketches/202605050615_kit_taxonomy/FINDINGS.md`."
source = "mock/crates/hilavitkutin-kit/DESIGN.md.tmpl:113-143"
provenance = ["mock::crates::hilavitkutin-kit::DESIGN::#kit-internal-types-and-visibility"]
quote = '''
### Kit-internal types and visibility

Kit authors face one structural constraint surfaced by the round-4
S5 sketch: every type appearing in a `pub Kit` impl's `type Owned`
position must be at least as visible as the impl itself. Rust's
E0446 ("private type in public interface") forbids `pub(crate)`
or module-private types in pub-trait associated-type positions.
The two workable kit-shape patterns:

1. **Whole-kit pub**: the Kit struct, every Owned type, every
 WorkUnit type are all `pub`. "Kit-internal" is a documentation
 convention applied by the kit author (typically by keeping
 non-Replaceable types out of the kit's public re-export
 surface). The kit framework cannot enforce kit-internalness;
 convention is the only signal.
2. **Whole-kit pub(crate) within a per-kit crate**: the kit ships
 in its own crate; Kit struct and Owned types are all
 `pub(crate)`. Consumers outside the kit's crate cannot name the
 kit directly; the kit's crate provides a `pub` helper-fn that
 consumes a builder and returns one without naming the kit. This
 is the genuine kit-private mode.

A single Kit impl cannot mix levels. Round-4 kits ship using
pattern (1); switching to pattern (2) is an optional kit-author
choice when kit-private state is genuinely required at the crate
boundary.

See `mock/research/sketches/202605050615_kit_taxonomy/FINDINGS.md`
for the empirical evidence behind this constraint and
the design notes
for the corresponding framing.
'''
because = "Rust's E0446 forbids private types in the associated-type positions of a public trait."
origin = "proposed"
written_by = "the design template of hilavitkutin-kit, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `86aa80598714`'
