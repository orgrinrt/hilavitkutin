subject = "kits"
what = "Replaceable is the only enforced annotation on owned types, and kit authors opt in per type. An override of a kit-owned resource by the app is rejected at compile time unless the type opted in, which makes the polarity safer by default and follows the workspace rule of tools and not policies."
mechanism = "`Replaceable` marker in `hilavitkutin-api`; the static bound `T: Replaceable` on `Scheduler::replace_value::<T>(value)` in the engine crate; `impl Replaceable for LintConfig {}` allows override, `RoundState` without the impl is locked. Polarity decision in sketch S4, `mock/research/sketches/202605050555_replaceable_polarity/`."
source = "mock/crates/hilavitkutin-kit/DESIGN.md.tmpl:190-211"
provenance = ["mock::crates::hilavitkutin-kit::DESIGN::#replaceable-enforced-override-gating"]
quote = '''
## Replaceable: enforced override gating

`Replaceable` is the only enforced annotation on Owned types.
The marker lives in `hilavitkutin-api`; kit authors opt in
per type:

```rust
pub struct LintConfig;
impl Replaceable for LintConfig {} // app may override via.replace_value

pub struct RoundState;
// no impl Replaceable: locked, cannot be overridden
```

The static `T: Replaceable` bound on
`Scheduler::replace_value::<T>(value)` (declared in the engine
crate) rejects override attempts on non-opt-in types at compile
time. See `hilavitkutin-api::Replaceable` and
`hilavitkutin::Scheduler::replace_value` for the trait
documentation; see S4 (`mock/research/sketches/202605050555_replaceable_polarity/`)
for the polarity decision (opt-in is safer-by-default per the
"tools, not policies" workspace rule).
'''
