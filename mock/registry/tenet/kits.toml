[[tenet]]
id = "kit_author_crates_import_no_engine_item_and_depend_only_on_the_api_markers_and_the_kit_trait"
subject = "kits"
what = "A kit declaration depends only on the api crate, for the bundle traits, the replaceable marker and the three store markers, and on the kit crate itself for the kit trait. Kit-author crates do not import the engine directly, and the forbidden-imports rule continues to apply and is trivially satisfied. The earlier bridge layer, which let a kit's install method call the builder against any builder type, is gone, because the new shape has no install method and never names a builder."
mechanism = "Depends on `hilavitkutin-api` (`WorkUnitBundle`, `StoreBundle`, `Replaceable`, `Resource<T>` / `Column<T>` / `Virtual<T>`) and `hilavitkutin-kit` (`Kit`); the v0.1 `BuilderResource` bridge layer is removed."
