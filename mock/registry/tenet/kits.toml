what = "Kits compose by being added in sequence on the scheduler builder. Each add-kit call accumulates the kit's units into the bundle and its owned stores into the stores by type-level concatenation. A kit whose units read another kit's owned state is fine, but that state must be among the accumulated stores by the time the build resolves the bound, so adding kits in dependency order is the simplest discipline, and the builder accepts any order that satisfies the proof."
mechanism = "`Scheduler::builder().resource::<...>(default_interner()).add_kit::<RunnerKit>().add_kit::<LinterKit>().add_kit::<TracingKit>().build()`; `ContainsAll<Wus::AccumRead>` proof at `.build()`; type-level `Concat`."
source = "mock/crates/hilavitkutin-kit/DESIGN.md.tmpl:160-180"
provenance = ["mock::crates::hilavitkutin-kit::DESIGN::#composition"]
quote = '''
## Composition

Kits compose by being added in sequence on the SchedulerBuilder:

```rust
let scheduler = Scheduler::builder()
.resource::<StringInterner<...>>(default_interner())
.add_kit::<RunnerKit>()
.add_kit::<LinterKit>()
.add_kit::<TracingKit>()
.build();
```

Each `.add_kit::<K>()` accumulates `K::Units` into the bundle and
`K::Owned` into the stores via type-level `Concat`. Order matters
for the `ContainsAll<Wus::AccumRead>` proof at `.build()`: a Kit
whose WUs read from another Kit's Owned state is fine, but the
Owned state must be in the accumulated `Stores` by the time
`.build()` resolves the bound. Adding kits in dependency order is
the simplest discipline; the builder accepts any order that
satisfies the proof.
'''
