[[tenet]]
id = "weights_in_the_arvo_crates_and_data_facing_structs_use_arvo_fixed_point_newtypes_and_not_raw_integers"
subject = "principles"
what = "Weights and costs in the graph, sparse and combinatorial crates use arvo fixed-point newtypes rather than raw integers, which gives validation and semantic clarity at no machine-code cost. The lint that requires arvo types applies to all arvo crates and rejects non-arvo numerics in data-facing structs."
mechanism = "The arvo-types-only lint; after compilation the newtypes translate to the same machine instructions as raw integers (u32/usize)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:166-170, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:261-262"
