[[tenet]]
id = "expanded_lto_is_required_because_monomorphised_tuple_dispatch_does_not_devirtualise_without_it"
subject = "principles"
what = "Fat link-time optimisation with a single codegen unit is required for the compiler to devirtualise monomorphised tuple dispatch. Without it, arrays of function pointers held in struct fields do not devirtualise and the dispatch is far slower."
mechanism = "The `ExpandedLto` pragma (fat LTO + codegen-units=1); without it struct-field fn arrays do not devirtualise (12.6x slower)."
because = "Without it, struct-field fn arrays do not devirtualise (12.6x slower)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:364-367"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#03-build-time-optimisation"]
quote = '''
**Critical for hilavitkutin execution model (T6):**
- ExpandedLto pragma (fat LTO + codegen-units=1) is REQUIRED for
  LLVM to devirtualise monomorphised tuple dispatch. Without it,
  struct-field fn arrays don't devirtualise (12.6x slower).
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:364-367"]
keywords = ["ExpandedLto", "fat LTO", "codegen-units=1", "devirtualise", "monomorphised dispatch", "12.6x"]

[[tenet]]
id = "hilavitkutin_does_not_use_the_alloc_crate_and_dynamic_storage_goes_through_slab_columns_or_stack_arrays"
subject = "principles"
what = "The alloc crate is technically available in no_std mode, but hilavitkutin does not use it: there are no heap vectors, boxes or strings. All dynamic storage goes through slab columns, which use mmap on the os tier, std alloc on the std tier and consumer-provided memory on the no_os tier, and fixed-size structures use stack arrays, arrayvec or a slab column. Consumers may use alloc in their own code."
mechanism = "SlabColumn (mmap on os, std::alloc on std, consumer-provided on no_os); stack arrays; arrayvec."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:284-286, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:308-310"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#02-platform-tiers"]
quote = '''
- `alloc` crate is technically available in no_std mode but hilavitkutin
  does NOT use it. No Vec, Box, String. All dynamic storage via SlabColumn
  or stack arrays. Consumers may use alloc in their own code.
---
**No alloc crate.** All dynamic storage through SlabColumn (mmap on os,
std::alloc on std, consumer-provided on no_os). Fixed-size structures
use stack arrays, arrayvec, or SlabColumn.
'''
