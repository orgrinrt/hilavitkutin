[[tenet]]
id = "the_design_is_the_simd_contract_and_llvm_auto_vectorises_when_the_eight_killers_are_absent"
subject = "principles"
what = "The design itself is the SIMD contract: of eight vectorisation killers, six are eliminated by design, loop-carried dependencies are partly eliminated by separate read and write declarations, and complex control flow is the op author's domain and not the framework's. No explicit SIMD intrinsics are needed in the common case, because LLVM auto-vectorises when the killers are absent."
mechanism = "Opaque calls: eliminated by no-dyn monomorphisation. Heap allocation: eliminated by no-alloc and the at-most-16-byte constraint. Non-contiguous access: eliminated by columnar storage. Loop-carried dependencies: partially, by separate Read/Write declarations. Complex control flow: op author's domain. Interior mutability: eliminated by the Copy bound. Non-Copy types: eliminated by the Copy bound. Misaligned data: eliminated by 64-byte alignment."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2257-2271"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#cross-cutting-constraints"]
quote = '''
**Auto-vectorisation contract (T3 L2500-3596, ~1100-line analysis):**

8-point vectorisation killer checklist. 6 of 8 eliminated by design:
- Opaque calls → eliminated by no-dyn monomorphisation
- Heap allocation → eliminated by no-alloc, ≤16-byte constraint
- Non-contiguous access → eliminated by columnar storage
- Loop-carried deps → partially by separate Read/Write declarations
- Complex control flow → op author's domain (not framework's)
- Interior mutability → eliminated by Copy bound
- Non-Copy types → eliminated by Copy bound
- Misaligned data → eliminated by 64-byte alignment

The design IS the SIMD contract. No explicit SIMD intrinsics needed
in the common case; LLVM auto-vectorises when these 8 killers are
absent. (T3 §Q3, cross-cuts domains 04, 05, 09, 13, 14, 17)
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2257-2271"]
