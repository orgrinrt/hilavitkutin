[[tenet]]
id = "static_composition_means_every_unit_is_registered_through_the_builder_and_no_schedule_is_dynamic"
subject = "principles"
what = "Pipeline composition is static: every unit is registered through the builder at compile time, and everything the builder defines is statically analysable and computable. The unit set, the graph structure, the fiber, trunk and phase topology and the monomorphised dispatch functions are all fixed at build time, with no runtime unit registration and no dynamic schedules."
because = "It is what enables LLVM devirtualisation, since the schedule is statically analysable."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2110-2114, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2435-2440"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#23-scheduler-builder-and-meta"]
quote = '''
**Static schedule (resolved):**

Everything via the builder is statically defined. The schedule is
statically analysable and computable. No runtime WU registration, no
dynamic schedules. The plan stage adjusts only what compile time
---
**R6. Static composition, adaptive parameters.** (domain 23)
Pipeline composition is static: all WUs registered via the builder at
compile time. The WU set, DAG structure, fiber/trunk/phase topology,
and monomorphised dispatch functions are all fixed at build time. This
is what enables LLVM devirtualisation — the schedule is statically
analysable. No runtime WU registration, no dynamic schedules.
'''
origin = "stated"
standing = "ratified"
