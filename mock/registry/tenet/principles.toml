[[tenet]]
id = "the_eight_enforcement_lints_reject_raw_primitives_dyn_type_id_unwrap_toml_value_ui_below_the_cli_and_sdk_exports_beyond_traits"
subject = "principles"
what = "Eight enforcement lints exist: one rejects raw primitives in struct fields and public functions, one rejects dynamic dispatch anywhere, one rejects type identity and the any facility, one requires arvo types in data-facing struct fields, one rejects unwrap calls outside tests, one rejects the TOML value type outside polka-data, one rejects a UI reference outside polka-cli, and one limits SDK crates to exporting traits, C-layout types and proc macros."
mechanism = "no-raw-primitives: reject f32/f64/i8..u128 in struct fields and pub fn. no-dyn: reject dyn Trait anywhere. no-std-any: reject TypeId/Any. arvo-types-only: require arvo types in data-facing struct fields. no-unwrap: reject .unwrap() outside tests. no-toml-value: reject toml::Value outside polka-data. no-ui-below-cli: reject &Ui outside polka-cli. sdk-traits-only: SDK crates export only traits, repr(C), proc macros."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2240-2248"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#cross-cutting-constraints"]
quote = '''
**Enforcement lints (T4 L2358-2428 §Q8, 8 lints):**
- no-raw-primitives: reject f32/f64/i8..u128 in struct fields and pub fn
- no-dyn: reject dyn Trait anywhere
- no-std-any: reject TypeId/Any
- arvo-types-only: require arvo types in data-facing struct fields
- no-unwrap: reject .unwrap() outside tests
- no-toml-value: reject toml::Value outside polka-data
- no-ui-below-cli: reject &Ui outside polka-cli
- sdk-traits-only: SDK crates export only traits, repr(C), proc macros
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
