what = "One non-negotiable assumption governs the linking crate: any library can be loaded at any point in the host's execution, invoked immediately and dropped at any time, independent of other libraries. The ABI, the trait contracts and the typed symbol handle semantics all enforce this by construction. There is no global registry, no init ordering is assumed, and lifecycle is strictly per library and never ecosystem-wide."
