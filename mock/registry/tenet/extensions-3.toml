[[tenet]]
id = "any_library_can_be_loaded_invoked_and_dropped_at_any_time_independent_of_other_libraries_and_the_loader_enforces_it_by_construction"
subject = "extensions"
what = "One non-negotiable assumption governs the linking crate: any library can be loaded at any point in the host's execution, invoked immediately and dropped at any time, independent of other libraries. The ABI, the trait contracts and the typed symbol handle semantics all enforce this by construction. There is no global registry, no init ordering is assumed, and lifecycle is strictly per library and never ecosystem-wide."
mechanism = "No static 'currently loaded libraries' collection; every handle is explicit; the lifetime parameter on the typed symbol handle ties it to its loader, so dropping the loader invalidates outstanding symbols at compile time. Example of correct use: load library A at time T, invoke it at T+1, drop it at T+2, load library B at T+3."
source = "mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:85-89"
provenance = ["mock::crates::hilavitkutin-linking::DESIGN::#arbitrary-time-linking-invariant"]
quote = '''
## Arbitrary-time linking invariant

One non-negotiable assumption governs everything in this crate: any library can be loaded at any point in the host's execution, invoked immediately, and dropped at any time, independent of other libraries. The ABI, trait contracts, and typed symbol handle semantics all enforce this by construction.

No global registry exists. The host never reads a static "currently loaded libraries" collection; every handle is explicit. No init ordering is assumed. Libraries do not depend on other libraries being loaded first, and each loader handle is self-contained. The lifetime parameter on the typed symbol handle ties it to its loader, so dropping the loader at any time invalidates outstanding symbols at compile time. Lifecycle is strictly per-library, never ecosystem-wide: a consumer may load library A at time T, invoke it at T+1, drop it at T+2, load library B at T+3, and that is correct use.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-linking, agent-written, undated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `86aa80598714`'
keywords = ["arbitrary-time linking", "non-negotiable", "no global registry", "no init ordering", "per-library lifecycle", "by construction", "typed symbol lifetime"]
related = ["tenet::the_extensions_crate_preserves_the_arbitrary_time_linking_invariant_by_construction_through_four_api_level_absences"]

[[tenet]]
id = "host_code_must_tolerate_arbitrary_time_linking_and_every_layer_of_the_stack_preserves_the_invariant_or_documents_its_loss"
subject = "extensions"
what = "The consumer-side obligation is that host code built on the linking crate tolerates arbitrary-time linking. Assumptions that all libraries are loaded before any is invoked, that init ordering gates invocation or that the full ecosystem must be known before proceeding are forbidden at the framework level, and a consumer that needs ecosystem-wide semantics builds them in its own higher layer. The invariant propagates into the extensions crate and into any downstream consumer contract crate, and every layer in the stack preserves it or explicitly documents the loss."
source = "mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:91-93"
provenance = ["mock::crates::hilavitkutin-linking::DESIGN::#arbitrary-time-linking-invariant"]
quote = '''
The consumer-side obligation is that host code built on top of this crate tolerates arbitrary-time linking. Assumptions like "all libraries loaded before any invoked", "init ordering gates invocation", or "the full ecosystem must be known before proceeding" are forbidden at the framework level. Any consumer that needs ecosystem-wide semantics builds them in its own higher layer.

This invariant propagates forward into the upper host layer (`hilavitkutin-extensions`) and into any downstream consumer contract crate (`viola-plugin-abi`, and so on). Every layer in the stack preserves the invariant or explicitly documents the loss.
