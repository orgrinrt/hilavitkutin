[[tenet]]
id = "the_strategy_is_selected_at_plan_time_from_estimated_compute_weights_and_a_wrong_pick_costs_about_ten_to_twenty_percent"
what = "At plan time the scheduler knows each fiber's column count, each fiber's unit count and complexity from the scheduling hints, the dependency graph and the total record count, and from these estimates compute weight ratios: below 10K records it is sequential, a consumer to producer weight ratio above 0.5 gives chase and steal, a producer weight below the light threshold gives adaptive, and otherwise pipe-chase. The weight estimate is rough, from unit count times column access counts in light, medium and heavy classes, and a wrong selection costs about 10 to 20% and is not catastrophic."
mechanism = "`record_count < 10K` -> Sequential. `consumer_weight / producer_weight > 0.5` -> ChaseSteal. `producer_weight < LIGHT_THRESHOLD` -> Adaptive. else -> PipeChase. Bench at 2M records vs sequential: pipe-chase 0.56-0.58x (A+B interleaved core 0, C chases core 1), chase+steal 0.55-0.56x, adaptive 0.32-0.54x (no frame budget, continuous chaser); asymmetric L-H workload with chase+steal 0.34x."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1934-1962"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#21-scheduling-strategy"]
quote = '''
**Plan-time strategy selection (T6 L2227-2260):**

The scheduler knows at plan time: each fiber's column count (→ morsel
size), each fiber's WU count and complexity (from scheduling hints),
the dependency graph, total record count. From this it estimates
compute weight ratios:

- `record_count < 10K` → Sequential
- `consumer_weight / producer_weight > 0.5` → ChaseSteal (both
  threads contribute to consumer fibers)
- `producer_weight < LIGHT_THRESHOLD` → Adaptive (producer finishes
  fast, steals consumer tail)
- else → PipeChase (overlap producer with consumer chasing)

Weight estimate from WU count × column access counts. Rough
classification (light/medium/heavy). Wrong selection → ~10-20%
suboptimal, not catastrophic.

**Tested strategies (T6 L1982-2355, at 2M records):**

| Strategy | vs seq | Description |
|---|---|---|
| sequential | 1.00x | single core, no overhead |
| pipe-chase | 0.56-0.58x | A+B interleaved core 0, C chases core 1 |
| chase+steal | 0.55-0.56x | pipe-chase + producer steals C tail |
| adaptive | 0.32-0.54x | no frame budget, continuous chaser |

Asymmetric workloads amplify chase+steal: L-H gives 0.34x (66%
faster with 2 threads).
'''
origin = "stated"
standing = "ratified"
