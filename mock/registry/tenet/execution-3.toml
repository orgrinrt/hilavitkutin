[[tenet]]
id = "the_pipeline_shape_chooses_adaptive_sequential_or_phased_and_deep_pipelines_never_significantly_benefit_from_threading"
what = "The pipeline shape selects the strategy: a wide pipeline, with many roots and low depth, uses adaptive or pipe-chase; a deep one, with serial dependencies and few roots, runs sequentially; a mixed one, where phases have parallel trunks, runs phased. Deep pipelines never significantly benefit from threading, because serial dependency depth is a fundamental limit."
mechanism = "Wide: roots > depth/2. Deep: depth > fibers/2 and roots <= 2. Mixed: phases have parallel trunks. A 7-fiber deep pipeline gains nothing from threading and adds 1.03-1.05x overhead (T6 L2283-2355)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1911-1921"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#21-scheduling-strategy"]
quote = '''
**Pipeline shape (T7 §5.2):**

| Shape | Indicator | Strategy |
|---|---|---|
| Wide (many roots, low depth) | roots > depth/2 | adaptive / pipe-chase |
| Deep (serial deps, few roots) | depth > fibers/2, roots ≤ 2 | sequential |
| Mixed (some width, some depth) | phases have parallel trunks | phased |

Deep pipelines never significantly benefit from threading (T6
L2283-2355): 7-fiber deep pipeline → threading adds 1.03-1.05x
overhead. Serial dependency depth is a fundamental limit.
'''
