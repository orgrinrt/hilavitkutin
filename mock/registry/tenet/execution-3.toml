[[tenet]]
id = "each_convergence_thread_accumulates_into_its_own_stack_local_resource_and_non_commutative_accumulation_runs_sequentially"
what = "Units that accumulate into a resource have cross-record dependencies through it, so two head and tail convergence threads would otherwise accumulate into the same resource concurrently. Each convergence thread gets its own stack-local accumulator; after convergence an additive accumulation adds the two accumulators, and a non-commutative accumulation falls back to sequential processing of that fiber and skips head and tail."
mechanism = "Uses the same stack-local caching pattern; each thread's snapshot is independent. `ru`/`rw` per element."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1750-1760, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1762-1763"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#19-resource-handling"]
quote = '''
**Resource accumulation + convergence (T6 L2938-2961, T7 §4.3):**

WUs that accumulate resources (ru/rw per element) have cross-record
dependencies through the resource. Head+tail convergence breaks this
— two threads accumulating into the same resource concurrently.

Fix: each convergence thread gets its own stack-local accumulator
(same caching pattern). After convergence:
- Additive accumulation: add the two accumulators
- Non-commutative accumulation: fall back to sequential processing
  for that fiber (skip head+tail)
---
The stack-local caching pattern handles this naturally — each thread's
snapshot is independent. Detection at plan time from WU metadata:
'''
