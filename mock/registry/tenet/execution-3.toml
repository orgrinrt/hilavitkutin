[[tenet]]
id = "core_assignment_is_heterogeneous_aware_with_p_cores_on_the_critical_path_and_proportionally_smaller_ranges_for_e_cores"
what = "On a machine with core types, the critical path trunks go to the P-cores and the leaf and branch fibers to the E-cores. P-cores get larger morsels because of their larger L1 and L2, and E-cores get proportionally smaller morsel ranges and not an equal distribution, because E-cores run at about 40% of P-core speed and drag performance down under an even split."
