what = "A locked changelist stays as it was at lock time and is not edited. A drift from shipped source is documented by a sketch under the research sketches that names the original changelist by path and the shipped reality by source line. A future round that genuinely supersedes the original, a substantive design change, deprecates it, and a purely wording mismatch with no design change behind it needs a documentation sketch and no rename or new round."
