[[tenet]]
id = "the_fiber_grouper_classifies_each_column_statically_as_internal_input_output_or_both"
what = "The fiber grouper classifies each column statically from the read and write declarations of the units: internal to the fiber, input from upstream, output to downstream, or both internal and output. An internal column is a register-to-register data path and dead-store elimination skips its memory operations; an input is read from memory at morsel start and an output is written to memory at morsel end."
mechanism = "Fiber-internal: written by one WU, read only by the next WU in the same fiber, not read externally (`d(c(b(a(input_n))))`). Fiber-input: written by upstream fiber/trunk. Fiber-output: read by downstream fiber or final consumer. Fiber-internal AND fiber-output: local reused within the fiber (register) and stored for downstream."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1095-1108"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#14-fiber-formation"]
quote = '''
**Column classification:**

The fiber grouper classifies each column statically from WorkUnit
Read/Write declarations:
- **Fiber-internal:** written by one WU, read only by the next WU in
  the same fiber, not read externally. Register-to-register data path.
  DSE skips memory ops. The fiber as pure function pipeline:
  `d(c(b(a(input_n))))`.
- **Fiber-input:** written by upstream fiber/trunk. Read from memory at
  morsel start.
- **Fiber-output:** read by downstream fiber or final consumer. Written
  to memory at morsel end.
- **Fiber-internal AND fiber-output:** local reused within fiber
  (register) AND stored for downstream.
'''
