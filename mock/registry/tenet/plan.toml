[[tenet]]
id = "fibers_are_formed_by_a_topological_walk_that_groups_a_unit_into_its_predecessor_fiber_when_the_check_passes"
what = "Fibers are formed by a topological sort followed by a greedy grouping walk. A unit joins a fiber when all its predecessors are in one fiber and the combined feasibility check passes, and otherwise it starts a new fiber with fence dependencies on the upstream fibers. The dependencies between fibers are then computed from the unit-level predecessors."
mechanism = "arvo-graph Kahn's topological sort (fixed `[u16; MU]` queue + in-degree array, zero heap), then arvo-comb greedy grouping walk; inter-fiber deps from WU-level predecessors. Validated: 17-WU game world → 12 fibers (T6 bench)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1054-1055, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1060-1068"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#14-fiber-formation"]
quote = '''
Core algorithm: arvo-graph Kahn's topological sort → arvo-comb greedy
grouping walk (T2 §8.4, T6 §Q12, T7 §1.3):
---
2. Topological sort via arvo-graph Kahn's (fixed `[u16; MU]` queue +
   in-degree array, zero heap).
3. Walk topo order. For each WU: if all predecessors are in one fiber
   AND adding this WU passes the holistic feasibility check → group
   into that fiber. Otherwise → new fiber with fence dependencies on
   upstream fiber(s).
4. Compute inter-fiber deps from WU-level predecessors.

Validated: 17-WU game world → 12 fibers (T6 bench).
'''
origin = "stated"
standing = "provisional"
subject = "plan"
keywords = ["Kahn's", "greedy grouping", "fiber formation", "fence dependencies", "topological sort", "[u16; MU]", "17-WU game world"]
