[[tenet]]
id = "a_unit_precedes_every_unit_that_reads_what_it_writes_and_the_edge_is_one_mask_overlap_test"
what = "Each unit's read and write sets are lowered to bitmasks at registration, and one unit must precede another when the first one's write mask overlaps the second one's read mask. The result is a bit-matrix graph, built with one AND and compare per pair."
mechanism = "`type Read: AccessSet` and `type Write: AccessSet` tuple types are lowered to `AccessMask` bitmasks. `read_masks[i]`: bit j set if unit i reads store j. `write_masks[i]`: bit j set if unit i writes store j. Edge: `(write_masks[i] & read_masks[j]) != 0` means unit i precedes unit j. O(N^2) on u64 values; for 50 units 2500 ANDs, about 1 microsecond. Result `dag[i] |= 1 << j` where i precedes j."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1265-1277"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
**Step 1: Build the access matrix** (arvo-bitmask)

Each WU's `type Read: AccessSet` and `type Write: AccessSet` tuple
types are lowered to `AccessMask` bitmasks at registration. The
access matrix is the collection of these masks:
- `read_masks[i]`: bit j set if WU i reads store j
- `write_masks[i]`: bit j set if WU i writes store j

DAG edges: for every pair (i, j), `(write_masks[i] & read_masks[j])
!= 0` → WU i must precede WU j. This is a single AND + compare per
pair. O(N²) on u64 values. For 50 WUs: 2500 ANDs, ~1µs. The result
is a bit-matrix DAG: `dag[i] |= 1 << j` where i precedes j.

'''
