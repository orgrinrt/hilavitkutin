[[tenet]]
id = "the_nine_adapt_axes_ship_as_individual_inputs_and_kits_are_only_recipes_over_them"
subject = "meta"
what = "The nine adaptation axes ship as individual builder inputs, each a specialised structure carrying only its own knobs, and there is no composite configuration structure above them. Kits are documented combinations of the axes: a consumer registers axes one by one, registers a kit, or registers a kit and then overrides one axis."
mechanism = "`PassDurationConfig`, `PhaseEmaConfig`, `FiberEmaConfig`, `ChangeClassConfig`, `CacheResidencyConfig`, `ThroughputConfig`, `PredictiveParkingConfig`, `MemoryWatermarkConfig`, `CoreIdleTimeConfig` in `pub mod adapt`; sealed `AdaptAxis` with `is_enabled()` and `sample_skip()`; `StandardAdaptKit`, `OffAdaptKit`; a later `.with` replaces the slot for that axis."
source = "mock/design_rounds/202605101036/202605101036_topic.adapt-subsystem.md:265-265"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.adapt-subsystem::#decision-log"]
quote = '''
- [x] **Axis A. Multi-axis individual BuilderInputs + Kit-recipe presets (REFRAMED twice; final shape).** Nine axes ship as individual `BuilderInput`s in `pub mod adapt`: `PassDurationConfig`, `PhaseEmaConfig`, `FiberEmaConfig`, `ChangeClassConfig`, `CacheResidencyConfig`, `ThroughputConfig`, `PredictiveParkingConfig`, `MemoryWatermarkConfig`, `CoreIdleTimeConfig`. Each is a heterogeneous specialised struct (carries only its meaningful knobs); each impls `BuilderInput<Dispatch = <Self>Dispatch<Self>>` with its own dispatch slot (no collision); each impls sealed `AdaptAxis: Sealed` for the universal `is_enabled() + sample_skip()` accessors; each has `Default` impl (sensible-on baseline per axis) + `Self::off()` const fn (disabled shorthand). **No top-level `AdaptConfig` composite struct** — the user's Kit reframe replaced the struct + const fn presets with: (1) individual axis-configs as the primary surface and (2) Kit recipes (`StandardAdaptKit`, `OffAdaptKit`, optionally domain-specific consumer Kits) as documented combinations. Consumer registers axes individually `.with(my_phase_ema_config)`, or via a Kit `.with(StandardAdaptKit::default())`, or composes `.with(StandardAdaptKit).with(my_fiber_override)` (later `.with` replaces the slot for that axis). Cadence interleaving via per-axis `sample_skip`. Core-idle-time axis included for load-distribution sensitivity, breadcrumb mechanism in Topic 6's parking primitive. **C1 audit finding dissolves:** without a composite `AdaptConfig` struct, there is no `AdaptCfgDispatch<Self>` slot needed; each axis has its own slot via standard `BuilderInput` pattern. The workspace convention applies cleanly without scope-clarification gymnastics. Plan stage reads each axis-config via its accessor; absent registrations use the trivial-ctor default. **Workspace convention dogfooded properly:** individuals primary + Kits as recipes, same shape as Axis F's metrics layer. (Earlier "AdaptConfig as struct + const fn presets" framing retired by this reframe; the C1 audit response that locked `AdaptConfig` as a `BuilderInput` is also retired by the reframe.)
'''
origin = "stated"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
keywords = ["adapt axis", "BuilderInput", "StandardAdaptKit", "OffAdaptKit", "no composite AdaptConfig", "sample_skip"]
related = ["tenet::each_adaptation_metric_is_its_own_axis_with_independent_tuning"]

[[tenet]]
id = "adapt_metrics_live_in_a_scratch_arena_and_the_adapt_unit_refreshes_a_consumer_readable_snapshot_at_the_end_of_the_schedule"
subject = "meta"
what = "The adaptation metrics have a hybrid home: a scratch arena on the hot path, reached directly by the inner loop, and a snapshot resource the consumer can read, which the adapt unit refreshes from the arena at the end of the schedule. The snapshot is small."
mechanism = "Axis B, option B3. The arena is reached by raw pointer; the snapshot is on the order of MAX_PHASES + MAX_FIBERS + MAX_LANES u64s. The vocabulary section names the raw region `AdaptArena` (not consumer-readable) and the consumer-readable side the per-axis `metrics::*` resources."
source = "mock/design_rounds/202605101036/202605101036_topic.adapt-subsystem.md:266-266, mock/design_rounds/202605101036/202605101036_topic.adapt-subsystem.md:25-26"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.adapt-subsystem::#decision-log"]
quote = '''
- [x] **Axis B. AdaptMetrics data plane: B3 hybrid.** Scratch-arena hot path + `Resource<SchedulerMetrics>` snapshot refreshed by AdaptWu at `ScheduleEnd`. Snapshot is small (per-phase + per-fiber + per-core counters, on the order of MAX_PHASES + MAX_FIBERS + MAX_LANES u64s). Inner loop accesses arena directly via raw pointer; consumer reads via standard `Has<SchedulerMetricsProvider>` Ctx bound.
---
- **AdaptArena**: the raw scratch-arena memory region (hot per-fiber lines + per-core park slots + cold SoA arena). Plan-stage allocated. Codegen + AdaptWu read/write directly via raw pointer. Not consumer-readable.
- **`metrics::*` Resources** (per-axis sub-resources from Axis F): `PassDurationMetrics`, `PhaseEmaMetrics`, `FiberEmaMetrics`, `ChangeClassMetrics`, `CacheResidencyMetrics`, `ThroughputMetrics`, `PredictiveParkingMetrics`, `MemoryWatermarkMetrics`, `CoreIdleTimeMetrics`. Consumer-readable. Refreshed from AdaptArena by AdaptWu at `ScheduleEnd`.
'''
