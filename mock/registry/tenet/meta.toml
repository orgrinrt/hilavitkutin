- [x] **(Audit-2 M3, 2026-05-10):** the per-fiber 64B line co-locating progress counter (cross-core read) + inline metric slots (producer-only writes) risks cache-line ping-pong. **Invariant locked:** inline metric slots on each per-fiber line are **write-only by the owning fiber's producer core, read-only-after-phase-barrier by AdaptWu at `ScheduleEnd`**. No other core reads the metrics slots mid-pass. The line is hot on the producer core throughout the fiber's execution (Modified state); the consumer-side `ldar` on the progress counter alone causes a coherence transition only at fiber completion, not during inner-loop morsels. This is the invariant the design relies on; a lint enforces it (no consumer-WU AccessSet may directly read an axis-config's inline-write metric — only the AdaptWu's snapshot Resource).
