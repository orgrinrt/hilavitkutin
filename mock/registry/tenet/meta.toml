id = "the_adapt_unit_predicts_the_wait_per_phase_and_the_parking_primitive_only_reads_the_prediction"
subject = "meta"
what = "Predictive parking is split into policy and mechanism. The adapt unit computes the predicted wait per phase from history at the end of the schedule and writes it to the parking metrics; the parking primitive reads the prediction and picks spin, spin with backoff, or park by the three-tier rule."
mechanism = "Axis G, option G1: `predicted_wait_per_phase[PhaseId]` written to `PredictiveParkingMetrics`; the parking contract is `(predicted_wait_ns: arvo::UFixed<...>) -> ParkStrategy`; under 100ns spin, 100ns to 10us spin_loop with backoff, over 10us park."
source = "mock/design_rounds/202605101036/202605101036_topic.adapt-subsystem.md:308-308"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.adapt-subsystem::#decision-log"]
quote = '''
- [x] **Axis G. Predictive parking boundary: G1 policy in metrics, mechanism in Topic 6.** Policy/mechanism separation. AdaptWu (Topic 5) computes `predicted_wait_per_phase[PhaseId]: arvo::UFixed<I, F, S>` from history at `ScheduleEnd`, writes to `PredictiveParkingMetrics`. Topic 6's parking primitive reads `predicted_wait_ns: arvo::UFixed<I, F, S>` (a fixed-point nanoseconds duration; exact widths picked by Topic 6 to cover the canonical wait range) and dispatches the three-tier rule (under 100ns spin / 100ns to 10us spin_loop+backoff / over 10us thread::park). Topic 6 contract becomes pure: `(predicted_wait_ns: arvo::UFixed<...>) -> ParkStrategy`. **Type-discipline note:** `USize` is forbidden here per `no-bare-primitives.md` (it names index/length, not duration). The fixed-point duration type is the substrate-canonical shape for time intervals. Reasons: single source of truth for prediction logic; Topic 6 stays narrow; multi-axis-friendly (AdaptWu has access to all metrics; parking primitive does not need to declare AccessSet over them); update-rate separation (predictions cold-path once per pass; parking warm-path many times per pass; G3 would repeat prediction logic on the warm path); consumer-readable predictions (custom Executors share the same predictions); SRP-clean.
'''
