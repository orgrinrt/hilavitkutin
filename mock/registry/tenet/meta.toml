written_by = "design round 202605101036, topic 5 adapt subsystem, decisions dated 2026-05-10; the text does not say whose each decision is"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
