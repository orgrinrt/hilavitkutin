[[tenet]]
id = "a_phase_s_duration_average_folds_the_phase_total_of_the_frame_once_per_frame_and_not_once_per_morsel"
subject = "meta"
what = "The per-phase duration average is the same one-eighth moving average the pass duration uses, seeded on the first frame. It folds how long a phase took in the whole frame, summed across its morsels, once per frame. It is not folded once per phase and morsel, which on a multi-morsel frame would leave the first frame holding the last morsel's duration and decay later frames per morsel."
mechanism = "`phase_accum: [Cell<Nanos>; GATE2_MAX_UNITS]` beside `phase_ema`; `dispatch_trunks` adds each phase's per-morsel duration into `phase_accum[p]` (saturating) with no seed read; `run` folds `phase_accum[p]` into `phase_ema[p]` once at the pass-duration EMA fold point with the same `ema_seed`, after the morsel loop, then zeroes it."
source = "mock/design_rounds/202606192345/202606192345_topic.phase-ema-per-frame-fix.md:10-18, mock/design_rounds/202606192345/202606192345_topic.phase-ema-per-frame-fix.md:22-32"
provenance = ["mock::design_rounds::202606192345::202606192345_topic.phase-ema-per-frame-fix::#current-state"]
quote = '''
The per-phase EMA just landed (round 202606192301) folds the phase duration
into `phase_ema[p]` INSIDE `dispatch_trunks`. But `dispatch_trunks` is called
once per MORSEL window on the morsel-outer path (the common record-bearing
case), so the fold runs per (phase, morsel), not per frame. On a multi-morsel
frame (`total > MORSEL_SIZE`) frame 1 ends holding the last morsel's raw
duration, and later frames decay 1/8 per morsel, not per frame. The DESIGN says
"the same 1/8 EMA the pass-duration fold uses, seeded on the first frame", which
is per-frame semantics the code does not honor when there is more than one
morsel. The single-morsel N=4 test did not exercise it.
---
Make the code match the per-frame DESIGN (the natural reading of "per-phase
duration EMA": how long phase p took this frame, summed across its morsels).

1. Add a per-frame accumulator field `phase_accum: [Cell<Nanos>;
   GATE2_MAX_UNITS]` alongside `phase_ema`.
2. `dispatch_trunks` ADDS each phase's per-morsel duration into `phase_accum[p]`
   (saturating), instead of folding into `phase_ema`. No seed read there.
3. `run` folds each phase's per-frame total (`phase_accum[p]`) into
   `phase_ema[p]` once, at the existing pass-duration EMA fold point (same
   `ema_seed`, after the morsel loop), then zeroes `phase_accum[p]`. Bounded by
   the phase count.
'''
origin = "proposed"
written_by = "topic phase-ema-per-frame-fix of 2026-06-19, round 202606192345, a post-review fix to round 202606192301, agent-written"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
keywords = ["phase_ema", "phase_accum", "per-phase EMA", "dispatch_trunks", "per frame", "one-eighth", "fold_ema", "morsel"]
rejects = ["the fold runs per (phase, morsel), not per frame"]
