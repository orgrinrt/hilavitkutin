[[tenet]]
id = "inline_metric_slots_are_written_only_by_the_owning_fiber_s_core_and_read_by_the_adapt_unit_only_after_the_phase_barrier"
subject = "meta"
what = "The inline metric slots on a fiber's line are written only by the core that owns the fiber and read only after the phase barrier, by the adapt unit at the end of the schedule; no other core reads them mid-pass. A lint enforces that no consumer unit's access set reads an axis's inline metric directly, only the adapt unit's snapshot resource."
because = "A line that holds both the progress counter, which another core reads, and inline metric slots risks cache-line ping-pong."
