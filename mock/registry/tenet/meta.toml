[[tenet]]
id = "the_scheduler_writes_the_previous_pass_s_metrics_at_the_start_of_each_pass"
what = "The scheduler writes its metrics resource at the start of each pass, and what it writes is the previous pass's metrics. The data is always one pass behind, which is consistent, because the current pass is still in progress and cannot report its own metrics. The write happens at pass start, so it is the first thing in the DAG and all readers come after it, and its version stamp increments every pass, so readers always dispatch."
mechanism = "`Resource<SchedulerMetrics>`; `pass_count` always changes."
source = "mock/design_rounds/202604200055/202603141800_topic.hilavitkutin-core-design.md:595-598, mock/design_rounds/202604200055/202603141800_topic.hilavitkutin-core-design.md:639-641"
provenance = ["mock::design_rounds::202604200055::202603141800_topic.hilavitkutin-core-design::#key-design-questions"]
quote = '''
The scheduler writes `Resource<SchedulerMetrics>` at the START of
each pass, containing the PREVIOUS pass's metrics. This is always
one-pass-behind data, which is consistent and non-paradoxical — the
current pass is still in progress and can't report its own metrics.
---
The write happens at pass start → it's the first thing in the DAG.
All readers naturally come after. The version stamp increments every
pass (pass_count always changes), so readers always dispatch.
'''
origin = "proposed"
written_by = "topic T5 of the founding round (hilavitkutin-core-design)"
standing = "provisional"
subject = "meta"
keywords = ["SchedulerMetrics", "previous pass", "one pass behind", "pass start", "metrics resource", "version stamp"]

[[tenet]]
id = "whether_meta_units_share_the_consumer_carrier_or_get_a_dedicated_carrier_is_decided_by_sketching_both_shapes"
what = "Whether meta units stay on the shared consumer carrier, with bands hoisted out of the morsel loop on every record-bearing path, once per frame, or move to a dedicated meta carrier with an independent band walk, is decided by sketching both shapes far enough to compare complexity and codegen. Either shape must cure the known warts: per-morsel meta execution on record-bearing paths, leading-band accumulator appends unsupported on the parallel unit-outer path, and the clear-on-dispatch semantics of slice 1b."
mechanism = "Task #687 for the slice-1b clear-on-dispatch semantics; single-core and parallel alike."
source = "mock/research/202606111400_canonical-design-addendum-a1.md:124-131"
provenance = ["mock::research::202606111400_canonical-design-addendum-a1::#a1-7-the-meta-carrier-question-is-sketch-decided"]
quote = '''
Whether meta WUs stay on the shared consumer carrier (with bands hoisted out
of the morsel loop on every record-bearing path, once per frame, single-core
and parallel alike) or move to a dedicated meta carrier with an independent
band walk is decided by sketching both shapes far enough to compare
complexity and codegen. The known warts either shape must cure: per-morsel
meta execution on record-bearing paths, leading-band accumulator appends
unsupported on the parallel unit-outer path, and the slice-1b
clear-on-dispatch semantics (#687).
'''
origin = "stated"
standing = "provisional"
subject = "meta"
keywords = ["meta carrier", "meta WUs", "band walk", "sketch", "morsel loop", "accumulator append", "clear-on-dispatch", "#687"]

