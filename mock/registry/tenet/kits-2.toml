what = "Value retention is delivered without adding any method to the builder input trait, which keeps its two associated types, so none of the existing implementation sites change. The value carrier owns the registered value and exposes it through an into-inner accessor for the later arena move, and the builder moves the registered input itself onto the staged list."
mechanism = "`BuilderInput` stays `Init` + `Dispatch`; 24 existing `impl BuilderInput` sites unchanged; `pub struct StagedResource<T>(T)` with `into_inner(self) -> T`; `.with<P>(self, provider: P)` moves `provider` onto `Stage<P, Staged>`; `Scheduler::builder()` returns `SchedulerBuilder<Empty, Empty, Empty, StageEmpty>`; the arena move is round B2."
source = "mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:3-3, mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:12-12, mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:27-27"
