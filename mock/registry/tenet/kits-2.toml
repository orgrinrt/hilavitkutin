[[tenet]]
id = "the_builder_retains_each_registered_value_in_a_sealed_value_carrying_list_beside_the_type_level_store_list"
what = "The scheduler builder retains each registered value in a sealed value-carrying list that is separate from the type-level access-set list tracking store identity. A resource constructor returns a carrier that owns the value while its marker type still routes into the stores, and the builder also threads the platform accumulator so a registered memory provider is carried."
mechanism = "Sealed `StageList` (`StageEmpty`, `Stage<H, T>`); `Resource::new(value)` returns `StagedResource<T>` implementing `BuilderInput<Init = T, Dispatch = StoreDispatch<Resource<T>>>`; `BuilderInput` gains `into_init(self) -> Self::Init`; builder reshaped to `SchedulerBuilder<Wus, Stores, Platform, Staged>`; pre-1.0 no-legacy-shims clean delete-and-replace."
source = "mock/design_rounds/202605282319/202605282319_topic.builder-value-retention.md:12-12"
provenance = ["mock::design_rounds::202605282319::202605282319_topic.builder-value-retention::#topic-builder-value-retention-the-first-data-plane-round-phase-b-b1"]
quote = '''
B1 makes the value survive. It adds a sealed value-carrying cons-list (`StageList`: `StageEmpty`, `Stage<H, T>`) that holds the actual registered values, distinct from the type-level `AccessSet` cons-list that tracks store identity. `Resource::new(value)` returns a value carrier (`StagedResource<T>`) that impls `BuilderInput<Init = T, Dispatch = StoreDispatch<Resource<T>>>`, so the marker type still routes into `Stores` while the value rides in the carrier. `BuilderInput` gains `into_init(self) -> Self::Init` so `.with` can move the construction value out of the carrier and onto the `Staged` list. The builder reshapes to `SchedulerBuilder<Wus, Stores, Platform, Staged>`, threading the platform accumulator (so a registered `MemoryProvider` is carried) and the staged-value list. Per the pre-1.0 no-legacy-shims rule this is a clean delete-and-replace; consumers that build through inference are unaffected.
'''
