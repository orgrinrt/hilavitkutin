[[tenet]]
id = "the_value_retention_adds_no_method_to_the_builder_input_trait_and_the_builder_moves_the_registered_input_onto_the_staged_list"
what = "Value retention is delivered without adding any method to the builder input trait, which keeps its two associated types, so none of the existing implementation sites change. The value carrier owns the registered value and exposes it through an into-inner accessor for the later arena move, and the builder moves the registered input itself onto the staged list."
mechanism = "`BuilderInput` stays `Init` + `Dispatch`; 24 existing `impl BuilderInput` sites unchanged; `pub struct StagedResource<T>(T)` with `into_inner(self) -> T`; `.with<P>(self, provider: P)` moves `provider` onto `Stage<P, Staged>`; `Scheduler::builder()` returns `SchedulerBuilder<Empty, Empty, Empty, StageEmpty>`; the arena move is round B2."
source = "mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:3-3, mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:12-12, mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:27-27"
provenance = ["mock::design_rounds::202605282319::202605282319_changelist.src.lock::#source-changelist-builder-value-retention-b1"]
quote = '''
Round: 202605282319. Phase: IMPL. Makes the scheduler builder retain each registered value instead of dropping it, by giving `.with` a value-carrying accumulator and having `Resource::new` return a carrier that owns the value. No method is added to `BuilderInput` (it stays `Init` + `Dispatch`), so none of the 24 existing `impl BuilderInput` sites change. The move of retained values into a `MemoryProvider`-allocated arena is the next round (B2).
---
`pub struct StagedResource<T>(T)` owning the registered value, with `into_inner(self) -> T` for the arena drain (B2) and the retention test. Its `BuilderInput` routes `Resource<T>` into the store accumulator via `StoreDispatch<Resource<T>>`. Re-export from `hilavitkutin-api/src/lib.rs`.
---
The builder carries `staged: Staged`. `.with<P>(self, provider: P)` moves `provider` onto `Stage<P, Staged>` and advances the typestate through `P::Dispatch as Dispatch<Wus, Stores, Platform>` (the real `Platform` accumulator, replacing the hardcoded `Empty`). `Scheduler::builder()` returns `SchedulerBuilder<Empty, Empty, Empty, StageEmpty>`. `build()` / `build_with` carry the extra parameters and consume `staged` (B1 drops it at `build()`; B2 moves it into the arena).
'''
