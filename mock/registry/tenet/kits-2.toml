id = "the_interner_resource_is_not_replaceable_by_default_and_an_app_needing_a_test_fixture_opts_in_on_its_own_alias_type"
what = "The interner resource does not implement the replaceable marker by default. An app that needs test-fixture replacement, for example a deterministic interner for unit tests, implements the marker itself on the relevant alias type, which matches the workspace rule of tools and not policies: the crate ships the resource without forcing override semantics on consumers that do not want them."
