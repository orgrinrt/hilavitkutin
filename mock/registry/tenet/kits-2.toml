mechanism = "Sealed `StageList` (`StageEmpty`, `Stage<H, T>`); `Resource::new(value)` returns `StagedResource<T>` implementing `BuilderInput<Init = T, Dispatch = StoreDispatch<Resource<T>>>`; `BuilderInput` gains `into_init(self) -> Self::Init`; builder reshaped to `SchedulerBuilder<Wus, Stores, Platform, Staged>`; pre-1.0 no-legacy-shims clean delete-and-replace."
