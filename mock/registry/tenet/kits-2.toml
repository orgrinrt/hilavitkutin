id = "the_scheduler_builder_keeps_one_unified_verb_for_registering_values_and_the_split_into_with_and_store_methods_is_rejected"
what = "The scheduler builder keeps its single unified verb for registering values, with store values routed from other values at the type level. The architect's recommended split into separate methods for general values and for stores, with its fifth builder parameter, is rejected."
mechanism = "Router kind tags on each dispatch router (`StoreDispatch`, `UnitDispatch`, `PlatformDispatch`) with a `Place<P>` GAT keyed on the tag; the store-value list is aligned with `Stores`, so the value drain walks both in lockstep with no search."
source = "mock/research/sketches/202605290002_builder-kind-dispatch.md:3-3, mock/research/sketches/202605290002_builder-kind-dispatch.md:7-7, mock/research/sketches/202605290002_builder-kind-dispatch.md:15-15"
provenance = ["mock::research::sketches::202605290002_builder-kind-dispatch::#sketch-single-with-store-value-routing-via-routerkind-dispatch"]
quote = '''
**Hypothesis:** the scheduler builder can keep its single unified `.with(value)` verb (per `DESIGN.md`) while retaining ONLY store-registration values on a `Stores`-aligned value list, routing store-vs-nonstore at the type level without the overlapping-impl / coherence error that a heterogeneous-list search (`FindCarrier`) hits, and without specialization, on stable `no_std` Rust.
---
This unblocks B2: it lets the value drain walk a `Stores`-aligned store-value list in lockstep (no search), so the arena build is coherence-clean. It also means the architect's recommended `.with`/`.store` method split (and its fifth builder parameter justification) is rejected: the unified verb survives.
---
Each `Dispatch` router carries an associated kind tag; the kind-conditional next-list computation lives on a `Place<P>` GAT keyed on the tag as `Self` (three disjoint `Self` types, so coherence sees no overlap). The builder's single `.with` return type projects through it.
'''
