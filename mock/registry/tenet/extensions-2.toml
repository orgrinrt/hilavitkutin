[[tenet]]
id = "link_errors_are_fixed_shape_enum_variants_with_no_heap_payload_and_carry_os_error_codes_as_non_negative_usize"
subject = "extensions"
what = "Load, resolve and unload errors are fixed-shape enum variants with no heap payload, carrying platform codes as non-negative size values that fit both Unix errno and Windows error ranges. On Windows the code is the last-error value at the failure site. On Unix it is the thread-local errno and is best-effort, because the standard does not require the loader call to set it, and on unsupported Unixes it is zero. A separate variant distinguishes a path the loader cannot transcode from a path the operating system rejects, and in the first version it fires on Windows for non-ASCII paths and for paths beyond the classic length limit."
mechanism = "`LinkError`, `arvo::USize` platform codes; `LinkError::LoadFailed { platform_code }`; `GetLastError()` on Windows; `__errno_location` on Linux/Android, `__error` on Darwin and BSD; `LinkError::PathEncodingUnsupported` on Windows for non-ASCII paths and paths over the classic `MAX_PATH` (260 wchars); Unix paths are opaque bytes and never produce it. Full UTF-8 to UTF-16 transcoding plus the long-path prefix LongPath support is a separate scope."
source = "mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:30-30, mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:47-47"
provenance = ["mock::crates::hilavitkutin-linking::DESIGN::#public-items"]
quote = '''
- `LinkError` is the load / resolve / unload error enum. Fixed-shape variants; no heap payloads. Carries `arvo::USize` platform codes where relevant.
---
Error shapes are fixed enum variants with no heap payloads. OS error codes are carried as `arvo::USize` values (non-negative on both unix errno and Windows GetLastError ranges). On Windows, `LinkError::LoadFailed { platform_code }` always reflects `GetLastError()` at the failure site. On Unix, the value is the thread-local `errno` read via the per-libc helper (`__errno_location` on Linux/Android, `__error` on Darwin and BSD); since POSIX does not require `dlopen` to set `errno`, the value is best-effort and reflects the most recent libc syscall failure during the load. On unsupported unixes (Solaris, Haiku, etc.) the value is `0`. `LinkError::PathEncodingUnsupported` distinguishes a path the loader cannot transcode from a path that the OS loader rejects after handoff. v1 fires it on Windows for non-ASCII paths and paths exceeding the classic `MAX_PATH` (260 wchars); Unix paths are opaque bytes and never produce it. Full UTF-8 to UTF-16 transcoding plus `\\?\` LongPath support is a separate scope.
