[[tenet]]
id = "the_macro_keeps_the_trampolines_alive_under_fat_lto_by_an_exported_function_returning_a_used_static_that_holds_their_addresses"
subject = "extensions"
what = "The macro emits an init trampoline and a shutdown trampoline that wrap the consumer's init and shutdown types, and stores their addresses as function-pointer constants in a static descriptor. The chain keeps the trampoline bytes alive under aggressive link-time optimisation and library stripping: the export forces the descriptor function to stay, the function returns the static, the static is marked used, and the compiler cannot elide a function whose address sits in a preserved static. The trampolines are also marked unmangled and never inlined, so external linkage keeps their names in the symbol table and no inlining into the static's initializer can happen."
mechanism = "`__ext_init_trampoline_<Struct>`, `__ext_shutdown_trampoline_<Struct>`; `__HILAVITKUTIN_EXT_DESCRIPTOR` static `#[used]`; `__hilavitkutin_extension_descriptor` `#[unsafe(no_mangle)] pub extern \"C\"`; trampolines `#[unsafe(no_mangle)] #[inline(never)]`; aggressive LTO and cdylib stripping."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:80-82"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#trampoline-preservation-under-lto"]
quote = '''
The proc-macro emits two trampolines (`__ext_init_trampoline_<Struct>`, `__ext_shutdown_trampoline_<Struct>`) that wrap the consumer's `init` / `shutdown` types. Their addresses are stored as fn-pointer constants in the `__HILAVITKUTIN_EXT_DESCRIPTOR` static. The static is `#[used]`, and the descriptor function (`__hilavitkutin_extension_descriptor`, `#[unsafe(no_mangle)] pub extern "C"`) returns its address. This chain preserves the trampoline bytes under aggressive LTO + cdylib stripping: the export forces the descriptor function to keep, the function returns the static, the static is `#[used]`, and LLVM cannot elide a function whose address has been taken in a preserved static.

The trampolines additionally carry `#[unsafe(no_mangle)] #[inline(never)]`. `no_mangle` gives external linkage, which keeps both trampoline names in the symbol table after LTO. `inline(never)` prevents an LTO path that would inline a trampoline body into the descriptor static's initializer expression. Neither attribute prevents the linker's identical-code-folding (ICF) pass from aliasing two trampolines to a single address when their bodies are byte-identical. ICF aliasing is benign for the framework's contract: when both impls inline to the same return value (e.g. trivial `init` and `shutdown` both returning `ExtensionAbiStatus::Ok`), the descriptor's two fn-pointer slots refer to one shared body and runtime calls produce the same correct result through either slot. Real consumer extensions ship `init` and `shutdown` impls that compile to non-identical bytes, so ICF does not fold them in practice.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["trampoline", "LTO", "cdylib stripping", "#[used]", "no_mangle", "inline(never)", "descriptor static", "fat LTO", "__ext_init_trampoline"]

[[tenet]]
id = "identical_code_folding_may_alias_two_trampolines_and_that_is_benign_but_the_macro_still_makes_their_bodies_differ_with_a_per_role_constant"
subject = "extensions"
what = "The linker's identical-code-folding pass can alias two trampolines to one address when their bodies are byte-identical, and neither unmangling nor non-inlining prevents it. That aliasing is benign for the framework's contract, since both slots then reach one shared body that gives the same correct result, and real extensions have non-identical init and shutdown bodies. As a defensive measure each trampoline embeds a per-role byte-string constant consumed through a black box, so their bodies differ at the byte level and cannot be folded, at the cost of one constant load and a no-op fence per call, which is negligible because trampolines fire only at load and drop."
mechanism = "`b\"init\"` and `b\"shutdown\"` consumed via `core::hint::black_box`; ICF = identical-code-folding. A regression test `hilavitkutin-extensions-macros/tests/lto_smoke.rs` builds a sample cdylib with `lto = \"fat\"`, asserts both trampoline names survive in `nm` output, dlopens it, resolves the descriptor and asserts `init_fn` and `shutdown_fn` resolve to distinct addresses; it caught an early `inline(never)`-only design that left `shutdown_fn` symbolless and then the ICF aliasing case."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:82-84, mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:88-88"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#trampoline-preservation-under-lto"]
quote = '''
The trampolines additionally carry `#[unsafe(no_mangle)] #[inline(never)]`. `no_mangle` gives external linkage, which keeps both trampoline names in the symbol table after LTO. `inline(never)` prevents an LTO path that would inline a trampoline body into the descriptor static's initializer expression. Neither attribute prevents the linker's identical-code-folding (ICF) pass from aliasing two trampolines to a single address when their bodies are byte-identical. ICF aliasing is benign for the framework's contract: when both impls inline to the same return value (e.g. trivial `init` and `shutdown` both returning `ExtensionAbiStatus::Ok`), the descriptor's two fn-pointer slots refer to one shared body and runtime calls produce the same correct result through either slot. Real consumer extensions ship `init` and `shutdown` impls that compile to non-identical bytes, so ICF does not fold them in practice.

Macro emission goes one step further as a defensive measure: each trampoline body embeds a per-role byte-string constant (`b"init"` for the init trampoline, `b"shutdown"` for the shutdown trampoline) consumed via `core::hint::black_box`. The discriminator forces the trampoline bodies to differ at the byte level even when the wrapped impls are byte-identical, so ICF cannot alias them. The cost is one constant load plus a `black_box` no-op assembly fence per trampoline call, which is negligible because trampolines fire only at extension load and drop.
---
A regression test under `hilavitkutin-extensions-macros/tests/lto_smoke.rs` builds a sample cdylib with `lto = "fat"`, asserts both trampoline names survive in `nm` output, dlopens the cdylib, resolves the descriptor, and asserts that `descriptor.init_fn` and `descriptor.shutdown_fn` resolve to distinct addresses. The test caught both an early `inline(never)`-only design that left `shutdown_fn` symbolless, and the subsequent ICF address-aliasing case that the discriminator addresses.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["ICF", "identical code folding", "black_box", "per-role discriminator", "trampoline aliasing", "lto_smoke", "regression test", "nm"]

