[[tenet]]
id = "a_function_symbol_and_a_static_data_symbol_are_two_separate_handle_types_because_their_pointer_reinterpretation_rules_differ"
subject = "extensions"
what = "A resolved function symbol and a resolved static-data symbol are deliberately separate handle types. For a function the resolved address is the function-pointer value, and for static data it is the location of a value to dereference, and hiding the difference behind one type would force runtime branching or unsafe code, so two types keep the soundness explicit."
mechanism = "`Symbol<'_, F>`: `Symbol::get(&self) -> T` returns the function pointer by value via `transmute_copy` from a raw pointer. `StaticRef<'_, T>`: `T: 'static`, `StaticRef::get(&self) -> &T` dereferences the pointer; the pointer-to-static-struct pattern every extension ABI uses for its descriptor export."
source = "mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:27-28, mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:38-39, mock/crates/hilavitkutin-linking/DESIGN.md.tmpl:43-43"
provenance = ["mock::crates::hilavitkutin-linking::DESIGN::#public-items"]
quote = '''
- `Symbol` is the typed handle to a resolved function-pointer symbol. `T` is restricted by the sealed `LibrarySymbol` marker. `Symbol::get(&self) -> T` returns the function pointer by value.
- `StaticRef` is the typed handle to a resolved static-data symbol (the pointer-to-static-struct pattern every extension ABI uses for its descriptor export). `T: 'static` is arbitrary data. `StaticRef::get(&self) -> &T` dereferences the pointer.
---
- `Library::resolve<F: LibrarySymbol>(&self, name)` resolves a function-pointer symbol into `Symbol<'_, F>`. `Symbol::get` returns the fn pointer by value via the `transmute_copy`-from-raw-pointer pattern that matches the platform loader's contract for function symbols.
- `Library::resolve_static<T: 'static>(&self, name)` resolves a static-data symbol into `StaticRef<'_, T>`. `StaticRef::get` dereferences the resolved pointer to `&T`. This is the pattern every extension ABI uses for its descriptor export.
---
`Symbol` and `StaticRef` are deliberately separate types. The pointer reinterpretation rules differ: for function pointers the resolved address IS the function-pointer value (transmute); for static data the address is the location of a `T` (deref). Hiding the distinction behind a single type would force runtime branching or unsafe; two types keep the soundness explicit.
'''
because = "The pointer reinterpretation rules differ; hiding the distinction behind a single type would force runtime branching or unsafe; two types keep the soundness explicit."
origin = "proposed"
written_by = "the design template of hilavitkutin-linking, agent-written, undated"
