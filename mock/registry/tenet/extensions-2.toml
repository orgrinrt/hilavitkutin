[[tenet]]
id = "the_extensions_crate_preserves_the_arbitrary_time_linking_invariant_by_construction_through_four_api_level_absences"
subject = "extensions"
what = "The extensions crate preserves, at the API level and by construction, the arbitrary-time linking invariant, which propagates forward from the linking crate. There is no global registry, so loading returns one extension and nothing accumulates them. There is no ecosystem-wide init barrier, so each extension completes its init before load returns and nothing waits on siblings. There is no cross-extension channel, so the host-opaque pointer is per extension. Drop is independent and per extension, closing one extension and releasing one library with no side effect visible to others."
mechanism = "No `load_all_extensions(manifest)` entry point, no `initialize_ecosystem()` call; consumers choose their own holding pattern (`Vec`, `Seq<Extension, N>`, `HashMap`, drop-immediately). The invariant propagates forward from `hilavitkutin-linking`."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:143-150"
