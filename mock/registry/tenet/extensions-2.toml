## Architectural position

The extension stack layers downward from the consumer's domain crate
to the OS:

- Consumer plugin ABI crates (e.g. `viola-plugin-abi`) define
  domain-specific `Provider` types that implement `ProviderExport`.
  These crates optionally wrap `#[export_extension]` under a domain-
  named attribute (e.g. `#[viola::plugin]`).
- `hilavitkutin-extensions-macros` is the proc-macro crate. It emits
  the `#[repr(C)]` descriptor, the `DESCRIPTOR_SYMBOL` export, the
  provider table, and trampolines from user trait impls.
- `hilavitkutin-extensions` (this crate) holds descriptor types, the
  discovery protocol, the lifecycle orchestrator, provider lookup,
  and failure policy.
- `hilavitkutin-linking` ships `dlopen` / `LoadLibrary` plus typed
  `Library` / `Symbol` / `StaticRef`.
- The OS dynamic loader sits underneath.

Dependency flow is strictly downward. The engine crate (`hilavitkutin`) does not depend on this one. Nor does the api, build-time, or ecosystem crates.
'''
