[[tenet]]
id = "discovery_has_one_step_beyond_opening_the_library_and_the_descriptor_is_validated_in_a_fixed_defensive_order_of_five_steps"
subject = "extensions"
what = "Discovery has exactly one step beyond opening the library: calling the function exported under the descriptor symbol, which returns a pointer to extension-static memory. The descriptor and the host's advertised providers fully determine validation, and the order of validation is fixed and defensive, each step building confidence that the next read is sound: tag, size, ABI version, length bounds, required host providers. A wrong tag stops all further reading."
mechanism = "Step 1 `descriptor.tag == EXTENSION_DESCRIPTOR_TAG` (else `DescriptorTagMismatch { found }`, no further fields read). Step 2 `descriptor.descriptor_size >= core::mem::size_of::<ExtensionDescriptor>()` (else `DescriptorSizeTooSmall { advertised, minimum }`). Step 3 `descriptor.abi_version == HOST_ABI_VERSION` (else `AbiVersionMismatch { expected, got }`). Step 4 `name_len`, `providers_len`, `required_host_providers_len` against `MAX_DESCRIPTOR_LIST_LEN` (else `DescriptorBoundsExceeded { field, len }`). Step 5 each id in `required_host_providers` against the host's provider set (else `RequiredHostProviderMissing { provider }`). The function returns `*const ExtensionDescriptor`."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:70-74"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#pull-based-discovery-protocol"]
quote = '''
## Pull-based discovery protocol

The discovery protocol has exactly one step beyond opening the library: call the function exported at the symbol name `DESCRIPTOR_SYMBOL`. That function returns `*const ExtensionDescriptor` pointing at extension-static memory. The descriptor contents plus the host's advertised provider set fully determine validation.

The host's descriptor-validation order is fixed and defensive. Each step builds confidence that the next step's read is sound. Step 1: tag check (`descriptor.tag == EXTENSION_DESCRIPTOR_TAG`). A wrong tag means the layout is suspect; the host surfaces `ExtensionError::DescriptorTagMismatch { found }` and reads no further fields. Step 2: descriptor-size check (`descriptor.descriptor_size >= core::mem::size_of::<ExtensionDescriptor>()`). With the layout established, the host ensures it reads only what its own version of `ExtensionDescriptor` knows; a smaller value surfaces `ExtensionError::DescriptorSizeTooSmall { advertised, minimum }`. Step 3: ABI version check (`descriptor.abi_version == HOST_ABI_VERSION`). The v1.1 layout is now sound; a wrong version surfaces `ExtensionError::AbiVersionMismatch { expected, got }`. Step 4: length-field bounds checks. Each of `name_len`, `providers_len`, and `required_host_providers_len` is validated against `MAX_DESCRIPTOR_LIST_LEN`; the first failure surfaces `ExtensionError::DescriptorBoundsExceeded { field, len }`. Step 5: required-host-provider check (the existing v1 step, unchanged). Each id in `required_host_providers` is verified against the host's advertised provider set; a missing id surfaces `ExtensionError::RequiredHostProviderMissing { provider }`.
'''
origin = "proposed"
written_by = "the design template of hilavitkutin-extensions, agent-written, undated"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
