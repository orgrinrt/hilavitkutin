[[tenet]]
id = "shutdown_runs_at_most_once_through_drop_or_close_and_the_host_opaque_pointer_is_per_extension"
subject = "extensions"
what = "Shutdown runs at most once, either through drop, which swallows errors, or through the explicit close, which returns them. A missing shutdown function is a no-op. The host-opaque pointer is per extension: the host allocates it or passes null at load time and threads the same pointer through init and shutdown, so two simultaneously loaded extensions never see each other's context through this channel."
mechanism = "`shutdown_fn(host_ctx)`; host-opaque `*mut c_void`. Named as one of the API-level enforcements of the arbitrary-time linking invariant."
source = "mock/crates/hilavitkutin-extensions/DESIGN.md.tmpl:96-98"
provenance = ["mock::crates::hilavitkutin-extensions::DESIGN::#lifecycle-contract"]
quote = '''
Shutdown: either drop runs `shutdown_fn(host_ctx)` and swallows errors, or `Extension::close(self)` runs it and returns the error. In both cases `shutdown_fn` is called at most once. If `None`, shutdown is a no-op.

The host-opaque pointer (`*mut c_void`) is per-extension. The host allocates it (or passes null) at load time and threads the same pointer through init and shutdown. Two simultaneously-loaded extensions never see each other's `host_ctx` through this channel. This is one of the API-level enforcements of the arbitrary-time linking invariant.
'''
