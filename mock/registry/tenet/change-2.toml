[[tenet]]
id = "a_replaceable_swap_installs_the_whole_value_as_one_blob_write_and_marks_the_store_dirty"
what = "Swapping a replaceable resource installs the whole value as one blob write and marks the store dirty, and there is no other pointer derivation on the swap path. The whole-blob install is the specified mechanism, since under the bench-decided layout a resource value is one reserved blob record; the earlier rule of copying leaf by leaf rested on a layout the bench refuted. The collection halves of a swapped value are outside the swap until the collection wiring lands."
mechanism = "The write goes through the same `Selector` witness the drain and the projection read use. A resource value is one reserved blob record (scalar snapshot plus live-streamed collections); `Seq` and `Map` halves gain per-record element writes only when the collection wiring lands."
source = "mock/research/202611130850_the-record-read-whole/RECOVERED.md:74-85"
provenance = ["mock::research::202611130850_the-record-read-whole::RECOVERED::#mock-crates-hilavitkutin-design-md-tmpl-lines-563-to-574"]
quote = '''
A `Replaceable` swap installs the whole value as one blob write through the
same `Selector` witness the drain and the projection read use, plus a
store-dirty mark; no other pointer derivation exists on the swap path. Under
the bench-decided storage layout a resource value is one reserved blob record
(scalar snapshot plus live-streamed collections), so the whole-blob install is
the specified mechanism, not an excluded shortcut. The earlier per-leaf-copy
rule was grounded on the refuted pre-bench layout, and the revert of the
one-line install that followed it was a mis-citation; the witnessed blob write
is canonical. Collection-bearing values gain per-record element writes for
their `Seq` and `Map` halves only when the collection wiring lands (tracked by
the catalogued swap test); until then the collection halves of a swapped value
are out of the swap's scope by design, not by omission.
'''
origin = "proposed"
written_by = "engine design template as on the branch recover/unlanded-rounds-and-benches, commit of 2026-08-30, not on dev; the text does not say whose it is"
standing = "provisional"
subject = "change"
keywords = ["Replaceable", "swap", "blob install", "store-dirty mark", "replace_value", "per-leaf copy", "Selector witness"]

[[tenet]]
id = "the_adapt_unit_publishes_its_metrics_snapshot_through_two_buffers_and_one_index_it_flips"
what = "The adapt unit publishes its metrics snapshot by a double buffer. The metrics resource holds two buffers and an index that says which is live. At the end of the schedule the adapt unit fills the buffer that is not live and then publishes it with one atomic store of the index; a consumer unit loads the index and reads the buffer it names."
mechanism = "`MetricsResource<T> { buffer_a, buffer_b, current: AtomicUsize }`; the writer writes the snapshot fields `Relaxed`, then `current.store(next_idx, Release)`; the reader does `current.load(Acquire)`, then `Relaxed` reads. The pattern resolves audit finding M1."
source = "mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1176-1176, mock/design_rounds/202605101036/202605101036_topic.plan-algorithm-chain.md:1181-1198"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.plan-algorithm-chain::#s7-cross-thread-atomic-ordering-protocol-added-2026-05-10-per-audit-2-structural-recommendation"]
quote = '''
| AdaptWu→`metrics::*` snapshot publish | AdaptWu (on whatever core runs the meta-WU) | Write all snapshot fields with `Relaxed`; then `current_buffer_idx.store(new_idx, Release)` (double-buffer pattern) | Consumer WU reading `metrics::*` | `current_buffer_idx.load(Acquire)`; then `Relaxed` reads of snapshot fields | `stlr` (idx only) / `ldar` (idx only) | `mov` / `mov` |
---
**Double-buffer pattern for AdaptWu snapshot publish (resolves audit M1):**

```rust
struct MetricsResource<T> {
    buffer_a: T,
    buffer_b: T,
    current: AtomicUsize,  // 0 = a is live, 1 = b is live
}

// AdaptWu at ScheduleEnd:
fn execute(&self, ctx: &Self::Ctx) {
    let mut r = ctx.writer::<MetricsResource<...>>();
    let next_idx = 1 - r.current.load(Ordering::Relaxed);
    let next_buf = if next_idx == 0 { &mut r.buffer_a } else { &mut r.buffer_b };
    // ... fill next_buf from AdaptArena slots (Relaxed reads paired
    //     with phase-barrier Acquire fence at WU entry) ...
    r.current.store(next_idx, Ordering::Release);  // single atomic publish
}
'''
