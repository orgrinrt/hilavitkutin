id = "as_of_round_202605101036_plan_affecting_is_a_sealed_marker_and_a_resource_without_it_is_swapped_cheaply"
what = "In the round of May 2026 the marker that makes a resource plan-affecting is sealed, taken by consumer opt-in or derived by macro. Replacing the value of a resource that carries it sets the dirty bit for a plan recompute; replacing one that does not is a cheap value swap. The default is not plan-affecting."
mechanism = "`pub trait PlanAffecting: BuilderInput + private::Sealed {}`; replacement through `Scheduler::replace_resource`."
source = "mock/design_rounds/202605101036/202605101036_topic.resource-resolution.md:33-41"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.resource-resolution::#axis-b-planaffecting-marker-trait"]
quote = '''
Sealed marker trait in `hilavitkutin-api`. Implementations are opt-in by consumers OR derived by macro:

```rust
pub trait PlanAffecting: BuilderInput + private::Sealed {}
```

When a `BuilderInput` impl carries `PlanAffecting`, replacing its value via `Scheduler::replace_resource` (or the equivalent post-rename method) triggers a plan recompute dirty bit. When it does NOT, replacement is a cheap value swap.

Default: NOT plan-affecting. Consumers opt in for resources whose value shape changes the plan (e.g., the `RunCfg` resource itself — the dispatch routing target). Most app-state resources (column data, intermediate accumulators, diagnostics) are NOT plan-affecting.
'''
