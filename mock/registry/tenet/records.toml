# The tenets whose subject is `records`.

[[tenet]]
id = "a_record_is_the_global_data_identity"
what = "\"Record\" is the global data identity: a column has N records, and a morsel windows into a range of records. It is not an entity and not a row."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2453-2455"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#resolutions"]
quote = '''
**R8. "record" is the global data identity.** (vocabulary)
Not "entity" (ECS connotation), not "row" (tabular connotation).
A column has N records. A morsel windows into a range of records.
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["record", "entity", "row", "morsel", "window", "range", "R8"]
rules_out = ["entity", "row"]

[[tenet]]
id = "storage_is_contiguous_and_a_fiber_s_columns_share_one_arena"
what = "Storage is contiguous and columnar. All columns of a fiber share one arena allocation with known static offsets, and columns of different fibers are separate allocations."
mechanism = "One base pointer per morsel, columns at `base + col_offset + i * stride`."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:395-399"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#04-column-memory-layout"]
quote = '''
- Contiguous columnar storage (all topics agree)
- Co-located arena within fibers (T6 L1770-1777): all columns in a
  fiber share one arena allocation with known static offsets. One base
  pointer per morsel, columns at `base + col_offset + i * stride`.
  Columns across different fibers are separate allocations.
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["contiguous", "columnar", "arena", "co-located", "fiber", "offset", "base pointer", "allocation"]

[[tenet]]
id = "each_column_has_its_own_stride_and_a_value_is_at_most_sixteen_bytes"
what = "Each column has its own stride, the size of its value type, and a stored value is at most sixteen bytes. There is no per-value flags byte; null and tombstone are a separate bitmask per column."
mechanism = "Stride = `size_of::<T>()` per column; `size_of::<T>() <= 16`."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:383-388"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#04-column-memory-layout"]
quote = '''
**Resolution R3: type-native stride, no flags byte.**
- Stride = `size_of::<T>()` per column. Each column has its own stride.
- No per-entry flags byte. Null/tombstone handled via separate bitmask
  per column (same pattern as fences moving to external progress counters).
- Value constraint becomes `size_of::<T>() <= 16` (was 15 with flags byte).
  Full 16 bytes usable. Clean power-of-two, fits u128, aligns with SIMD.
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["stride", "type-native", "16 bytes", "flags byte", "null", "tombstone", "bitmask", "R3"]

[[tenet]]
id = "records_within_a_fiber_are_independent"
what = "Records within a fiber are independent, and the order in which they are executed does not matter for correctness. The exception is resource accumulation with non-commutative operations, for which head and tail convergence is skipped."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:609-613"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#08-determinism-and-ordering"]
quote = '''
**Record independence within fibers:**
- Records within a fiber are independent (T6 L2910)
- Execution order of records doesn't matter for correctness
- Exception: resource accumulation with non-commutative ops — skip
  head+tail convergence for those (T6 L2938-2961)
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["independent", "record order", "cross-record", "accumulation", "non-commutative", "convergence"]

[[tenet]]
id = "the_engine_does_not_load_data_and_does_not_know_record_counts_ahead"
what = "hilavitkutin does not load data, does not allocate storage and does not know record counts ahead of time. It accepts whatever columns the consumer provides."
