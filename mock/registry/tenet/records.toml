[[tenet]]
id = "the_fiber_s_columns_are_one_neighbourhood_with_one_base_register_and_internal_columns_stay_in_registers"
what = "With co-location, all of a fiber's data lies in one cache-line neighbourhood, the columns internal to the fiber are register-to-register data paths, only the fiber's outputs are written to memory, and one base register with offset immediates replaces many separate pointers. A morsel boundary is one base pointer update."
mechanism = "`arena_base + col_A_offset + i * stride_A`; `arena_base + col_B_offset + i * stride_B`; record index `i` advances one cursor covering all columns."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:961-972"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#14-fiber-formation"]
quote = '''
All columns within a fiber share one arena allocation. The morsel
context has one base pointer. Each column at a known static offset:
```
arena_base + col_A_offset + i * stride_A
arena_base + col_B_offset + i * stride_B
```
Record index `i` advances one cursor covering all columns. Morsel boundary
= one base pointer update. Co-location means:
- All fiber data in one cache-line neighborhood
- Fiber-internal columns are register-to-register data paths (DSE)
- Fiber outputs are the only columns written to memory
- One base register + offset immediates, not N separate pointers
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["co-located arena", "base pointer", "offset immediates", "DSE", "register-to-register", "one cursor", "morsel boundary"]
cites = ["storage_is_contiguous_and_a_fiber_s_columns_share_one_arena"]

