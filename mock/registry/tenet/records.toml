[[tenet]]
id = "record_counts_are_known_when_loaders_complete_and_cascade_downstream"
subject = "records"
what = "Record counts are not known until the loaders complete. A downstream fiber, which the topic still calls a chain, computes its morsel ranges just in time, when its dependencies are first satisfied and the lengths of the upstream columns are known. For a fiber whose inputs come from other transform fibers and not from loaders the count cascades: if the upstream one processed N records, the downstream one also processes N, and the count propagates through the graph."
mechanism = "Morsel ranges are computed from `(0..current_progress).step_by(morsel_size)`; the progress counter provides the current count."
source = "mock/design_rounds/202604200055/202603121310_topic.memory-layout-and-platform.md:840-845, mock/design_rounds/202604200055/202603121310_topic.memory-layout-and-platform.md:860-863"
provenance = ["mock::design_rounds::202604200055::202603121310_topic.memory-layout-and-platform::#8-10-data-loading-loaders-as-root-ops"]
quote = '''
Row counts are not known until loaders complete. Downstream chains
compute their morsel ranges just-in-time — when their fence
dependencies are first satisfied, the upstream column lengths are
known. This is not a special case: the progress counter naturally
provides the current row count, and morsel ranges are computed from
(0..current_progress).step_by(morsel_size).
---
For chains whose inputs come from other transform chains (not
loaders), the row count cascades: if the upstream chain processed
N rows, the downstream chain also processes N rows. The count
propagates through the chain graph.
'''
