provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#16-data-loading"]
quote = '''
hilavitkutin does not load data, does not allocate storage, does not
know record counts ahead of time. The boundary is clean:
---
**hilavitkutin's responsibility:**
- Accept whatever columns the consumer provides
'''
origin = "stated"
standing = "provisional"
subject = "records"
keywords = ["record count", "data loading", "allocate", "consumer", "ahead of time", "columns provided"]

