[[tenet]]
id = "a_non_canonical_mechanism_is_not_kept_because_it_beats_nothing_and_single_trunk_phases_run_serially_until_head_and_tail_is_built"
what = "Deleting the N-way branch leaves single-trunk phases running serially until head and tail convergence is built, which is a real loss of parallelism on exactly the phases that most want it, and it is still the right move. The canon's parallelism comes from trunks, and a single-trunk phase legitimately has none until the mechanism the canon specifies exists. Keeping a non-canonical mechanism because it is faster than nothing is how drift became load-bearing in the first place, and the longer it stays the more of the engine is built against it."
mechanism = "Roadmap band W1 builds head and tail; its substrate (`HeadTailConvergence`, `RecordRange::Head` and `Tail`, `thread::Convergence`, the `commutative` flag computed at plan/mod.rs:422 and read nowhere) exists and is unwired."
source = "mock/design_rounds/202607192110/202607192100_topic.n-way-record-split-is-not-convergence.md:56-65"
provenance = ["mock::design_rounds::202607192110::202607192100_topic.n-way-record-split-is-not-convergence::#what-removing-it-costs-and-why-that-is-correct"]
quote = '''
Deleting the branch leaves single-trunk phases running serially until head+tail is built. That is a
real loss of parallelism on exactly the phases that most want it, and it is still the right move.
Canon's parallelism comes from trunks; a single-trunk phase legitimately has none until the
mechanism canon specifies exists. Keeping a non-canonical mechanism because it is faster than
nothing is how the drift became load-bearing in the first place, and the longer it stays the more
of the engine is built against it.

The replacement is roadmap band W1, whose substrate (`HeadTailConvergence`, `RecordRange::Head` and
`Tail`, `thread::Convergence`, the `commutative` flag already computed at `plan/mod.rs:422` and read
nowhere) exists and is unwired.
'''
