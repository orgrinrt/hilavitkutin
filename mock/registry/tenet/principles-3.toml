[[tenet]]
id = "an_allow_on_an_item_line_ending_in_an_opening_brace_is_kept_in_place_by_pinning_the_item_against_the_formatter_and_is_not_a_question_for_op"
subject = "principles"
what = "A lint allow comment on an item line that ends in an opening brace is kept where the lint reads it by pinning the item against the formatter, because the formatter otherwise moves the comment into the body, where it suppresses nothing. The earlier conclusion that nothing was wrongly suppressed was wrong: the strict gate reported live violations at exactly those items, and the allows were decorative while the gate passed only because those lints are advisory. The conflict between the same-line requirement and the formatter was never a wall for op."
mechanism = "`#[rustfmt::skip]` on the affected items; an allow on a line ending in `;` stays put, one on a line ending in `{` is moved into the body by rustfmt on every commit. The strict gate over both crates dropped from fourteen findings to five."
source = "mock/design_rounds/202608090500/202608090500_changelist.src.lock.md:55-70, mock/design_rounds/202608090700/202608090700_changelist.src.lock.md:48-57"
provenance = ["mock::design_rounds::202608090500::202608090500_changelist.src.lock::#change-lint-allow-comments-return-to-their-item-lines"]
quote = '''

rustfmt moved seven of them into bodies, where they suppress nothing. Restored
same-line, which is what the rule requires.

**This one does not fully hold, and the reason is worth recording rather than
hiding.** An allow on a line ending in `;` stays put; one on a line ending in `{`
is moved into the body by rustfmt on every commit, because a trailing comment
after an opening brace belongs to the block by its formatting rules. Moving it
back and committing moves it again.

So the same-line requirement and the formatter conflict for exactly that item
shape, and no edit to this crate resolves it. Three allows in `interner.rs` and
one in `shape.rs` sit inside bodies for that reason. The scoped gate passes with
them there, so nothing is suppressed that should not be, but the rule as written
cannot be satisfied without `#[rustfmt::skip]` or a change to the rule. That is
a workspace decision rather than this round's, and it is recorded for op.
---
The previous round recorded that an allow on a line ending in `{` cannot survive
rustfmt and concluded nothing was wrongly suppressed. **That conclusion was
wrong**: the strict gate reported live violations at exactly those items, so the
allows were decorative and the gate passed only because those lints are advisory.

`#[rustfmt::skip]` on the affected items keeps the allow where the lint reads it.
It was never a wall for op.

Verification: the strict gate over both crates drops from fourteen findings to
five, and the five that remain are pre-existing rather than introduced here.
'''
origin = "proposed"
written_by = "source changelists of rounds 202608090500 and 202608090700, agent-written; the earlier one records the conflict for op and the later one corrects it"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `make_formal_or_overturn_the_394_stamped_tenets_of_hilavitkut`'
keywords = ["lint allow", "rustfmt::skip", "same-line requirement", "opening brace", "strict gate", "decorative allow", "formatter"]
rejects = ["the rule as written cannot be satisfied without #[rustfmt::skip] or a change to the rule", "nothing was wrongly suppressed"]
related = ["tenet::the_lint_allow_escape_hatch_is_for_a_genuinely_unavoidable_boundary_and_always_carries_a_tracked_remediation_task"]

