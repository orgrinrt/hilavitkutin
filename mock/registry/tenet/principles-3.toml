[[tenet]]
id = "every_type_is_a_trait_a_newtype_or_a_c_layout_enum_and_there_is_no_fourth_bare_primitive_category"
what = "Every type anywhere in source, public or private, in a signature or a field, falls into one of three categories. A trait is for varying behaviour, a shared contract or extensibility, a newtype is for a fixed representation with validation at construction, and a C-layout enum is for a closed set that crosses an ABI boundary. There is no fourth bare primitive category, and every numeric identity flows through the type system of arvo."
mechanism = "Trait: arithmetic ops, sinks, platform providers. Newtype: `UFixed<I, F, S>`, `USize`, `Bool`, `ContentHash`, strategy markers. `repr(C)` enum: `Priority`, `ErrorClass`."
rules_out = ["a fourth bare primitive category", "raw u8..u128, i8..i128, f32, f64, usize, isize or bool in source"]
source = "mock/PRINCIPLES.md.tmpl:81-94"
provenance = ["mock::PRINCIPLES::#type-taxonomy"]
quote = '''
## Type taxonomy

Every type anywhere in source, public or private, fn sig or field,
local or cast expression, falls into one of three categories:

| Category | When | Examples |
|----------|------|----------|
| **Trait** | Varying behavior, shared contract, extensible | arithmetic ops, sinks, platform providers |
| **Newtype** | Fixed representation, validation at construction | `UFixed<I, F, S>`, `USize`, `Bool`, `ContentHash`, strategy markers |
| **`repr(C)` enum** | Closed set, crosses ABI boundary | `Priority`, `ErrorClass` |

There is no fourth "bare primitive" category. Raw `u8`..`u128`,
`i8`..`i128`, `f32`, `f64`, `usize`, `isize`, `bool` never appear in
source; every numeric identity flows through arvo's type system.
'''
origin = "stated"
standing = "provisional"
subject = "principles"
keywords = ["type taxonomy", "trait", "newtype", "repr(C) enum", "no fourth category", "UFixed", "ContentHash", "Priority"]
cites = ["the_type_taxonomy_is_trait_newtype_repr_c_enum_or_primitive_and_it_governs_the_form_of_every_type"]

[[tenet]]
id = "container_capacity_lives_at_type_level_and_a_consumer_needing_more_picks_the_bigger_type"
what = "Every container's capacity lives at type level. There is no runtime resize and no runtime growth, and a consumer that needs a bigger container picks the bigger type."
because = "It is what the no heap principle bottoms out in at the storage layer: capacity is a compile-time choice the consumer makes once and not a runtime allocation the callee fabricates."
