[[tenet]]
id = "meta_units_declare_a_distinct_schedule_marker_because_one_marker_cannot_classify_meta_and_consumer_units_without_overlap"
subject = "meta"
what = "Meta units declare a schedule marker distinct from the consumer's one, because the lifecycle classification of a meta unit against a consumer unit cannot use a single marker: a blanket implementation and a specific one conflict, a negative bound is not expressible, and full specialization is forbidden. Three disjoint classification implementations then cover every schedule with no overlap, and the lifecycle rank is carried only by the four closed-set meta markers."
because = "A blanket implementation for the consumer default plus a specific one for the meta marker conflict, a negative bound is not expressible, and full specialization is forbidden by the workspace's unstable-features rule."
mechanism = "`OnMeta<V>` in place of canonical `On<meta::V>`; `impl Lifecycle for Always`, `impl<V> Lifecycle for On<V>` (`RANK_CONSUMER`), `impl<V: MetaVirtual> Lifecycle for OnMeta<V>` (`<V as MetaVirtual>::RANK`); `MetaVirtual` on `PlanStage` / `ScheduleReady` / `PassStart` / `ScheduleEnd`; E0119; sketch `202606082000_e4-slice2-lifecycle-classify` WORKS; core-design `:720`/`:757`/`:764`."
source = "mock/design_rounds/202606082100/202606082100_changelist.doc.lock.md:56-65, mock/design_rounds/202606082100/202606082100_changelist.doc.lock.md:67-80"
provenance = ["mock::design_rounds::202606082100::202606082100_changelist.doc.lock::#forced-surface-deviation-onmeta-v-not-on-meta-v"]
quote = '''
## Forced surface deviation: `OnMeta<V>` not `On<meta::V>`

The canonical writes meta work units as `WorkUnit<On<meta::PlanStage>>`
(core-design `:720`/`:757`/`:764`). The de-risk sketch
(`202606082000_e4-slice2-lifecycle-classify`) proved that const-time lifecycle
classification of a meta work unit versus a consumer work unit CANNOT use the
same `On<V>` marker: a blanket `impl<V> Lifecycle for On<V>` (consumer default)
plus a specific `impl Lifecycle for On<meta::PlanStage>` (meta) conflict
(E0119), a negative bound `V: !MetaVirtual` is not expressible, and full
specialization is forbidden (`unstable-features.md`).
---
The escape (proven `WORKS`): meta work units declare a distinct schedule marker
`OnMeta<V>` (versus consumer `On<V>`). Three disjoint `Lifecycle` impls then
classify every schedule with no overlap and no specialization:

```rust
impl Lifecycle for Always                    { const RANK: Rank = RANK_CONSUMER; }
impl<V> Lifecycle for On<V>                  { const RANK: Rank = RANK_CONSUMER; }
impl<V: MetaVirtual> Lifecycle for OnMeta<V> { const RANK: Rank = <V as MetaVirtual>::RANK; }
```

`MetaVirtual` is implemented only on the four closed-set meta markers
(`PlanStage` / `ScheduleReady` / `PassStart` / `ScheduleEnd`), each carrying a
const lifecycle rank. A const fold over a mixed carrier yields the correct
per-unit rank array.
'''
origin = "proposed"
written_by = "design round 202606082100, doc changelist for GATE-2 E4 slice-2 self-hosting meta pipeline, section on a forced surface deviation, dated 2026-06-08, agent-written; the text does not say whose decision it is"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["OnMeta", "On<meta::V>", "Lifecycle", "MetaVirtual", "E0119", "lifecycle rank", "meta work unit", "forced deviation"]
rejects = ["const-time lifecycle classification of a meta work unit versus a consumer work unit CANNOT use the same `On<V>` marker"]
