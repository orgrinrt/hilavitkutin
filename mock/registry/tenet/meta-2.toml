[[tenet]]
id = "the_scheduler_metrics_are_engine_owned_in_a_meta_block_written_by_the_scheduler_and_read_through_a_meta_access_gated_context_accessor"
subject = "meta"
what = "Meta state is engine-owned, held in a block on the scheduler and not in a store, because consumer stores are copy and read-only. A meta unit reads it through a context accessor gated on the meta-access marker, which a consumer unit's context does not have, and the engine maintains the pass count per pass for a consumer end-of-schedule hook to read."
because = "A consumer resource is Copy and read-only after init, so it cannot carry mutable per-pass state, and the resource-backed design hit a hard compile wall."
mechanism = "`MetaBlock` on the scheduler; `MetaRef`; `meta::<T>()` accessor with `T: MetaAccess` implemented only on the Ctx carrying a `MetaRef`; consumer `MetaNil` Ctx has none; `SchedulerMetrics::pass_count` maintained per pass by `run`; read by an `OnMeta<ScheduleEnd>` hook as `ctx.meta::<SchedulerMetrics>()`; sketch `202606090300` candidate 1 (the bridge); resolution `202606090100` Correction 2."
