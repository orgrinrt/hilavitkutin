# What the record says about `meta`, part 2.

[[tenet]]
id = "the_plan_stage_reserves_cache_budget_from_the_axes_the_consumer_registered_and_not_from_a_worst_case"
subject = "meta"
what = "With no composite adaptation configuration structure, the plan stage reserves its cache budget by walking the axes the consumer actually registered and computing how many are active in a pass from their literal sampling skip values. The reservation follows the consumer's own configuration and is tighter than a worst case where every axis is active."
because = "The registered values are concrete when the scheduler is built and are not hidden behind a preset enum, so a window analysis over the sampling cadences becomes feasible."
mechanism = "Per-axis `sample_skip` values read from the registered axis configurations; the LCM-window analysis proposed by the M1 alternative; no preset enum."
source = "mock/design_rounds/202605101036/202605101036_topic.adapt-subsystem.md:288-288"
provenance = ["mock::design_rounds::202605101036::202605101036_topic.adapt-subsystem::#decision-log"]
quote = '''
- [x] **(Audit M1 dissolves with the Kit reframe.)** Without a composite `AdaptConfig` struct, presets are not const fns over a single struct; they are Kits over the individual axis-configs. The "M1 budget reservation: literal-skip-presets vs worst-case-all-active" question collapses: each consumer's actual registered set of axis-configs determines the per-axis `sample_skip` values; plan stage walks the registered axes and computes max-active-this-pass from those literal values. **Plan stage uses cadence-aware budget reservation** — the LCM-window analysis the M1 alternative proposed becomes feasible because the registered values are concrete at `.build()` time, not hidden behind a preset enum. No worst-case-all-active needed; the consumer's actual configuration determines the budget. This is strictly tighter than worst-case and was unlocked by the reframe.
