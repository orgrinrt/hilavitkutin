[[tenet]]
id = "allocation_is_managed_by_the_scheduler_and_declared_at_compile_time_and_never_fabricated_at_runtime"
subject = "principles"
what = "No allocation is ad hoc. Allocation is managed by the scheduler and declared at compile time, and nothing fabricates it at runtime. No standard library and no allocator are the universe of the stack, before they are crate attributes, and the vector, box, reference-counted pointers, hash map, owned string and formatting macro do not exist in it."
mechanism = "`#![no_std]` + `#![no_alloc]`; `Vec`, `Box`, `Rc`, `Arc`, `HashMap`, `String` and `format!` do not exist."
source = "mock/PRINCIPLES.md.tmpl:5-10"
provenance = ["mock::PRINCIPLES::#no-heap-ever"]
quote = '''
## No heap. Ever.

No ad-hoc allocations. Allocation is scheduler-managed, declared at
compile time, never runtime-fabricated. `#![no_std]` + `#![no_alloc]`
aren't crate attributes first, they're the universe. `Vec`, `Box`,
`Rc`, `Arc`, `HashMap`, `String`, `format!` don't exist here.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
