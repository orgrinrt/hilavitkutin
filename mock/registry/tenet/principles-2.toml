[[tenet]]
id = "a_position_where_two_implementations_with_different_behaviour_are_imaginable_is_a_trait_slot_and_never_an_extensible_enum"
what = "Where two implementations with different behaviour can be imagined, the position is a trait slot and not a concrete type. A set that would need room for plugin extensions is not an enum and is a trait."
source = "mock/PRINCIPLES.md.tmpl:57-58, mock/PRINCIPLES.md.tmpl:96-97, mock/PRINCIPLES.md.tmpl:99-100"
provenance = ["mock::PRINCIPLES::#think-in-traits-not-types"]
quote = '''
**Decision test:** "Can I imagine two implementations with different
behavior?" If yes, it's a trait slot, not a concrete type.
---
Decision test is the same as above: if two plausible implementations
could differ, it's a trait.
---
If you're asking "should this enum have room for plugin extensions?"
It shouldn't be an enum. It should be a trait.
'''
origin = "stated"
standing = "provisional"
subject = "principles"
keywords = ["decision test", "two implementations", "trait slot", "enum", "plugin extension", "concrete type"]

[[tenet]]
id = "trait_signatures_return_iterators_and_take_sinks_and_never_name_a_vector_or_boxed_slice"
what = "As a direct consequence of the two principles stated above it, trait return types use an iterator, a slice reference bound or an associated type, and sink positions take a mutable collector, diagnostic sink or byte emitter. Concrete collection types are implementation choices and not contracts."
mechanism = "Returns: `impl IntoIterator`, `AsRef<[T]>`, associated types. Sinks: `&mut impl Collector<T>` / `&mut impl DiagnosticSink` / `&mut impl ByteEmitter`."
rules_out = ["Vec in trait signatures", "Box<[T]> in trait signatures", "concrete collection types as contracts"]
source = "mock/PRINCIPLES.md.tmpl:60-66"
provenance = ["mock::PRINCIPLES::#no-vec-or-box-t-in-trait-signatures"]
quote = '''
## No `Vec` or `Box<[T]>` in trait signatures

Direct consequence of the two principles above. Trait return types
use `impl IntoIterator`, `AsRef<[T]>`, or associated types. Sink
positions take `&mut impl Collector<T>` / `&mut impl DiagnosticSink`
/ `&mut impl ByteEmitter`. Concrete collection types are
implementation choices, not contracts.
'''
origin = "stated"
standing = "provisional"
subject = "principles"
keywords = ["no Vec", "Box<[T]>", "IntoIterator", "Collector", "DiagnosticSink", "ByteEmitter", "trait signature", "sink"]
cites = ["allocation_is_managed_by_the_scheduler_and_declared_at_compile_time_and_never_fabricated_at_runtime"]

