[[tenet]]
id = "the_primitive_vocabulary_table_names_the_stack_type_that_replaces_each_bare_primitive_and_applies_everywhere"
subject = "principles"
what = "The primitive vocabulary documents which stack type replaces which bare primitive. It is not a table for the public interface only, and every mapping applies everywhere the bare primitive might otherwise appear."
mechanism = "Option to Maybe and Result to Outcome (notko); Vec return to an iterator or trait-bound sink; mutable Vec parameter to a Collector sink; HashMap to a KeyValueStore sink or `Map<K, V, N>`; owned String to `Str`; non-static &str to `&'static str` or `Str`; usize and isize to `USize` / `ISize` / `Cap` / a domain newtype; u8..u128 and i8..i128 to `UFixed` / `IFixed` / `T: Boundable` / `T: NonZeroable`; f32 and f64 to `FastFloat` / `StrictFloat`; bool to `Bool`."
source = "mock/PRINCIPLES.md.tmpl:159-178"
provenance = ["mock::PRINCIPLES::#primitive-vocabulary-the-stack-s-own"]
quote = '''
## Primitive vocabulary (the stack's own)

The rule is "no bare primitives anywhere" (section above); the table
here documents WHICH stack type replaces WHICH bare primitive. It is
not a "for public API only" table. Every mapping applies everywhere
the bare primitive might otherwise appear.

| Don't | Do | Lives in |
|-------|----|----------|
| `Option<T>` | `Maybe<T>` | `notko` |
| `Result<T, E>` | `Outcome<T, E>` | `notko` |
| `Vec<T>` return | `impl IntoIterator<Item=T>` / trait-bound sink | trait at the API boundary |
| `&mut Vec<T>` param | `&mut impl Collector<T>` | hilavitkutin-api contracts |
| `HashMap<K, V>` | `&mut impl KeyValueStore<K, V>` / `Map<K, V, N>` | hilavitkutin-api |
| `String` owned | `Str` | `hilavitkutin-str` |
| `&str` non-static | `&'static str` or `Str` | as above |
| `usize` / `isize` | `USize` / `ISize` / `Cap` / domain newtype | `arvo::newtype` |
| `u8..u128` / `i8..i128` | `UFixed` / `IFixed` / `T: Boundable` / `T: NonZeroable` | `arvo` / `notko` traits |
| `f32` / `f64` | `FastFloat` / `StrictFloat` | `arvo::newtype` |
| `bool` | `Bool` | `arvo::newtype` |
'''
origin = "stated"
standing = "pending"
stamp = 'provisional, 2026-11-13: its lines mock/PRINCIPLES.md.tmpl:159-178 were written by 8e63891 and 04e1cb9 of 2026-04-20, which ported the shared principles fragment of the workspace and tightened its bare-primitive section, and not by the seed 680a672, and no capture of op speaks of that fragment; the founding spec scopes the raw-primitives lint to struct fields and public functions at mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2240-2241 and keeps a primitive among the four forms of type at mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2205-2206, so a table applying everywhere is the point row no_bare_primitive_exists_anywhere_in_the_stack puts to op; searched mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:130-270 and mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2198-2256, so it is not ratified by default from the written history and stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
