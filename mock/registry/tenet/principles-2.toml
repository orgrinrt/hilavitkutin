# What the record says about `principles`, part 2.

[[tenet]]
id = "lock_free_dispatch_is_a_library_guarantee_and_the_only_atomics_are_progress_counters_with_plain_store_and_load"
subject = "principles"
what = "Dispatch is lock-free by construction: a static dispatch table, one writer and N readers, and deterministic morsel assignment. There are no locks and no compare-and-swap in the dispatch path, and the only atomics are progress counters using plain store and load, never read-modify-write. This is a library guarantee and not an Executor implementation detail."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1629-1634"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#17-dispatch-codegen"]
quote = '''
**Lock-free guarantee (T3 decisions #103-104):**
- Lock-free dispatch by construction: static dispatch table,
  one-writer-N-readers, deterministic morsel assignment
- This is a library guarantee, not an Executor implementation detail
- No locks, no CAS in the dispatch path. The only atomics are
  progress counters (plain store/load, not RMW).
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1629-1634"]
keywords = ["lock-free", "static dispatch table", "one-writer-N-readers", "no CAS", "library guarantee", "Executor", "progress counters"]

[[tenet]]
id = "caps_are_defaults_and_never_policy_so_a_sketch_arc_looks_for_cap_lifting_shapes_now"
subject = "principles"
what = "Consumer-tunable caps get a redesign arc now. The fixed caps exist because current rustc rejects field access on generic constants and the trait solver overflows on config-driven sizes. The rule that caps are defaults and never policy outranks the convenience of the workaround, so a sketch arc investigates cap-lifting shapes before more code accretes on the fixed sizes."
mechanism = "Fixed caps: `GATE2_MAX_UNITS = 256`, `GATE2_MAX_ACCUMS = 16`, `plan_dirty: [AtomicBool; 256]`, `MAX_CORES`. Cause: no field access on generic constants under `generic_const_exprs`, and trait-solver overflow on `Cfg`-driven sizes. Shapes to investigate: macro-generated per-cap instantiations, associated-const indirection, alternative bound layering. The rule is called the substrate rule in the text."
source = "mock/research/202606111400_canonical-design-addendum-a1.md:61-68"
