[[tenet]]
id = "no_bare_primitive_exists_anywhere_in_the_stack"
subject = "principles"
what = "Bare numeric types, booleans, option and result types, owned strings and non-static string slices do not exist in the stack. They are not allowed in public signatures, private fields, local bindings, casts, literal suffixes, type aliases, constant and static declarations, trait method parameters, where clauses or tuple-struct fields."
mechanism = "Banned: `u8` through `u128`, `i8` through `i128`, `f32`, `f64`, `usize`, `isize`, `bool`, `Option`, `Result`, `String`, non-static `&str`."
rejects = ["bare primitives in public signatures", "bare primitives in private fields", "bare primitives in internal let bindings", "bare primitives in cast expressions", "bare primitives in literal suffixes", "bare primitives in type aliases", "bare primitives in const and static declarations", "bare primitives in trait method parameter types", "bare primitives in where clauses", "bare primitives in tuple-struct fields"]
source = "mock/PRINCIPLES.md.tmpl:17-27"
provenance = ["mock::PRINCIPLES::#no-bare-primitives-anywhere"]
quote = '''
## No bare primitives. Anywhere.

`u8` through `u128`, `i8` through `i128`, `f32`, `f64`, `usize`,
`isize`, `bool`, `Option`, `Result`, `String`, non-static `&str`, **they do not exist in this stack.** Not in public signatures, not
in private fields, not in internal `let` bindings, not in cast
expressions, not in literal suffixes, not in type aliases, not in
`const`/`static` declarations, not in trait method parameter types,
not in `where` clauses, not in tuple-struct fields.

Substitute vocabulary lives in arvo (`UFixed` / `IFixed` /
`FastFloat` / `StrictFloat` / `USize` / `Cap` / `Bool`) and notko
'''
