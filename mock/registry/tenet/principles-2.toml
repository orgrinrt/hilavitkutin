[[tenet]]
id = "all_dispatch_goes_through_monomorphised_trait_bounds_because_dyn_forces_late_binding_heap_and_unstable_vtable_layouts"
what = "All dispatch goes through monomorphised trait bounds, and no dynamic dispatch, boxed trait object or runtime dispatch is used."
because = "Dynamic dispatch forces late binding, heap through a boxed trait object, and vtable layouts that are not stable across compilations or dynamic library loading boundaries."
rules_out = ["dyn Trait", "Box<dyn>", "runtime dispatch"]
source = "mock/PRINCIPLES.md.tmpl:72-76"
provenance = ["mock::PRINCIPLES::#no-dyn-no-box-dyn-no-runtime-dispatch"]
quote = '''
## No `dyn`, no `Box<dyn>`, no runtime dispatch

All dispatch goes through monomorphised trait bounds. `dyn Trait`
forces late binding, heap via `Box<dyn>`, and vtable layouts that
aren't stable across compilations or `dlopen` boundaries.
'''
origin = "stated"
standing = "provisional"
subject = "principles"
keywords = ["no dyn", "Box<dyn>", "late binding", "vtable layout", "dlopen", "monomorphised trait bounds", "runtime dispatch"]
cites = ["dyn_is_banned_entirely_with_no_exceptions"]
