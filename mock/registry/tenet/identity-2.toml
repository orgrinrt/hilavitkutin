[[tenet]]
id = "the_identity_handle_is_four_bytes_with_a_four_bit_kind_over_a_twenty_eight_bit_id_and_handles_of_different_kind_are_never_equal"
subject = "identity"
what = "The identity handle of the generic interned-identity core is a four-byte handle with a four-bit kind over a twenty-eight-bit id. This reinterprets the four high bits of the current string handle layout, one origin bit plus three reserved, as one kind field, so every bit pattern a string handle holds today is a valid handle. Equality is integer equality over the whole thirty-two bits, so two handles with different kinds are never equal whatever their ids, and that disjointness by kind is the core property the whole design rests on."
mechanism = "`hilavitkutin-sym` defines `Sym`, a `#[repr(transparent)]` 4-byte handle over a `SymLayout` bitfield with `kind: 4 at 28` and `id: 28 at 0`; a zero-byte-change reinterpretation of the current `Str` layout."
source = "mock/design_rounds/202607241915/202607241915_topic.sym-generic-interned-identity.md:22-22"
provenance = ["mock::design_rounds::202607241915::202607241915_topic.sym-generic-interned-identity::#changes-proposed"]
quote = '''
The identity handle. `hilavitkutin-sym` defines `Sym`, a 4-byte `#[repr(transparent)]` handle over a `SymLayout` bitfield with `kind: 4 at 28` and `id: 28 at 0`. This reinterprets the current `Str` layout's four high bits (one origin plus three reserved) as one 4-bit `kind` field over the same 28-bit id. It is a zero-byte-change reinterpretation: every bit pattern a `Str` can hold today is a valid `Sym`, and the fields simply gain a unified meaning. `Sym` carries integer-equality identity on its whole 32-bit layout, so two `Sym`s with different `kind` values are never equal whatever their ids. That disjointness by kind is the core property the whole design rests on.
'''
