[[tenet]]
id = "the_shape_trait_is_a_const_trait_so_handle_construction_is_const_and_generic_over_every_shape_and_no_per_name_const_shim_stands"
subject = "identity"
what = "Making the shape trait itself a const trait gives a const construction path that is generic over every shape. A refused bound on an associated type was one bound spelling and not a wall. The per-name const shim added on the default shape, on the reading that a generic const path was unavailable, is deleted, and the string crate returns to the plain names."
mechanism = "`pub const trait SymShape` with `type Layout: [const] SymLayoutOps`; `const_trait_impl` is a vetted allowed feature. `[const]` bounds belong on trait impls and on function `where` clauses, not on inherent impl headers: `pub const fn new(..) -> Self where S: [const] SymShape` is accepted, `impl<S: [const] SymShape>` is not. Deleted: `new_const`, `to_bits_const`, `with_flag_const`, `id_const`, `kind_const`, `flag_const`."
source = "mock/design_rounds/202608090130/202608090130_topic.the-origin-mechanism-round-one-only-named.md:73-80, mock/design_rounds/202608090130/202608090130_topic.the-origin-mechanism-round-one-only-named.md:82-85, mock/design_rounds/202608090130/202608090130_changelist.src.lock.md:64-68"
provenance = ["mock::design_rounds::202608090130::202608090130_topic.the-origin-mechanism-round-one-only-named::#the-const-traits-correction-which-is-the-more-useful-lesson"]
quote = '''
Round one hit `Layout: [const] SymLayoutOps` being refused on an associated type
bound, concluded const construction was unavailable generically, and shipped a
`*_const` shim on the default shape.

That was backwards. `const_trait_impl` is a vetted allowed feature, the crate
already gates on it, and this stack wants const traits wherever they apply. The
refusal was one bound spelling, not a wall. **Making `SymShape` itself a const
trait works**, and the const path is then generic over every shape:
---
- `pub const trait SymShape` with `type Layout: [const] SymLayoutOps`.
- `[const]` bounds belong on trait impls and on function `where` clauses, not on
  inherent impl headers. `pub const fn new(..) -> Self where S: [const] SymShape`
  is accepted; `impl<S: [const] SymShape>` is not.
---
The previous round added `new_const`, `to_bits_const`, `with_flag_const`,
`id_const`, `kind_const` and `flag_const` on the default shape, on the reading
that a generic const path was unavailable. Making `SymShape` const gives the
generic path, so the shim goes and `hilavitkutin-str` returns to the plain
names.
'''
origin = "proposed"
written_by = "topic and source changelist of round 202608090130 'the origin mechanism round one described and did not build', agent-written"
standing = "provisional"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["SymShape", "const trait", "const_trait_impl", "const shim", "new_const", "[const] bound", "generic const path"]
rejects = ["a `*_const` shim on the default shape"]
