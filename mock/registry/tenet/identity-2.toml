[[tenet]]
id = "the_ecosystem_crates_are_standalone_and_consumers_opt_into_them"
subject = "identity"
what = "The context, persistence, identity core, string, kit and providers crates are standalone ecosystem crates that consumers opt into. The context, persistence, identity core and string crates are pure ecosystem crates that the engine does not depend on."
mechanism = "hilavitkutin-ctx, -persistence, -sym, -str, -kit, -providers: standalone, opt-in. ctx, persistence, sym, str: the engine does not depend on them."
source = "mock/DESIGN.md.tmpl:32-32"
provenance = ["mock::DESIGN::#dependency-graph"]
quote = '''
hilavitkutin-ctx, -persistence, -sym, -str, -kit, -providers are standalone ecosystem crates that consumers opt into. ctx, persistence, sym, str are pure ecosystem (engine does not depend on them). hilavitkutin-str depends on hilavitkutin-sym for the identity handle; hilavitkutin-sym itself depends only on the foundations (arvo, notko), sitting below the rest of the ecosystem. kit is a contract crate the engine depends on for its `.add_kit()` method, but it has no reverse dependency on the engine; consumers can author Kits without pulling the engine in. providers ships default Kit impls consumers wire in (interner, future ColumnStorage / Clock / Memory defaults); it consumes api + str + kit + the foundations crates, no reverse dep.
'''
origin = "proposed"
written_by = "the design template of the workspace, agent-written, undated"
standing = "provisional"
keywords = ["ecosystem crates", "standalone", "opt-in", "engine does not depend", "ctx", "persistence", "sym", "str", "kit", "providers"]

