# What the record says about `identity`, part 2.

[[tenet]]
id = "the_graph_crate_holds_the_dag_algorithms_for_ordering_ranks_paths_waists_and_renumbering"
what = "The graph crate holds the DAG algorithms: topological sort with a fixed-size queue, connected components, weighted longest and shortest paths, upward and downward rank, critical path analysis, waist detection and node renumbering that matches the reverse topological order."
mechanism = "Kahn's topological sort (fixed-size queue + in-degree array); connected components (DFS/BFS on bitmask adjacency); `rank(u) = cost(u) + max(rank(successors(u)))`; waist detection by concurrent path counting in topo order; node renumbering to sequential IDs matching reverse topo order (prefetcher-optimal access)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:207-215"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#01-arvo-primitives"]
quote = '''
- Topological sort (Kahn's): fixed-size queue + in-degree array
- Connected components: DFS/BFS on bitmask adjacency
- Longest/shortest weighted path
- Upward/downward rank computation: `rank(u) = cost(u) +
  max(rank(successors(u)))`
- Critical path analysis
- Waist detection: concurrent path counting in DAG topo order
- Node renumbering: sequential IDs matching reverse topo order
  (prefetcher-optimal access)
'''
origin = "stated"
standing = "provisional"
subject = "identity"
keywords = ["arvo-graph", "Kahn's", "topological sort", "connected components", "rank", "critical path", "waist detection", "renumbering"]

