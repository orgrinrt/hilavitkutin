[[tenet]]
id = "the_consumer_materialises_external_data_into_columns_through_its_own_loader_units_and_manages_storage_lifecycle"
subject = "identity"
what = "The consumer materialises external data into the engine's columns before execution, through loader units it defines, provides the memory provider, and manages the storage lifecycle: allocation, growth and eviction via the R2 APIs. The engine accepts whatever columns the consumer provides."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1465-1475"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#16-data-loading"]
quote = '''
**Consumer's responsibility:**
- Provide a MemoryProvider (domain 02 platform traits)
- Materialise external data into hilavitkutin columns before execution
- Define loader WorkUnits (`type Read = ()`, `type Write = (Column<A>,
  ...)`) that bridge from external data to columns
- Manage storage lifecycle (allocation, growth, eviction via R2 APIs)

**hilavitkutin's responsibility:**
- Accept whatever columns the consumer provides
- Build the DAG from WU Read/Write declarations (loaders are root nodes
  with no read dependencies)
'''
