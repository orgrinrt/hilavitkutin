[[tenet]]
id = "the_unified_mechanism_is_the_runtime_plan_to_compile_time_per_core_program_bridge_and_fiber_shape_typestate_is_its_unproven_realisation"
subject = "plan"
what = "With the special-casing gone there is no registration-order walk that works for single core to ship first. The real mechanism is unavoidable for all core counts: the bridge from the runtime plan to a compile-time per-core program, where the topology of fibers, phases and cores is a function of the associated types of the access sets, which only the trait solver sees. The per-fiber shape typestate is its likely realisation and the highest-risk unproven step, which the engine-completion roadmap must sketch-prove."
mechanism = "Per-fiber `FiberShape` typestate; \"build time = the type system\"; topology as a function of the WU `AccessSet` associated types."
source = "mock/research/202606061000_canon-amendment-unified-engine.md:28-30"
provenance = ["mock::research::202606061000_canon-amendment-unified-engine::#consequence-for-the-dispatch-design"]
quote = '''
## Consequence for the dispatch design

The easy escape hatch is gone: there is no "registration-order cons-list walk that works for single core" to ship first. The real unified mechanism is unavoidable, the runtime-plan-to-compile-time per-core-program bridge ("build time = the type system": the fiber/phase/core topology is a function of the WU `AccessSet` associated types, which only the trait solver sees), for all core counts. The per-fiber `FiberShape` typestate is its likely realization and the highest-risk unproven step the engine-completion roadmap must sketch-prove.
'''
origin = "proposed"
written_by = "canon amendment of 2026-06-06 on the unified engine, the working out under the maintainer's ruling, written in the first person by an author the text does not name"
standing = "provisional"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["FiberShape", "typestate", "per-core program", "build time = the type system", "AccessSet", "trait solver", "sketch-prove", "highest risk"]
rejects = ["a registration-order cons-list walk that works for single core, shipped first"]
