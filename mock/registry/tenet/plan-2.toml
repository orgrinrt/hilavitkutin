[[tenet]]
id = "dulmage_mendelsohn_splits_the_pipeline_into_dead_end_units_input_only_columns_and_a_matched_core"
subject = "plan"
what = "Dulmage-Mendelsohn refines the block structure into three kinds of component. Horizontal components are units whose output columns no other unit reads, dead ends whose output can be eliminated unless it is a final consumer output. Vertical components are columns that are only inputs, never written by transform units and read-only for all phases after loading. Square components are matched unit and column pairs where every unit's output is consumed, the core of the pipeline."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1357-1365"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
Dulmage-Mendelsohn refines the block structure:
- Horizontal components: WUs whose output columns are never read by
  any other WU. These are dead-end WUs — their output can be
  eliminated entirely unless it's a final consumer output.
- Vertical components: columns that are only inputs (loaded by root
  WUs, never written by transform WUs). These are read-only for all
  phases after loading.
- Square components: matched WU-column pairs where every WU's output
  is consumed. The core of the pipeline.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1357-1365"]
keywords = ["Dulmage-Mendelsohn", "horizontal components", "vertical components", "square components", "dead-end units", "arvo-sparse"]

[[tenet]]
id = "spectral_bisection_forms_trunks_by_cutting_the_fibers_graph_where_the_shared_data_volume_is_smallest"
subject = "plan"
what = "When there are more than five fibers, trunks are formed by spectral bisection of a weighted graph of the fibers, where the edge weight between two fibers is the data volume of the columns they share. The cut minimises the volume crossing the trunk boundary, so fibers within a trunk share heavy column sets on one core's L1, and the cut between trunks carries only read-only columns from previous phases or lightweight bridge columns. Trunks share no write columns with other trunks, so there is zero synchronisation, and they may share read-only columns from earlier phase output."
mechanism = "Nodes are fibers. Edge weight is `Σ size_of::<T_i>()` for the columns shared between two fibers, the volume that would need L2/L3 coherence if the fibers ran on different cores. The Fiedler vector bisects the graph. Runs after the initial greedy fiber grouping pass."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1373-1392"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
**Step 7: Spectral partitioning → trunk formation** (arvo-spectral,
when >5 fibers)

After fiber grouping (step 8, which runs first for the initial
greedy pass), build a weighted graph where:
- Nodes = fibers
- Edge weight = Σ size_of::<T_i>() for columns shared between two
  fibers (the data volume that would need L2/L3 coherence if the
  fibers ran on different cores)

The Fiedler vector bisects this graph to minimize cut weight — the
data volume crossing the trunk boundary. The result: trunks where
fibers within a trunk share heavy column sets (kept on one core's
L1), and the cut between trunks is minimal (only read-only columns
from previous phases, or lightweight bridge columns).

Trunks share NO write columns with other trunks (zero sync). They
MAY share read-only columns from previous phase output. The spectral
cut ensures the shared read volume is minimal — trunks that need
the same read columns end up in the same trunk when possible.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1373-1392"]
keywords = ["spectral partitioning", "Fiedler vector", "trunk formation", "arvo-spectral", "cut weight", "L1", "zero sync", "more than five fibers"]
related = ["tenet::a_trunk_is_a_column_disjoint_maximal_path_within_a_phase_and_trunks_share_no_write_columns"]

