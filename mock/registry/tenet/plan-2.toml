id = "whether_dispatch_follows_rcm_order_or_waist_phase_order_is_decided_by_a_bench"
subject = "plan"
what = "The choice between the spec's dual-ordering position, where the RCM order of units is their execution order, and the shipped waist-phase order is resolved by a bench and not by fiat. Both orders can be built behind the const grouping mechanism, and a cache-locality bench on wide fan-out graphs decides which wording canon keeps. Until the bench lands, neither order is drift, and the fork is registered open with a bench oracle."
mechanism = "Spec steps 5 and 8 dual ordering (RCM row order = WU execution order) versus the shipped waist-phase order; the guarded-walk relaxation proven in r2 section 7-6 carries an arbitrary const-side order; oracle: cache-locality bench on wide fan-out DAGs."
source = "mock/research/202606111400_canonical-design-addendum-a1.md:51-57"
