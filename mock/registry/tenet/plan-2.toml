[[tenet]]
id = "greedy_fiber_grouping_walks_the_units_in_rcm_order_and_joins_a_fiber_only_where_the_holistic_check_passes"
subject = "plan"
what = "Greedy fiber grouping, used for ten units or fewer and as the fallback, processes the units in the RCM-reordered topological order. A unit joins a fiber when all its predecessors are in that one fiber and the full feasibility check passes; otherwise it starts a new fiber."
mechanism = "The feasibility predicate is the full holistic check of domain 14: register file, L1 write budget, L1 plus L2 total, no fan-in and no pipeline breaker. Implemented in arvo-comb."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1398-1408"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
**Step 8: Fiber grouping** (arvo-comb)

Two modes depending on WU count:

Greedy grouping (≤10 ops, or as fallback): the walk from domain 14.
Process WUs in RCM-reordered topo order (step 5). For each WU: if
all predecessors are in one fiber AND the holistic feasibility check
passes → group into that fiber. Otherwise → new fiber. The
feasibility predicate is the full holistic check from domain 14
(register file + L1 write budget + L1+L2 total + no fan-in + no
pipeline breaker).
'''
