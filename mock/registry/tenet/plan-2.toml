[[tenet]]
id = "plan_affecting_is_an_open_marker_trait_that_consumers_implement_on_resource_value_types"
subject = "plan"
what = "The plan-dirty trigger, by which a swapped plan-affecting resource marks the plan for recompute, had no carrier a consumer could reach, because the plan-affecting marker was sealed with one engine-internal implementor. The maintainer ruled it unsealed: consumers implement it on resource value types whose swap invalidates the plan, mirroring the existing opt-in marker for replaceable resources. The property belongs to the type and not to one app's registration."
mechanism = "`PlanAffecting` unsealed, mirroring the opt-in marker `Replaceable`; implementation tracked under #696 and riding the swap-semantics round (A2-5), since the two surfaces interact."
source = "mock/research/pre_seed/202607193200_canon-amendment-a2-precedence-and-rulings.md:55-62"
provenance = ["mock::research::pre_seed::202607193200_canon-amendment-a2-precedence-and-rulings::#a2-3-planaffecting-ranges-over-an-open-marker-trait-op-2026-07-19"]
quote = '''
## A2-3: PlanAffecting ranges over an open marker trait (op, 2026-07-19)

Canon's plan-dirty trigger (a swapped plan-affecting resource marks the plan for recompute) had
no consumer-reachable carrier: `PlanAffecting` shipped sealed with one engine-internal
implementor. Op ruled: unseal it. Consumers implement `PlanAffecting` on resource value types
whose swap invalidates the plan, mirroring the existing `Replaceable` opt-in marker. The
property is intrinsic to the type, not to one app's registration. Implementation is tracked
under #696 and rides the swap-semantics round (A2-5), since the two surfaces interact.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
