what = "The executor reorganises between frames and never during execution. Comparing the EMAs against thresholds, a significant change in fiber morsel timing recomputes the morsel sizes, a shift in phase balance re-selects the per-phase configs, and a changed record count triggers a full plan recompute. The triggers are cheap bitmask comparisons."
mechanism = "Uses the arvo-bitmask dirty propagation pattern."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2042-2048"
