# What the record says about `plan`, part 2.

[[tenet]]
id = "rcm_always_runs_and_reorders_the_units_so_column_sharing_units_are_adjacent_for_fiber_grouping"
subject = "plan"
what = "RCM reordering always runs on the access matrix. Its unit reordering orders the units so that those accessing similar column sets are adjacent, which lets the greedy fiber grouping walk meet column-sharing units in sequence and produce better fibers than a plain topological order; for wide graphs with fan-out it decides which of the equal-depth units are grouped first."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1328-1339"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
**Step 5: RCM reordering → fiber grouping order + arena layout**
(arvo-sparse, always run)

RCM operates on the access matrix and produces two orderings:

Row reordering (WU execution order): RCM reorders WUs so that ops
accessing similar column sets are adjacent. When the greedy fiber
grouping walk (step 8) processes WUs in this order, it encounters
column-sharing WUs in sequence, producing better fiber groupings
than a naive topo order. For wide DAGs with fan-out (many WUs at
the same topo depth), RCM determines which of those equal-depth
WUs get grouped first.
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["founding: mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1328-1339", "later: mock/research/202606111400_canonical-design-addendum-a1.md:49-57, whether_dispatch_follows_rcm_order_or_waist_phase_order_is_decided_by_a_bench"]
keywords = ["RCM", "row reordering", "unit execution order", "fiber grouping", "arvo-sparse", "fan-out", "column sets"]

[[tenet]]
id = "rcm_column_reordering_decides_the_byte_offsets_of_columns_within_the_co_located_arena"
subject = "plan"
what = "RCM also reorders the columns, so that columns accessed together have adjacent offsets within the co-located arena and end up in adjacent cache lines, which the prefetcher brings in at once. This is the physical manifestation of co-location: RCM determines the actual byte offsets of columns within the arena."
mechanism = "A fiber's morsel walks `arena_base + col_offset + i * stride`."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1341-1347"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#15-pipeline-analysis-algorithms"]
quote = '''
Column reordering (arena memory layout): RCM reorders columns so
that co-accessed columns have adjacent offsets within the co-located
arena (domain 04). When a fiber's morsel walks `arena_base +
col_offset + i * stride`, columns that are read together end up in
adjacent cache lines. The prefetcher brings in both at once. This
is the physical manifestation of "co-location" — RCM determines the
actual byte offsets of columns within the arena.
'''
origin = "stated"
standing = "ratified"
