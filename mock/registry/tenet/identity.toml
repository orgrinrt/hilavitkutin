[[tenet]]
id = "the_crates_are_the_api_the_engine_the_build_crate_and_the_arvo_family"
subject = "identity"
what = "The design names three hilavitkutin crates: the api crate with the consumer-facing types, traits and platform contracts, the engine crate, and the build crate for build-time optimisation. Beside them stand the arvo crates for numeric, bitmask, sparse, graph, spectral and combinatorial primitives."
mechanism = "hilavitkutin-api (consumer-facing types, traits, platform contracts); hilavitkutin (engine: scheduling, dispatch, codegen, platform impls); hilavitkutin-build (build-time optimisations: LLVM, MIR, codegen, cfg emission); arvo; arvo-bitmask; arvo-sparse; arvo-graph; arvo-spectral; arvo-comb."
