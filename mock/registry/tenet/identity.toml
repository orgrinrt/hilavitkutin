hilavitkutin-api       consumer-facing types, traits, platform contracts
hilavitkutin           engine (scheduling, dispatch, codegen, platform impls)
hilavitkutin-build     build-time optimisations (LLVM, MIR, codegen, cfg emission)
arvo                   numeric primitives (UFixed/IFixed, floats, semantic aliases)
arvo-bitmask           fixed-width bitmask types, bit-matrix, set ops
