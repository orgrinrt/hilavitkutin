subject = "identity"
what = "The build crate is a standalone build dependency with no runtime dependencies. The api crate, the engine and every consumer use it from their build script, and it provides configuration emission, compiler wrapper scripts, LLVM pass configuration, profile-guided and post-link workflows and pragma-based build configuration."
