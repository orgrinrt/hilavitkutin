[[tenet]]
id = "the_dead_terms_chain_chain_group_partition_archetype_entity_row_and_order_have_named_replacements"
subject = "identity"
what = "Several earlier terms are dead and have a named replacement. The words for the older grouping levels are replaced by fiber, trunk and phase, the word for column co-access is replaced by fiber, the two words for a data point by record, and an order on a unit by scheduling hints."
mechanism = "chain → fiber; chain group → trunk; partition → phase; archetype → fiber (it was just column co-access, which is fiber formation); entity → record; row → record; order (on WU) → scheduling hints (WUs declare hints, the scheduler derives ordering)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:92-101"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#vocabulary"]
quote = '''
**Dead terms (do not use):**
| Dead term | Replacement | Why |
|---|---|---|
| chain | fiber | "Chain" causes regression to stale T2/T3 mental model |
| chain group | trunk | Trunks replaced chain groups |
| partition | phase | Phases replaced partitions |
| archetype | fiber | Archetype was just column co-access, which IS fiber formation |
| entity | record | "Entity" implies ECS; hilavitkutin is not an ECS |
| row | record | "Row" implies tabular joins; columns are independent |
| order (on WU) | scheduling hints | WUs declare hints, scheduler derives ordering |
'''
origin = "stated"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
