[[tenet]]
id = "build_configuration_has_four_parts_and_no_custom_cargo_features"
subject = "identity"
what = "The build configuration has four parts: the build crate emits cfg flags, there are no custom cargo features because the compiler supplies target features, a compiler workspace wrapper carries all the LLVM codegen flags per target and tier, and mutually exclusive features are rejected with a compile error."
mechanism = "(1) hilavitkutin-build (build-dep): cfg flag emission; (2) no custom cargo features (compiler provides target_feature, CARGO_CFG_*); (3) RUSTC_WORKSPACE_WRAPPER: all LLVM codegen flags per (target, tier); (4) compile_error! for mutually exclusive features. T4 §Q1."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:329-333"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#03-build-time-optimisation"]
quote = '''
