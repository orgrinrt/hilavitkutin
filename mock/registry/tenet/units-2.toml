[[tenet]]
id = "the_arity_twelve_cap_continues_to_govern_unit_read_and_write_declarations_and_not_the_builder_accumulator"
subject = "units"
what = "The access set needs no extension to higher arities: the arity-twelve cap continues to govern the unit read and write declarations, which are flat tuples, and it does not govern the builder's accumulator, which is a cons-list."
source = "mock/research/sketches/app-builder-typestate-202605010900/FINDINGS.md:166-178"
