written_by = "the standalone spec 202606111800, a reading aid with no design authority of its own by addendum A2"
standing = "provisional"
subject = "units"
keywords = ["execute", "Context", "Ctx", "access set", "nothing else", "WorkUnit", "signature"]

[[tenet]]
id = "inside_a_fiber_a_unit_is_a_pure_function_from_column_values_to_column_values"
what = "The founding round's api topic describes the processing of one record inside a fiber as the composition of its units, each a pure function that takes column values and produces column values, with the intermediate columns as named wires between stages that need no memory inside the fiber. The closure a unit registers moves from taking references to columns to a pure function of values that returns values, and the flattener wires the returns to the next stage's inputs."
source = "mock/design_rounds/202604200055/202603151200_topic.hilavitkutin-api-surface.md:1767-1771, mock/design_rounds/202604200055/202603151200_topic.hilavitkutin-api-surface.md:1840-1843"
provenance = ["mock::design_rounds::202604200055::202603151200_topic.hilavitkutin-api-surface::#chain-internal-columns-are-dead-stores-only-chain-outputs-need-materialization"]
quote = '''
Within a chain, processing row n is: `d(c(b(a(input_n))))`. Each WU is
a pure function that takes column values and produces column values. The
chain is a composition of these functions. The intermediate "columns"
are just named wires between stages — they don't need memory backing
within the chain.
---
The WU's `each` closure signature changes from
`|col_a: &T, col_b: &mut U| { ... }` to a pure function
`fn(input_a: T, input_b: T) -> (U, V)` that takes values and returns
values. The flattener wires the returns to the next stage's inputs.
'''
origin = "proposed"
written_by = "the founding-round topic T6 on the api surface, 202603151200"
standing = "provisional"
subject = "units"
keywords = ["pure function", "values in values out", "each closure", "flattener", "fiber", "composition", "value function"]
