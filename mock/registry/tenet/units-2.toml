id = "execute_receives_a_context_and_nothing_else"
what = "The execute body of a unit receives a context and nothing else. It does not receive handles to global storage, does not reach into a registry and holds no long-lived references. Everything it can touch is exactly what its access set declared, projected into the context for the duration of one call."
mechanism = "`trait WorkUnit<Sched = Always> { type Read: AccessSet; type Write: AccessSet; type Hint; type Ctx<'frame>; fn execute<'frame>(&self, ctx: &Self::Ctx<'frame>); }`"
source = "mock/research/pre_seed/202606111800_canonical-spec-standalone.md:138-145, mock/research/pre_seed/202606111800_canonical-spec-standalone.md:155-158"
provenance = ["mock::research::pre_seed::202606111800_canonical-spec-standalone::#3-1-workunit"]
quote = '''
```rust
trait WorkUnit<Sched = Always> {
    type Read: AccessSet;    // the stores this unit reads
    type Write: AccessSet;   // the stores this unit writes
    type Hint;               // scheduling hints (priority, atomicity, ...)
    type Ctx<'frame>;        // the per-frame context handed to execute
    fn execute<'frame>(&self, ctx: &Self::Ctx<'frame>);
}
---
`execute` receives a `Context` (see 3.4) and nothing else. It does not
receive handles to global storage, it does not reach into a registry, it
holds no long-lived references. Everything it can touch is exactly what its
access set declared, projected into the context for the duration of one call.
'''
