id = "the_scheduling_hint_stays_sealed_and_gains_one_additive_arm_a_four_tuple_with_an_open_extension_marker"
subject = "units"
what = "The scheduling hint stays sealed over the tuple shapes the api names and gains one additive arm, a four-tuple whose fourth member is an open marker that a downstream runner implements to carry one runner-specific dimension. A three-tuple and a four-tuple are different types, so nothing existing changes, and the seal still holds with the extension marker as the one open slot inside the tuples. A runner that declares an extension marker reads its own dimension. No extension markers ship in the crate."
because = "A runner with a dimension that the triple lacks cannot express it, and unsealing would cost the engine its ability to reason about every hint shape."
mechanism = "`pub trait HintExt: 'static {}` and `impl<U: UrgencyValue, D: DivisibilityValue, S: SignificanceValue, X: HintExt> SchedulingHint for (U, D, S, X) {}`; `SchedulingHint` sealed at hint.rs:68 for `(U, D, S)` triples."
source = "mock/design_rounds/202607171807/202607171733_topic.plannable-declaration-split.md:73-89, mock/design_rounds/202607171807/202607171807_changelist.doc.lock.md:44-48"
provenance = ["mock::design_rounds::202607171807::202607171733_topic.plannable-declaration-split::#the-hint-s-extensibility-settled-in-the-same-round"]
quote = '''
## The hint's extensibility, settled in the same round

`SchedulingHint` is sealed (`hint.rs:68`) and implemented only for `(U, D, S)` triples of urgency,
divisibility, and significance markers. A runner with a dimension the triple lacks cannot express it,
and unsealing would cost the engine its ability to reason about every hint shape.

The additive fix keeps the seal and adds one arm:

```rust
pub trait HintExt: 'static {}
impl<U: UrgencyValue, D: DivisibilityValue, S: SignificanceValue, X: HintExt> SchedulingHint for (U, D, S, X) {}
```

A 3-tuple and a 4-tuple are different types, so the arms cannot overlap and nothing existing changes.
The engine keeps reading urgency, divisibility, and significance, and ignores the extension. A runner
that declares an extension marker reads its own dimension. The seal still holds: `SchedulingHint` is
implemented only for tuple shapes this crate names, and `HintExt` is the one open slot inside them.
---
Where the scheduling hint is described (the three-axis tuple), note that `SchedulingHint` stays
sealed and gains one additive arm: the 4-tuple `(U, D, S, X: HintExt)`, where `HintExt` is an open
marker trait a downstream runner implements to carry a fourth, runner-specific dimension. The engine
reads urgency, divisibility, and significance and ignores the extension. No `HintExt` markers ship
in this crate.
'''
origin = "proposed"
written_by = "topic plannable-declaration-split of 2026-07-17, round 202607171807, and its doc changelist, agent-written"
standing = "provisional"
stamped_by = "maintainer"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md:5), and asked of the maintainer in ticket `86aa80598714`'
