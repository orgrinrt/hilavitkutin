[[tenet]]
id = "the_context_of_a_unit_is_a_generic_associated_type_over_a_frame_lifetime_the_scheduler_owns"
what = "The context of a unit is a generic associated type over a frame lifetime owned by the scheduler. The engine instantiates it at dispatch time with the live frame lifetime, so a unit can read borrows into state derived from the pool frame, such as progress slots and predicted-wait readers, without its implementation carrying an explicit lifetime parameter. Dispatch sites use higher-ranked trait bounds."
mechanism = "`WorkUnit::Ctx` is `type Ctx<'frame>`; borrows into `PoolFrame`-derived state; dispatch sites use HRTB; validated by the lifetime sketch shipped alongside round 202605101036."
source = "mock/PRINCIPLES.md.tmpl:217-223"
provenance = ["mock::PRINCIPLES::#monomorphisation-is-the-dispatch"]
quote = '''
`WorkUnit::Ctx` is a Generic Associated Type (`type Ctx<'frame>`)
over a frame lifetime owned by the scheduler. The engine instantiates
it at dispatch time with the live `'frame`, so the WU can read borrows
into `PoolFrame`-derived state (progress slots, predicted-wait readers)
without forcing the consumer's `impl WorkUnit` to carry an explicit
`<'frame>` parameter. Dispatch sites use HRTB. Validated by the lifetime
sketch shipped alongside round 202605101036.
'''
