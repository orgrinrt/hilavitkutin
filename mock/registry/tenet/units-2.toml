[[tenet]]
id = "a_declaration_trait_parameterised_by_the_schedule_is_granted_to_every_unit_by_one_blanket_across_all_schedules"
subject = "units"
what = "The declaration half of a unit, its reads, writes and hint, is granted by one blanket implementation to every unit under any schedule, because the schedule is a parameter of the declaration trait. No explicit implementation is needed for a unit under a schedule other than the always one, which is strictly more general than the earlier schedule trait, whose blanket pins the always schedule and requires an explicit implementation per unit under an event-type schedule."
mechanism = "`Plannable<Schedule = Always>` with `impl<W: WorkUnit<S>, S> Plannable<S> for W`; `AdaptWu`, an `impl WorkUnit<On<ScheduleEnd>>`, is accepted at a `T: Plannable<S>` bound; `HasSchedule` (`work_unit.rs:145`) has a blanket that pins `Always`."
source = "mock/research/sketches/202607171733_plannable-declaration-split/FINDINGS.md:28-34, mock/research/sketches/202607171733_plannable-declaration-split/FINDINGS.md:38-41"
provenance = ["mock::research::sketches::202607171733_plannable-declaration-split::FINDINGS::#the-shape-that-works-upstream-rs-downstream-rs"]
quote = '''
```rust
pub trait Plannable<Schedule = Always> { type Read: AccessSet; /* Write, Hint */ }
impl<W: WorkUnit<S>, S> Plannable<S> for W { type Read = <W as WorkUnit<S>>::Read; }
```

The load-bearing detail is that `Schedule` is a **parameter of `Plannable`**, not only of the bound.
`S` therefore appears in the impl's trait reference (`Plannable<S>`), which is what constrains it.
---
- `AdaptWu`, an `impl WorkUnit<On<ScheduleEnd>>` with no `Plannable` impl of its own, is accepted at
  a `T: Plannable<S>` bound. The blanket covers non-`Always` schedules, so nothing needs an explicit
  impl. This is strictly more general than `HasSchedule` (`work_unit.rs:145`), whose blanket pins
  `Always` and requires an explicit impl per `On<V>` unit.
'''
