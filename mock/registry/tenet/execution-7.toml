# What the record says about `execution`, part 7.

[[tenet]]
id = "per_trunk_dispatch_is_a_const_range_walk_that_selects_the_members_of_one_trunk_and_each_trunk_is_its_own_monomorphisation"
what = "Per-trunk isolation is a const-gated walk over the flat unit carrier that runs only the members of one trunk, so that each trunk value monomorphises once and dead-code elimination removes every non-member position, leaving a member-only program equivalent to the flat walk restricted to that trunk. The flat carrier stays flat and the partition lives in const data."
mechanism = "`trait RunTrunkSel<A, WL, const POS, const TRUNK>` with `{ POS + 1 }` const-generic threading; body gated by whether the carrier position is a member of `TRUNK`, running `RunFiber::run`; `run_one_trunk::<.., const TRUNK>(carrier, bindings, morsel)`; gate from `trunk_of(POS) == TRUNK` or `is_member::<.., PHASE, TRUNK>()`; `WuNil` terminates; sketch 071230 objdump."
source = "mock/design_rounds/202606080400/202606080100_topic.gate2-ge-const-gated-trunk-dispatch.md:16-19"
provenance = ["mock::design_rounds::202606080400::202606080100_topic.gate2-ge-const-gated-trunk-dispatch::#canonical-mechanism-proven-to-port"]
quote = '''
The flat carrier stays flat; the partition lives in const data (`GROUPING`), and const-eval + DCE is the flattener. Per-trunk isolation via a `POS`-threaded, const-gated walk over the flat `WuVals`:

- `trait RunTrunkSel<A, WL, const POS, const TRUNK>` with `impl for WuCons<H, T> where T: RunTrunkSel<A, TW, { POS + 1 }, TRUNK>` (the `{ POS + 1 }` GCE threading), body: `if const { is this carrier position a member of TRUNK } { RunFiber::run(&WuCons{head, tail: WuNil}, ..) } self.tail.run(..)`. The gate uses the shipped const grouping (`trunk_of(POS) == TRUNK`, or `is_member::<.., PHASE, TRUNK>()` for the phase-scoped form). `WuNil` terminates.
- `run_one_trunk::<.., const TRUNK>(carrier, bindings, morsel)` is the per-trunk program: monomorphising once per `TRUNK` value, DCE removes every non-member position's dispatch, leaving a member-only, devirt-clean (zero `blr`) program output-equivalent to the flat walk restricted to that trunk. (sketch 071230 objdump-proven; 071330 proved the same driven by the real computed grouping.)
'''
