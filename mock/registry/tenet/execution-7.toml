[[tenet]]
id = "the_outer_dispatcher_drives_the_shipped_per_trunk_walk_keyed_by_trunk_only_and_phase_order_is_a_runtime_loop"
what = "The single-core run is driven by an outer dispatcher that walks the carrier and fires the shipped per-trunk walk once per trunk root in its phase's pass, with phase order as a runtime loop and a waist between phases that is a no-op on one core. The per-trunk walk is keyed by trunk only, since a trunk lies wholly within one phase. A new walk beside the shipped one is not built."
because = "A parallel walk reinvents shipped infrastructure, and dropping the phase from the per-trunk walk's key removes an always-generic-constant-expression const argument."
mechanism = "`RunGatedTrunk<const TRUNK, Pos>` over `WuCons` / `WuNil` with a Peano `Pos` witness (`Here` / `There<..>`), gate `trunk_of(Pos::INDEX) == TRUNK`; outer `Discover<Full, const POS>` bound `Full: RunGatedTrunk<POS, Here>`, const gate `trunk_of(POS) == POS` and runtime `phase_of(POS) == p`; top `for p in 0..phase_count { carrier.run(carrier, p, ..); waist }`; `RunFiber::run_head`; `Scheduler::run` re-pointed; `run_parallel` untouched; sketches `202606080130` and `202606080200`; round 202606080400."
source = "mock/design_rounds/202606080400/202606080300_topic.gate2-ge-drive-shipped-rungatedtrunk.md:6-7, mock/design_rounds/202606080400/202606080300_topic.gate2-ge-drive-shipped-rungatedtrunk.md:17-23, mock/design_rounds/202606080400/202606080500_changelist.src.lock.md:11-11"
provenance = ["mock::design_rounds::202606080400::202606080300_topic.gate2-ge-drive-shipped-rungatedtrunk::#topic-gate-2-g-e-correction-drive-the-shipped-rungatedtrunk-trunk-only-keyed"]
quote = '''
**Supersedes the design framing of:** `202606080100_topic.gate2-ge-const-gated-trunk-dispatch.md` (same round; that topic proposed a NEW `RunTrunkSel` + `run_one_trunk` walk, which reinvents shipped infra).
**Source / oracle:** roadmap r4 `mock/research/202606070700_engine-roadmap-r4-gate2-mechanism.md` (stage G-e). Proven sketches `mock/research/sketches/202606080130_gate2-ge-const-range-dispatcher` (first cut + the const-recursion-non-termination finding) and `202606080200_gate2-ge-outer-drives-rungatedtrunk` (the corrected, decisive proof). Carrier-mechanism mandate [[gate2-carrier-mechanism-mandate]] (op, #672).
---
1. **Trunk-only keying.** A trunk lies wholly within one phase, so `RunGatedTrunk`'s `const PHASE` is redundant for membership. Drop it; the gate becomes `trunk_of(Pos::INDEX) == TRUNK` only. This removes the always-GCE `PHASE = phase_of(POS)` const-argument. Phase ORDER is the runtime outer loop, not a const on the walk.

2. **Inner walk (shipped, Peano).** `RunGatedTrunk<const TRUNK, Pos>` over `WuCons` / `WuNil`; the recursion threads `There<Pos>` (a type, no const arithmetic, the idiom that dodges the `{POS+1}` solver overflow at the inner level). Per cell, gate the member const and run it through `RunFiber::run_head`.

3. **Outer dispatcher (new).** `Discover<Full, const POS>` walk over the carrier threading `{POS+1}`, bound `Full: RunGatedTrunk<POS, Here>`. Per cell, const-gate `const { trunk_of(POS) == POS }` (is this a trunk-root) and, inside, the runtime `phase_of(POS) == p` match (fire this trunk only in its phase's pass); dispatch `RunGatedTrunk::<TRUNK = POS, Here>` on the FULL carrier. `POS` reaches the inner `TRUNK` by identity, so there are zero GCE const-arguments.

4. **Top.** Runtime phase loop `for p in 0..phase_count { carrier.run(carrier, p, ..); waist }`. Single-core waist is a no-op; G2-N inserts the real barrier.
---
Make the shipped per-trunk walk `RunGatedTrunk` (round 2a) trunk-only keyed (a trunk lies wholly within one phase, so its `const PHASE` is redundant for membership), add the outer all-trunks dispatcher that drives one per-trunk mono per trunk-root in phase order, and re-point single-core `Scheduler::run` to it. The parallel `run_parallel` path is untouched (G2-N re-points it later). Phase order is the dispatcher's runtime phase loop; the per-trunk monos DCE to member-only programs.
'''
