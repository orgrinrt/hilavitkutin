[[tenet]]
id = "resource_and_column_pointers_must_have_separate_provenance_or_llvm_reloads_resources_every_iteration"
what = "Resource storage and column storage must have separate pointer provenance. Two raw pointers from the same struct may alias in LLVM's view, so it cannot prove that a column store does not affect a resource read, and without separation it reloads resources from memory every iteration instead of keeping them in registers. This is a pointer provenance issue and not the shared-reference versus exclusive-reference issue: the fix is pointer separation and not the reference type."
mechanism = "Measured overhead without separation: 1.28-1.40x (T6 L1654-1658). `cw()` store to a column versus `ru()` read of a resource."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1693-1701, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1708-1712"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#19-resource-handling"]
quote = '''
**Pointer separation (T6 L1612-1687):**

Resource storage and column storage must have separate pointer
provenance. Two raw pointers from the same struct may alias in LLVM's
view — LLVM cannot prove that a `cw()` store to one column doesn't
affect a `ru()` read from a resource if both pointers originate from
the same struct. Result without separation: LLVM reloads resources
from memory every iteration instead of keeping them in registers.
Measured: 1.28-1.40x overhead (T6 L1654-1658).
---
This is NOT the same issue as `&self` vs `&mut self` (the cu/cw
noalias finding from domain 09). That prevents LLVM from reordering
writes across fused WUs. This is a pointer provenance issue: two raw
pointers from the same struct may alias. The fix is pointer
separation, not reference type.
'''
origin = "stated"
standing = "provisional"
subject = "memory"
keywords = ["pointer separation", "pointer provenance", "aliasing", "resource reload", "cw", "ru", "noalias", "registers"]
cites = ["the_context_is_taken_by_shared_reference_because_that_prevents_noalias_undefined_behaviour"]

[[tenet]]
id = "the_fiber_dispatcher_snapshots_resources_to_a_stack_local_array_before_the_morsel_loop_and_writes_mutable_ones_back_after"
what = "Resource data lives in a stack-local region that LLVM can prove does not alias the column pointers. Before the morsel loop the fiber dispatcher snapshots all accessed resources to a stack-local array and redirects the resource pointer to it; LLVM then promotes all resource accesses to registers, leaving zero resource memory operations in the hot loop, and after the loop the mutable resources are written back to the canonical storage."
mechanism = "Write-back via `stp`. Bench on aarch64: without caching 21 memory operations per iteration with 6 resource reloads through `[x0, #N]` (res_ptr), read-only resources reloaded every iteration; with caching all 4 resources promoted to registers (x3, x9, x10, x13) and written back once."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1703-1706, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1714-1730"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#19-resource-handling"]
quote = '''
The fix: resource data lives in a stack-local region that LLVM can
prove non-aliasing with column pointers. The fiber dispatcher handles
this automatically — it knows the resource set from WU Read/Write
declarations.
---
**Stack-local resource caching (T6 L1649-1687, T7 §6.1):**

Before the morsel loop, the fiber dispatcher:
1. Snapshots all accessed resources to a stack-local array
2. Redirects res_ptr to the stack-local copy

LLVM proves stack memory doesn't alias heap column data → promotes
all resource accesses to registers. Zero resource memory ops in the
hot loop. After the loop, mutable resources are written back to
canonical storage via `stp`.

Bench evidence (T6 L1660-1669, aarch64):
- Without caching: 21 memory ops per iteration, 6 resource reloads
  through `[x0, #N]` (res_ptr). Read-only resources reloaded every
  iteration.
- With caching: all 4 resources promoted to registers (x3, x9, x10,
  x13). Zero resource memory ops in loop. Written back once via `stp`.
'''
origin = "stated"
standing = "provisional"
subject = "memory"
keywords = ["stack-local resource caching", "snapshot", "res_ptr", "register promotion", "write-back", "stp", "fiber dispatcher", "aarch64"]
cites = ["resource_and_column_pointers_must_have_separate_provenance_or_llvm_reloads_resources_every_iteration"]

