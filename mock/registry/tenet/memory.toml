[[tenet]]
id = "the_noalias_invariant_is_kept_as_an_architectural_guarantee_and_not_claimed_as_a_scalar_speedup"
subject = "memory"
what = "The handle store never aliases the value columns, and scalar members are snapshotted before the loop, so LLVM keeps them in registers across the morsel loop. The spec's figure of 1.28 to 1.40 times is a March 2026 distillation that the bench did not reproduce as a scalar wall-clock effect on M1, where scalars are L1-resident, but the mechanism is real and decisive for large collection members. The invariant is kept as an architectural guarantee and not as a claimed scalar speedup."
mechanism = "Spec line 1698, figure 1.28-1.40x; not reproduced on M1 (hoist is wall-clock-nil); decisive for large collection members (axis D)."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:39-45"
provenance = ["mock::research::202606210600_resource-storage-model-canonical-addendum::#the-model-stated-outright-bench-confirmed"]
quote = '''
5. **Noalias invariant (architectural).** The handle store never aliases the value columns
   (separate provenance), and scalar members are snapshotted before the loop, so LLVM keeps them
   in registers across the morsel loop. The spec's 1.28-1.40x figure (1698) is a March-2026
   distillation; the bench did NOT reproduce it as a scalar wall-clock effect on M1 (scalars are
   L1-resident, so the hoist is wall-clock-nil there), but the mechanism is real and it is
   decisive for large collection members (axis D). Keep the invariant as an architectural
   guarantee, not a claimed scalar speedup.
'''
origin = "proposed"
written_by = "canonical addendum on the resource storage model, 2026-06-19, revised 2026-07-02 (bench-confirmed), agent-written; the text does not name its author"
standing = "ratified"
ratified_by = 'op, by default from the written history and not by a walk, under his words of 2026-11-13 (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md): "fill them as ratified by default from written history"'
ratified_from = ["ruled: mock/research/202606210600_resource-storage-model-canonical-addendum.md:39-45", "ruled: mock/research/202606210600_storage-bench-findings.md:372-374"]
keywords = ["noalias invariant", "architectural guarantee", "1.28-1.40x", "scalar speedup", "M1", "registers", "morsel loop", "axis D"]
related = ["tenet::resource_and_column_pointers_must_have_separate_provenance_or_llvm_reloads_resources_every_iteration"]

[[tenet]]
id = "the_providers_crate_ships_default_resource_backed_providers_and_kit_impls_that_consumers_wire_in"
subject = "memory"
what = "The providers crate ships default providers, backed by resources, for the scheduler, and default kit implementations that consumers wire in. It depends on the api, string and kit crates and the foundations crates, with no dependency back on the engine."
mechanism = "`hilavitkutin-providers`: consumes api + str + kit + the foundations crates; no reverse dep; standalone (no engine dep)."
source = "mock/DESIGN.md.tmpl:24-24, mock/DESIGN.md.tmpl:32-32"
provenance = ["mock::DESIGN::#crate-layout"]
quote = '''
| `hilavitkutin-providers` | Default Resource-backed providers for the scheduler. v0 ships the interner value-type surface (InternerApi / HasInterner / MemoryArena + default_interner constructor) plus the declarative `InternerKit` (round-4 shape: `type Units = read![]`, `type Owned = read![Resource<...>]`). Future modules add ColumnStorage / Clock / Memory defaults per consumer demand. Standalone (no engine dep). |
---
hilavitkutin-ctx, -persistence, -sym, -str, -kit, -providers are standalone ecosystem crates that consumers opt into. ctx, persistence, sym, str are pure ecosystem (engine does not depend on them). hilavitkutin-str depends on hilavitkutin-sym for the identity handle; hilavitkutin-sym itself depends only on the foundations (arvo, notko), sitting below the rest of the ecosystem. kit is a contract crate the engine depends on for its `.add_kit()` method, but it has no reverse dependency on the engine; consumers can author Kits without pulling the engine in. providers ships default Kit impls consumers wire in (interner, future ColumnStorage / Clock / Memory defaults); it consumes api + str + kit + the foundations crates, no reverse dep.
'''
