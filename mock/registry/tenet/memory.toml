[[tenet]]
id = "the_memory_arena_is_an_inline_storage_interner_with_const_generic_byte_and_entry_caps_and_overflow_returns_a_sentinel_id"
subject = "memory"
what = "The default interner backing holds its bytes and its entry table inline, with the byte capacity and the entry capacity as const generics that a consumer tunes to its workload. Each runtime-interned string gets a sequential 28-bit identifier, which is its entry index, and when the arena runs out of bytes or entry slots the intern call returns a sentinel identifier."
mechanism = "`MemoryArena<BYTES, ENTRIES>`: `[u8; BYTES]` plus `[Entry; ENTRIES]` where each entry records `(offset, len)`; interior mutability via `Cell` for the cursor and entry count and `UnsafeCell` for the buffer and table; `arena_resolve(id)` slices `[offset..offset+len]`; overflow returns sentinel id `u32::MAX` from `arena_intern`. It is the inline-storage `ArenaInterner` impl that backs the default `StringInterner`."
source = "mock/crates/hilavitkutin-providers/DESIGN.md.tmpl:22-22, mock/crates/hilavitkutin-providers/DESIGN.md.tmpl:57-71"
provenance = ["mock::crates::hilavitkutin-providers::DESIGN::#surface"]
quote = '''
| `MemoryArena<BYTES, ENTRIES>` | Inline-storage `ArenaInterner` impl. Const-generic byte-cap and entry-cap. Backs the default `StringInterner`. |
---
### `MemoryArena<BYTES, ENTRIES>`

Inline-storage `ArenaInterner` impl. Holds `[u8; BYTES]` bytes plus
an `[Entry; ENTRIES]` table where each entry records `(offset,
len)` for a previously-interned string. Interior mutability via
`Cell` for the cursor and entry count, `UnsafeCell` for the
buffer and table.

Each runtime-interned string gets a sequential 28-bit id (the
entry index). `arena_resolve(id)` looks up the entry and slices
`[offset..offset+len]` from the byte buffer.

Capacity overflow (out of bytes or out of entry slots) returns
sentinel id `u32::MAX` from `arena_intern`. Consumers tune
`BYTES` and `ENTRIES` to their workload.
'''
