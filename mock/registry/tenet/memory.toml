id = "the_platform_contracts_are_memory_provider_thread_pool_and_clock_traits_in_the_api_crate"
subject = "memory"
what = "The platform contracts live in the api crate as three traits: a memory provider that allocates, deallocates and protects memory, a thread pool that takes work and reports its worker count, and a clock that reports the time in nanoseconds."
mechanism = "`pub trait MemoryProvider: Send + Sync { unsafe fn allocate(&self, len: usize, align: usize) -> *mut u8; unsafe fn deallocate(&self, ptr: *mut u8, len: usize); unsafe fn protect(&self, ptr: *mut u8, len: usize, read: bool, write: bool); }`; `pub trait ThreadPool: Send + Sync { fn spawn(&self, f: impl FnOnce() + Send + 'static); fn worker_count(&self) -> usize; }`; `pub trait Clock: Send + Sync { fn now_ns(&self) -> u64; }`."
