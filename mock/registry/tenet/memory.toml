[[tenet]]
id = "the_platform_has_three_tiers_no_os_os_and_std"
subject = "memory"
what = "There are three platform tiers: no_os for bare metal and WASM, os as the default for Linux and macOS, and std for Windows and other targets. The tiers differ in who provides memory, threads and clock and in how panics are handled."
mechanism = "no_os: bare metal, WASM; memory, threads and clock provided by the consumer; panics abort. os (default): Linux, macOS; raw mmap / extern C, raw clone / pthread, raw clock_gettime; panics abort. std: Windows, other; std::alloc, std::thread, std::time::Instant; panics catch_unwind."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:275-280"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#02-platform-tiers"]
quote = '''
**Three tiers:**
| Tier | Target | Memory | Threads | Clock | Panics |
|---|---|---|---|---|---|
| `no_os` | bare metal, WASM | Consumer provides | Consumer provides | Consumer provides | abort |
| `os` (default) | Linux, macOS | raw mmap / extern "C" | raw clone / pthread | raw clock_gettime | abort |
| `std` | Windows, other | std::alloc | std::thread | std::time::Instant | catch_unwind |
'''
origin = "stated"
standing = "held"
keywords = ["platform tiers", "no_os", "os", "std", "bare metal", "WASM", "mmap", "catch_unwind"]

