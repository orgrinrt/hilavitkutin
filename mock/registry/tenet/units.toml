[[tenet]]
id = "execute_returns_nothing_and_a_failing_unit_aborts_because_abort_gives_better_llvm_codegen"
subject = "units"
what = "A unit's execute method returns nothing and carries no result on the hot path. Failure aborts: on the no_os and os tiers panic is abort already, and on the std tier catching an unwind is available but abort is preferred."
because = "Abort enables more aggressive LLVM optimisation, with no unwind tables and no landing pads."
mechanism = "`execute()` returns `()`. No `Result` return type on the hot path. `catch_unwind` is available on the std tier, and abort is preferred."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2147-2153, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2157-2157, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2448-2452"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#23-scheduler-builder-and-meta"]
quote = '''
**Error handling (resolved):**

`execute()` returns `()`. Abort on failure. This is the design:
- `no_os` and `os` tiers: panic = abort already
- `std` tier: `catch_unwind` available but we prefer abort for LLVM
  codegen quality (abort enables more aggressive optimisation —
  no unwind tables, no landing pads)
---
- No Result return type on the hot path
---
**R7. Abort on failure.** (domain 23)
execute() → (). No Result on the hot path. Errors via data flow
(error columns/virtuals). Abort enables better LLVM codegen. On
no_os/os tiers panic = abort already. On std tier we prefer abort.

'''
