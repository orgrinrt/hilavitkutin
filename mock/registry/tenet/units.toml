subject = "units"
what = "The scheduler is constructed through a builder that is const-generic over the maximum number of units, stores and lanes. It registers units, columns and resources, and optionally overrides the memory provider, the thread pool and the clock before building the scheduler."
mechanism = "`Scheduler::<MAX_UNITS, MAX_STORES, MAX_LANES>::builder().add::<MyWU>().resource::<T>(initial).resource_default::<T>().column::<T>().memory(my_provider).threads(my_pool).clock(my_clock).build()`."
