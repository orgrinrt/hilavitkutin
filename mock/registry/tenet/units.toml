[[tenet]]
id = "a_unit_registers_through_the_builder_with_one_add_whatever_its_schedule_condition"
subject = "units"
what = "One add call on the builder registers any unit and handles all schedule conditions, such as the always and on conditions, because the condition is part of the trait implementation and not of the builder call. There is no separate add for on-conditions."
mechanism = "`.add::<MyWU>()` handles all schedule conditions; `Always`, `On<V>` and the rest are on the trait impl, not the builder call. No separate `add_on`."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:2101-2103"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#23-scheduler-builder-and-meta"]
