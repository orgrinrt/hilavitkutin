[[tenet]]
id = "a_unit_declares_its_name_read_set_write_set_hint_commutativity_and_an_execute_function"
subject = "units"
what = "A unit is a trait with a name, a read access set, a write access set, a scheduling hint with a default, a commutativity flag and an execute function that takes a context over its read and write sets. It is generic over its schedule condition, which defaults to always."
mechanism = "`pub trait WorkUnit<Schedule = Always>: Send + Sync + 'static { const NAME: &'static str; type Read: AccessSet; type Write: AccessSet; type Hint: SchedulingHint = (Immediate, Atomic, Normal); const COMMUTATIVE: bool; fn execute(&self, ctx: Context<Self::Read, Self::Write>); }`"
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:640-647"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#09-workunit-trait"]
quote = '''
pub trait WorkUnit<Schedule = Always>: Send + Sync + 'static {
    const NAME: &'static str;
    type Read: AccessSet;
    type Write: AccessSet;
    type Hint: SchedulingHint = (Immediate, Atomic, Normal);
    const COMMUTATIVE: bool;  // T3 decision #45
    fn execute(&self, ctx: Context<Self::Read, Self::Write>);
}
'''
