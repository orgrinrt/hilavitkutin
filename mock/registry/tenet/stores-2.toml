[[tenet]]
id = "virtual_flags_are_reset_by_one_epoch_increment_and_fully_cleared_every_two_hundred_and_fifty_six_passes"
what = "The flags are reset by incrementing a global epoch once per pass instead of clearing memory: a flag counts as set when its value equals the current epoch. A full clear is done every two hundred and fifty-six passes, at the epoch wraparound."
mechanism = "Global epoch u8, incremented per pass; 'flag is set' = flag_value == current_epoch; reset = one u8 increment (not memset); full clear every 256 passes."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:709-713"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#10-virtual-flag-system"]
quote = '''
**Epoch-based reset (T5 L1124-1128, T6 L444-454):**
- Global epoch u8, incremented per pass
- "Flag is set" = flag_value == current_epoch
- Reset = one u8 increment (not memset)
- Full clear every 256 passes (epoch wraparound)
'''
origin = "stated"
standing = "provisional"
subject = "stores"
keywords = ["epoch", "u8", "epoch wraparound", "reset", "memset", "256 passes", "virtual flags"]

