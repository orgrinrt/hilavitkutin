[[tenet]]
id = "as_of_2026_07_02_the_drain_stores_blob_is_the_correct_layout_and_the_drift_is_the_missing_snapshot_and_live_stream_path"
subject = "stores"
what = "As of 2026-07-02, the storage addendum records that the shipped drain stores reserve a one-record blob per resource behind a single resource pointer, and that the bench confirms the blob as the correct layout. The drift is that the drain stores read the value live through the pointer every iteration, with no stack snapshot of the scalar members and no live-stream path for collection members. The fix is additive, adding the snapshot and the live-stream, and not a decomposition rewrite."
mechanism = "`DrainStores` at `mock/crates/hilavitkutin/src/resource/bindings.rs:22`; `ResourcePtr<T>`."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:81-88"
provenance = ["mock::research::202606210600_resource-storage-model-canonical-addendum::#the-shipped-impl-is-drift-only-in-lacking-the-snapshot"]
quote = '''
## The shipped impl is drift only in lacking the snapshot

`DrainStores` (`mock/crates/hilavitkutin/src/resource/bindings.rs:22`) reserves a one-record blob
per `Resource<T>` behind a single `ResourcePtr<T>`. The bench confirms the blob is the CORRECT
per-record layout, so this is not the drift. The drift is that `DrainStores` reads the value live
through the pointer every iteration with no stack-snapshot of the scalar members and no
live-stream path for collection members. The fix is additive (add the snapshot + the live-stream),
not a decomposition rewrite.
'''
