[[tenet]]
id = "a_resource_is_a_handle_and_not_an_inline_value_store_which_is_the_corrected_reading_of_r5"
subject = "stores"
what = "A resource is a handle and not an inline-value store. The handle model is the corrected reading of the spec's resource section: resources sit behind pointer indirection to external slab storage and not inline in the context struct, and resource storage and column storage have separate pointer provenance, with the stack-local hoist as the noalias mechanism."
mechanism = "`Resource<T>` as a handle. Spec 1689: \"All behind pointer indirection to external slab storage. NOT inline in the context struct.\"; spec 1695-1704: separate pointer provenance, resource data in a stack-local region LLVM can prove non-aliasing with column pointers; spec 537/1684: resources consist of three field types Field/Seq/Map. Oracle: consolidation spec R5, lines 535-566 and 1682-1710."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:4-6, mock/research/202606210600_resource-storage-model-canonical-addendum.md:12-12, mock/research/202606210600_resource-storage-model-canonical-addendum.md:14-16, mock/research/202606210600_resource-storage-model-canonical-addendum.md:58-68"
provenance = ["mock::research::202606210600_resource-storage-model-canonical-addendum::#canonical-addendum-the-resource-storage-model-handle-one-record-blob"]
quote = '''
**Status:** canonical reading-correction of consolidation-spec R5, now with the layout fork
resolved by the six-variant bench (round 202606210600, both runs). The handle model is the
corrected READING of R5 (solid). The original version of this addendum ALSO asserted a
---
**Oracle:** consolidation spec R5 (`mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md` lines 535-566, 1682-1710).
---
## The model, stated outright (bench-confirmed)

A `Resource<T>` is a **handle**, not an inline-value store.
---
## Why the handle model is what R5 says (the reading correction)

- Spec **1689**: "All behind pointer indirection to external slab storage. NOT inline in
  the context struct." -> the resource holds pointers; values are external. This is item 1+3.
- Spec **1695-1704**: "Resource storage and column storage must have separate pointer
  provenance ... resource data lives in a stack-local region that LLVM can prove
  non-aliasing with column pointers." -> the **handle store** is the separate-provenance
  thing; the stack-local hoist is the noalias mechanism. This is item 3+5.
- Spec **537/1684**: "Resources consist of three field types `Field`/`Seq`/`Map`." -> the
  per-member composition read by the `Decompose` seam (size fold + collection ptr+len); the
  value bytes themselves stay contiguous in the blob (item 1), not one column per member.
'''
origin = "proposed"
written_by = "canonical addendum on the resource storage model, 2026-06-19, revised 2026-07-02 (bench-confirmed), agent-written; the text does not name its author"
standing = "ratified"
