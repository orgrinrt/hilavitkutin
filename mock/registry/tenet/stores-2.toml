[[tenet]]
id = "a_resource_value_is_addressed_through_an_erased_static_shape_so_it_can_cross_a_plugin_boundary"
subject = "stores"
what = "The maintainer picked the hybrid: the value bytes of a resource stay one contiguous record, and they are addressed through an erased static-shape descriptor and not through a monomorphised concrete-type pointer, so that a resource value can cross a plugin boundary and interoperate with builtin resources near-natively, as in loimu's model. The bench measured this addressing at parity with the native monomorphised one. He chose it citing future-proofing and parity. Every resource uses the erased addressing, so any resource is plugin-capable without a design change."
mechanism = "Backcast on access; cdylib/wasm plugin boundary; v4/v1 within +-1.7% across both runs, ties on B/C/E; global-capable, 2026-07-02."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:46-56"
provenance = ["mock::research::202606210600_resource-storage-model-canonical-addendum::#the-model-stated-outright-bench-confirmed"]
quote = '''
6. **Erased static-shape addressing (op picked the hybrid, global-capable, 2026-07-02).** The
   value bytes stay the one-record contiguous blob (items 1-5), but are ADDRESSED through an
   erased static-shape descriptor (backcast on access) rather than a monomorphised concrete-type
   pointer, so a resource value can cross a cdylib/wasm plugin boundary and interoperate with
   builtin resources near-natively (loimu's model). The bench measured this addressing at parity
   with native monomorphised on every axis (v4/v1 within +-1.7% across both runs, ties on B/C/E),
   so it carries no in-process penalty. Op chose the hybrid citing future-proofing + parity, with
   the erasure complexity ruled out as an anti-axis. The per-resource-vs-global sub-question
   resolves to global-capable: every resource uses the erased addressing (any resource
   plugin-capable without a design change). See
   `mock/design_rounds/202606210600_topic.hybrid-decision.md`.
'''
origin = "stated"
standing = "pending"
