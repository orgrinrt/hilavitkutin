[[tenet]]
id = "a_seq_or_map_value_is_a_pointer_and_a_length_and_its_elements_are_live_streamed_from_their_column_and_never_copied"
subject = "stores"
what = "A sequence or map value is a pointer to the first element plus a length counted in strides, with elements stored consecutively. The snapshot copies only the pointer and length and never the elements, so the collection is streamed live from its column inside the loop. The bench decided this on axis D: live-streaming beats snapshot-copying by about 2.5 times once the collection exceeds cache, with parity below about 4 MiB."
mechanism = "`Seq`/`Map` = pointer-to-first + length (count of strides); axis D: live-stream beats snapshot-copy by ~2.5x above cache (64 MiB), parity below ~4 MiB, confirmed in both runs."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:34-38"
