[[tenet]]
id = "the_value_of_a_resource_is_one_contiguous_record_blob_and_the_per_member_column_decomposition_was_refuted_by_bench"
subject = "stores"
what = "The value of a resource lives as a per-resource contiguous blob of one record, bumped from the arena, and is not decomposed into per-member columns. The six-variant bench decided this: the decomposed layout loses intra-resource locality and crosses the column-count cap on realistic resource sets, and the shape-bound shared layout carries a cross-core false-sharing penalty and a resize hazard, and neither buys a hot-loop win. The decompose trait remains the per-member seam for the size fold and for the collection pointer and length, but the value bytes stay contiguous."
mechanism = "V2 (each member its own column) loses intra-resource locality, up to 3.1x at M=64, and crosses the `Dim<256>` column-count cap; V3 (shape-bound shared layout) carries a 3.4x cross-core false-sharing penalty plus a resize-invalidates-all-sharers hazard; V2 and V3 lose axes B/C/E for no hot-loop win. `Decompose` in `hilavitkutin-api/src/storage.rs`. Findings: `mock/research/202606210600_storage-bench-findings.md`; round resolution `mock/design_rounds/202606210600_topic.bench-run2-resolution.md`."
source = "mock/research/202606210600_resource-storage-model-canonical-addendum.md:7-11, mock/research/202606210600_resource-storage-model-canonical-addendum.md:18-25"
provenance = ["mock::research::202606210600_resource-storage-model-canonical-addendum::#canonical-addendum-the-resource-storage-model-handle-one-record-blob"]
quote = '''
per-member decompose-to-shape-bound-columns layout; the bench refuted that (V2 decomposed and
V3 shape-bound lose axes B/C/E for no hot-loop win). The layout below is the bench-decided one:
a one-record blob (per-resource contiguous value), scalar-snapshotted, with live-streamed
collection members. See `mock/research/202606210600_storage-bench-findings.md` (the full findings
+ run-2 confirmation) and `mock/design_rounds/202606210600_topic.bench-run2-resolution.md`.
---
1. **One-record blob value.** `T`'s value lives as a per-resource contiguous blob (one record),
   bumped from the arena, NOT decomposed into per-member columns. The bench decided this: the
   decomposed layout (V2, each member its own column) loses intra-resource locality (up to 3.1x
   at M=64) and crosses the `Dim<256>` column-count cap on realistic resource sets; the
   shape-bound shared layout (V3) carries a 3.4x cross-core false-sharing penalty plus a
   resize-invalidates-all-sharers hazard. Neither buys a hot-loop win. The `Decompose` trait
   (`hilavitkutin-api/src/storage.rs`) remains the per-member seam for the size fold and the
   collection ptr+len, but the value bytes stay contiguous.
'''
