[[tenet]]
id = "an_accumulator_is_a_column_written_by_append_and_a_fourth_store_marker"
what = "The design round that landed accumulators reports the maintainer's model as two kinds of column: an input column, whose buffer is sized to a build-time record count, populated before the frame and read and written by index, and an accumulator column, which is written by append during the frame, growing from zero toward a capacity, and whose populated prefix a later drain reads into persistence. It says the maintainer chose this two-kind surface deliberately and not a single global record count. The round represents the accumulator as a distinct store marker beside the three existing ones, the fourth on the same pattern, because making it a role or mode of the column would put indexed random write and ordered append on one marker."
mechanism = "`Accum<T>`, sibling of `Resource<T>` / `Column<T>` / `Virtual<T>`, with its own binding node, selector, projection and accessor. The alternative, a mode of `Column<T>`, makes the `Contains<...>` membership proof ambiguous (read vs write vs append) and forces a runtime flag or a forbidden specialization."
source = "mock/design_rounds/202606041800/202606041800_topic.accumulator-columns.md:8-8, mock/design_rounds/202606041800/202606041800_topic.accumulator-columns.md:16-16"
provenance = ["mock::design_rounds::202606041800::202606041800_topic.accumulator-columns::#topic-accumulator-columns-append-surface-through-dispatch"]
quote = '''
The column-data-plane round landed INPUT columns: buffers sized to a build-time record count, populated before the frame, read and written by index. This round lands the second half of op's locked model: ACCUMULATOR columns. An accumulator is written by APPEND during the frame, growing from zero toward a capacity; a later PassEnd drain reads the populated prefix into persistence. op chose this two-kind surface deliberately rather than a single global record count.
---
**Kind representation (A1): a distinct `Accum<T>` marker.** Sibling of `Resource<T>` / `Column<T>` / `Virtual<T>`, with its own binding node, selector, projection, and accessor. The alternative (a role or mode of `Column<T>`) collapses two semantically distinct operations (indexed random-write vs ordered append) onto one marker, making the `Contains<...>` membership proof ambiguous (read vs write vs append) and forcing a runtime flag or a forbidden specialization. The engine already has three parallel per-kind markers; `Accum<T>` is the fourth on the same pattern.
'''
origin = "proposed"
written_by = "design round 202606041800 (accumulator columns), its topic file, an agent-written round that reports the maintainer's model"
standing = "provisional"
subject = "stores"
keywords = ["accumulator", "Accum", "append", "input column", "fourth store", "two-kind", "record count", "capacity", "drain"]
related = ["tenet::there_are_three_store_types_and_one_scheduling_mechanism", "question::what_an_append_past_the_capacity_of_an_accumulator_does"]

[[tenet]]
id = "the_standalone_spec_lists_four_store_shapes_with_the_accumulator_among_them"
what = "The standalone spec says state lives in one of four store shapes and there is nothing else: a singleton store of one value, a collection store of N records in columnar layout accessed through morsel windows, an accumulator, which is an append-only output store a unit pushes records into with a reserved capacity fixed at build, and a fired marker carrying no data."
mechanism = "`Resource<T>`, `Column<T>`, `Accum<T>`, `Virtual<V>`."
source = "mock/research/pre_seed/202606111800_canonical-spec-standalone.md:162-173"
provenance = ["mock::research::pre_seed::202606111800_canonical-spec-standalone::#3-2-stores"]
quote = '''
State lives in one of four store shapes. There is nothing else; a pipeline's
entire mutable and immutable state reduces to these.

- **`Resource<T>`**: a singleton store: one value of `T`, with
  scheduler-managed lifetime. Providers (a clock, a configuration, an
  interner) are Resources.
- **`Column<T>`**: a collection store: N records of `T` in columnar layout,
  accessed through cache-friendly morsel windows.
- **`Accum<T>`**: an accumulator: an append-only output store a unit pushes
  records into, with a reserved capacity fixed at build.
- **`Virtual<V>`**: a fired/event marker carrying no data, used for
  cross-unit signalling at plan-time-determined boundaries (see 3.3 and 8).
'''
origin = "proposed"
written_by = "the standalone spec 202606111800, a reading aid with no design authority of its own by addendum A2"
standing = "provisional"
subject = "stores"
keywords = ["four store shapes", "Accum", "accumulator", "append-only", "reserved capacity", "Resource", "Column", "Virtual"]
related = ["tenet::there_are_three_store_types_and_one_scheduling_mechanism"]

