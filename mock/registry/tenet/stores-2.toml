[[tenet]]
id = "resource_data_sits_behind_pointer_indirection_to_external_slab_storage_and_never_inline_in_the_context"
what = "A resource's fields sit behind pointer indirection to external slab storage and not inline in the context struct, because writing inline data through a shared reference is undefined behaviour."
because = "LLVM adds noalias to a shared reference, and inline writes violate it."
mechanism = "Three field types: `Field<T>` where T: ColumnValue (at most 16 bytes, a scalar), `Seq<T, const N: usize>` (const-sized array, separate arena), `Map<K, V, const N: usize>` (const-sized map, separate arena)."
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:1684-1691"
provenance = ["mock::design_rounds::202604200055::202603181200_topic.hilavitkutin-design-consolidation::#19-resource-handling"]
quote = '''
Resources consist of three field types:
- `Field<T>` where T: ColumnValue (≤16 bytes) — scalar
- `Seq<T, const N: usize>` — const-sized array, separate arena
- `Map<K, V, const N: usize>` — const-sized map, separate arena

All behind pointer indirection to external slab storage. NOT inline
in the context struct. Writing inline data through `&self` is UB
(LLVM adds noalias to `&self`, inline writes violate it).
'''
origin = "stated"
standing = "provisional"
subject = "stores"
keywords = ["resource storage", "pointer indirection", "slab storage", "inline write", "noalias", "Field", "Seq", "Map"]
cites = ["a_resource_is_scalars_and_const_sized_collections_only"]

