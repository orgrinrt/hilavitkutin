[[tenet]]
id = "the_platform_has_two_tiers_no_os_and_os_and_a_build_on_default_features_is_the_no_os_tier"
subject = "memory"
what = "There are two platform tiers, no_os and os, and neither is chosen for the consumer. A build on default features is the no_os tier, trait contracts only, with memory, threads and clock provided by the consumer. The os tier is a feature the consumer turns on, giving raw mmap and clock_gettime on Linux and macOS. Both abort on panic."
mechanism = "No crate has a default feature. The engine's `os` feature carries `OsMemoryProvider`, `OsClock` and the operating-system arms of thread parking and thread classes; with it off the engine reaches no operating system."
