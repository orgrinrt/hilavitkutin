[[tenet]]
id = "the_arena_column_storage_reserves_64_byte_aligned_blocks_through_the_memory_provider_and_a_release_gives_the_block_back_as_reserved"
subject = "memory"
what = "Reserving a column allocates its byte count 64-byte aligned through the bound memory provider and records the slot, and a resizing reserve frees the prior block first. The column pointer accessors return the recorded base cast to the scalar type, raw and not a slice, and the count reads the slot. A release gives the slot's block back to the provider with the layout it was reserved at and empties the slot, and dropping deallocates every live slot the same way, so every free matches its reserve."
mechanism = "`reserve<T>` allocates `count * size_of::<T>()` bytes 64-byte aligned; `column_ptr` / `column_ptr_mut` return a raw pointer, not a slice, per R6; `count`; `release` deallocates with `CACHE_LINE_ALIGN` and empties the slot; `Drop` deallocates every live slot with `CACHE_LINE_ALIGN`."
source = "mock/research/202611200520_default-impls-opt-in/OP-CALL.md:7-18"
provenance = ["mock::research::202611200520_default-impls-opt-in::OP-CALL::#the-question-and-his-answer"]
quote = '''
Option a/b but make the default impls an opt in feature on their respective crates. Default to contracts only. The default impls we already have for other things should probably move there too and the readmes should mention the different principled features for impls to opt in optionally (there are different principles on the impls now so each needs a unified name)
'''
