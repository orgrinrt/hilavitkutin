[[tenet]]
id = "a_deallocation_is_given_the_same_alignment_as_its_allocation"
what = "Freeing memory through the memory provider takes the same alignment the matching allocation was given, beside the same pointer and length, and all three are part of the safety contract. A provider whose free path ignores alignment may leave the parameter unread."
because = "An allocator underneath may need the full layout to free correctly, and nothing at the free site can recover the alignment; column slabs are reserved at 64-byte alignment, so a provider left to guess would free every column with a mismatched layout."
mechanism = "`deallocate` takes `align` beside `ptr` and `len`; `std::alloc` requires the full layout; a bump arena may not read the parameter."
source = "mock/research/202611130850_the-record-read-whole/RECOVERED.md:123-133"
provenance = ["mock::research::202611130850_the-record-read-whole::RECOVERED::#mock-crates-hilavitkutin-api-design-md-tmpl-lines-953-to-963"]
quote = '''
`deallocate` takes the same `align` the matching `allocate` was given,
alongside the same `ptr` and `len`. All three are part of the safety
contract, not just the first two. An allocator underneath may require the
full layout to free correctly (`std::alloc` does), and nothing at the free
site can recover the alignment on its own: the caller is the only party
that knows it. A provider whose free path ignores alignment, such as a
bump arena, may simply not read the parameter.

The hazard is concrete rather than theoretical. Column slabs are reserved
at 64-byte alignment, so a provider left to guess a word would free every
column with a mismatched layout.
'''
origin = "proposed"
written_by = "api design template as on the branch recover/unlanded-rounds-and-benches, commit of 2026-08-30, not on dev; the text does not say whose it is"
standing = "provisional"
subject = "memory"
keywords = ["deallocate", "alignment", "MemoryProvider", "safety contract", "64-byte alignment", "layout"]
