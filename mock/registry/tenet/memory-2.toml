id = "the_clock_is_a_builder_slot_provider_starting_at_the_os_clock_when_the_os_feature_is_on_and_at_a_null_clock_otherwise"
subject = "memory"
what = "The clock is a builder-slot provider. The builder starts it at the os-tier monotonic clock when the consumer turns the os feature on, and at a null clock otherwise until the consumer supplies one. Platform inputs routed through the generic with call drop their values, so value-carrying providers get dedicated slots."
mechanism = "`SchedulerBuilder::clock`; the builder's starting clock is `OsClock` under the `os` feature and `NullClock` without it; `.with(...)` drops platform input values."
