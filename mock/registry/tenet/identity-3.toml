[[tenet]]
id = "a_shape_s_counter_width_is_tied_to_the_span_a_minter_owns_read_off_the_functions_that_define_it_and_not_to_another_declaration"
subject = "identity"
what = "A law relating two declarations to each other constrains neither, so the counter width is tied to what the mechanism does. For every shape and every origin, the span a minter owns equals two to the power of the counter width minus one, read off the two functions that define it. The origin width then follows from the existing sum law. The law is written for every shape and not only the varying one."
mechanism = "`origin_ceiling(o) - origin_base(o)  ==  2^COUNTER_BITS - 1`; `ORIGIN_BITS` follows from the existing sum law."
source = "mock/design_rounds/202608091100/202608091100_topic.widths-tied-to-the-mechanism-and-a-dead-gate.md:31-34, mock/design_rounds/202608091100/202608091100_topic.widths-tied-to-the-mechanism-and-a-dead-gate.md:38-48, mock/design_rounds/202608091100/202608091100_topic.widths-tied-to-the-mechanism-and-a-dead-gate.md:50-51"
