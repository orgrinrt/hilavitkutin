[[tenet]]
id = "a_shape_declares_which_minter_an_origin_is_by_an_index_and_the_run_it_owns_is_derived_so_disjointness_is_arithmetic"
subject = "identity"
what = "A shape declares which minter an origin is, by an index, and the run that origin owns is derived from the index and the counter width. Distinct indices own disjoint runs by arithmetic, so disjointness is a consequence of the derivation and not a law, and a shape with overlapping origins cannot supply its own bounds. The base and the ceiling leave the shape trait entirely."
because = "Two laws had been written to reject the construction that had just been found, each did, and neither described the property; a law samples the shapes that exist, while a derivation covers the ones that do not yet."
mechanism = "`origin_index` on the shape; free functions generic over the shape: `base = index << COUNTER_BITS`, `ceiling = base + (1 << COUNTER_BITS) - 1`; the run is `[index << COUNTER_BITS, ((index+1) << COUNTER_BITS) - 1]`. `origin_base` and `origin_ceiling` leave the trait."
source = "mock/design_rounds/202608101000/202608101000_changelist.src.lock.md:11-22, mock/design_rounds/202608101000/202608101000_changelist.doc.lock.md:11-24"
provenance = ["mock::design_rounds::202608101000::202608101000_changelist.src.lock::#change-symshape-declares-origin-index-base-and-ceiling-become-free-functions"]
quote = '''
`origin_base` and `origin_ceiling` leave the trait entirely. A shape declares
`origin_index`, and the run it owns is derived by free functions generic over
the shape:

```
base    = index << COUNTER_BITS
ceiling = base + (1 << COUNTER_BITS) - 1
```

**Disjointness stops being a law and becomes arithmetic.** Distinct indices own
`[i << C, ((i+1) << C) - 1]`, which cannot overlap, so the shape that defeated
round nine cannot be written at all.
---
The document says origins divide the id space so two minters cannot collide
however far either counts. The code let a shape supply two arbitrary numbers, and
three rounds of numbers were wrong: first placed past the field, then placed
inside it but overlapping.

The document now says what the mechanism is. A shape declares **which minter an
origin is**; the run it owns is derived, `[index << COUNTER_BITS, ((index+1) <<
COUNTER_BITS) - 1]`. Distinct indices own disjoint runs by arithmetic, so an
overlapping shape cannot be written rather than being caught by a law.

It also records why the previous answer was wrong in kind rather than in detail:
**both laws were written to reject the construction that had just been found**,
each succeeded at that, and neither described the property. A law samples the
shapes that exist; a derivation covers the ones that do not yet.
'''
origin = "proposed"
written_by = "source and doc changelists of round 202608101000 'an origin is an index, and the run is derived', 2026-08-10, agent-written"
standing = "pending"
stamp = 'provisional, 2026-11-13: nothing read in the written history shows it to be his or to be unbacked, and it stands on a stamp under the words of op "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
keywords = ["origin_index", "derived run", "disjoint runs", "COUNTER_BITS", "free functions", "origin_base", "origin_ceiling", "disjointness by arithmetic"]
rejects = ["The code let a shape supply two arbitrary numbers"]
related = ["tenet::a_generator_is_built_for_an_origin_and_a_shape_with_no_origin_bits_has_one_origin_and_a_constructor_with_no_argument"]

