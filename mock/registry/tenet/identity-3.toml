[[tenet]]
id = "the_width_a_shape_declares_comes_from_the_associated_types_its_accessors_are_typed_against_and_not_from_a_forwarded_mask"
subject = "identity"
what = "The width a shape declares comes from the associated types the layout's accessors are typed against, read through a width trait that no layout can supply for itself. A layout cannot lie about those, because the accessor must return what the bitfield hands it, and a wrong associated type is a type error rather than a silent disagreement. The forwarded mask constants have no reader and go."
because = "The earlier defence, that a layout which lied would have to lie about its mask, which its own accessors read through, is false: the accessor uses the bitfield's own mask directly, the forwarded mask has no reader outside the test law, and a layout may forward any mask while every accessor still round-trips."
mechanism = "`KIND_BITS == width of Self::Kind` and `ID_BITS == width of Self::Id`, read through a `FieldWidth` trait with a blanket impl over `Bits<N, S>` yielding `N`; blanket because `specialization` is forbidden. `get_kind` returns `self.kind()`. Changing `type Kind = Bits<5, Hot>` to `Bits<9, Hot>` on a five-bit field is four `E0308`s."
source = "mock/design_rounds/202608091100/202608091100_changelist.doc.lock.md:16-30, mock/design_rounds/202608091100/202608091100_topic.widths-tied-to-the-mechanism-and-a-dead-gate.md:88-91, mock/design_rounds/202608091100/202608091100_topic.widths-tied-to-the-mechanism-and-a-dead-gate.md:93-104"
provenance = ["mock::design_rounds::202608091100::202608091100_changelist.doc.lock::#change-the-width-derivation-paragraph-from-the-mask-to-the-associated-type"]
quote = '''
The current text says the width is counted from the layout's generated mask, and
defends that choice with: "a layout that lied would have to lie about its mask,
which its own accessors read through."

**That is false and the review proved it by construction.** `get_kind` returns
`self.kind()`, the bitfield's inherent accessor, which uses the macro's mask
directly. The forwarded `KIND_MASK` constant has no reader outside the test law,
so a layout may forward any mask at all and every accessor still round-trips.

Replacement states the derivation that holds: the width comes from `Self::Kind`
and `Self::Id`, the associated types the accessors are typed against, read
through a `FieldWidth` trait whose blanket impl over `Bits<N, S>` yields `N`. A
layout cannot lie about those, because `get_kind` must return what the bitfield
hands it, and a wrong associated type is a type error rather than a silent
disagreement.
---
**What is actually constrained is `Self::Kind` and `Self::Id`.** `get_kind`
returns `Self::Kind` and its body returns `self.kind()`, which the bitfield
types at the field's real width. Changing `type Kind = Bits<5, Hot>` to
`Bits<9, Hot>` on a five-bit field is four `E0308`s. Verified the same way.
---
So the widths come from the associated types, not from the masks:

```
KIND_BITS == width of Self::Kind
ID_BITS   == width of Self::Id
```

read through a `FieldWidth` trait with a blanket impl over `Bits<N, S>`
yielding `N`. Blanket, so no layout can supply its own; `specialization` is
forbidden, so that is not a stylistic claim.

The forwarded mask constants then have no reader at all and go.
'''
origin = "proposed"
written_by = "doc changelist and topic of round 202608091100 'widths tied to the mechanism and a dead gate', 2026-08-09, agent-written"
standing = "pending"
keywords = ["FieldWidth", "KIND_BITS", "ID_BITS", "associated type", "Self::Kind", "forwarded mask", "width derivation", "SymShape"]
rejects = ["a layout that lied would have to lie about its mask, which its own accessors read through"]
