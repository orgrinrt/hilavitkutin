## CHANGE: retract "the `Uint<28, Hot>` in the trait signature is gone"

File: `mock/crates/hilavitkutin-sym/DESIGN.md.tmpl`

**It is not gone.** `shape.rs:73` carries it on `id_from_counter`, as do four
impls and `generator.rs`. The claim is in the design tier and was repeated in
round thirteen's src changelist, which makes it the sixth false locked claim on
this branch and the first to sit in a document that governs code.

It becomes true in this round, by moving the projection to the layout. The
document says what actually happened rather than being quietly edited to match:
the claim was written from the intended end state while one signature still held
the type.
---
The document says a shape whose origins overlap cannot be written. That holds for
the routes closed so far and is stated universally, and two more routes were live
when it was written.

Replaced with what is true and what is not: a shape can no longer supply a base,
a ceiling or a counter projection; a **layout** still supplies the projection and
can lie, constrained by the round-trip law; and an out-of-range index is refused
at the point of use rather than being unwritable.

**Five rounds have now claimed elimination and been wrong.** The document records
that, because the next reader's real question is which parts of this are load
bearing, and a document that has overclaimed five times has to say so to be worth
reading.
---
`id_from_counter` leaves `SymShape`. The projection belongs to the layout, whose
`Id` type its bitfield fixes, so what is left there is forwarding rather than
arithmetic. **This reduces the freedom rather than eliminating it**: a layout is
still written by hand and can still lie, and what constrains it is the round-trip
law that already exists. Round thirteen claimed elimination and was wrong; this
round claims a reduction and names what remains.
'''
