id = "the_build_crate_is_no_std_takes_the_profile_and_target_strings_as_parameters_and_writes_its_text_into_a_formatting_writer"
subject = "identity"
what = "The build crate is no_std and touches neither the environment nor the filesystem. The build script owns the environment and the filesystem: it reads the profile and the target configuration values and passes them in, and the crate writes the directives and the config file text into a writer the script supplies. Profile-guided optimisation inputs, whether a profile exists and how far the head is from the profiled commit, are read by the script and passed the same way. Nothing in the crate's design needed std for itself, because each value it read from the environment is one a build script can pass in."
because = "The workspace rule forbidding extern crate std settles it, and not a ruling."
mechanism = "The crate is `#![no_std]`; takes `PROFILE` and the `CARGO_CFG_*` values as parameters; writes directives and config file text into any `core::fmt::Write`; `configure().run()` keeps its builder shape and takes that input. The earlier design read `CARGO_CFG_*`, emitted `cargo:rustc-cfg` lines and wrote config files from a build script."
