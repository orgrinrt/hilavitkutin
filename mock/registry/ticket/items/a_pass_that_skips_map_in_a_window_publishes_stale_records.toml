title = "a pass that skips map in a window publishes stale records of a buffered store under Exchange"
kind = "task"
what = "DESIGN.md.tmpl, the buffered boundary paragraph, says the value function is applied at every record of the unit's range, so the live side is whole when the boundary takes it. A unit's execute runs per window and may call map in some windows and not others (shown by host_import's live-copy test, round 202611200058-dx86). Under Exchange the boundary then flips to a side whose unwritten windows hold the values of two passes before. Reasoned by the pass 2 reviewer of work/hila-consumer-surface and run by the pass 3 reviewer: one pass over every window, then a pass over the first window only, leaves the last record at A(0) where A(1) is right. The red test is a_pass_that_skips_a_window_keeps_the_last_value_there in the exchange arm of host_import.rs, ignored with this ticket named, round 202611200124-arjq; its snapshot arm passes. Under Snapshot it does not arise: the boundary copies the whole live side, and outside the written windows the live side holds what the last boundary copied."
related = ["tenet::change_detection_is_per_morsel_and_skips_what_is_unchanged"]
repos = ["orgrinrt/hilavitkutin"]

