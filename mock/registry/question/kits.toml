[[question]]
id = "whether_the_builder_input_trait_gains_a_method_that_extracts_the_construction_value_from_a_carrier"
asks = "In the builder value retention round, does the builder input trait gain a method that moves the construction value out of a carrier, or does it stay with its two associated types?"
options = ["`BuilderInput` gains `into_init(self) -> Self::Init` so `.with` can move the construction value out of the carrier and onto the `Staged` list.", "No method is added to `BuilderInput` (it stays `Init` + `Dispatch`), so none of the 24 existing `impl BuilderInput` sites change."]
state = "open"
source = "mock/design_rounds/202605282319/202605282319_topic.builder-value-retention.md:12-12, mock/design_rounds/202605282319/202605282319_topic.builder-value-retention.md:25-25, mock/design_rounds/202605282319/202605282319_changelist.src.lock.md:3-3"
quote = '''
B1 makes the value survive. It adds a sealed value-carrying cons-list (`StageList`: `StageEmpty`, `Stage<H, T>`) that holds the actual registered values, distinct from the type-level `AccessSet` cons-list that tracks store identity. `Resource::new(value)` returns a value carrier (`StagedResource<T>`) that impls `BuilderInput<Init = T, Dispatch = StoreDispatch<Resource<T>>>`, so the marker type still routes into `Stores` while the value rides in the carrier. `BuilderInput` gains `into_init(self) -> Self::Init` so `.with` can move the construction value out of the carrier and onto the `Staged` list. The builder reshapes to `SchedulerBuilder<Wus, Stores, Platform, Staged>`, threading the platform accumulator (so a registered `MemoryProvider` is carried) and the staged-value list. Per the pre-1.0 no-legacy-shims rule this is a clean delete-and-replace; consumers that build through inference are unaffected.
---
2. `hilavitkutin-api/src/builder_input.rs`: add `StagedResource<T>(T)` with `impl BuilderInput<Init = T, Dispatch = StoreDispatch<Resource<T>>>`; add `fn into_init(self) -> Self::Init` to `BuilderInput` (default `self`; carriers and zero-data markers override).
---
Round: 202605282319. Phase: IMPL. Makes the scheduler builder retain each registered value instead of dropping it, by giving `.with` a value-carrying accumulator and having `Resource::new` return a carrier that owns the value. No method is added to `BuilderInput` (it stays `Init` + `Dispatch`), so none of the 24 existing `impl BuilderInput` sites change. The move of retained values into a `MemoryProvider`-allocated arena is the next round (B2).
'''
