## Composition

Kits compose by being added in sequence on the SchedulerBuilder:

```rust
let scheduler = Scheduler::builder()
.resource::<StringInterner<...>>(default_interner())
.add_kit::<RunnerKit>()
.add_kit::<LinterKit>()
.add_kit::<TracingKit>()
.build();
---
| `InternerKit<BYTES, ENTRIES>` | Kit impl that declares `Resource<StringInterner<MemoryArena<BYTES, ENTRIES>>>` as `Owned`. Pure declaration; no install method. Engine reads `K::Units` and `K::Owned` at compile time on `.with(InternerKit::<BYTES, ENTRIES>)`. |
---
Usage on the scheduler:

```rust
let scheduler = Scheduler::builder()
.with(Resource::new(default_interner::<4096, 256>()))
.with(InternerKit::<4096, 256>)
.build();
```
'''
