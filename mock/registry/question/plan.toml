# The questions whose subject is `plan`, part 1.

[[question]]
id = "which_order_the_dispatch_follows_the_rcm_order_of_units_or_the_waist_phase_order"
asks = "Which order canon keeps for dispatch: the RCM order of units as their execution order, or the shipped waist-phase order. The text registers the fork open with a bench oracle and holds that neither is drift until the bench lands."
options = ["the spec's Step 5/8 dual-ordering position: RCM row order is the unit execution order", "the shipped waist-phase order"]
state = "open"
source = "mock/research/202606111400_canonical-design-addendum-a1.md:51-57"
quote = '''
The spec's Step 5/8 dual-ordering position (RCM row order = WU execution
order) versus the shipped waist-phase order is resolved by bench, not by
fiat. Both orders are buildable behind the const grouping mechanism (the
guarded-walk relaxation proven in r2 section 7-6 carries an arbitrary
const-side order). A cache-locality bench on wide fan-out DAGs decides which
wording canon keeps. Until the bench lands, neither order is drift; the fork
is registered open with a bench oracle.
'''
subject = "plan"
keywords = ["RCM", "waist-phase order", "dispatch order", "bench oracle", "cache locality", "A1-1"]
related = ["tenet::whether_dispatch_follows_rcm_order_or_waist_phase_order_is_decided_by_a_bench"]

[[question]]
id = "whether_the_morsel_term_for_write_resource_collections_absorbs_the_swap_traffic_or_a_separate_budget_line_is_owed"
asks = "Whether the write-resource-collection-sizes morsel term absorbs the write-then-read traffic of a swap, or a separate budget line is owed. The Swap-D bench is commissioned to decide it, triggered when #344's write side lands."
options = ["the write_resource_collection_sizes morsel term absorbs the swap's write-then-read traffic", "a separate budget line is owed"]
state = "open"
source = "mock/research/202607200200_replaceable-swap-semantics-spec.md:113-120"
quote = '''
## S7: bench

Swap-D (cold-write-then-stream; N swept 16/64/256, element sizes 4/16/64
bytes, baseline versus swap-at-frame-end): commissioned with the trigger
"when #344's write side lands". It decides whether the
`write_resource_collection_sizes` morsel term absorbs the swap's
write-then-read traffic or a separate budget line is owed. No accessor-shape
arm (one write per swap, between frames; the stakes do not justify one).
'''
subject = "plan"
keywords = ["Swap-D", "morsel term", "write_resource_collection_sizes", "budget line", "#344", "swap traffic"]
related = ["tenet::the_swap_d_bench_is_commissioned_with_the_trigger_when_the_344_write_side_lands"]

