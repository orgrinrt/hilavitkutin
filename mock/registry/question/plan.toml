# The questions whose subject is `plan`, part 1.

[[question]]
id = "which_order_the_dispatch_follows_the_rcm_order_of_units_or_the_waist_phase_order"
asks = "Which order canon keeps for dispatch: the RCM order of units as their execution order, or the shipped waist-phase order. The text registers the fork open with a bench oracle and holds that neither is drift until the bench lands."
options = ["the spec's Step 5/8 dual-ordering position: RCM row order is the unit execution order", "the shipped waist-phase order"]
state = "open"
stamp = 'open, 2026-11-13: op ruled that a bench decides it (mock/research/202606111400_canonical-design-addendum-a1.md:49-57), and the bench of 2026-07-20 reports that the RCM order stands (mock/research/202607200800_a1-1-ordering-theory-bench-expansion.md:82-90); no word of his read takes that result as the answer, so the question stays open on a stamp under his words "The rest can be on provisional stamps to begin with" (mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md)'
source = "mock/research/202606111400_canonical-design-addendum-a1.md:51-57"
quote = '''
The spec's Step 5/8 dual-ordering position (RCM row order = WU execution
order) versus the shipped waist-phase order is resolved by bench, not by
fiat. Both orders are buildable behind the const grouping mechanism (the
guarded-walk relaxation proven in r2 section 7-6 carries an arbitrary
const-side order). A cache-locality bench on wide fan-out DAGs decides which
wording canon keeps. Until the bench lands, neither order is drift; the fork
is registered open with a bench oracle.
'''
subject = "plan"
keywords = ["RCM", "waist-phase order", "dispatch order", "bench oracle", "cache locality", "A1-1"]
related = ["tenet::whether_dispatch_follows_rcm_order_or_waist_phase_order_is_decided_by_a_bench"]

