[[question]]
id = "whether_column_buffers_are_allocated_at_build_to_capacity_or_per_run_once_the_record_count_is_known"
asks = "Column buffers are sized by a record count that can vary per run. Are they reserved at build to capacity, or allocated by the run loop once the per-frame record count is known?"
options = ["Columns are NOT allocated at build(); they belong to the run-loop / plan phase (C/E) where the per-frame record_count is known", "columns reserve at build() to capacity, stable pointer for the scheduler lifetime; per-frame live record count is a metadata field, no per-frame allocation"]
state = "open"
source = "mock/research/sketches/202605290101_ctx-projection-selector.md:57-59, mock/research/sketches/202606041631_column-source-dual-selector/FINDINGS.md:36-36"
quote = '''
## Columns lifetime reframing (corrects the earlier "B2b at build()" framing)

Resource buffers are sized once at `build()` (singleton, scheduler lifetime; shipped in B2a). Column buffers are sized by `record_count`, which varies per run (a real pipeline lints N files where N changes per invocation), so columns are NOT allocated at `build()`; they belong to the run-loop / plan phase (C/E) where the per-frame `record_count` (via `RunCfg: HasRecordCount`) is known. There is no standalone "B2b columns at build()" round; column buffer allocation folds into the run-loop. B3's column accessors operate on the per-frame column buffers passed into the Context at construction. B3 is testable now with hand-provided column buffers, independent of the run-loop.
---
Reservation timing (Timing X, separate decision): columns reserve at `build()` to capacity, stable pointer for the scheduler lifetime; per-frame live record count is a metadata field, no per-frame allocation. The `ColumnBinding` Column drain arm stops recording a dangling placeholder and records the real `column_ptr_mut` after a `reserve` sized by the record count.
'''
