# The questions whose subject is `memory`, part 1.

[[question]]
id = "whether_the_providers_crate_already_ships_the_default_column_storage_and_the_adapt_surface_or_only_the_interner"
asks = "The workspace design template says the providers crate ships only the interner surface in its first version, with a default column storage added by a future module. The providers crate's own design template says it ships the arena column storage today, and its surface table also lists a default adapt unit, nine adapt metric resources and two adapt kits that its prose scope does not mention. What does the providers crate ship?"
options = ["v0 ships the interner value-type surface plus InternerKit; future modules add ColumnStorage / Clock / Memory defaults (workspace template)", "ships the interner surface and the default ColumnStorage backing (ArenaColumnStorage) today, with Clock and libc/Unix MemoryProvider defaults to follow (providers template, prose)", "also ships AdaptWu, the per-axis metrics resources and StandardAdaptKit / OffAdaptKit (providers template, surface table)"]
state = "open"
source = "mock/DESIGN.md.tmpl:24-24, mock/crates/hilavitkutin-providers/DESIGN.md.tmpl:8-14, mock/crates/hilavitkutin-providers/DESIGN.md.tmpl:25-28, mock/crates/hilavitkutin-providers/DESIGN.md.tmpl:185-188"
quote = '''
| `hilavitkutin-providers` | Default Resource-backed providers for the scheduler. v0 ships the interner value-type surface (InternerApi / HasInterner / MemoryArena + default_interner constructor) plus the declarative `InternerKit` (round-4 shape: `type Units = read![]`, `type Owned = read![Resource<...>]`). Future modules add ColumnStorage / Clock / Memory defaults per consumer demand. Standalone (no engine dep). |
---
Ships the interner surface and the default `ColumnStorage` backing
(`ArenaColumnStorage`) today: an `InternerApi` provider trait,
`MemoryArena<BYTES, ENTRIES>` inline-storage backing, the
`InternerKit` preset, and `ArenaColumnStorage<M, D>` (the naive
arena-backed store the engine wires in via `CS: ColumnStorage`).
Future rounds add the Clock default and a MemoryProvider default for
libc/Unix per consumer demand.
---
| `AdaptWu` | Default substrate AdaptWu observing `ScheduleEnd` per Topic 1 axis 5 / Topic 5. Consumes `ResourceSnapshot<AdaptMetrics>` at phase boundary and writes `predicted_wait_ns[]` for the next frame. Consumers register via `.with(AdaptWu::default())` for substrate adapt behaviour; consumers ship their own AdaptWu for custom adaptation. |
| `PassDurationMetrics`, `PhaseEMAMetrics`, `FiberEMAMetrics`, `ChangeClassMetrics`, `CacheResidencyMetrics`, `ThroughputTrendingMetrics`, `PredictiveParkingMetrics`, `MemoryWatermarkMetrics`, `CoreIdleTimeMetrics` | Per-axis AdaptMetrics sub-resources (Topic 5 axis F). Each ships individually under `pub mod metrics::*`. Per-axis `pub const DEFAULT_*` named constants per Topic 5 axis C. |
| `StandardAdaptKit`, `OffAdaptKit` | Convenience Kit recipes bundling the nine axes (Topic 5 axis A). Standard ships all axes with bench-validated defaults; Off ships none (adapt observer disabled). Custom mixes via consumer-authored Kits per the themed-resource-sets-individuals-primary workspace convention. |
| `ArenaColumnStorage<M, D>` | Naive arena-backed `ColumnStorage` impl: the default backing for the unified columnar store. `M: MemoryProviderApi` is the allocator; `D: Capacity = Dim<256>` caps the distinct-column count. Placeholder shape; the columnar engine replaces it later without touching any `CS: ColumnStorage` consumer. |
---
- **Clock / MemoryProvider defaults.** Per crate scope: interner and
 the `ArenaColumnStorage` backing at this stage. The Clock and
 libc/Unix MemoryProvider defaults each land in their own round when
 consumer demand surfaces.
'''
subject = "memory"
