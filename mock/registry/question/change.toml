source = "mock/design_rounds/202611122301/202611122258_topic.suite-can-fail.md:18-18, mock/design_rounds/202607200900/202607200500_topic.replaceable-swap-semantics.md:10-10, mock/design_rounds/202607200900/202607200500_topic.replaceable-swap-semantics.md:14-16"
quote = '''
Round `202607193100` removed the install from `replace_value` on op's ruling, because an in-place write of the whole value contradicts the member-by-member swap that `202606210600` requires, and left the install to the decomposed drain (#654). Installing here would redo what that ruling reverted. Deleting the two methods removes a documented API (`docs/HILAVITKUTIN.md`, `docs/KIT.md`, `README.md`), and `plan_dirty` has no setter anywhere in `src` today (`grep -n plan_dirty` shows the field, its initialisers and reads only), so what `replace_resource` is meant to feed does not exist yet either. Neither is a change a test-suite round can make alone, so H9 is reported as not reached, with this reason, and a ticket.
---
Canon has no swap specification. The shipped `replace_value` marks dirty without installing (the D1 install was reverted after the A2-5 mis-citation was found); `replace_resource` is callable only for a type no consumer registers (its `PlanAffecting` bound is sealed with one run-config implementor); the plan-dirty trigger canon promises (a swapped plan-affecting resource forces plan recompute) is unwired end to end (the band gate reads `first_frame` only); and three artifacts (the engine DESIGN template's swap paragraph, the `replace_value` FIXME, the catalogued test's ignore reason) still state the bench-refuted member-by-member layout as if it were canon.
---
1. **S1 install.** `replace_value<V: Replaceable>` performs the whole-blob
   `ptr::write` through the same `Selector<V, Index>` witness the drain and
   the projection read use, plus `mark_dirty`. No other pointer derivation.
'''
