[[question]]
id = "what_changed_means_for_a_computed_column"
asks = "When hilavitkutin tracks which records changed in a frame, so that only readers of changed data are woken, what does changed mean for a computed column?"
options = [
    "Differs from the frame before (Recommended): A value compared with the committed one, at a granularity fixed in the contract. Equal rewrites wake nobody and the plumbing has no discretion.",
    "Written this frame: Any write marks it changed, whatever the value. Cheaper to track, wakes more.",
    "Declared per column: The column (or the unit writing it) declares which of the two holds, as a trait or const; default differs.",
]
state = "answered"
answer = "Declared per column"
answered = "2026-11-13 05:50: .data/op-responses/202611130550_four-calls-that-shape-the-hilavitkutin-api-revision.md"
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS.md:258-280"
quote = '''
#### Changed

  ```text
  When hilavitkutin tracks which records 'changed' in a frame (so only readers of changed data are woken), what does changed mean for a computed column? Both experts picked the first option; they call it a derivation of yours to confirm, not canon text.
  ```

Options offered:

1. Differs from the frame before (Recommended)

   A value compared with the committed one, at a granularity fixed in the contract. Equal rewrites wake nobody and the plumbing has no discretion.

2. Written this frame

   Any write marks it changed, whatever the value. Cheaper to track, wakes more.

3. Declared per column

   The column (or the unit writing it) declares which of the two holds, as a trait or const; default differs.

Chosen:

- Declared per column
'''
