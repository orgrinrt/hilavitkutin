id = "whether_the_plan_affecting_marker_is_sealed_or_open"
asks = "Is the marker that makes a resource plan-affecting a sealed trait, or an open marker a consumer implements on its own resource value types?"
options = [
    "Sealed: the round of May 2026 and the api design template on dev declare it as a sealed marker over the builder input",
    "Open: amendment A2-3 and the swap specification make it an open marker on resource value types, and the api design template on the recovery branch says so",
]
state = "answered"
answer = "Op ruled: unseal it. Consumers implement `PlanAffecting` on resource value types whose swap invalidates the plan, mirroring the existing `Replaceable` opt-in marker."
answered = "2026-11-13, by default from the written history: mock/research/202611130850_the-record-read-whole/OP-ANSWERS-18.md"
answered_from = ["quote: mock/research/pre_seed/202607193200_canon-amendment-a2-precedence-and-rulings.md:55-62"]
source = "mock/design_rounds/202605101036/202605101036_topic.resource-resolution.md:33-37, mock/crates/hilavitkutin-api/DESIGN.md.tmpl:1119-1127, mock/research/202611130850_the-record-read-whole/RECOVERED.md:137-146"
quote = '''
Sealed marker trait in `hilavitkutin-api`. Implementations are opt-in by consumers OR derived by macro:

```rust
pub trait PlanAffecting: BuilderInput + private::Sealed {}
```
---
### `PlanAffecting: BuilderInput + Sealed`

Sealed marker trait. Resources implementing `PlanAffecting` dirty the
plan cache when replaced via `Scheduler::replace_resource`; resources
without it are cheap value-swaps. Default is NOT plan-affecting.

```rust
pub trait PlanAffecting: BuilderInput + private::Sealed {}
```
---
### `PlanAffecting` open marker

Open marker trait on resource value types, per-type consumer opt-in
mirroring `Replaceable`. Resources implementing `PlanAffecting` dirty
the plan cache when replaced via `Scheduler::replace_resource`;
resources without it are cheap value-swaps. Default is NOT
plan-affecting. `PlanAffecting` and `Replaceable` are mutually
exclusive with `PlanAffecting` dominant (see the `Replaceable`
section's negative impl); a plan-affecting swap performs the identical
witnessed blob install plus the plan-dirty bit.
'''
