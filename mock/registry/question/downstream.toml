[[question]]
id = "how_kaski_holds_its_lattice"
asks = "How is kaski's lattice held: as entities of an entity system, outside it, or decided after benches?"
options = [
    "Tile is an entity (Recommended): A tile is an entity with one component pointing at its block in a kaski-owned store, found through the place index and read by a declared query.",
    "Outside the entity system: Tiles are keys of the store; the lattice does not touch entities at all.",
    "Decide after benches: Wait for lattice-floor and thing-tables to report, with an entity-cells arm and an entity-handle arm added to the bench.",
]
state = "answered"
answer = "Option 3 but I would be interested in reducing the ecs role to even zero if hilavitkutin proves capable and we can implement realistically the things we need under its mantle"
answered = "2026-11-13 05:05: .data/op-responses/202611130448_answers-to-the-fix-up-calls-batch-1.md"
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS.md:176-198"
quote = '''
#### Lattice

  ```text
  How is the lattice held? Both experts lean to the first option; upstream block addressing fits the first two either way.
  ```

Options offered:

1. Tile is an entity (Recommended)

   A tile is an entity with one component pointing at its block in a kaski-owned store, found through the place index and read by a declared query.

2. Outside the entity system

   Tiles are keys of the store; the lattice does not touch entities at all.

3. Decide after benches

   Wait for lattice-floor and thing-tables to report, with an entity-cells arm and an entity-handle arm added to the bench.

Answered in their own words:

> Option 3 but I would be interested in reducing the ecs role to even zero if hilavitkutin proves capable and we can implement realistically the things we need under its mantle
'''
subject = "downstream"
keywords = ["kaski", "lattice", "entity system", "ecs", "tile", "bench", "under its mantle"]

