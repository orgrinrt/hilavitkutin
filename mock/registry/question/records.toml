[[question]]
id = "whether_the_extent_of_a_record_domain_is_fixed"
asks = "A record domain is a set of records with its own count, replacing the scheduler's single record count. Is a domain's extent fixed for the life of a built scheduler, or can it be replaced between passes?"
options = [
    "Replaceable between passes: The extent is a value the consumer may replace between passes up to a capacity fixed at build; the plan is built for the capacity and passes run over the current extent.",
    "Fixed at build: The extent is fixed when the scheduler is built; a world that grows rebuilds the scheduler.",
    "Both, declared per domain: A domain declares in its type whether its extent is fixed or replaceable up to a capacity; fixed domains let the planner assume more.",
]
state = "answered"
answer = "Both, declared per domain"
answered = "2026-11-13 07:59: .data/op-responses/202611130726_does-anyone-here-know-what-hilavitkutin-is.md"
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS.md:483-505"
quote = '''
#### Extent

  ```text
  A record domain is a set of records with its own count (replacing the scheduler's single record count). Is a domain's extent fixed for the life of a built scheduler, or can it be replaced between passes (as a value is swapped with `replace_value`)? Kaski's world grows, loads tiles and has births and deaths.
  ```

Options offered:

1. Replaceable between passes

   The extent is a value the consumer may replace between passes up to a capacity fixed at build; the plan is built for the capacity and passes run over the current extent.

2. Fixed at build

   The extent is fixed when the scheduler is built; a world that grows rebuilds the scheduler.

3. Both, declared per domain

   A domain declares in its type whether its extent is fixed or replaceable up to a capacity; fixed domains let the planner assume more.

Chosen:

- Both, declared per domain
'''
subject = "records"
keywords = ["record domain", "extent", "capacity", "fixed", "replaceable", "between passes", "record count"]
related = ["question::where_the_record_count_of_a_column_lives", "tenet::morsel_boundaries_are_stable_unless_the_record_count_changes"]

[[question]]
