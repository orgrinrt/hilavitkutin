[[question]]
id = "which_convergence_a_single_trunk_phase_uses"
asks = "For single-trunk phases: head-and-tail convergence or the N-way record split? The records were reversed back to head-and-tail in July, the N-way path is what runs on the trunk, and the design text carries both. Which is the design?"
options = [
    "Head-and-tail, finish the deletion: As r8 and the seed say. The N-way path in `worker.rs` is removed, the head-and-tail types get driven, the design's ceil-slice passages are corrected, a commutativity test is added.",
    "N-way, retire head-and-tail: The N-way record-order split is the design; the unused head-and-tail types and the seed sentence go.",
    "Both, chosen at plan time: Two inhabitants the planner picks between per fiber (commutative single-trunk: head-and-tail; ordered appends: N-way forward slices), stated in the contract.",
    "Measure first: A bench under the harness with both arms on single-trunk workloads; the question returns with the numbers. The code stays as it is meanwhile.",
]
state = "answered"
answer = "Measure first"
answered = "2026-11-13 06:02: .data/op-responses/202611130602_convergence-is-measured-first.md"
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS.md:349-375"
quote = '''
#### Convergence

  ```text
  hilavitkutin, single-trunk phases: head-and-tail convergence or the N-way record split? The records were reversed back to head-and-tail in July (r7, r8, and the seed says 'Never an N-way record or morsel partition'), but the N-way path is what runs on `dev` and your design text carries both. Which is the design?
  ```

Options offered:

1. Head-and-tail, finish the deletion

   As r8 and the seed say. The N-way path in `worker.rs` is removed, the head-and-tail types get driven, the design's ceil-slice passages are corrected, a commutativity test is added.

2. N-way, retire head-and-tail

   The N-way record-order split is the design; the unused head-and-tail types and the seed sentence go.

3. Both, chosen at plan time

   Two inhabitants the planner picks between per fiber (commutative single-trunk: head-and-tail; ordered appends: N-way forward slices), stated in the contract.

4. Measure first

   A bench under the harness with both arms on single-trunk workloads; the question returns with the numbers. The code stays as it is meanwhile.

Chosen:

- Measure first
'''
subject = "execution"
keywords = ["convergence", "head and tail", "N-way", "record split", "single trunk", "measure", "bench"]
related = ["question::what_is_done_with_the_supersession_the_roadmap_records_as_an_agent_s_call"]

