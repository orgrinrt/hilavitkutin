[[question]]
id = "whether_the_morsel_size_counts_every_fiber_column_or_only_the_written_ones"
asks = "Does the morsel size formula divide the L1 budget by the sizes of all columns of the fiber, or only by the sizes of the write columns and write resource collections?"
options = ["L1_usable / (Σ size_of::<T_i>() for fiber columns), as the downstream-changes list of domain 04 puts it", "(L1_usable / Σ write_sizes), where read-only columns and read-only resource collections ride the L2 prefetcher and do not consume the L1 budget, as domain 12 puts it"]
state = "open"
source = "mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:407-408, mock/design_rounds/202604200055/202603181200_topic.hilavitkutin-design-consolidation.md:832-839"
quote = '''
- Morsel formula: `L1_usable / (Σ size_of::<T_i>() for fiber columns)`
  instead of `L1_usable / (col_count * 16)`
---
**Morsel sizing formula (with R3 type-native stride, R5 resource model):**
```
morsel_size = (L1_usable / Σ write_sizes).clamp(MIN_MORSEL, MAX_MORSEL) & !3
```
- L1_usable = detected_L1 × 0.75
- write_sizes = Σ size_of::<T_i>() for write columns + write resource
  collection sizes (R5). Read-only columns and read-only resource
  collections ride L2 prefetcher, don't consume L1 budget.
'''
subject = "execution"
keywords = ["morsel formula", "L1_usable", "write sizes", "fiber columns", "read-only columns", "R3", "R5"]
related = ["tenet::the_morsel_size_is_the_l1_budget_divided_by_the_written_bytes_per_record_within_fixed_bounds"]

