[[question]]
id = "what_the_engine_does_when_the_executor_reports_no_workers"
asks = "What the engine does when an executor reports no workers: refuse, run inline on the caller, or hand out one closure."
options = ["the engine refuses: run_parallel returns an error before publishing a frame, and the frame done-wait is never reached", "the engine runs inline on the caller: the calling thread runs core 0's worker body itself, and the done-wait counts one arrival, its own", "the engine hands out one closure: the done-wait expects one arrival from the executor, and where the executor reported zero because it has no thread to run anything on, the closure never runs and the done-wait never returns"]
state = "open"
source = "mock/design_rounds/202609191001/202609191000_topic.second-review-on-arvo-dev.md:23-31, mock/design_rounds/202609191001/202609191001_changelist.doc.lock.md:19-19"
quote = '''
The previous round's sentence in the engine design, "at zero the engine still hands the executor one closure", settles a question nobody ratified. Three answers exist and each does something different to the frame's done-wait, `frame_await_done`, which returns once the done counter equals the expected worker count:

If the engine refuses, `run_parallel` returns an error before publishing a frame, and `frame_await_done` is never reached.

If it runs inline on the caller, the calling thread runs core 0's worker body itself, and the done-wait counts one arrival, its own.

If it hands out one closure, the done-wait expects one arrival from the executor. Where the executor reported zero because it has no thread to run anything on, the closure never runs and the done-wait never returns.

The design states the three and marks the question provisional, waiting on op. The code keeps its current behaviour, and its test and the changelist call it provisional.
---
The clamp paragraph keeps the ceiling, which follows from the per-core state being sized by `MAX_CORES`. The zero case becomes a provisional paragraph naming refuse, run inline on the caller, and hand out one closure, with what each does to `frame_await_done`, and saying the choice is not decided yet and the code's current behaviour (one closure) is provisional. The choice waits on op; the paragraph renders into the public `docs/HILAVITKUTIN.md`, so it says "not decided yet" and names nobody, and this changelist and the topic carry who decides.
'''
subject = "execution"
keywords = ["zero workers", "executor reports zero", "run_parallel", "frame_await_done", "refuse", "run inline", "one closure", "provisional"]
related = ["tenet::the_engine_clamps_the_worker_count_it_runs_on_to_the_ceiling_of_its_per_core_state_and_workers_past_the_ceiling_are_never_handed_a_closure"]

