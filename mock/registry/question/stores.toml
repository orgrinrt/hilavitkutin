[[question]]
id = "what_an_append_past_the_capacity_of_an_accumulator_does"
asks = "hilavitkutin asserts (panics) when a unit appends past an accumulator's capacity. A branch about to land makes that a refusal returned as a value from the run. Is that wanted?"
options = [
    "Refusal as a value (Recommended): `run` returns the refusal; no panic path on a worker of a no_std engine that spawns nothing. If someone wants an abort it is the memory provider's property.",
    "Assert stays the default: The panic stays; a refusal value is something a provider opts into.",
    "Configurable by the consumer: A const, generic or trait parameter on the run configuration picks refuse or assert, default refuse.",
]
state = "answered"
answer = "Configurable by the consumer"
answered = "2026-11-13 05:50: .data/op-responses/202611130550_four-calls-that-shape-the-hilavitkutin-api-revision.md"
source = "mock/research/202611130850_the-record-read-whole/OP-ANSWERS.md:234-256"
quote = '''
#### Overflow

  ```text
  hilavitkutin today asserts (panics) when a unit appends past an accumulator's capacity. A branch about to land makes that a refusal returned as a value from `run` (the frame fails closed, nothing is silently dropped, same result at every worker count). Both experts picked the first option. Do you want it?
  ```

Options offered:

1. Refusal as a value (Recommended)

   `run` returns the refusal; no panic path on a worker of a no_std engine that spawns nothing. If someone wants an abort it is the memory provider's property.

2. Assert stays the default

   The panic stays; a refusal value is something a provider opts into.

3. Configurable by the consumer

   A const, generic or trait parameter on the run configuration picks refuse or assert, default refuse.

Chosen:

- Configurable by the consumer
'''
subject = "stores"
keywords = ["accumulator", "append", "capacity", "overflow", "refusal", "panic", "assert", "configurable"]

