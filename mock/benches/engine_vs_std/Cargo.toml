# The `engine_vs_std` bench member: the engine against optimal std over four
# workloads. See `bench.toml` for the sections. The generated driver runs it;
# the routine of each section is in the bench tree's hooks library, and the
# support crate is `support/evs-support` at the bench root.
#
# One workspace for every arm, so they share one lockfile, one release profile
# and one build of the engine.
[workspace]
members = ["arms/*"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }
