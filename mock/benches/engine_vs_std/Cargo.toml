# The `engine_vs_std` bench member: the engine against optimal std over four
# workloads, timed by the bench harness. See `bench.toml` for the sections.
#
# One workspace for the driver, the support crate and every arm, so they share
# one lockfile, one release profile and one build of the engine.
[workspace]
members = [".", "support", "variants/*"]
resolver = "2"

[package]
name = "engine_vs_std"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "engine_vs_std"
path = "src/main.rs"

[dependencies]
evs-support = { path = "support" }
bench-arm = { path = "../bench-arm" }
bench-stage = { path = "../bench-stage" }
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", rev = "f42844c7f7f8be9c54dd96b9a975a6c7da3fea5e", features = ["std"] }
mockspace-bench-harness = { git = "https://github.com/hiisi-digital/mockspace", rev = "f42844c7f7f8be9c54dd96b9a975a6c7da3fea5e" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }
