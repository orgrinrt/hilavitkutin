# Axis D: Seq collection-member payload. Two variants: live-stream (V0 shape) vs
# snapshot-copy (V1 shape). N = Seq bytes, swept from L1-resident to 256 MiB.
# Clean workload (the fold IS the work). live wins decisively once the Seq
# exceeds cache (the copy becomes pure overhead).
[bench.rsb_seqd]
title = "Seq collection member: live-stream vs snapshot-copy across payload size"
workload = "rsb_seqd"
master_seed = 0x1234_5678_9ABC_DEF0

[[bench.rsb_seqd.sizes]]
n = 65536
variants = ["variants/seq_live/target/release/seq_live", "variants/seq_snapshot/target/release/seq_snapshot"]
[[bench.rsb_seqd.sizes]]
n = 1048576
variants = ["variants/seq_live/target/release/seq_live", "variants/seq_snapshot/target/release/seq_snapshot"]
[[bench.rsb_seqd.sizes]]
n = 4194304
variants = ["variants/seq_live/target/release/seq_live", "variants/seq_snapshot/target/release/seq_snapshot"]
[[bench.rsb_seqd.sizes]]
n = 16777216
variants = ["variants/seq_live/target/release/seq_live", "variants/seq_snapshot/target/release/seq_snapshot"]

[bench.rsb_bwide]
