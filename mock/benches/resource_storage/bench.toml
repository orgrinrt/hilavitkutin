# Six-variant resource-storage-model comparison (round 202606210600).
#
# Three bench sections form the mix-in-intensity axis (one single-program
# workload per section so the harness does not rotate intensities across samples
# and confound the comparison):
#
#   rsb_clean        algo only (no surrounding work)
#   rsb_light_thrash a little surrounding scalar/branch work
#   rsb_heavy_thrash L1-evicting heavy-memory passes between morsel-loop calls,
#                    the regime that turns V0's L1-hot member reload into a real
#                    cache miss so the snapshot/live difference can surface.
#
# Each section sweeps the payload size (bytes = column-record data) across all
# six variants. Output is the 8-byte FNV-1a checksum, validated byte-exact
# across variants (MAY_DIFFER=false). Variant dylib paths are bare stems; the
# orchestrator appends the platform DLL prefix/suffix.
#
# Lighter-than-default timing so the full matrix runs in minutes, not hours,
# while keeping enough samples for tight CIs and the sign test. The harness
# default is 10 passes x 50000 runs x 3 harness_runs x 3 cooldowns; this trims to
# a single 0-cooldown cohort with fewer passes/runs (still thousands of timed
# batches per variant).
title = "Resource storage layouts across mix-in intensity and payload size"

[timing]
# Per-call work scales with N (the morsel loop is N records), so a few thousand
# runs already give a tight CI; the default 50000-run budget just re-measures the
# same parity at great cost. This is a moderate budget (a few minutes for the
# full matrix) with enough samples for the sign test and a narrow bootstrap CI.
# The harness dylib-hash cache (.bench_cache/, keyed on cdylib hash + these
# timing knobs + workload hash) reuses any unchanged variant on re-run, so this
# budget is paid once; a later unchanged re-run is free, and the baseline (V0)
# still re-runs each time as the drift anchor.
passes = 5
runs_per_pass = 2000
batch_size = 250
harness_runs = 3
cooldowns_ms = [0]

[sweep.rsb_clean]
title = "Resource storage layouts under clean morsel loop (algo only)"
workload = "rsb_clean"
master_seed = 0x1234_5678_9ABC_DEF0

arms = ["v0_blob", "v1_snapshot", "v2_decomposed", "v3_shapebound", "v4_erased", "v5_handletable"]
points = [1024, 16384, 262144]

[sweep.rsb_light_thrash]
title = "Resource storage layouts under light surrounding work"
workload = "rsb_light_thrash"
master_seed = 0x1234_5678_9ABC_DEF0

arms = ["v0_blob", "v1_snapshot", "v2_decomposed", "v3_shapebound", "v4_erased", "v5_handletable"]
points = [1024, 16384, 262144]

[sweep.rsb_heavy_thrash]
title = "Resource storage layouts under L1-evicting heavy-memory mix-in"
workload = "rsb_heavy_thrash"
master_seed = 0x1234_5678_9ABC_DEF0

arms = ["v0_blob", "v1_snapshot", "v2_decomposed", "v3_shapebound", "v4_erased", "v5_handletable"]
points = [1024, 16384, 262144]

# Axis D: Seq collection-member payload. Two variants: live-stream (V0 shape) vs
# snapshot-copy (V1 shape). N = Seq bytes, swept from L1-resident to 256 MiB.
# Clean workload (the fold IS the work). live wins decisively once the Seq
# exceeds cache (the copy becomes pure overhead).
[sweep.rsb_seqd]
title = "Seq collection member: live-stream vs snapshot-copy across payload size"
workload = "rsb_seqd"
master_seed = 0x1234_5678_9ABC_DEF0

arms = ["seq_live", "seq_snapshot"]
points = [65536, 1048576, 4194304, 16777216]

[sweep.rsb_bwide]
title = "Intra-resource member gather at M=64: contiguous blob vs scattered columns"
workload = "rsb_bwide"
master_seed = 0x1234_5678_9ABC_DEF0

arms = ["wide_blob", "wide_decomposed"]
points = [256, 16384, 4194304]

# Axis E: cross-core false sharing, the measurement the `axis_ce` test crate
# used to time with its own clock. One thread per slot, at most sixteen, each
# writing its own `u32` slot `n * 1024` times. `fs_packed` holds every slot in
# one cache line, the V3 shape-bound hazard; `fs_padded` gives each slot a line
# of its own, as the per-resource-line layouts do. Both return the same digest,
# the sum of the slots read back. The input bytes are not read.
[sweep.false_sharing]
title = "Cross-core false sharing: slots packed in one line vs one line each"
workload = "false_sharing"
master_seed = 0x1234_5678_9ABC_DEF1
may_differ = false
required = true
threaded = true
baseline = "fs_padded"
arms = ["fs_packed", "fs_padded"]
points = [1024, 16384, 65536]

[sweep.false_sharing.timing]
passes = 2
runs_per_pass = 10
batch_size = 1
harness_runs = 1
cooldowns_ms = [0]
validation_seeds = 2
determinism_check_seeds = 1
