# Six-variant resource-storage-model comparison (round 202606210600).
#
# Three bench sections form the mix-in-intensity axis (one single-program
# workload per section so the harness does not rotate intensities across samples
# and confound the comparison):
#
#   rsb_clean        algo only (no surrounding work)
#   rsb_light_thrash a little surrounding scalar/branch work
#   rsb_heavy_thrash L1-evicting heavy-memory passes between morsel-loop calls,
#                    the regime that turns V0's L1-hot member reload into a real
#                    cache miss so the snapshot/live difference can surface.
#
# Each section sweeps the payload size (bytes = column-record data) across all
# six variants. Output is the 8-byte FNV-1a checksum, validated byte-exact
# across variants (MAY_DIFFER=false). Variant dylib paths are bare stems; the
# orchestrator appends the platform DLL prefix/suffix.
#
# Lighter-than-default timing so the full matrix runs in minutes, not hours,
# while keeping enough samples for tight CIs and the sign test. The harness
# default is 10 passes x 50000 runs x 3 harness_runs x 3 cooldowns; this trims to
# a single 0-cooldown cohort with fewer passes/runs (still thousands of timed
# batches per variant).
[timing]
# Per-call work scales with N (the morsel loop is N records), so a few thousand
# runs already give a tight CI; the default 50000-run budget just re-measures the
# same parity at great cost. This is a moderate budget (a few minutes for the
# full matrix) with enough samples for the sign test and a narrow bootstrap CI.
# The harness dylib-hash cache (.bench_cache/, keyed on cdylib hash + these
# timing knobs + workload hash) reuses any unchanged variant on re-run, so this
# budget is paid once; a later unchanged re-run is free, and the baseline (V0)
# still re-runs each time as the drift anchor.
passes = 5
runs_per_pass = 2000
batch_size = 250
harness_runs = 3
cooldowns_ms = [0]

[bench.rsb_clean]
title = "Resource storage layouts under clean morsel loop (algo only)"
workload = "rsb_clean"
master_seed = 0x1234_5678_9ABC_DEF0

[[bench.rsb_clean.sizes]]
n = 1024
variants = ["variants/v0_blob/target/release/v0_blob", "variants/v1_snapshot/target/release/v1_snapshot", "variants/v2_decomposed/target/release/v2_decomposed", "variants/v3_shapebound/target/release/v3_shapebound", "variants/v4_erased/target/release/v4_erased", "variants/v5_handletable/target/release/v5_handletable"]
[[bench.rsb_clean.sizes]]
n = 16384
variants = ["variants/v0_blob/target/release/v0_blob", "variants/v1_snapshot/target/release/v1_snapshot", "variants/v2_decomposed/target/release/v2_decomposed", "variants/v3_shapebound/target/release/v3_shapebound", "variants/v4_erased/target/release/v4_erased", "variants/v5_handletable/target/release/v5_handletable"]
[[bench.rsb_clean.sizes]]
n = 262144
variants = ["variants/v0_blob/target/release/v0_blob", "variants/v1_snapshot/target/release/v1_snapshot", "variants/v2_decomposed/target/release/v2_decomposed", "variants/v3_shapebound/target/release/v3_shapebound", "variants/v4_erased/target/release/v4_erased", "variants/v5_handletable/target/release/v5_handletable"]

