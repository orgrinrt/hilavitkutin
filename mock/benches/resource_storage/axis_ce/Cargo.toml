[workspace]

[package]
name = "rsb-axis-ce"
version = "0.0.0"
edition = "2021"
publish = false

# Axis C (column-count capacity) for the resource-storage-model round, a
# capacity assertion expressed as a test: it reserves into the real
# `ArenaColumnStorage<_, Dim<256>>` to show the per-member-column layouts (V2/V5)
# cross the 256-store cap while the per-resource layouts (V0/V1/V3/V4) do not.
# Axis E, the false-sharing measurement, is the `false_sharing` sweep of the
# `resource_storage` bench.
[lib]
name = "rsb_axis_ce"
path = "src/lib.rs"

[dependencies]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev", default-features = false, features = ["const", "try_trait_v2"] }
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-bits = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-tensor = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
hilavitkutin-api = { path = "../../../crates/hilavitkutin-api" }
hilavitkutin-providers = { path = "../../../crates/hilavitkutin-providers", features = ["static", "portable"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }
