# The `frame_wide` bench member: one simulation frame of three independent
# three-stage pipelines, a fan-in joining them and two independent
# transforms, timed across seven arms. See `bench.toml` for the sweeps.
#
# One workspace for the driver, the support crate and every arm, so they share
# one lockfile, one release profile and one build of the engine. Every arm
# links the same `mockspace-bench-core` revision, which the harness checks
# through `bench_abi_hash` before it loads one.
[workspace]
members = [".", "support/frame-wide-support", "variants/*"]
resolver = "2"

[package]
name = "frame_wide"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "frame_wide"
path = "src/lib.rs"

[[bin]]
name = "frame_wide"
path = "src/main.rs"

# The committed negative control. `harness = false` because the harness
# re-executes this binary as its validation worker, so `main` has to answer
# `--worker` itself.
[[test]]
name = "negative_control"
path = "tests/negative_control.rs"
harness = false

# What the engine's plan makes of this frame: the phase and trunk of every
# unit and the mask each core is handed, read out of the engine's own grouping.
# Pure compile-time analysis, so it runs in milliseconds and needs no dylib.
[[test]]
name = "engine_grouping"
path = "tests/engine_grouping.rs"

# The driver run from the target directory rather than a stage is refused.
[[test]]
name = "unstaged_driver"
path = "tests/unstaged_driver.rs"

[dependencies]
frame-wide-support = { path = "support/frame-wide-support" }
bench-arm = { path = "../bench-arm" }
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", rev = "5a775f3ea7f969a7589ce970e16e55b2ba856f41", features = ["std"] }
mockspace-bench-harness = { git = "https://github.com/hiisi-digital/mockspace", rev = "5a775f3ea7f969a7589ce970e16e55b2ba856f41" }

# `engine_grouping` reaches the engine's grouping directly. The arms reach it
# only through `frame-wide-support`, so these are test-only.
[dev-dependencies]
hilavitkutin = { path = "../../crates/hilavitkutin" }
hilavitkutin-api = { path = "../../crates/hilavitkutin-api" }
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-bitmask = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }
