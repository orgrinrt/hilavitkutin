# The single-trunk convergence bench member: head-and-tail against the N-way
# ceil slice on one commutative fiber. Each arm is its own cdylib under
# arms/, run in its own worker subprocess by the driver `mock bench run`
# generates, with validation across arms before any timing. The routine of each
# section is in the bench tree's hooks library, and the support crate is
# `support/stc-support` at the bench root. std and alloc are allowed here: this
# is a standalone bench workspace, outside the no_std / no_alloc members of
# mock/.
[workspace]
members = ["arms/*"]
resolver = "2"

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
