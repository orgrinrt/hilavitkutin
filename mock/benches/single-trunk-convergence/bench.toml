# Single-trunk convergence: head-and-tail against the N-way ceil slice on one
# commutative fiber, with the engine's sequential run, the std parallel bar,
# and the N-way slice on the bench's own crew as the control for machinery.
#
# A section is `<workload>_w<W>`, or `<workload>_w<W>_big` for the sizes
# where one frame takes milliseconds and the budget is cut to fit. `short` is
# the one-to-four-morsel band of `fold_light`. `W` is the worker count each
# arm that takes one runs at; `sequential` and `kernel_seq` ignore it and run
# in every section as the same-run anchors. The machine this was run on has 4
# cores, so `W = 4` is its maximum and `W = 8` oversubscribes it.
#
# Every section validates all arms against each other over three seeds
# before timing (may_differ = false, required = true): the fold's sum and the
# append's output sequence must match byte for byte. `threaded = true` keeps
# the harness from pinning the worker subprocess to one core.

[timing]
passes = 3
runs_per_pass = 60
batch_size = 10
harness_runs = 1
cooldowns_ms = [0]
validation_seeds = 3
determinism_check_seeds = 1

# ---------------------------------------------------------------- W = 1

[bench.short_w1]
title = "fold_light, short fiber (1 to 4 morsels), W = 1"
workload = "light"
master_seed = 0x5EED_0000_0000_0001
threaded = true
may_differ = false
required = true
baseline = "stc_sequential"
variants = ["target/release/stc_sequential", "target/release/stc_nway", "target/release/stc_head_tail", "target/release/stc_head_tail_dyn", "target/release/stc_kernel_seq", "target/release/stc_kernel_nway", "target/release/stc_std_parallel"]
sizes = [16, 64, 256, 1024]
timing = { runs_per_pass = 150, batch_size = 25 }

