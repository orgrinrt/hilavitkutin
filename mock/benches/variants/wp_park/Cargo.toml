[workspace]

[package]
name = "wp_park"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "wp_park"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
mockspace-bench-core = { git = "https://github.com/hiisi-digital/mockspace", branch = "dev", features = ["std"] }
mockspace-bench-macro = { git = "https://github.com/hiisi-digital/mockspace", branch = "dev" }
wake_common = { path = "../wake_common" }
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
