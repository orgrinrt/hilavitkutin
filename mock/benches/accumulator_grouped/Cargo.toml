# The accumulator-grouped-by-the-data bench member: option 3 of the fold split
# priced against one partial per core and against one walker. Each arm is its
# own cdylib under arms/, run in its own worker subprocess by the driver
# `mock bench run` generates. The routine of each section is in the bench
# tree's hooks library, and the support crate is
# `support/accum-group-support` at the bench root. std and alloc are allowed
# here: this is a standalone bench workspace, outside the no_std / no_alloc
# members of mock/.
[workspace]
members = ["arms/*"]
resolver = "2"

# The pinned arvo crates name notko by its `ssh` spelling; the patch points
# that spelling at the `https` source the engine names, so the graph holds one
# notko (the same patch as mock/Cargo.toml).
[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
