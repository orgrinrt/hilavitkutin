# swap_column: what a pass costs by the kind of the column between a
# producer and its reader. One carrier in swap_common, three stores:
# cs_plain is a plain column, where the reader follows the producer in
# the same pass and nothing is brought in (the floor); cs_snap is a
# buffered column under Snapshot, whose boundary copies the live side
# over the frozen one; cs_exch is a buffered column under Exchange,
# whose boundary turns the two sides. cs_snap_twin is cs_snap again:
# the distance between the two is the noise floor of the run. Every
# timed frame holds one producer pass, one reader pass and, in the
# buffered arms, one boundary. Four-byte records, n x 1024 of them, so
# 256 KiB, 4 MiB and 32 MiB a column side. The output column holds the
# same records in every arm.
title = "a buffered column's swap: plain floor vs Snapshot copy vs Exchange"
workload = "realistic"
master_seed = "0x51C3_5107_0000_0004"
may_differ = false
baseline = "cs_plain"

arms = ["cs_plain", "cs_snap", "cs_snap_twin", "cs_exch"]
points = [64, 1024, 8192]

[timing]
passes = 3
runs_per_pass = 30
batch_size = 10
harness_runs = 2
cooldowns_ms = [0]
