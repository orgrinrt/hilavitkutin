[package]
name = "hilavitkutin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static scheduler and runtime that turns read / write access sets into per-core dispatch with cache-aware morsels. no_std, no alloc, no spawn, no dyn."
repository.workspace = true

[dependencies]
hilavitkutin-api.workspace = true
hilavitkutin-kit.workspace = true
arvo.workspace = true
notko.workspace = true
arvo-bitmask.workspace = true
arvo-graph.workspace = true
arvo-sparse.workspace = true
arvo-tensor.workspace = true
arvo-spectral.workspace = true
arvo-comb.workspace = true
libc = { workspace = true, optional = true }


[dev-dependencies]
# Tests wire the arena-backed `ColumnStorage` default. Dev-dep only: the
# engine lib depends on the storage trait (hilavitkutin-api), never on
# the default impl. providers forbids depending on the engine, so no cycle.
hilavitkutin-providers.workspace = true

[features]
default = ["platform-os"]
platform-os = ["dep:libc"]
platform-std = []
platform-no-os = []
# Opt-in intrinsics upgrade. Still core-only; enables
# `core::hint::black_box` for `noinline_barrier`. Nightly
# `core::intrinsics::prefetch_*` is a follow-up (BACKLOG).
intrinsics-std = []
