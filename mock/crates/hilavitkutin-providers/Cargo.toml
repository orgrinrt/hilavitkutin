[package]
name = "hilavitkutin-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default Resource-backed providers for the hilavitkutin scheduler"
repository.workspace = true

[dependencies]
notko.workspace = true
arvo.workspace = true
arvo-bits.workspace = true
arvo-tensor.workspace = true
hilavitkutin-api.workspace = true
hilavitkutin-kit.workspace = true
hilavitkutin-str.workspace = true

[dev-dependencies]
# The examples run on the engine's os tier, OsMemoryProvider under the column
# store. The crate does not name itself here, so its suite runs on the build
# a consumer gets; a binary that needs an implementation names its feature
# below.
hilavitkutin = { workspace = true, features = ["os"] }
hilavitkutin-sym.workspace = true
trybuild = "1"

[features]
default = []
# Memory providers over a buffer the consumer hands in, with no operating
# system: StaticBumpMemory, StaticFreeListMemory.
static = []
# Implementations over the contracts alone, on any target: ArenaColumnStorage,
# MemoryArena with the interner and InternerKit, AdaptWu and the adapt kits,
# the metrics resources with MetricsKit.
portable = []

[build-dependencies]
hilavitkutin-build.workspace = true

[[test]]
name = "column_storage"
required-features = ["static", "portable"]

[[test]]
name = "interner_law"
required-features = ["portable"]

[[test]]
name = "smoke"
required-features = ["portable"]

[[test]]
name = "static_bump_memory"
required-features = ["static"]

[[test]]
name = "static_free_list_memory"
required-features = ["static"]

[[example]]
name = "audio_mix"
required-features = ["portable"]

[[example]]
name = "particle_collision"
required-features = ["portable"]

[[example]]
name = "word_count"
required-features = ["portable"]
