[workspace]

[package]
name = "s1-ext"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
hilavitkutin-extensions = { path = "../../../../../crates/hilavitkutin-extensions" }
hilavitkutin-extensions-macros = { path = "../../../../../crates/hilavitkutin-extensions-macros" }

[patch."ssh://git@github.com/orgrinrt/notko.git"]
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev" }
