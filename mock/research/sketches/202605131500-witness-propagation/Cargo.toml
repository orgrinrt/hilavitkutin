[workspace]

[package]
name = "sketch-witness-propagation"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "sketch_witness_propagation"
path = "src/lib.rs"

# Sketch is standalone and outside this repo; arvo is a git dep pinned
# to the same rev the main workspace carries, rather than a path into
# a sibling clone that may not be checked out.
[dependencies]
arvo            = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-sparse     = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-bitmask    = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-bits-contracts = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-storage    = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }
arvo-bits       = { git = "ssh://git@github.com/orgrinrt/arvo.git", rev = "1b2796e92ad2b8176c2177d72a9cffa161b7b92e", default-features = false }

[profile.release]
opt-level = 3
