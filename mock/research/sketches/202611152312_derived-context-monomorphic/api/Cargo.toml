edition.workspace = true
license.workspace = true
description = "WorkUnit + provider trait surface for the hilavitkutin pipeline engine"
repository.workspace = true

[dependencies]
arvo.workspace = true
arvo-bitmask.workspace = true
arvo-tensor.workspace = true
hilavitkutin-ctx.workspace = true
notko.workspace = true
notko-hlist.workspace = true

[dev-dependencies]
trybuild = "1"

[features]
default = []
