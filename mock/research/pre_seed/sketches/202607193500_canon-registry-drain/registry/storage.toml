[[mechanism]]
id = "resource_drain"
domain = "resources"
what = "per registered Resource<T>: reserve a one-record column through the consumer's ColumnStorage, ptr::write the staged value in, record the base erased (ErasedResourcePtr) plus the value's static shape for backcast"
status = "wired"
provenance = ["ruling::resource_is_handle_not_inline", "ruling::resource_value_layout_one_record_blob", "seed::storage::#the-value-layout"]
lives_at = "crates/hilavitkutin/src/resource/bindings.rs"

[[mechanism]]
id = "erased_backcast_addressing"
domain = "resources"
what = "value bytes addressed through the erased static-shape descriptor; the typed pointer is recovered by backcast at projection time, the binding's type parameter is the witness"
status = "wired"
provenance = ["ruling::erased_static_shape_addressing_global"]
lives_at = "crates/hilavitkutin/src/resource/provenance.rs, crates/hilavitkutin/src/dispatch/engine_ctx.rs"

[[mechanism]]
id = "scalar_snapshot"
domain = "resources"
what = "stack-snapshot of scalar Field members (and collection ptr+len views) before the morsel loop, so LLVM keeps them in registers across it"
status = "absent"
note = "the shipped drain reads live through the pointer with no snapshot; the addendum names this absence as the drift, and the fix is additive. Part of the drift-fix arc"
provenance = ["ruling::scalar_members_snapshot_before_morsel_loop", "git::commit::8a30758e"]

[[mechanism]]
id = "collection_members_in_resource_values"
domain = "resources"
what = "Seq/Map members wired into resource values: element columns reserved per member, ptr+len views in the blob, live-stream read access inside the loop"
status = "absent"
note = "tracked #344; the engine_ctx Project impl carries the FIXME; the catalogued red in tests/resource_snapshot.rs pins the intended behaviour"
provenance = ["ruling::resource_model_three_field_types", "ruling::collections_live_streamed_never_copied", "git::commit::a68f0832"]

[[mechanism]]
id = "replace_value_install"
domain = "resources"
what = "the Replaceable value-swap surface installing a staged value into the data plane"
status = "absent"
note = "replace_value marks store-dirty without writing; swap semantics are canonically unspecified (the absence of a swap-semantics ruling row is the signal), the specifying round is commissioned by A2-5, and the panel plus sketch material at res::202607193300 and the parked draft spec are its inputs. The catalogued red in tests/resource_bindings.rs pins the install assertion"
provenance = ["ruling::member_by_member_swap_language_is_not_canon", "git::commit::543cdf5b"]

[[mechanism]]
id = "replace_resource_plan_dirty"
domain = "resources"
what = "the PlanAffecting swap surface: install plus a plan-dirty mark the next run() consumes to enter the plan band on a non-first frame"
status = "absent"
note = "unwired end to end: replace_resource sets no plan_dirty bit and run() reads the array only to suppress an unused-field warning; the band gate is first_frame alone. PlanAffecting itself unseals into an open marker per A2-3 (#696), riding the same commissioned round"
provenance = ["git::commit::543cdf5b", "git::commit::a68f0832"]

[[mechanism]]
id = "column_release_consumer_count"
domain = "storage"
what = "release(column) advisory lifetime: the schedule pre-computes readers, decrements on fiber completion, release fires at zero"
status = "absent"
provenance = ["seed::storage::#columnstorage-contract"]

[[bench]]
id = "storage_six_variant"
hypothesis = "which resource value layout and addressing mode wins: inline (V0), native blob (V1), per-member decomposed (V2), shape-bound shared (V3), erased blob (V4), plus access-pattern variants"
arms = ["V0 inline reload", "V1 native monomorphised blob", "V2 per-member decomposed columns", "V3 shape-bound shared columns", "V4 erased static-shape blob", "axis D: live-stream vs snapshot-copy of collections"]
result = "blob layout wins: V2 loses up to 3.1x intra-resource locality at M=64 and crosses the Dim<256> column cap; V3 carries 3.4x cross-core false sharing plus the resize-invalidates-all-sharers hazard; V4 ties V1 within plus-minus 1.7% on every scalar arm across both runs (ties on B, C, E), so erased addressing is free; axis D: live-stream beats copy about 2.5x past 64 MiB, parity below about 4 MiB. Scalar-snapshot hoist confirmed in codegen (V0 reloads, V1 through V5 hoist) but wall-clock-neutral on M1"
decided = ["ruling::resource_value_layout_one_record_blob", "ruling::erased_static_shape_addressing_global", "ruling::collections_live_streamed_never_copied", "ruling::scalar_members_snapshot_before_morsel_loop"]
runs = "two, second run confirming the first"
provenance = ["git::commit::8a30758e"]

[[constant]]
id = "column_alignment"
value = "64 bytes"
why = "cache-line alignment on column arrays so morsel windows start line-aligned and cross-core writes to adjacent columns cannot false-share a line"
provenance = ["seed::storage::#columnstorage-contract"]

[[constant]]
id = "column_value_size_limit"
value = "16 bytes"
why = "the ColumnValue bound on Field<T> scalar members: small enough that LLVM promotes snapshotted scalars to registers; Seq/Map ELEMENTS are exempt by design"
provenance = ["seed::storage::#the-resource-model"]

[[constant]]
id = "column_slot_cap"
value = "Dim<256> distinct columns"
tunable = true
why = "the ArenaColumnStorage slot-table capacity; a capacity type parameter, so a consumer needing more instantiates wider. The V2 layout refusal cites this cap as one of its grounds"
provenance = ["seed::storage::#the-value-layout", "git::commit::8a30758e"]

