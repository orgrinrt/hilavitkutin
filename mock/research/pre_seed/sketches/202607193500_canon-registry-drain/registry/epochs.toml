# Epochs: the roadmap's ordered bands. Epochs file alone; tasks file in the
# domain dossier they belong to (storage tasks in storage.toml) or in their
# own file when domain-free, so each surface stays reasonable on its own.
# The roadmap document is a query over epochs, tasks, and mechanism status.

